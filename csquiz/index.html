 "d": "어렵게", "q": "정신상태검사(MSE) 영역 중, 상담자가 직접 관찰한 내담자의 외현적인 감정 표현 상태(예: 둔마된, 부적절한 등)를 일컫는 용어는?", "a": "정동", "a2": "정동 (Affect)", "e": "내담자가 주관적으로 보고하는 지속적인 감정 상태인 '기분(Mood)'과 변별하십시오.", "b": "3권 p.70 · 3권 p.71"}, {"id": "B8-3-6", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "문항 분석 지표 중 하나로, 전체 피험자 중 정답을 맞힌 사람의 비율을 의미하며 수치가 클수록 '쉬운 문항'임을 뜻하는 지표는?", "a": "문항 난이도", "a2": "문항 난이도 (Item Difficulty)", "e": "지수가 0.5일 때 변산성이 최대가 되어 신뢰도가 가장 높게 측정됩니다.", "b": "3권 p.68"}, {"id": "B8-3-7", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "반사회적 충동과 에너지가 결합되어, 죄책감 결여와 행동화(Acting-out) 양상을 보이는 비행 청소년의 전형적인 코드는 4-(      ) 코드이다. 또는 (      )-4 코드이다. 괄호에 알맞은 숫자를 쓰시오.", "a": "9", "a2": "4-9 / 9-4 코드", "e": "충동 조절이 어렵고 규범을 무시하며, 에너지가 높아 즉각적인 행동으로 문제를 일으킬 위험이 큽니다.", "b": "3권 p.104 · 1권 p.584 · 3권 p.105"}, {"id": "B8-3-8", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "MMPI의 문항 선정 방식으로, 특정 진단군과 정상군을 가장 잘 구별해주는 문항을 통계적으로 선택하여 제작하는 방식을 (      )적 준거방식이라고 한다.", "a": "경험", "a2": "경험", "e": "문항의 안면 타당도(내용)보다 실제 피검자를 얼마나 잘 변별해내느냐에 초점을 맞춘 MMPI의 핵심 제작 원리입니다.", "b": "3권 p.76 · 3권 p.74 · 3권 p.75"}, {"id": "B8-3-9", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "타당도 척도 중 내용이 상반되는 문항 쌍을 활용하여, 문항 내용과 상관없이 '일정한 방향(예 혹은 아니오)'으로 응답한 경향을 탐지하는 지표는?", "a": "TRIN / 고정반응 비일관성 척도", "a2": "고정반응 비일관성 척도 (TRIN)", "e": "무작위 반응을 잡는 것은 VRIN이며, 무조건 '예' 혹은 '아니오'로 줄을 세우는 경향을 잡는 것이 TRIN입니다.", "b": "3권 p.81 · 3권 p.80 · 3권 p.120"}, {"id": "B8-4-1", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "구인 타당도의 하위 개념 중 하나로, \"다른 구인을 같은 방법으로 측정했을 때 결과가 서로 다르게 나타나야 함\"을 의미하는 타당도는?", "a": "변별 타당도", "a2": "변별 타당도 (Discriminant Validity)", "e": "같은 구인을 다른 방법으로 쟀을 때 일치해야 하는 '수렴 타당도'와 짝을 이룹니다.", "b": "3권 p.65"}, {"id": "B8-4-6", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "임상 척도 2번(D)의 핵심인 '즐거움을 느끼지 못하는 상태(Anhedonia)'를 정밀하게 측정하며, 성격적 우울을 탐지하는 RC 척도는?", "a": "낮은 긍정 정서 / RC2", "a2": "낮은 긍정 정서 (RC2)", "e": "임상 척도 2번이 낮더라도 RC2가 높으면 내면의 우울한 성격 특질이 있음을 시사합니다.", "b": "3권 p.110 · 3권 p.121"}, {"id": "B8-4-10", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "MSE 영역 중 내담자가 현재의 시간, 장소, 그리고 자신과 주변 인물의 정체성을 정확히 파악하고 있는지 확인하는 기능은?", "a": "지남력", "a2": "지남력 (Orientation)", "e": "시간 → 장소 → 사람의 순서로 손상되는 경향이 있습니다.", "b": "3권 p.71 · 3권 p.70 · 3권 p.107"}, {"id": "9-1", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 1, "d": "쉽게", "q": "발달이 급속도로 이루어지는 특정 시기로, 이 시기를 놓치면 이후에 적절한 자극이 주어지더라도 완벽한 결손 보완이나 회복이 어려운 비가역적 시간 제한성을 뜻하는 개념은?", "a": "결정적 시기", "a2": "결정적 시기 (Critical Period)", "e": "특정 시기를 지나더라도 자극이 주어지면 어느 정도 회복이 가능한 가역적 특성의 민감기(Sensitive Period)와 구별됩니다.", "b": "3권 p.301 · 3권 p.299"}, {"id": "9-2", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 2, "d": "어렵게", "q": "인간의 신체 발달이 머리 부분에서 아래쪽으로, 그리고 몸통 중심부에서 사지 말초 방향으로 진행되는 발달의 보편적 규칙을 뜻하는 원리는 발달은 (      )이/가 있다는 것이다.", "a": "순서 / 순서와 방향", "a2": "순서, 순서와 방향", "e": "발달은 무질서하게 일어나는 것이 아니라 일정한 방향과 순서를 지니며 진행됩니다.", "b": "3권 p.300 · 3권 p.299"}, {"id": "9-3", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 3, "d": "어렵게", "q": "유전이 개인이 도달할 수 있는 발달적 성취의 상한선과 하한선(한계 범위)을 결정하고, 실제 도달하는 구체적인 수준은 환경적 자극의 질에 의해 결정된다는 상호작용 개념은?", "a": "반응 범위", "a2": "반응 범위 (Range of Reaction)", "e": "동일한 유전적 잠재력을 가졌더라도 양육 환경의 질에 따라 발현되는 수준이 달라짐을 설명합니다.", "b": "3권 p.302"}, {"id": "9-4", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "환경적 자극에 제약을 받거나 일시적인 왜곡이 있더라도, 유전적 요인에 의해 사전에 파놓은 강력한 궤적을 밟아 거의 예외 없이 자연스럽게 발달(예: 옹알이, 걷기)이 출현하는 생물학적 제어 현상은?", "a": "운하화 / 수로화", "a2": "운하화 혹은 수로화 (Canalization)", "e": "환경적 변화가 발달적 궤적을 쉽게 흔들지 못하도록 유전이 강력한 경로를 설정해 둔 것입니다.", "b": "3권 p.302"}, {"id": "9-5", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 5, "d": "쉽게", "q": "서로 다른 연령대의 집단을 동시에 표집하여 비교하는 연구설계로, 시간과 비용은 절약되나 서로 다른 시대적 경험에서 오는 '동시대 출생집단효과'가 혼입될 위험이 있는 설계는?", "a": "횡단적 설계", "a2": "횡단적 설계 (Cross-sectional Design)", "e": "동일한 대상의 시간적 흐름에 따른 연령 변화를 직접 관찰할 수 없다는 한계가 있습니다.", "b": "3권 p.307 · 3권 p.308 · 3권 p.306"}, {"id": "9-6", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "특정 발달적 변화가 일어나는 아주 짧은 전이 기간 동안 아동을 집중적·반복적으로 조밀하게 관찰함으로써 인지 구조가 실제로 변화해 가는 미시적 과정과 원인을 밝히는 설계는?", "a": "미시발생적 설계", "a2": "미시발생적 설계 (Microgenetic Design)", "e": "변화가 일어나는 결정적인 순간(Moment of Change)을 촘촘히 포착하여 인지 조작의 역동을 규명합니다.", "b": "3권 p.308"}, {"id": "9-7", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "갑자기 큰 소리가 나거나 몸의 위치가 바뀔 때, 신생아가 양팔을 바깥쪽으로 쫙 펼쳤다가 가슴 쪽으로 껴안듯이 오므리는 대칭적인 원시 반사는?", "a": "모로 반사", "a2": "모로 반사 (Moro Reflex)", "e": "뇌간 등 하위 뇌 영역의 지배를 받는 반사이며, 중추신경계의 정상적인 성숙과 함께 생후 4~6개월경 자연스럽게 소멸합니다.", "b": "3권 p.313 · 3권 p.312"}, {"id": "9-8", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 8, "d": "어렵게", "q": "출생 후 1~5분 이내에 신생아의 생리적 상태를 평가하기 위해 심장박동, 호흡, 반사 민감성, 근육 긴장, 피부색의 5가지 항목을 측정하는 척도는?", "a": "아프가 척도", "a2": "아프가 / 아프가 척도 (Apgar Scale)", "e": "각 항목당 0, 1, 2점을 부여하여 총합 7~10점일 때 신생아의 적응 상태가 지극히 건강하고 양호함을 뜻합니다.", "b": "3권 p.313 · 3권 p.314"}, {"id": "9-9", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 9, "d": "어렵게", "q": "과잉 생성된 뉴런과 무수히 얽힌 시냅스 연결망 중, 자주 사용되는 것은 강화하고 오랜 기간 자극을 받지 못해 사용되지 않는 것은 선택적으로 제거하여 두뇌의 효율성을 극대화하는 생물학적 과정은?", "a": "시냅스 상실 / 시냅스 가지치기", "a2": "시냅스 가지치기 혹은 시냅스 상실 (Synaptic Pruning)", "e": "불필요한 에너지 소모를 차단하고 자주 쓰이는 핵심 신경 고속도로를 공고히 하여 정보 처리 속도를 높입니다.", "b": "3권 p.314"}, {"id": "9-10", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "축색(축삭돌기) 주위에 지방 물질을 형성하여 신경 자극의 전달 속도와 기능적 효율성을 비약적으로 향상시키는 물리적 성숙 기제는?", "a": "수초화", "a2": "수초화 (Myelination)", "e": "감정 변연계는 청소년기 초기에 성숙하지만 이성적 통제를 담당하는 전두엽은 수초화가 가장 늦게(성인 초기) 완성되므로 청소년기 충동 조절의 취약성이 나타납니다.", "b": "3권 p.315 · 3권 p.326 · 3권 p.302"}, {"id": "20-1", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "피아제의 인지발달 이론을 근거로 다음의 개념을 쓰시오.\n\n감각운동기의 하위 단계인 정신적 표상기에 이 능력을 완전히 획득한다.\n대상이 시야에서 사라지더라도 계속 존재한다는 것을 인식하는 능력을 의미한다.", "a": "대상영속성", "a2": "대상영속성", "e": "대상영속성 개념: 대상이 시야에서 사라지더라도 계속 존재한다는 것을 인식하는 능력을 의미한다.\n감각운동기의 하위단계인 이차 순환반응의 협응기에 대상영속성 개념을 획득하고, 정신적 표상기 단계에서 완전히 획득하게 된다.", "b": "3권 p.332"}, {"id": "20-2", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "피아제 인지발달 이론의 주요개념에 관한 설명으로 옳지 않은 것은?\n① 동화: 새로운 정보를 기존의 도식으로 이해하는 과정\n② 조절: 새로운 정보를 수용하기 위해 기존의 도식을 수정하는 과정\n③ 조직화: 지식을 일관성 있게 체계화하거나 범주를 만드는 경향성\n④ 불평형: 사람의 사고과정과 환경사건 사이의 불균형 또는 모순\n⑤ 적응: 동화와 조절의 과정을 거쳐 불평형한 상태를 벗어나고 인지적 균형상태를 이루는 것", "a": "5", "a2": "5 적응: 동화와 조절의 과정을 거쳐 불평형한 상태를 벗어나고 인지적 균형상태를 이루는 것", "e": "적응은 환경과의 직접적인 상호작용을 통해 도식이 변화하는 과정으로 동화와 조절을 통해 이루어진다.\n동화와 조절의 과정을 거쳐 불평형한 상태를 벗어나고 인지적 균형상태를 이루는 것은 ‘평형화’이다.", "b": "3권 p.330"}, {"id": "20-3", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음의 현상을 나타내는 개념을 쓰시오.\n\n영아의 기질과 어머니의 성격 및 양육방식 간의 관계를 나타내는 개념으로, 어머니가 영아의 타고난 기질적 성향을 파악하고 수용하여 양육방식을 조절함으로써 아동발달을 최적화 할 수 있다는 것을 의미한다.", "a": "조화의 적합성", "a2": "조화의 적합성", "e": "조화의 적합성 : 영아의 기질과 어머니의 성격 및 양육방식 간의 관계를 나타내는 개념으로, 어머니가 영아의 타고난 기질적 성향을 파악하고 수용하여 양육방식을 조절함으로써 아동발달을 최적화 할 수 있다는 것을 의미한다.", "b": "3권 p.374 · 3권 p.379 · 3권 p.292"}, {"id": "20-4", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "공격성에 대한 설명으로 옳지 않은 것은?\n\n① 반응적 공격성은 타인의 행동을 적대적으로 해석하고 그것에 대한 보복으로 활용되는 공격성을 의미한다.\n② 관계적 공격성은 남아에 비해 여아에게 많이 나타난다.\n③ 부모의 비일관적 훈육과 애정철회는 자녀의 공격성 발달에 영향을 미친다.\n④ 관계적 공격성은 사회적 배척을 통하여 또래관계에 손상을 가하는 행동을 의미한다.\n⑤ 적대적 공격성은 개인의 목표를 획득하거나 힘을 과시하기 위한 전략으로 활용되는 공격성을 의미한다.", "a": "5", "a2": "5 적대적 공격성은 개인의 목표를 획득하거나 힘을 과시하기 위한 전략으로 활용되는 공격성을 의미한다.", "e": "설명은 도구적 공격성에 대한 설명이다.\n적대적 공격성 : 타인에게 해를 입히려는 의도에서 감정적으로 분노하거나 적대감을 표출하는 공격성\n도구적 공격성 : 특정 목표나 목적을 달성하기 위한 수단으로 행해지는 공격성", "b": "3권 p.390 · 3권 p.391 · 1권 p.388"}, {"id": "20-5", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "다음 중 보기에서 설명하는 발달연구설계 방법의 특징으로 알맞은 것을 모두 고르시오.\n\n<보기>\n동일한 시기에 서로 다른 연령집단을 표집하여 상이한 연령집단을 동시에 비교하는 방법이다.\n\n㉠ 비교적 빠르게 조사할 수 있어서 시간과 비용이 경제적이다.\n㉡ 반복되는 검사로 인한 연습효과가 있다.\n㉢ 연령 차이는 연령 그 자체의 영향이라기보다는 동시대 출생집단효과 때문일 수 있다.\n㉣ 개인 안에서 이루어지는 연령과 관련된 변화를 알 수 있다.\n㉤ 오랜 기간 연구로 인한 피험자 탈락현상의 가능성이 있다.", "a": "ㄱ / ㄷ", "a2": "ㄱ / ㄷ", "e": "발달연구설계 방법에는 횡단적 설계, 종단적 설계, 계열적 설계, 미시발생적 설계가 있다.\n다음 특징들은 ‘종단적 설계’에 해당한다.\n반복되는 검사로 인한 연습효과가 있다.\n개인 안에서 이루어지는 연령과 관련된 변화를 알 수 있다.\n오랜기간 연구로 인한 피험자 탈락현상의 가능성이 있다.", "b": "3권 p.307"}, {"id": "20-6", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "신생아 반사의 종류와 설명으로 적절하지 않은 것을 고르시오.\n\n① 원시반사 - 생존과 자기보호를 위한 본능적인 반응으로, 양육자와 초기 관계형성에 도움을 준다.\n② 모로반사 - 갑자기 위치를 바꾸거나 큰 소리를 들을 때 양팔을 옆으로 뻗고 손가락을 펼친 상태에서 무엇을 안으려는 듯한 모양을 하는 것이다.\n③ 바빈스키반사 - 발바닥을 간질이면 발가락들을 부채모양으로 쫙 펼치는 행동이다.\n④ 빨기 반사 - 입속에 들어온 것은 무엇이든 빨고자 하는 행동이다.\n⑤ 근원반사 - 눈 깜빡임, 하품, 기침, 재채기 등 인간이 살아가는데 필요한 반응으로 대부분 평생 유지된다.", "a": "5", "a2": "5 근원반사 - 눈 깜빡임, 하품, 기침, 재채기 등 인간이 살아가는데 필요한 반응으로 대부분 평생 유지된다.", "e": "‘근원반사’는 뺨에 닿는 무엇인가를 향해 고개를 돌려 빨기 행동을 보이는 것이다.\n눈 깜빡임, 하품, 기침, 재채기 등 인간이 살아가는데 필요한 반응으로 대부분 평생 유지되는 것은 ‘생존반사’에 해당하는 설명이다.", "b": "3권 p.313 · 3권 p.312"}, {"id": "20-7", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "피아제의 인지발달에 관한 설명으로 옳지 않은 것은?\n\n① 감각운동기는 6개의 하위단계로 구성된다.\n② 형식적 조작기에 들어가면 추상적이고 가설적인 사고가 발달한다.\n③ 질량, 수, 부피에 관한 보존개념은 동일한 연령에서 나타난다.\n④ 인지발달 단계의 순서는 불변하다.\n⑤ 조절은 새로운 경험을 수용하고 설명하기 위해 기존의 도식을 수정하는 것이다.", "a": "3", "a2": "3 질량, 수, 부피에 관한 보존개념은 동일한 연령에서 나타난다.", "e": "보존개념은 과제의 형태에 따라 서로 습득되는 시기가 다르다. 처음에는 수에 대한 보존개념을 습득하고, 그 다음에는 질량, 길이, 면적, 무게, 마지막으로 부피 순으로 보존개념을 습득한다.", "b": "3권 p.335 · 3권 p.334 · 3권 p.330"}, {"id": "20-8", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "다음의 현상을 설명하는 피아제의 전조작기의 특징으로 가장 알맞은 것을 고르시오.\n\n유담이는 아침에 일어나자마자 엄마에게 “엄마 해님이 유담이가 놀이터에 가서 놀게 해주려고 빨리 떴나 봐요. 어서 놀이터 가요.”라고 말하였다. 유담이는 놀이터에 가서도 “미끄럼틀이 유담이를 재미있게 해주려고 해요, 그네가 유담이를 하늘로 올려주려고 있나 봐요”라고 했다.\n\n① 상징적 사고\n② 자기중심적 사고\n③ 물활론적 사고\n④ 인공론적 사고\n⑤ 전환적 추론", "a": "4", "a2": "4 인공론적 사고", "e": "‘인공론적 사고’는 세상의 모든 사물이나 자연현상이 사람의 필요에 의해 만들어진 것이라고 믿는 사고이다.", "b": "3권 p.333"}, {"id": "20-9", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "(나)에 해당하는 비고츠키의 발달개념을 쓰시오.\n\n(가) 진수가 선물로 받은 퍼즐을 잘 맞추지 못하고 있었다.\n(나) 옆에 있는 아빠가 “모퉁이부터 맞추어 보면 좋지 않을까?” 라고 말하면서 모서리에 해당하는 조각 하나를 진수 앞에 두었다.\n(다) 그러자 진수는 점차 모서리 조각을 스스로 찾아서 퍼즐을 맞출 수 있게 되었다.", "a": "비계 / 발판화 / 스캐폴딩", "a2": "비계 / 발판화 / 스캐폴딩", "e": "비고츠키의 발달개념 중 ‘발판화’는 아동 스스로 문제를 해결하는 수준에 도달하도록 제공되는 친구, 부모, 교사의 도움이다. 즉, 개인의 잠재적 발달수준에 제공되는 지원체계라고 할 수 있다.", "b": "3권 p.338"}, {"id": "20-10", "s": "아동 및 청소년심리", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "밑줄 친 ‘이것’이 의미하는 아동의 언어발달 특성의 개념은?\n\n“칸지”라는 보노보 침팬지의 언어 획득은 많은 주목을 받았다(Savage-Rumbaugh, Shanker, & Taylor, 1998).\n\n칸지는 수백 개의 영어 단어를 구분하기도 하고, 이전에 들어보지 못한 문장을 행동으로 나타내기도 했다. 하지만, 칸지는 정보를 공유하기 위해 언어를 사용하기보다는 자신이 원하는 먹이 등을 얻기 위해 언어를 사용했고, 칸지의 문법적 이해는 2세 인간 영아의 수준을 넘어서지 못했다. 선천적이고 생득적인 기제가 없이 단순히 학습을 통해 언어가 획득된다면 동물들 역시 인간과 같이 학습한 언어와 구조를 통해 무한한 의사 표현이 가능해야 한다. 동물 연구에서 나타난 동물 언어 학습의 한계점들은 인간에게 고유한 ‘이것’의 존재가능성을 지지한다.\n\n① 스키너의 강화\n② 촘스키의 언어습득 장치\n③ 레너버그의 결정적 시기\n④ 반두라의 모방\n⑤ 브루너의 언어습득지원체계", "a": "2", "a2": "2 촘스키의 언어습득 장치", "e": "언어발달에 있어 생득론적 관점은 아동이 언어를 습득할 수 있는 능력을 가지고 태어났다고 주장한다. 즉, 언어를 배울 수 있는 가능성을 타고났다는 것이다.\n‘촘스키의 언어습득장치’는 인간이 선천적으로 가지고 태어나는 보편적 문법 지식체계로, 문법적인 변형규칙을 적용가능하게 하는 장치이다.", "b": "3권 p.342"}, {"id": "B9-1-2", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "피아제(Piaget)의 인지발달 기제 중, 새로운 자극을 마주했을 때 기존의 인지 도식을 수정하거나 새로운 도식을 만들어 평형 상태를 회복하는 인지적 적응 과정은?", "a": "조절", "a2": "조절 (Accommodation)", "e": "기존의 도식을 바꾸지 않고 새로운 정보를 흡수하는 동화(Assimilation)와 구별되는 개념입니다.", "b": "3권 p.330 · 3권 p.423"}, {"id": "B9-1-3", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "에른스트 헤켈(Ernst Haeckel)의 생물학적 진화론 법칙을 최초로 인간 심리 발달에 적용하여 아동기에서 청소년기로의 발달을 인류 조상들의 야만 상태에서 문명사회로의 대격동적 도약기를 유전적 프로그램에 의해 고스란히 밟아 나가는 것이라 설명한 홀(Hall)의 이론적 명칭은?", "a": "재현이론", "a2": "재현이론 (Recapitulation Theory)", "e": "개체발생은 계통발생을 재현한다는 진화학적 가설을 아동 및 청소년 발달 단계(야만에서 문명으로의 이행인 질풍노도기)에 일대일로 매칭한 이론입니다.", "b": "3권 p.414"}, {"id": "B9-1-5", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "호프만(Hoffman)이 제시한 부모의 훈육 방법 중, 아동이 잘못된 행동을 저질렀을 때 아동의 행동이 타인에게 미친 물리적·정서적 피해와 고통을 논리적으로 설명해 주어, 아동 스스로 도덕적 규칙의 타당성을 수긍하고 조망수용 능력 및 공감을 발달시키도록 이끄는 가장 유용한 훈육 기법은?", "a": "유도법", "a2": "유도법 (Induction)", "e": "호프만에 따르면 부모가 사랑을 끊겠다는 협박을 일삼는 '애정 철회법'이나 신체적·언어적 폭력을 사용하는 '권력 행사법'은 아동에게 불안과 분노만을 남겨 도덕성 발달을 저해합니다. 반면, 타인의 고통을 짚어주는 '유도법'은 아동의 내재적 도덕성 자율 내면화를 적극 촉진합니다.", "b": "3권 p.389"}, {"id": "B9-1-7", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "위니컷(Winnicott)이 제안한 무의식적 방어 성격 구조로, 양육자의 조건적인 수용에 순응하기 위해 자신의 진짜 욕구(참자기)를 깊은 곳에 억압하고 타인의 기대에만 과도하게 부응하며 느끼는 공허감의 상태는?", "a": "거짓 자기", "a2": "거짓자기 (False Self)", "e": "하터(Harter)가 제안한 청소년기의 '의지적/의도적 관계 대처'인 거짓 자기행동(False Self-Behavior)과 엄격히 변별되어야 합니다.", "b": "3권 p.349 · 2권 p.509"}, {"id": "B9-1-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "청소년기 자아중심성(Elkind)의 하위 특성으로, 자신은 매우 특별하고 고유한 존재이므로 보편적인 위험이나 재앙(사고, 질병 등)으로부터 스스로 면제되어 있다고 믿는 비현실적 신념은?", "a": "개인적 우화", "a2": "개인적 우화 (Personal Fable)", "e": "타인들이 자신을 끊임없이 관찰하고 평가한다고 믿는 상상적 청중(Imaginary Audience)과 함께 청소년기 인지 왜곡의 양대 축을 형성합니다.", "b": "3권 p.438"}, {"id": "B9-1-9", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "안나 프로이트(A. Freud)가 제시한 청소년기 고유의 방어기제로, 사춘기 재활성화된 원초아의 성적 본능과 충동에 극심한 불안을 느낀 나머지 성욕뿐만 아니라 신체와 관련된 모든 기본적인 생리 욕구(식욕, 수면욕, 편안함 등) 충족 자체를 죄악시하고 전면 차단하려는 태도는?", "a": "금욕주의", "a2": "금욕주의 (Asceticism)", "e": "특정 욕구 하나를 무의식으로 억압하는 것을 넘어, 자아 통제력 상실의 공포 때문에 신체적인 모든 쾌락적 만족 행위 자체를 거부하는 전면적 방어 방식입니다.", "b": "3권 p.416"}, {"id": "B9-1-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "길리건(Gilligan)의 보살핌(배려)의 윤리 발달 단계 중, 자신만이 중요한 1수준(개인적 생존)과 타인만을 위해 자신을 맹목적으로 희생하는 2수준(자기희생으로서의 선)을 통합하여, 자신과 타인 모두를 소중히 보살펴야 할 유기적 존재로 수용하며 \"누구에게도 해를 끼치지 않겠다\"는 원칙을 고수하는 최고 단계는?", "a": "비폭력 도덕성 / 비폭력 도덕성 지향", "a2": "수준 3: 비폭력 도덕성 지향 (또는 비폭력 도덕성)", "e": "3수준에 이른 여성은 자타를 아우르는 '상호의존성'과 '관계적 연결망'을 올바르게 자각합니다. 따라서 타인만을 위한 희생이 진정한 선이 아님을 깨닫고, 자신과 타인 모두에게 상처를 주지 않는 보편적 비폭력 원리를 도덕성의 근본으로 삼습니다.", "b": "3권 p.385"}, {"id": "B9-2-1", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "여러 방해 자극 속에서 불필요한 자극을 억제하고 자신이 목표로 삼은 특정 자극에만 몰두하여 정보를 가공하는 주의 유형은?", "a": "선택적 주의 / 선택주의", "a2": "선택(적) 주의 (Selective Attention)", "e": "대뇌 전두엽의 발달과 밀접하게 연계되며, 억제 능력이 부족한 유아기에는 주의가 쉽게 산만해집니다.", "b": "3권 p.318"}, {"id": "B9-2-2", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "제임스 레스트(James Rest)의 도덕성 4구성요소 중, 현재 내가 직면한 갈등 상황이 도덕적 쟁점을 품고 있는 심각한 사건임을 알아차리고, 이 안에서 나의 개입과 행동적 선택이 타인의 복지와 감정에 어떠한 고통과 영향력을 줄 수 있을지 CCTV처럼 예민하게 자각하고 분별하는 능력은?", "a": "도덕적 감수성", "a2": "도덕적 감수성 (Moral Sensitivity)", "e": "여러 대안의 도덕적 가치와 의무를 시시비비 가리는 '도덕적 판단(Kohlberg식 영역)'이 작동하기 전, 상황 자체를 도덕적으로 탐지해 내는 인지적 안테나 영역입니다.", "b": "3권 p.442"}, {"id": "B9-2-3", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "규칙을 위반하면 주변의 권위자가 이를 목격하지 못했거나 처벌을 내리지 않더라도, 하늘이 벌을 내리거나 스스로 돌에 걸려 넘어지는 등 자연법칙에 의해서라도 우주적으로 반드시 처벌이 뒤따르게 된다고 믿는 피아제 타율적 도덕성의 특징은?", "a": "내재적 정의", "a2": "내재적 정의 (Immanent Justice)", "e": "내재적 정의는 규칙 위반과 인과관계가 없는 물리적 사건(예: 도둑질하고 도망치다 다리를 다침)을 인과적으로 연결해 \"벌을 받은 것\"이라 생각하는 특징입니다. 이는 주관적 의식과 객관적 실제 세계를 완전하게 분리하여 추론하지 못하는 아동기 자아중심성에서 기인합니다.", "b": "3권 p.382 · 3권 p.381"}, {"id": "B9-2-5", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "케이스(Case)는 인지발달 단계를 (      ) 용량의 개념으로 설명하였다.", "a": "작업기억", "a2": "작업기억", "e": "작업기억은 작동공간과 저장공간으로 구성되어 있다.", "b": "3권 p.341"}, {"id": "B9-2-7", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "그로스(Gross)의 정서조절 전략 중, 정서를 유발하는 상황이나 사건 자체에 대한 개인의 주관적인 평가나 생각을 바꾸어 정서적 반응의 강도를 조절하는 전략의 명칭은?", "a": "인지적 변화 / 인지적 재평가", "a2": "인지적 변화 (인지적 재평가, Cognitive Change)", "e": "이는 정서가 완전히 발생하기 전에 개입하는 '선행사건 중심 정서조절 전략' 중 하나로, 스트레스를 유발하는 사건의 의미를 긍정적으로 바꾸어 생각함으로써 부적 정서의 유발을 원천적으로 완화하는 고차원적 인지 전략입니다.", "b": "3권 p.368"}, {"id": "B9-2-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "반복 제시되는 동일한 자극에 영아가 흥미를 잃고 응시 시간이나 빠는 속도가 감소하는 현상을 (①)라 하고, 여기에 새로운 자극을 제시했을 때 다시 높은 주의 집중을 보이는 현상을 (②)라고 한다.", "a": "습관화 / 탈습관화", "a2": "① 습관화 (Habituation), ② 탈습관화 (Dishabituation)", "e": "이 패러다임은 영아가 두 자극 간의 광학적·시각적 차이를 인지적으로 변별하고 구분하는 능력이 있음을 입증하는 도구로 쓰입니다.", "b": "3권 p.319 · 3권 p.323"}, {"id": "B9-2-9", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "코프(Kopp)의 자기통제 발달 단계 중, 아동이 스스로 규칙을 기억하고 내면화하여 부모의 직접적인 감시가 없는 상황에서도 도덕적 규범을 준수하는 능력을 지니는 단계를 쓰시오.", "a": "자기통제 / 자기통제 단계", "a2": "자기통제 단계 (Self-Control Phase)", "e": "부모가 현존할 때 지시나 물리적 제재에 따르는 수준인 '통제 단계(1단계)'에서 진일보하여, 언어와 인지적 표상 능력을 기반으로 규칙을 마음에 품고(내면화) 스스로 자신의 행동을 모니터링하며 이끄는 단계입니다.", "b": "3권 p.388"}, {"id": "B9-2-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "시글러(Siegler)의 모형으로, 아동이 과제를 해결할 때 한 번에 하나의 인지 전략만 단계적으로 쓰지 않고, 여러 대안적 전략들이 공존하며 경쟁하다가 성공률이 높은 전략 위주로 생존해 간다는 인지적 발달 모델은?", "a": "전략선택모델 / 중복파장이론", "a2": "전략선택모델 혹은 중복파장 이론(Overlapping Waves Model)", "e": "인지 발달이 계단식 단계로 일어나기보다 파도가 밀려오고 쓸려가듯 여러 인지 조작 전략이 겹쳐서 나타난다고 봅니다.", "b": "3권 p.340"}, {"id": "B9-3-1", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "와이너(Weiner)가 분류한 비행 유형 중, 평소 성실하게 통제되던 청소년이 내면의 감당하기 힘든 억압적 고통, 갈등, 혹은 분노를 마주했을 때, 이를 누군가에게 직접 알릴 구체적인 소통 기술이 부족하여 타인의 관심과 조력을 이끌어 내려는 '구조 신호(Cry for help)'적 목적으로 저지르는 우발적인 비행은?", "a": "신경증적 비행", "a2": "신경증적 비행 (Neurotic Delinquency)", "e": "주로 단독으로 갑작스럽게 일어나는 행동화 양상이며, 핵심 내재 동기는 '나를 봐주고 나를 도와 달라'는 타인의 인정과 찬탄 획득 욕구입니다.", "b": "3권 p.475"}, {"id": "B9-3-3", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "바커(Barker)의 신체심리학적 관점에서 제시된 개념으로, 사춘기 급격한 성장으로 인해 신체는 이미 성인 수준의 체격에 도달했으나 사회·법적 권리와 책임은 여전히 미성숙한 아동 수준에 묶여 있어 청소년이 대인관계 내에서 어느 쪽에도 온전히 소속되지 못하고 겪게 되는 모호한 경계선상의 갈등 상태는?", "a": "주변적 상황", "a2": "주변적 상황 (Marginal Situation)", "e": "레빈(Lewin)의 '주변인' 현상을 유발하는 구체적인 원인으로서, 신체 발달과 사회적 지위의 시간적 불일치(비동시성)를 뜻하는 신체심리학적 개념입니다.", "b": "3권 p.415 · 3권 p.398"}, {"id": "B9-3-4", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "경험과 학습, 혹은 신경학적 손상에 반응하여 뇌의 시냅스 연결망과 구조를 스스로 재구성하고 스스로를 치료하는 뇌의 특성은?", "a": "가소성 / 뇌 가소성", "a2": "뇌 가소성 (가소성, Brain Plasticity)", "e": "뇌 손상 후 다른 영역이 기능을 분담하는 '회복 가소성'과 학습을 통해 지도망을 바꾸는 '적응 가소성'이 있습니다.", "b": "3권 p.317 · 3권 p.302 · 3권 p.316"}, {"id": "B9-3-5", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "브론펜브레너(Bronfenbrenner)의 5대 환경체계 중, 자녀를 돕기 위해 엄마(가정 체계)가 담임 선생님(학교 체계)과 직접 연계하여 방안을 논의하는 사례가 속하는 환경적 공간은?", "a": "중간체계", "a2": "중간체계(Mesosystem)", "e": "\"미시체계와 미시체계가 만나는 접점이 형성되었는가?\"를 기준으로 삼아야 하며, 청소년이 직접 발을 딛지 않는 공간인 '외체계(부모 직장 등)'와 엄격히 구별됩니다.", "b": "3권 p.427 · 3권 p.426"}, {"id": "B9-3-7", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "에릭슨(Erikson)의 심리사회적 발달 단계 중 청소년기에 해당하며, 성인으로서의 책임과 의무를 일시적으로 유예받고 다양한 역할 실험과 정체성 탐색에 전념할 수 있도록 허용되는 자유로운 기간은?", "a": "심리사회적 유예기", "a2": "심리사회적 유예기 (Psychosocial Moratorium)", "e": "청소년이 이 유예기를 건강하게 통과하며 치열한 위기를 겪어낼 때 비로소 확고한 자아정체감을 확립할 수 있습니다.", "b": "3권 p.353 · 3권 p.448"}, {"id": "B9-3-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "토마스(Thomas)와 체스(Chess)가 제시한 기질 유형 중, 생리적 리듬(수면, 식사, 배변)이 불규칙하고, 새로운 자극이나 상황에 노출되었을 때 강한 저항과 함께 격렬한 부정적 정서 반응을 나타내며, 새로운 환경에 적응하는 데 오랜 시간이 걸리는 유형은?", "a": "까다로운 기질", "a2": "까다로운 기질 (Difficult Child)", "e": "토마스와 체스의 종단 연구에 따르면 영아의 약 10%가 까다로운 기질에 해당합니다. 이 유형의 아동은 양육의 난이도가 높기 때문에 양육자가 아동의 불규칙성에 민감하고 부드럽게 대처하는 조화의 적합성이 매우 중요합니다.", "b": "3권 p.371"}, {"id": "B9-3-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "대뇌피질의 좌반구와 우반구가 서로 독립적으로 분화되어, 좌반구는 논리와 언어를, 우반구는 시공간적 지각과 정서를 지배적으로 담당하는 비대칭적 기능 분화 현상은?", "a": "뇌의 편재화", "a2": "뇌의 편재화 (Cerebral Lateralization)", "e": "두 반구는 교량 역할을 하는 강력한 신경섬유 다발인 뇌량(Corpus Callosum)을 통해 실시간으로 정보를 상호 교환합니다.", "b": "3권 p.316"}, {"id": "B9-4-1", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "갓 말을 배우기 시작한 아동이 특정 낱말의 의미 범위를 객관적 범주 너머로 지나치게 넓게 적용하는 언어적 오류(예: 네 발 달린 동물을 모두 '개'라고 부르는 현상)는?", "a": "과잉확장", "a2": "과잉확장 (Overextension)", "e": "반대로 자신의 애착 인형만 '인형'이고 다른 인형은 인형이 아니라고 우기는 좁은 의미의 제한 오류는 과잉축소(Underextension)라고 합니다.", "b": "3권 p.345"}, {"id": "B9-4-3", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "영아가 눈으로 본 알록달록한 장난감을 손으로 직접 만져보고서도 동일한 장난감임을 알아채는 것과 같이, 서로 독립된 감각기관의 정보를 뇌에서 유기적으로 연합하고 통합하여 인지하는 지각 능력은 감각 간 지각 혹은 (      )이라고 한다.", "a": "통합감각", "a2": "통합감각 (Intersensory Perception)", "e": "감각이 독립적으로 태어나 학습을 통해 통합된다는 피아제(Piaget)의 통합이론과 원래 연결된 상태로 태어난다는 깁슨(Gibson)의 분화이론이 대립합니다.", "b": "3권 p.322"}, {"id": "B9-4-4", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "비고츠키의 (      )를 피아제는 인지적 미성숙의 상징인 '자기중심적 독백'으로 깎아내린 반면, 비고츠키는 이것이 아동기 행동과 사고를 조절하는 도구라고 보았다.", "a": "사적 언어 / 개인적 발화", "a2": "사적 언어 (개인적 발화, Private Speech)", "e": "사적 언어는 발달하면서 점차 소리 없는 내언어(Inner Speech) 형태로 내면화되어 지속적으로 사고를 지배합니다.", "b": "3권 p.338"}, {"id": "B9-4-5", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "도덕성 발달 단계에서 인습 수준에 들어선 성실한 청소년들이, 자아정체감 확립 과정에서 겪는 극심한 심리사회적 동요와 기성 질서에 대한 내적 회의로 인해 일시적으로 전인습 하위 수준인 2단계(개인적 쾌락주의 지향)로 발달이 후퇴했다가 위기 극복 후 다시 복귀하는 불안정 현상은?", "a": "도덕적 퇴행 / 도덕적 퇴행현상", "a2": "도덕적 퇴행(현상) (Moral Regression)", "e": "인지 발달 단계의 고정 불변성을 해치는 예외적 병리가 아니라, 정체성 독립 터널을 지날 때 자아 정렬을 위해 일시적으로 가동하는 과도기적 불안정 역동입니다.", "b": "3권 p.442 · 3권 p.384"}, {"id": "B9-4-7", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "영아가 주양육자를 언제든지 돌아와 정서적으로 의존할 수 있는 든든한 버팀목으로 믿고, 이 신뢰를 바탕으로 낯설고 새로운 외부 세계를 적극적으로 탐색하고 학습하는 능동적인 기반을 일컫는 용어는?", "a": "안전기지", "a2": "안전기지 (Secure Base)", "e": "영아는 위협을 느끼거나 지쳤을 때는 양육자를 '안전한 피난처'로 삼아 돌아와 위안을 얻고, 정서적 에너지가 충전되면 다시 양육자를 '안전기지'로 삼아 세상을 향해 나아가 탐색활동을 펼칩니다.", "b": "3권 p.378 · 3권 p.375 · 3권 p.374"}, {"id": "B9-4-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "망막에 맺히는 자극의 실제 물리적 크기나 모양, 밝기가 보는 각도나 거리에 따라 계속 변하더라도, 우리의 뇌가 대상 고유의 물리적 속성을 변함없이 동일한 것으로 인식하는 지각적 조절력은?", "a": "항등성 / 지각적 항등성", "a2": "지각적 항등성 혹은 항등성 (Perceptual Constancy)", "e": "친구가 다가오면서 망막상의 크기가 급격히 커져도 친구를 괴물로 지각하지 않는 '크기 항등성' 등이 포함됩니다.", "b": "3권 p.320 · 3권 p.624 · 3권 p.625"}, {"id": "B9-4-9", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "버스(Buss)와 플로민(Plomin)의 EAS 모형에 따르면 기질은 유전적 영향력이 매우 강해 전 생애 동안 잘 변하지 않는 성격의 기본 요소를 형성한다. 이 모형이 제시한 기질의 3가지 핵심 차원을 쓰시오.", "a": "정서성 / 활동성 / 사회성", "a2": "정서성 (Emotionality), 활동성 (Activity), 사회성 (Sociability)", "e": "정서성은 약한 자극에도 쉽게 스트레스를 받고 고통·분노를 표출하는 경향이며, 활동성은 신체 움직임의 속도와 강도를 의미합니다. 사회성은 타인과 상호작용하고 함께 어울리기를 갈망하는 경향성을 뜻합니다.", "b": "3권 p.372"}, {"id": "B9-4-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "과거의 경험을 의식적으로 떠올릴 때, 아무런 힌트나 단서가 즉각 주어지지 않은 상태에서 과거의 행동과 심상을 머릿속에서 능동적으로 끄집어내는 인출 능력은?", "a": "회상 / 회상 기억", "a2": "회상 혹은 회상 기억 (Recall)", "e": "제시된 단서(모빌 등)를 보고 과거를 떠올리는 재인 기억(Recognition)보다 고차원적인 기억 인출 방식입니다.", "b": "3권 p.323"}, {"id": "B9-5-2", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "촘스키(Chomsky)가 제안한 개념으로, 인간이 불충분한 언어적 환경 자극 속에서도 모국어의 문법 규칙을 선천적으로 자동 습득하여 산출해 낼 수 있도록 하는 내재적 신경학적 기제는?", "a": "언어습득장치", "a2": "언어습득장치 (LAD; Language Acquisition Device)", "e": "행동주의적 모방과 강화 이론의 맹점을 비판하며, 인간이 언어 유전성을 타고났음을 밝힌 생득주의 언어발달 이론의 기초입니다.", "b": "3권 p.342"}, {"id": "B9-5-4", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "영아가 낯선 사람을 만나거나 애매모호한 자극 상황에 직면했을 때, 스스로 어떻게 행동해야 할지 결정하기 위해 주양육자의 얼굴 표정이나 목소리 등의 정서적 반응을 신호로 참조하는 현상은?", "a": "사회적 참조", "a2": "사회적 참조 (Social Referencing)", "e": "사회적 참조가 일어나기 위해서는 타인의 정서 반응이 무엇을 의미하는지 이해하는 능력, 영아와 양육자가 동일한 자극 대상에 함께 주의를 두는 공동주의(Joint Attention) 능력, 그리고 해석된 정서 신호에 맞추어 자신의 행동을 통제하는 행동조절 능력이 필수적으로 선행되어야 합니다.", "b": "3권 p.367"}, {"id": "B9-5-5", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인간의 대뇌 피질 영역 중, 언어의 '이해 및 해독'을 담당하여 이 영역이 손상될 경우 말은 유창하게 하나 의미 없는 단어를 나열하게 되는 수용성 실어증 영역의 명칭은?", "a": "베르니케 영역 / 베르니케", "a2": "베르니케 영역 (Wernicke's Area)", "e": "반면 언어의 '표현 및 산출'을 담당하여 손상 시 말을 더듬거나 단어를 인출하지 못하는 운동성 실어증 영역은 브로카 영역(Broca's Area)이라고 합니다.", "b": "3권 p.347 · 3권 p.286 · 3권 p.612"}, {"id": "B9-5-6", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "타인의 편견이 개입된 유도 질문이나 암시, 혹은 권위자의 압력에 동조하여 실제로 일어나지 않은 사건조차 자신의 진짜 기억인 것처럼 왜곡되게 재구성하여 진술하는 아동기 기억의 취약성은?", "a": "피암시성", "a2": "피암시성 (Suggestibility)", "e": "상담실에서 아동의 진술 왜곡을 방지하기 위해 유도 질문이나 폐쇄형 질문을 배제하고 개방형 질문(Open-ended Questions) 위주로 면담을 구성해야 합니다.", "b": "3권 p.327 · 3권 p.325"}, {"id": "B9-5-7", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "개인이 성장하면서 겪은 구체적인 추억과 사건들을 시간과 장소의 맥락 속에서 생생히 기억하는 장기기억의 하위 유형은?", "a": "일화 기억 / 자서전적 기억", "a2": "일화 기억 혹은 자서전적 기억 (Episodic Memory)", "e": "객관적 상식과 지식(시간·장소 맥락 없음)을 저장하는 의미적 기억(Semantic Memory)과 함께 '서술적 기억'을 이룹니다.", "b": "3권 p.324"}, {"id": "B9-5-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "산드라 벰(Sandra Bem)의 이론으로, 아동이 사회적 경험을 거쳐 세상을 '남성'과 '여성'이라는 좁은 이분법적 렌즈로 분류하는 정보 처리 가이드라인 필터를 머릿속에 형성하여 자신의 행동을 지배하게 된다는 이론은?", "a": "성 도식 이론 / 성도식", "a2": "성 도식 이론 (Gender Schema Theory)", "e": "이 도식화 필터가 강력하게 작동하는 아동일수록 들어오는 새로운 정보들을 극단적인 성 고정관념식으로 왜곡하여 수용하게 됩니다.", "b": "3권 p.357 · 3권 p.455 · 3권 p.358"}, {"id": "B9-5-9", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "마음이론을 설명하는 4대 이론 중, 타인의 마음 상태를 이론적 인지 규칙으로 읽지 않고, 자신의 두뇌 인지 장치 속에 상대방의 조건과 처지를 가상으로 대입(거울처럼 투사)해 보며 모사해 낸다고 설명하는 이론은?", "a": "모사이론 / 시뮬레이션 이론", "a2": "모사이론 혹은 시뮬레이션 이론 (Simulation Theory)", "e": "이 이론은 아동이 어릴 때 또래와 적극적으로 소꿉놀이를 하는 가장 놀이(Pretense Play) 경험이 마음이론 발달에 가장 강력한 동기원이라고 주장합니다.", "b": "3권 p.365"}, {"id": "B9-5-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "콜버그(Kohlberg)의 성 항상성 발달 3단계 중 가장 성숙한 마지막 단계로, 머리 모양, 옷차림, 하는 행동 등 외형적인 조건이 달라지더라도 생물학적인 성별은 절대로 변하지 않음을 완벽히 이해하는 단계는?", "a": "성 항상성 / 성 일관성", "a2": "성 항상성 혹은 성 일관성 (Gender Constancy)", "e": "성별을 명명할 수 있는 성 정체성(Gender Identity), 시간적 영속성만 지각하는 성 안정성(Gender Stability)을 거쳐 만 6~7세경 완성됩니다.", "b": "3권 p.357"}, {"id": "B9-6-1", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "피터 블로스(Peter Blos)의 이론으로, 아동기 동안 자아를 지탱하기 위해 내면에 절대적 권위로 내사(Introjection)해 두었던 '부모의 표상'을 의심하고 흔들어 해체함으로써, 부모에게 묶여 있던 정서적 리비도를 주체적으로 회수하고 자아의 독립을 쟁취해 나가는 청소년기 발달 역동은?", "a": "이차 개별화", "a2": "이차 개별화 혹은 두 번째 개별화 (Second Individuation)", "e": "실체적 어머니로부터 육체를 독립시키는 영아기 '일차 개별화(말러)'와 달리, 청소년기는 내면화된 부모의 통제 가치관으로부터 심리 구조를 독립시키는 과업입니다.", "b": "3권 p.417"}, {"id": "B9-6-3", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "미숙아를 부모의 맨가슴 위에 심장 소리가 들리도록 밀착시켜 따뜻한 피부를 맞닿게 해주는 치료적 개입 방법으로, 자율신경계 안정을 돕는 이 케어의 명칭은?", "a": "캥거루식 케어", "a2": "캥거루식 케어 (Kangaroo Care)", "e": "따뜻한 살결 접촉(촉각 자극)을 통해 교감신경계의 각성을 낮추고, 신체 이완과 안정을 돕는 부교감신경계를 활성화합니다.", "b": "3권 p.322"}, {"id": "B9-6-4", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "데이먼(Damon)의 분배공정성 발달 단계 중, 열심히 노력한 사람이나 뛰어난 성취를 거두어 사회적 기여가 높은 대상에게 더 많은 보상과 자원을 분배해야 마땅하다고 생각하는 6~7세 아동의 분배 정의 단계의 명칭을 쓰시오.", "a": "장점 / 업적 지향", "a2": "장점 (업적 지향)", "e": "무조건 동등하고 획일적으로 나누어야 공평하다고 고집하는 5~6세의 '엄격한 평등성' 단계를 지나, 자원 분배 과정에 행위자의 성취도, 투자 시간, 기여와 공헌도라는 객관적 기준을 정당하게 대입하기 시작하는 발달 단계입니다. 8세 이후가 되면 소외 계층의 사정을 우선 배려하는 '형평성 및 박애' 단계로 발전합니다.", "b": "3권 p.393"}, {"id": "B9-6-6", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "나이서(Neisser)의 5대 자기개념 중, 타인은 절대 볼 수 없는 나만의 고유한 내면세계(비밀, 주관적 감정, 생각 등)가 독립적으로 실재하고 있음을 깨닫는 자기의 명칭은?", "a": "사적 자기", "a2": "사적 자기(Private Self)", "e": "타인과 실시간 정서를 공유하는 대인관계적 자기(Interpersonal Self)나 시간적 연속성을 이해하는 확장된 자기(Extended Self)와 구별됩니다.", "b": "3권 p.348"}, {"id": "B9-6-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "청소년기의 충동적이고 무모한 위험감수 행동을 뇌 과학적으로 규명하는 모델로, 정서와 보상에 민감한 편도체 및 변연계 중심의 '사회정서 시스템'은 조기에 급속히 성숙하는 반면, 충동을 억제하고 기획하는 전전두엽 중심의 '인지통제 시스템'은 20대까지 서서히 발달하여 그 성숙의 시간차로 위기가 초래된다는 이론(모델)은?", "a": "이중 시스템 모델 / 이중 시스템 이론", "a2": "이중 시스템 모델 (Dual Systems Model)", "e": "브레이크(전두엽)는 아직 조율 중인데 가속 페달(변연계)만 급격히 밟아 불균형이 최대로 벌어지는 청소년 초기의 신경학적 취약성을 입증합니다.", "b": "3권 p.433"}, {"id": "B9-6-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "로스바르트(Rothbart) 모형에서 제시한 기질 차원 중, 부적절한 지배적 반응(충동)을 억제하고 주의를 필요에 따라 유연하게 돌려 재배치하는 등 자극에 의해 일어난 흥분과 행동적 반응을 스스로 조절하는 기질적 능력은?", "a": "의도적 통제", "a2": "의도적 통제 (Effortful Control)", "e": "의도적 통제는 뇌의 전두엽 발달 및 실행 기능과 직접적으로 연관됩니다. 이 능력이 높은 아동은 장기적인 목표를 위해 눈앞의 매력적인 유혹을 참고 주의를 지속할 수 있어, 향후 학업 성취 및 사회적 적응의 강력한 예언 지표가 됩니다.", "b": "3권 p.372"}, {"id": "B9-7-1", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "마르샤(Marcia)의 정체감 4대 지위 중, 삶의 목표에 대해 스스로 치열하게 탐색하고 방황하는 위기(Crisis)는 겪고 있으나, 아직 어떠한 구체적인 대안이나 신념에 완전히 헌신(Commitment)하지는 못한 진행형 상태는?", "a": "정체감 유예", "a2": "정체감 유예 (Identity Moratorium)", "e": "부모가 정해준 진로를 고민 없이 수용하는 상태는 정체감 유실(Foreclosure), 고민도 없고 노력도 하지 않는 무기력한 상태는 정체감 혼미(Diffusion)입니다.", "b": "3권 p.353"}, {"id": "B9-7-4", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "시험 전 극심한 불안을 예방하기 위해 소음이 없는 조용한 독서실을 찾아 공부하거나, 무서운 개가 있는 길을 피해 다른 길로 돌아가는 등 부적 정서가 애초에 발생하지 않도록 특정 인물, 장소, 상황을 미리 선택하거나 회피하는 그로스의 정서조절 전략은?", "a": "상황 선택", "a2": "상황 선택 (Situation Selection)", "e": "상황 선택은 정서 발생의 가장 첫 단계에서 작동하는 전략으로, 특정 정서를 유발할 가능성이 높은 환경에 자신을 노출시킬지 혹은 회피할지 스스로 결정하는 예방적 조치에 해당합니다.", "b": "3권 p.368"}, {"id": "B9-7-6", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "피아제의 전조작기 아동이 보여주는 논리적 오류로, 한 특정 사건에서 다른 특정 사건으로 어떠한 논리적 인과관계 없이 직접 연결 지어 추론하는 경향성은?", "a": "전환적 추론 / 전인과적 추론", "a2": "전환적 추론 혹은 전인과적 추론 (Transductive Reasoning)", "e": "예컨대 \"낮잠을 자지 않았기 때문에 아직 오후가 되지 않았다\"라고 판단하는 식의 자기중심적 인과 추론입니다.", "b": "3권 p.333"}, {"id": "B9-7-7", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "유치원 하원, 손 씻기, 저녁 식사, 목욕, 취침 등 매일 반복되는 유아의 일상적인 경험의 순서와 인과관계를 나타내는 무의식적인 기억 도식(사건 도식)의 명칭은?", "a": "스크립트", "a2": "스크립트 (Script)", "e": "유아에게 하루 일과를 예측할 수 있는 인지적 지도를 제공하여 물리적·정서적 안정감과 평온함을 줍니다.", "b": "3권 p.326"}, {"id": "B9-7-8", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "타인으로부터 장난감, 돈, 권력 등 자신이 원하는 구체적인 이익이나 목표를 획득하기 위한 '수단과 도구'로 타인에게 해를 가하는 행동을 ( ① )이라 하고, 타인에게 고통과 상처를 입히는 것 '자체'를 궁극적인 목적으로 삼아 발현되는 가해 행동을 ( ② )이라 한다.", "a": "도구적 공격성 / 적대적 공격성", "a2": "① 도구적 공격성 (Instrumental Aggression), ② 적대적 공격성 (Hostile Aggression)", "e": "영유아기 유아들이 보이는 장난감 쟁탈전은 대부분 도구적 공격성입니다. 반면, 아동기 중기 이후에는 타인의 행동 이면에 깔린 의도와 동기를 인지적으로 조망할 수 있게 되면서, 타인에게 모욕이나 해를 주어 좌절시키는 것이 주 목적인 적대적 공격성이 부각되기 시작합니다.", "b": "3권 p.390"}, {"id": "B9-7-10", "s": "아동 및 청소년심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "영아의 선천적인 기질적 특성과 영아가 자라나는 환경적 요구, 양육자의 기대 및 양육 방식이 서로 조화를 이룰 때 가장 이상적인 발달이 촉진되며, 상호 부조화가 발생할 때 부적응과 갈등이 유발된다는 원리는?", "a": "조화의 적합성", "a2": "조화의 적합성 (Goodness of Fit)", "e": "까다롭거나 반응이 느린 기질적 약점을 지닌 아동이라도 부모가 이를 비난하거나 억압하지 않고 아동의 템포에 맞춰 일관되고 민감하게 반응해주면(조화의 적합성이 확보되면) 아동은 긍정적인 발달적 성장과 적응을 이루어 냅니다.", "b": "3권 p.374 · 3권 p.292"}, {"id": "10-1", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 1, "d": "쉽게", "q": "헐(Hull)의 체계적 행동이론(S-O-R)에서 학습자가 행동을 방출하려는 주관적 반응경향성(E)을 결정하는 세 가지 핵심 변수 중, '생리적 결핍(추동, D)'과 '자극-반응 연합 강도(습관강도, H)' 외에, 욕구 감소와 연계된 목표 자극의 주관적 가치를 지칭하는 변수명은 무엇인가?", "a": "유인가 / 유인동기", "a2": "유인가 혹은 유인동기", "e": "헐의 공식 E = D X H X K에서 K는 유인가를 뜻함.", "b": "3권 p.497"}, {"id": "10-2", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 2, "d": "쉽게", "q": "고전적 조건형성 과정에서 조건자극(CS)과 무조건자극(US)을 시간적으로 어떻게 배치하느냐에 따라 조건화의 성공 효율성이 결정된다. 이 중 조건자극을 먼저 제시하고, 그것이 끝나기 전에 무조건자극을 시간적으로 겹쳐서 제시함으로써 조건자극이 무조건자극의 신뢰할 만한 사전 예측 신호등 역할을 수행하도록 설계하는 가장 효과적인 시간적 배치 유형의 명칭은?", "a": "지연조건화", "a2": "지연조건화(Delay Conditioning)", "e": "자극 간의 시간적 근접성과 예측 정보 가치(수반성)가 가장 완벽하게 성립하는 방식으로, 동시조건화나 역행조건화에 비해 조건반응을 유도하는 힘이 압도적으로 우수합니다.", "b": "3권 p.500 · 3권 p.499"}, {"id": "10-3", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 3, "d": "어렵게", "q": "고전적 조건형성의 주요 정보처리 현상 중 하나로, 이미 하나의 조건자극(CS1)이 확고하게 조건화된 상태에서, 이 자극에 새로운 중성자극(CS2)을 추가하여 복합자극으로 묶어 무조건자극과 연합할 때, 기존 자극이 결과를 이미 100% 예견하고 있어 새로운 자극(CS2)은 아무런 예측 정보의 가치를 주지 못해(정보의 중복성) 조건화가 일어나지 않는 현상은 무엇인가?", "a": "차단 효과 / 차폐 효과", "a2": "차단 효과 혹은 차폐 효과 (Blocking)", "e": "로버트 레스콜라의 수반성 이론을 입증하는 가장 결정적인 실증적 증거로, 자극 간의 단순 시간적 근접성보다 '새로운 정보적 가치'가 조건화에 필수적임을 보여줍니다.", "b": "3권 p.499 · 3권 p.500 · 3권 p.501"}, {"id": "10-4", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "약물 중독자가 평소 자주 투약하던 익숙한 물리적 환경 자극(주사기 냄새, 늘 가던 방의 조명 등 = CS)을 마주하는 순간, 뇌는 신체의 항상성(Homeostasis)을 지키기 위해 약물이 몸에 들어와 일으킬 파괴적 효과와 정반대되는 생리적 각성 반응(체온 상승, 심박수 고조)을 사전에 발사한다. 이로 인해 마약의 효과가 상쇄되는 '내성(Tolerance)'이 생기게 되는데, 이 예방적 보상 반응을 뜻하는 고전적 조건화 용어는 무엇인가?", "a": "조건 반사적 보상 반응", "a2": "조건반사적 보상 반응(Conditioned Compensatory Response)", "e": "시겔(Siegel)의 이론으로, 중독자가 늘 늘려왔던 다량의 약물을 낯선 환경(CS 결여)에서 투약하는 순간 이 보상 반응이 작동하지 않아 과량투여(Overdose)로 즉사하는 원리를 해명합니다.", "b": "3권 p.503 · 3권 p.504 · 3권 p.499"}, {"id": "10-5", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "스키너의 조작적 조건화에서 특정 자발적 행동이 방출되기 직전에 제시되어, “만약 지금 행동(R)하면 보상을 받게 될 것이고, 그렇지 않으면 아무 결과가 없을 것”이라는 주관적 예측 신호등 역할을 하는 선행 환경 자극의 명칭은 무엇인가?", "a": "변별 자극", "a2": "변별자극 (Discriminative Stimulus)", "e": "변별자극은 반사 반응을 강제로 끌어내는 조건자극과 달리, 유기체가 스스로 행동을 선택하고 시작하도록 유발(Emit)하는 계기와 기회를 제공하는 자극 신호입니다.", "b": "3권 p.502 · 3권 p.501 · 3권 p.534"}, {"id": "10-6", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "강화물을 얻기 위해 도달해야 하는 표적 행동의 횟수가 평균값 기준으로 매번 무작위로 변동하여 유기체의 예측을 원천 차단하는 부분강화 계획은 무엇인가? (이는 4대 강화계획 중 가장 빠르고 폭발적인 반응률을 휴지기 없이 영속적으로 유지하며, 소거저항력이 가장 강한 특징을 지닌다.)", "a": "변동비율계획", "a2": "변동비율계획 (Variable-Ratio)", "e": "카지노의 슬롯머신이 작동하는 기본 유관 구조로, 언제 잭팟이 터질지 모른다는 불확실성에 의해 유기체의 학습 행동 빈도와 소거에 대항하는 저항력을 극대화하는 스케줄입니다.", "b": "3권 p.512 · 3권 p.511"}, {"id": "10-7", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "프리맥 원리는 고빈도 행동이 저빈도 행동을 강화한다고 보아 선호도 위계가 영구 고정되어 있다고 보았다. 반면 앨리슨과 팀버레이크는 유기체가 평소 마음껏 누리던 자유 분출량(기초선 수준) 이하로 행동을 강제 억제당해 '박탈' 상태가 되면, 평소에 귀찮아하던 저빈도 행동이라 할지라도 강력한 강화력을 획득할 수 있음을 입증했는데, 이 가설의 명칭은 무엇인가?", "a": "반응 박탈 가설", "a2": "반응박탈 가설 (Response Deprivation Hypothesis)", "e": "강화의 본질적 열쇠는 '단순 행동 선호도의 높고 낮음'에 있는 것이 아니라, '행동 실행 기회에 대한 인위적인 박탈과 결핍 수준'에 달려 있음을 보여주는 인지적 대안 가설입니다.", "b": "3권 p.513 · 3권 p.542 · 3권 p.543"}, {"id": "10-8", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 8, "d": "쉽게", "q": "전기 충격이나 통증 등 이미 가해져 겪고 있는 현재 진행형의 혐오자극으로부터 벗어나는 탈출 행동을 강화하는 '도피학습'과 달리, 고통이 시작되기 직전에 울리는 경고 신호를 인지하여 혐오자극의 발생 자체를 사전에 원천 차단하고 비켜가는 예방 행동을 학습하는 과정은 무엇인가?", "a": "회피학습", "a2": "회피학습 (Avoidance Learning)", "e": "회피학습은 도피학습이 먼저 성공적으로 확립되어야만 이행될 수 있으며, 경고 신호를 매개로 작동하는 고수준의 혐오 조건화 대처 행동입니다.", "b": "3권 p.513"}, {"id": "10-9", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 9, "d": "어렵게", "q": "가르시아 효과(맛 혐오 학습)는 단 한 번의 연합만으로 조건화가 성립하고, 자극 간의 긴 시간격차를 극복하며, 특정 자극끼리만 결합하는 생물학적 제약을 보여준다. 이는 전통적 행동주의 학자들이 고수해 오던 “어떠한 자극이든 조건자극과 무조건자극으로 사용될 수 있다면 동일한 강도와 속도로 연합될 수 있다”라는 극단적 환경 결정론적 가정을 완전히 무너뜨렸는데, 이 가정의 학술적 명칭은 무엇인가?", "a": "동등잠재력 가정 / 동등조건성 원리", "a2": "동등잠재력 가정 혹은 동등조건성 원리 (Equipotentiality Premise)", "e": "왓슨이나 스키너 등의 초기 행동주의가 가졌던 가정으로, 가르시아 효과와 셀리그만의 준비성 이론에 의해 학습 과정에 진화론적·생물학적 제약이 개입함이 증명되면서 반론이 제기되었음.", "b": "3권 p.504 · 3권 p.499 · 3권 p.500"}, {"id": "10-10", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2026", "no": 10, "d": "쉽게", "q": "손다이크의 시행착오설에는 3가지 법칙이 있다. 준비성의 법칙, 연습의 법칙, (      )이 있다.", "a": "효과의 법칙", "a2": "효과의 법칙", "e": "손다이크(Thorndike)의 시행착오설은 동물의 행동은 자극 S와 반응 R의 연합에 의해 결정된다고 본다.\n1) 준비성의 법칙\n2) 연습의 법칙: 단순동일행동의 반복이 아니고, 점차적인 변화를 꾀하는 목적 있는 진보\n3) 효과의 법칙", "b": "3권 p.507"}, {"id": "21-1", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "다음 사례는 간헐적 강화계획의 한 형태 중 ‘(      ) 계획’에 해당한다.\n\n교사는 때때로 예고 없이 불시에 학생의 학습 상태를 점검하는 경우가 있다. 교사가 이러한 불시점검을 하는 이유는 학생들이 언제 강화를 받게 될지 전혀 예측하지 못하므로 학생들이 항상 최선을 다해 공부할 것이라는 생각이 들기 때문이다. 그리고 교사가 학기 중간에 학생들의 학습 상태를 점검하는 일을 그만두어도, 즉 소거가 발생하여도 학생들은 남은 기간 동안 계속해서 최선을 다하는 행동을 지속하게 될 것이라는 믿음 때문이다. 이는 강화가 제시되는 시기를 예측할 수 없도록 설정해 행동의 빈도를 증가시키고 유지하는 방법이다.", "a": "변동간격", "a2": "변동간격", "e": "간헐적 강화계획은 고정비율계획, 고정간격계획, 변동간격계획, 변동비율계획으로 구분할 수 있다.\n‘변동간격계획’은 강화가 제시되는 시기를 예측할 수 없도록 설정하여 행동의 빈도를 증가시키고 유지시킬 수 있다.", "b": "3권 p.512"}, {"id": "21-2", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "다음의 사례에서 설명하는 현상을 무엇이라고 하는지 쓰시오.\n\n아이스크림을 가장 좋아하고 당근을 싫어하고 시금치를 가장 싫어하는 아이에게 저녁식사 때마다 시금치를 먹으면 후식으로 아이스크림을 먹을 수 있도록 허락한다면 아동이 가장 하기 싫어하는 행동인 시금치 먹기의 빈도를 점진적으로 증가시킬 수 있다.", "a": "프리맥 원리", "a2": "프리맥 원리", "e": "‘프리맥의 원리’는 발생빈도가 높은 행동을 강화물로 사용하여 발생빈도가 낮은 행동을 강화하는 것이다.", "b": "3권 p.513"}, {"id": "21-3", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음 중 ‘실험설계법’에 대한 설명으로 적절하지 않은 것을 고르시오.\n\n① ABAB반전설계는 독립변인과 종속변인 간의 기능적 관계를 검증할 수 있지만, 목표행동이 반전될 수 없는 특성을 지닐 때는 적절하지 않다.\n② 중다기초선설계는 다수의 기초선을 동시에 측정해야 하는 어려움이 있지만, 실험통제를 입증하기 위해 중재를 제거하거나 반전하지 않아도 된다는 장점을 가지고 있다.\n③ 처치변경설계는 여러 중재를 교대로 실시하여 중재들 간의 효과를 비교하는 방법으로 기초선 자료의 측정을 반드시 하지 않아도 된다는 장점이 있다.\n④ 다요인설계는 두 개 이상의 독립변인 요소들이 빠르게 교대되는 특징을 가지며, 서로 다른 중재 요소들을 동일한 횟수로 적용하고, 적용순서는 무작위로 선정된다.\n⑤ 준거변경설계는 독립변인을 이용하여 종속변인의 점진적이고 단계적인 변화를 이루고자 할 때 사용되며, 중재와 목표행동 간의 기능적 관계를 보여주기 위해 중재를 반전할 필요가 있다.", "a": "5", "a2": "5 준거변경설계는 독립변인을 이용하여 종속변인의 점진적이고 단계적인 변화를 이루고자 할 때 사용되며, 중재와 목표행동 간의 기능적 관계를 보여주기 위해 중재를 반전할 필요가 있다.", "e": "‘준거변경설계’는 중재와 목표행동 간의 기능적 관계를 보여주기 위해 중재를 반전할 필요가 없다는 장점이 있다.", "b": "3권 p.525 · 3권 p.526 · 3권 p.524"}, {"id": "21-4", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "다음 사례에서 (가) 부분에 해당되는 차별강화의 종류는 ‘(      ) 차별강화’이다.\n\n진운이는 수업시간에 늘 자리를 이탈해서 돌아다녔다. 담임교사는 이러한 문제행동을 멈추게 하기 위해 상담교사에게 자문을 구했고, (가)상담교사는 담임교사에게 진운이가 수업시간에 10분 이상 제자리에 앉아 있기만 하면 수업을 듣지 않거나 옆자리 친구들에게 말을 걸더라도 칭찬을 해주고 제자리에 앉는 행동을 강화해주는 방법을 알려주었다.", "a": "다른행동", "a2": "다른행동", "e": "차별강화의 종류는 저비율 차별강화, 다른행동 차별강화, 대체행동 차별강화, 상반행동 차별강화가 있다.\n‘다른행동 차별강화’는 표적행동 외 모든 행동을 강화하여 표적행동이 발생하지 않는 시간을 증가시키는 것이 목적이다.", "b": "3권 p.530 · 3권 p.531"}, {"id": "21-5", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "아동이 변별자극에 바람직한 반응을 보이는데 실패했을 경우, 바람직한 반응을 보일 수 있도록 도와주는 부가적인 자극을 ‘( A )’라고 하며, 어떤 부가적인 자극이 없어도 식별자극이 있을 경우 올바른 행동이 일어날 때까지 점차 촉구를 제공하지 않는 것을 ‘( B )’이라고 한다. A와 B를 순서대로 쓰시오.", "a": "촉구 / 용암", "a2": "촉구 / 용암", "e": "‘촉구’는 아동이 변별자극에 바람직한 반응을 보이는데 실패했을 경우 바람직한 반응을 보일 수 있도록 도와주는 부가적인 자극으로, 유형은 반응촉구와 자극촉구가 있다.\n‘용암’은 표적행동을 스스로 할 수 있을 때까지 점차 촉구를 없애나가는 방법이다.", "b": "3권 p.535 · 3권 p.534"}, {"id": "21-6", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "문제행동을 하였을 때 그 대가로 이미 지니고 있던 강화제를 잃게 함으로써 문제행동의 발생률을 감소시키는 절차를 ‘(      )’라고 하며, 문제행동을 하는 사람이 문제행동에 수반하여 모든 강화인에 접근하지 못하게 하는 절차를 타임아웃이라고 한다. 이 두 가지 방법의 공통점은 ‘(      )처벌의 원리’를 사용한다는 것이다.", "a": "반응대가 / 부적", "a2": "반응대가 / 부적", "e": "문제행동을 하였을 때 그 대가로 이미 지니고 있던 강화제를 잃게 함으로써 문제행동의 발생률을 감소시키는 절차는 ‘반응대가’이다.\n소거, 타임아웃, 반응대가의 공통점은 강화인을 제거하여 행동을 감소시키는 부적처벌의 원리에 기반한다는 것이다.", "b": "3권 p.539"}, {"id": "21-7", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "다음 중 ‘정적처벌의 원리’를 이용한 문제행동 교정 방법으로 옳지 않은 것은?\n\n① 정적연습: 받아쓰기에서 틀린 단어를 반복해서 여러 번 다시 쓰게 하는 것\n② 유관연습: 지각행동에 대해 운동장을 10바퀴 뛰게 하는 것\n③ 신체구속: 친구들을 때리거나 폭력적인 행동을 하는 아동의 팔을 붙잡아 움직일 수 없도록 하는 것\n④ 부적연습: 공책에 낙서를 하는 학생에게 공책 한 권에 전부 다 낙서를 하도록 하는 것\n⑤ 과잉교정: 친구를 때린 행동에 대해 앉았다 일어서기를 30번 하도록 하는 것", "a": "5", "a2": "5 과잉교정: 친구를 때린 행동에 대해 앉았다 일어서기를 30번 하도록 하는 것", "e": "친구를 때린 행동에 대해 앉았다 일어서기를 30번 하도록 하는 것은 ‘유관연습’에 해당한다.", "b": "3권 p.542"}, {"id": "21-8", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "4요인 유관분석에서 행동을 유도하는 동기를 높이거나 낮추어서 행동에 대한 의도와 작동 수준을 조절하는 것을 (      )이라고 하며, 이것은 이중적 통제의 효과가 있다.", "a": "동기조작", "a2": "동기조작", "e": "동기조작은 동기설정 조작과 동기해제 조작 두 가지 하위요소를 가진다.\n‘동기조작-선행사건-행동-후속결과’", "b": "3권 p.546"}, {"id": "21-9", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "이것은 한 자극이 어떤 한 반응을 일으키면 이 반응이 다음 반응을 유발하는 단서로 이어지는 과정이다. 이것은 한 반응이 다른 반응을 유발하는 선행사건으로 기능하기 때문이다. 이것을 위해서는 과제 분석을 하게 되며, 과제분석은 복잡한 행동을 위계에 따라 분류해 소단위의 간단한 행동으로 세분화하는 것이다. 과제 분석을 통해 목표행동을 쉽게 학습할 수 있도록 간단한 작은 단위의 행동으로 나누기 때문에 학습자는 쉽게 수행하고 강화받을 수 있다.", "a": "행동연쇄", "a2": "행동연쇄", "e": "행동 연쇄(behavioral chaining)는 한 자극이 어떤 한 반응을 일으키면 이 반응이 다음 반응을 유발하는 단서로 이어지는 과정이다. 이것은 한 반응이 다른 반응을 유발하는 선행사건으로 기능하기 때문이다. 조형처럼 행동을 작은 단위로 세분화하고 단순한 행동부터 단계적으로 강화하면서 최종 목표행동을 학습한다.\n① 과제 분석: 복잡한 행동을 위계에 따라 분류해 소단위의 간단한 행동으로 세분화하는 것이다. 과제 분석을 통해 목표행동을 쉽게 학습할 수 있도록 간단한 작은 단위의 행동으로 나누기 때문에 학습자는 쉽게 수행하고 강화받을 수 있다.\n② 종류\n㉠ 순행(전진) 연쇄법: 과제 분석을 통해 결정된 여러 단계의 행동들을 처음 단계부터 마지막 단계까지 순차적으로 가르치는 것이다.\n㉡ 역행(후진) 연쇄법: 과제 분석을 통해 나눈 단계의 행동들을 마지막 단계부터 처음 단계까지 역순으로 가르치는 것이다. 즉, 행동 연쇄의 뒷부분에서 앞부분으로 후진하며 가르치는 것이다.\n㉢ 전체과제 제시법: 과제 분석을 통한 모든 단계를 회기마다 가르치는 것이다. 이 방법은 아동이 행동 연쇄에 있는 단위행동은 습득했으나 행동을 순서대로 수행하지 못할 때 사용하면 유용하다. 아동이 순서를 따를 수 있도록 촉구를 사용하면서 가르치고 잘 수행하게 될수록 촉구를 용암시킨다.", "b": "3권 p.532 · 3권 p.533"}, {"id": "21-10", "s": "학습심리 및 행동수정", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "타임아웃 기법에서 비배제 타임아웃의 방법으로 옳지 않은 것을 고르시오.\n\n① 의도적 무시: 문제행동 발생에 수반하여 일정 시간 동안 모든 사회적 강화제를 제거하는 것\n② 고립 타임아웃: 문제행동 발생에 유관하여 강화하는 활동으로부터 일정 시간 동안 아동을 제외시키는 것\n③ 특정 강화제 제거: 문제행동 발생에 수반하여 일정 시간 동안 특정 강화제를 제거하는 것\n④ 타임아웃 리본: 일과가 시작될 때 모든 학생들이 리본을 받고 문제행동 발생에 수반하여 리본을 제거하는 것\n⑤ 유관관찰: 문제행동 발생에 수반하여 활동에 참여하며 적절하게 행동하는 다른 아동들을 관찰할 수 있지만 강화제로 접근하지 못하는 곳으로 이동시키는 것", "a": "2", "a2": "2 고립 타임아웃: 문제행동 발생에 유관하여 강화하는 활동으로부터 일정 시간 동안 아동을 제외시키는 것", "e": "고립 타임아웃: 문제행동 발생에 유관하여 강화하는 활동으로부터 일정 시간 동안 아동을 제외시키는 것은 배제 타임아웃의 방법이다.", "b": "3권 p.540"}, {"id": "B10-1-2", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "소거 절차에 의해 문제행동을 유지시키던 보상이 차단되자, 소거 적용 직후에 일시적으로 문제행동의 빈도, 지속시간, 강도가 평소보다 훨씬 더 급격하게 치솟고 날뛰는 과도기적 불안정 폭발 현상을 지칭하는 행동수정 용어는 무엇인가?", "a": "소거 폭발", "a2": "소거폭발 (Extinction Burst)", "e": "늘 주어지던 보상이 나오지 않자 유기체가 더 강한 반응을 뿜어내는 현상으로, 이 과정에서 새로운 공격 행동이나 울부짖음 등의 정서적 '소거발작'이 동반되기도 합니다.", "b": "3권 p.538 · 3권 p.539"}, {"id": "B10-1-3", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "분노 조절 실패로 미술실 교실 바닥 전체에 고의로 빨간 물감을 뿌려 훼손한 학생에게, 물감 자국을 닦아내게 하는 1차적 청소를 넘어, 교실 바닥 전체를 깨끗이 물걸레질하고 광택 왁스칠까지 완료하여 환경을 이전보다 훨씬 더 쾌적한 최상의 상태로 복원하게 만드는 정적 처벌은?", "a": "복원 / 원상회복 / 과잉교정", "a2": "원상회복 혹은 복원(Restitutional Overcorrection) 혹은 과잉교정", "e": "과잉교정(Overcorrection)의 하위 유형으로, 단순히 원상태로 돌려놓는 청소를 넘어 기진맥진할 때까지 과도한 복원 활동을 시켜 뇌에 정적 처벌 인자로 작동하게 만드는 전술입니다.", "b": "3권 p.542"}, {"id": "B10-1-6", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "단일대상 연구설계 중 독립변인(중재)의 효과를 입증하기 위해 잘 작동하는 중재를 중간에 의도적으로 걷어내는 '반전(A2 단계)' 과정을 생략하고, 대신 [대상자별, 행동별, 상황별]로 서로 다른 기초선 길이를 두고 순차적으로 중재를 이행하여 인과적 통제력을 안전하게 입증하는 설계법은?", "a": "중다기초선 설계", "a2": "중다기초선 설계 (Multiple Baseline Design)", "e": "자해 행동처럼 치료 철회가 비윤리적이거나, 곱셈 공식 학습처럼 한 번 배우면 원점으로 되돌릴 수 없는 비가역적 행동에 적용할 수 있는 매우 안전한 연구 설계입니다.", "b": "3권 p.524 · 3권 p.526"}, {"id": "B10-1-7", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "자폐 아동의 자해 행동이나 손가락 빨기처럼 문제행동이 완전하게 실행되어 아동이 피드백이나 자기 자극을 얻기 직전, 교사가 신체적인 제지나 도구를 활용해 아동이 문제행동의 완성 경로에 진입하지 못하도록 즉시 낚아채어 물리적으로 가로막는 정적 처벌 기법은 무엇인가?", "a": "반응 차단", "a2": "반응차단 (Response Blocking)", "e": "문제행동의 완성만 가로막을 뿐 다른 움직임은 제약하지 않는 찰나의 제지 기법으로, 유기체의 신체 전체를 묶어 동결하는 '신체구속(Physical Restraint)'과 엄격히 구별됩니다.", "b": "3권 p.542"}, {"id": "B10-1-8", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "4요인 유관분석에서 전통적 ABC 공식의 맨 앞에 개입하여, 현재 시점에서 보상물(강화제)이 지닌 주관적 가치를 비약적으로 고조시키거나(결핍) 완전히 무화시키고(포만), 그 보상을 얻기 위해 작동해야 하는 관련 표적행동을 즉각적으로 촉발하거나 억제하는 핵심 조절 변인은?", "a": "동기조작", "a2": "동기조작 (Motivating Operation / MO)", "e": "보상을 얻을 수 있는 외부의 물리적 '기회' 유무를 알려주는 신호등인 변별자극과 달리, 유기체 내면의 '결핍과 원함(Want)'의 주관적 가치를 조율하는 기제입니다.", "b": "3권 p.546 · 3권 p.545"}, {"id": "B10-1-10", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "문제행동(이석 행동)과 신체적 구조상 동시에 발생할 수 없는(비양립적인) 바람직한 상반행동(의자에 엉덩이 붙여 앉아있기)을 찾아내어, 오직 그 상반행동에만 집중적으로 보상을 제공함으로써 문제행동이 일어날 확률을 신체적으로 원천 차단하는 감소 지향적 차별강화 기법은?", "a": "상반행동 차별강화", "a2": "상반행동 차별강화(Differential Reinforcement of Incompatible Behavior / DRI)", "e": "한 몸으로 두 행동을 동시에 수행할 수 없는 신체적 불가능성(비양립성)을 무기 삼아, 문제행동을 강제로 억압하지 않고도 이롭게 제거하는 가장 세련된 차별강화 기법입니다.", "b": "3권 p.531 · 3권 p.530 · 3권 p.513"}, {"id": "B10-2-2", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담실 안에서 상담교사에게 '안녕하세요'라고 인사하는 적절한 행동을 훈련받은 지우가, 복도를 지나가다 처음 마주친 수학 교사나 복도에 서 있는 교장 선생님이라는 새로운 환경 자극을 마주했을 때도 스스로 정중히 허리 숙여 인사하는 행동을 하는 일반화 유형은?", "a": "자극 일반화", "a2": "자극 일반화", "e": "행동의 형태는 인사하기로 동일한데, 행동을 이끄는 사람, 장소, 도구 등 선행하는 물리적·환경적 자극이 변화하여 확장 전이된 형태를 의미함.", "b": "3권 p.543 · 3권 p.502 · 3권 p.509"}, {"id": "B10-3-2", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "Cooper 등(2005)은 행동계약서가 실질적인 통제력을 갖추기 위해 반드시 포함해야 할 4가지 필수 구성요소를 제안했다. '과제에 대한 구체적 설명(Task)', '과제 완수에 주어지는 보상에 대한 설명(Reward)', '계약자와 피계약자의 자발적 서명 및 날짜(Signatures)' 외에, 실제 이행 여부를 실시간으로 체크하고 스티커판 등으로 기록하여 시각화하는 세 번째 구성요소는 과제 (      ) 여부에 대한 기록이다.", "a": "수행", "a2": "수행 (Record)", "e": "과제 수행 여부에 대한 기록, 곧 수행 기록(Record)입니다.\n계약 기간 동안 학생의 목표 도달 진도와 부모/교사의 보상 지급 과정이 투명하게 공유되고 있는지 검증할 수 있는 시각적 누적 기록 장치입니다.", "b": "3권 p.537"}, {"id": "B10-3-5", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "교실 내 놀이 활동 중 또래에게 모래를 뿌리는 등 부적절한 공격 행동을 보인 아동에게, 생각하는 자리로 이동시켜 친구들이 재밌게 놀며 보상받는 모습(적절한 대처 행동)을 눈으로 빤히 관찰하게 하되, 자신은 참여 기회를 정지당하는 비배제 타임아웃은?", "a": "유관 관찰 / 앉아서 보기", "a2": "유관 관찰 혹은 앉아서 보기 (Contingent Observation)", "e": "물리적 공간 밖으로 쫓아내는 '배제 타임아웃'과 달리, 공간 내에 자리를 지키게 하되 관찰만 시키고 참여를 금지하여 투명인간 취급을 하는 비배제 타임아웃의 대표적 유형입니다.", "b": "3권 p.540"}, {"id": "B10-3-10", "s": "학습심리 및 행동수정", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "학습자가 행동을 정확하게 수행할 때마다 도움(촉구)의 수준을 점진적으로 줄여나가, 결국 순수한 변별자극만으로도 올바른 행동을 하게 만드는 과정을 의미하는 용어는?", "a": "용암법", "a2": "용암법", "e": "학습자가 행동을 정확하게 수행할 때마다 도움(촉구)의 수준을 점진적으로 줄여나가, 결국 순수한 변별자극만으로도 올바른 행동을 하게 만드는 과정을 의미한다. 즉 촉구를 점진적으로 제거하는 과정이다.", "b": "3권 p.535"}, {"id": "11-1", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 1, "d": "쉽게", "q": "신경세포(뉴런)가 자극을 받지 않은 휴지 상태일 때, 세포막 안쪽은 음(-), 바깥쪽은 양(+)의 전하를 띠며 내부 전위가 약 –70mV 수준을 유지하는 상태를 뜻하는 명칭은?", "a": "분극 / 안정전위 / 휴지막 전위", "a2": "분극 (Polarization) 혹은 안정전위(휴지막 전위)", "e": "휴지 상태의 뉴런은 나트륨-칼륨 펌프의 작동에 의해 세포막 외부에는 나트륨 이온이, 내부에는 칼륨 이온과 음전하를 띤 단백질 이온이 상대적으로 많아 음전하의 분극 상태를 유지합니다.", "b": "3권 p.599 · 3권 p.598"}, {"id": "11-2", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 2, "d": "쉽게", "q": "신경세포의 축삭돌기를 통해 전기 신호가 이동할 때, 가해진 자극의 크기가 역치(Threshold) 이상이면 항상 최대 크기의 활동전위가 발생하고, 역치 미만이면 신호가 전혀 발생하지 않는다는 신경 정보 전도의 법칙은?", "a": "실무율 / 실무율법칙", "a2": "실무율 (All-or-None Law)", "e": "실무율에 따라 자극이 강하다고 해서 전도되는 전기 신호(활동전위)의 크기가 커지는 것은 아니며, 단지 자극이 강할수록 신호의 발생 빈도(초당 방전 횟수)가 증가할 뿐입니다.", "b": "3권 p.600"}, {"id": "11-3", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 3, "d": "쉽게", "q": "시냅스 전 뉴런에서 방출된 신경전달물질이 시냅스 틈새(간극)에 머무르다가, 원래 방출되었던 시냅스 전 뉴런의 말단 단추로 수거되어 재활용되거나 분해되는 기제의 명칭은?", "a": "재흡수", "a2": "재흡수 (Reuptake)", "e": "시냅스 간극에 남은 신경전달물질은 재흡수되거나 효소에 의해 분해되어 제거됨으로써 다음 뉴런에 지속적인 자극이 가해지는 것을 방지하고 신경 전달을 신속히 종결시킵니다.", "b": "3권 p.602"}, {"id": "11-4", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 4, "d": "쉽게", "q": "대표적인 신경전달물질 중 수용체 과잉 시 조현병(Schizophrenia)의 망상 및 환각 증상과 밀접하게 연관되며, 반대로 도파민 경로의 세포 파괴로 인해 분비가 급감할 경우 파킨슨병(Parkinson's Disease)을 유발하는 물질은?", "a": "도파민", "a2": "도파민 (Dopamine)", "e": "도파민은 운동 조절, 주의, 보상, 유쾌한 정서 등과 밀접하며, 도파민 활성화 수준의 높고 낮음에 따라 조현병(과다)과 파킨슨병(결핍)이라는 서로 다른 병리가 유발됩니다.", "b": "3권 p.603 · 3권 p.634 · 3권 p.610"}, {"id": "11-5", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 5, "d": "쉽게", "q": "축삭돌기(축색)를 둘러싸고 있는 지방질 막으로, 전기 신호가 이 부위를 건너뛰며 흐르는 도약 전도(Saltatory Conduction)를 가능하게 하여 정보 전달 속도를 비약적으로 높여주는 구조의 명칭은?", "a": "수초 / 말이집", "a2": "수초 (Myelin Sheath) 혹은 말이집", "e": "수초는 신경 전도의 절연체 역할을 합니다. 수초가 파괴되거나 상실될 경우 신호의 흐름이 지체되어 다발성 경화증(Multiple Sclerosis)과 같은 운동 장애가 발생합니다.", "b": "3권 p.601 · 3권 p.597"}, {"id": "11-6", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 6, "d": "쉽게", "q": "말초신경계 중 우리가 의식적으로 지각하고 수의적(의도적)으로 골격근의 움직임을 제어하는 (①)과, 심장박동이나 위장 운동처럼 우리의 의지와 무관하게 신체 내부 기능을 무의식적으로 조절하는 (②)를 구분하여 쓰시오.", "a": "체성 신경계 / 자율 신경계", "a2": "① 체성 신경계 (Somatic Nervous System), ② 자율 신경계 (Autonomic Nervous System)", "e": "체성 신경계는 감각과 운동 정보를 뇌와 골격근으로 전달하고, 자율 신경계는 불수의근 및 내장 기관의 활동을 조절합니다.", "b": "3권 p.605 · 3권 p.606 · 3권 p.743"}, {"id": "11-7", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "갑작스러운 물리적·심리적 스트레스 상황(위협 자극)에 직면했을 때, 신체 에너지를 급격히 가동하여 '투쟁-도피(Fight-or-Flight)' 반응에 적합하도록 심장박동수와 혈압을 높이고 동공을 확장시키는 자율신경계는?", "a": "교감 신경계", "a2": "교감신경계 (Sympathetic Nervous System)", "e": "위협이 지나간 후 신체를 평온한 상태로 되돌리고 에너지를 보존(심장박동수 감소, 소화 촉진)하는 것은 '부교감신경계'의 역할이며, 두 신경계는 길항 작용을 합니다.", "b": "3권 p.606 · 3권 p.746"}, {"id": "11-8", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 8, "d": "쉽게", "q": "시상하부의 직접적인 통제를 받으며 내분비계 전체의 다른 호르몬 분비 기관들을 자극하고 통제하는 역할을 수행하여 '마스터 샘(Master Gland)'이라 불리는 뇌 속 내분비 기관은?", "a": "뇌하수체", "a2": "뇌하수체 (Pituitary Gland)", "e": "뇌하수체 전엽에서는 부신피질 자극 호르몬과 성장 호르몬 등을 분비하며, 후엽에서는 옥시토신(사회적 유대감 호르몬) 등을 분비합니다.", "b": "3권 p.614 · 3권 p.746 · 3권 p.615"}, {"id": "11-9", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 9, "d": "쉽게", "q": "만성 스트레스 경로인 HPA 축의 최종 목적지로서 외부 스트레스에 지속적으로 대항할 수 있도록 포도당 합성을 돕는 코르티솔(Cortisol)을 분비하는 (①)과, SAM 경로에 의해 자극받아 에피네프린을 신속하게 분비하는 (②)를 구분하여 쓰시오.", "a": "부신피질 / 부신수질", "a2": "① 부신피질 (Adrenal Cortex), ② 부신수질 (Adrenal Medulla)", "e": "부신의 바깥쪽인 피질은 호르몬(ACTH) 신호에 의해 코르티솔을 느리게 분비하고, 안쪽의 수질은 교감신경의 직접적인 자극에 의해 에피네프린을 초고속으로 뿜어냅니다.", "b": "3권 p.746 · 3권 p.752 · 3권 p.614"}, {"id": "11-10", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "후뇌에 위치하며 주로 신체의 평형 유지, 정교한 운동의 조정, 소근육 협응을 주관할 뿐만 아니라 악기 연주나 자전거 타기 등 자동화된 운동 기술을 저장하는 '절차기억' 학습에 관여하는 뇌 부위는?", "a": "소뇌", "a2": "소뇌 (Cerebellum)", "e": "소뇌가 손상되면 걸음걸이가 비틀거리고 물건을 정확히 집지 못하는 등 정교한 운동 통제 장애가 일어납니다.", "b": "3권 p.610 · 3권 p.608 · 3권 p.606"}, {"id": "22-1", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "뉴런에서 뻗어 나와 다른 뉴런이나 근육 또는 내분비선에 메시지를 전달하는 것은?\n\n① 세포체\n② 수상돌기\n③ 축색\n④ 수초\n⑤ 종말단추", "a": "3", "a2": "3 축색", "e": "축색에 대한 설명이다.", "b": "3권 p.597"}, {"id": "22-2", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "다음 중 아래의 설명에 해당되는 신경전달물질은?\n- 공급과잉은 조현병과 관련되어 있다.\n- 공급부족은 파킨슨병의 떨림과 동작 감소를 초래한다.\n\n① 아세틸콜린\n② 도파민\n③ 세로토닌\n④ 노르에피네프린\n⑤ 가바", "a": "2", "a2": "2 도파민", "e": "도파민의 공급과잉은 조현병과 관련되어 있으며, 공급부족은 파킨슨병의 떨림과 동작 감소를 초래한다.", "b": "3권 p.603"}, {"id": "22-3", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음 중 신경계에 대한 설명으로 적절하지 않은 것을 고르시오.\n\n① 중추신경계는 뇌와 척수로 이루어져 있다.\n② 말초신경계는 체성신경계와 자율신경계로 이루어져 있다.\n③ 교감신경은 스트레스 상황에서 신체를 활성화시키고 에너지를 동원하게 한다.\n④ 부교감신경은 신체를 안정시키고 에너지를 보존하는 체성신경계의 일부이다.", "a": "4", "a2": "4 부교감신경은 신체를 안정시키고 에너지를 보존하는 체성신경계의 일부이다.", "e": "부교감신경은 체성신경계가 아닌 자율신경계의 일부이다.", "b": "3권 p.606"}, {"id": "22-4", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "뇌와 행동과 관련하여, 다음에 해당하는 영역을 쓰시오.\n\n- 대뇌피질의 안쪽 둘레를 따라 간뇌를 바깥쪽에서 둘러싸고 있는 구조물이다.\n- 해마와 편도체가 대표적이다.\n- 대상회, 해마, 중격, 편도체 등의 전뇌 구조물과 유두체, 시상의 일부 핵 등과 같은 간뇌 구조물이 포함되며, 정서반응의 조절과 학습, 기억, 동기 등의 중요한 기능에 관여한다.", "a": "변연계", "a2": "변연계", "e": "변연계(limbic system)\n① 대뇌피질의 안쪽 둘레를 따라 간뇌를 바깥쪽에서 둘러싸고 있는 구조물이다.\n② 대상회, 해마, 중격, 편도체 등의 전뇌 구조물과 유두체, 시상의 일부 핵 등과 같은 간뇌 구조물이 포함되며, 정서반응의 조절과 학습, 기억, 동기 등의 중요한 기능에 관여한다.\n③ 해마(hippocampus): 학습과 기억과정에 결정적인 역할을 담당한다. 특히 유기체가 경험·지각된 내용을 의미적 관계 중심으로 학습하고 기억하는 데 중요한 역할을 한다.\n④ 편도체(amygdala): 정서, 특히 공격행동과 연관된다. 동물연구에서 편도체가 손상된 동물들은 매우 온순해졌으며, 편도체가 자극되면 공격행동이 유발되었다. 또한 정서반응 학습에도 중요한 역할을 담당하는데, 이 핵이 손상되면 동물은 정서반응을 학습하지 못한다", "b": "3권 p.608"}, {"id": "22-5", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "어떤 자극을 겨우 탐지하는 데 필요한 최소한의 자극강도를 무엇이라고 하는가?\n\n① 비례적 크기\n② 최소식별차이\n③ 절대역\n④ 베버의 법칙\n⑤ 역치하", "a": "3", "a2": "3 절대역", "e": "절대역 : 어떤 자극을 겨우 탐지하는 데 필요한 최소한의 자극강도", "b": "3권 p.617"}, {"id": "22-6", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "시각정보처리와 관련하여 다음에 해당하는 개념을 쓰시오.\n\n\n- 문제의 여러 측면을 동시에 처리하는 것으로, 우리의 뇌는 색, 깊이, 운동, 형태 등의 하위 차원으로 분할하여 각 차원을 동시에 처리한다.\n- 망막은 시각피질의 한 부분에만 정보를 내보내는 것이 아니라 동시에 여러 부위로 정보를 내보낸다. 이러한 시각 정보가 통합되면 다른 대뇌피질의 측두엽에서 추가로 처리하여 영상을 인식할 수 있다.", "a": "병렬처리", "a2": "병렬처리", "e": "병렬처리(parallel processing)\n① 문제의 여러 측면을 동시에 처리하는 것으로, 우리의 뇌는 색, 깊이, 운동, 형태 등의 하위 차원으로 분할하여 각 차원을 동시에 처리한다.\n② 망막은 시각피질의 한 부분에만 정보를 내보내는 것이 아니라 동시에 여러 부위로 정보를 내보낸다. 이러한 시각 정보가 통합되면 다른 대뇌피질의 측두엽에서 추가로 처리하여 영상을 인식할 수 있다.", "b": "3권 p.620"}, {"id": "22-7", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "다음의 공통적인 현상을 일컫는 운동 지각을 쓰시오.\n· 자극이나 대상이 실제로 정지되어 있음에도 불구하고 그것들이 공간상에서 움직이는 것처럼 지각하는 현상이다.\n· 둘 이상의 인접한 불빛이 빠른 속도로 교대할 때 발생하는 움직임 착시가 나타난다.\n· 영화를 볼 때처럼 약간 다른 영상을 연속적으로 보여주면 대뇌는 그것을 움직임으로 지각한다.", "a": "가현운동", "a2": "가현운동", "e": "가현운동: 자극이나 대상이 실제로 정지되어있음에도 불구하고 그것들이 공간상에서 움직이는 것처럼 지각하는 현상.\n파이현상과 유도된 운동이 포함된다.", "b": "3권 p.624"}, {"id": "22-8", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "다음 중 흥분제(stimulants)의 종류가 아닌 것을 고르시오.\n\n① 암페타민\n② 알코올\n③ 니코틴\n④ 코카인\n⑤ 엑스터시", "a": "2", "a2": "2 알코올", "e": "알코올은 진정제(depressants)에 해당한다.", "b": "3권 p.633 · 3권 p.632"}, {"id": "22-9", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "다음 중 기억에 대한 설명으로 적절하지 않은 것을 고르시오.\n\n① 단기기억은 용량이 제한적이지만 시연될 수 있고, 지속기간이 짧다.\n② 장기기억에서 정보는 비교적 오랫동안 유지되고, 기억용량에도 거의 제한이 없다.\n③ 감각기억은 수많은 정보를 받아들일 수 있으나 그중 일부만이 선택될 수 있다.\n④ 작업기억에서 시공간 잡기장은 시각적 심상과 공간정보를 유지하고 조정한다.\n⑤ 장기기억에서 정교화는 기억해야 할 정보를 뜻이나 범주 등을 기준으로 조직화해서 제시하면 더 기억이 잘 나게 되는 것을 의미한다.", "a": "5", "a2": "5 장기기억에서 정교화는 기억해야 할 정보를 뜻이나 범주 등을 기준으로 조직화해서 제시하면 더 기억이 잘 나게 되는 것을 의미한다.", "e": "정교화는 기억해야 할 정보를 기존에 알고 있는 지식과 연관지어 의미 있게 연결하는 전략을 말한다.", "b": "3권 p.663 · 3권 p.660 · 3권 p.664"}, {"id": "22-10", "s": "심리학개론 및 교육심리", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "스턴버그(Sternberg)의 지능의 삼원론은 크게 3가지로 지능을 구분할 수 있다. 첫째, 인간의 정신과정과 관련된 것으로 학문적 영역의 지능을 의미하는 (      )이 있다. 둘째, 창조적(경험적)지능으로, 인간의 경험과 연관된 것으로, 상상력, 발명, 종합적 능력을 포괄하는 창의적인 능력을 의미한다. 셋째, (      )으로 전통적인 지능검사 점수나 학업성취도와는 무관한 지능으로 적응, 선택, 조정의 세 부분으로 구성된다.", "a": "분석적 지능 / 실제적 지능", "a2": "분석적 지능 / 실제적 지능", "e": "1. 분석적 지능\n1) 인간의 정신과정과 관련된 것으로, 흔히 학문적 영역의 지능을 의미함\n2) 특정 정보나 문제를 분석하고 대조하며 평가하는 일련의 정신작용\n3) 구성요소\n- 메타 요소: 어떠한 일을 사전에 계획하거나 일이 진행되는 동안 점검하는 것, 일을 통제하기 위해 평가하는 것과 같은 정신과정\n- 수행 요소: 메타 요소인 고등 정신과정을 이행하기 위한 하위 수준의 과정\n- 지식 습득 요소: 메타 요소와 수행 요소가 하는 것을 실제로 어떻게 해야 하는지에 대한 학습\n2. 창조적(경험적) 지능\n1) 인간의 경험과 연관된 것으로, 상상력, 발명, 종합적 능력을 포괄하는 창의적인 능력을 의미함\n2) 구성요소\n- 신기성(novelty)을 다루는 능력: 통찰력 혹은 새로운 상황을 효과적으로 다루는 창조적 능력\n- 자동화 능력: 새로운 해결책을 신속하게 일상적인 과정으로 바꾸어 많은 인지적 노력 없이도 적용할 수 있는 능력\n3. 실제적 지능\n1) 전통적인 지능검사 점수나 학업성취도와는 무관한 지능으로 적응, 선택, 조정의 세 부분으로 구성됨\n2) 실제 적응력, 사회적 유능성 등의 능력을 의미하며 일상 속에서 개인의 경험을 통해 향상됨", "b": "3권 p.638"}, {"id": "B11-1-1", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "후각을 제외한 모든 감각 정보(시각, 청각, 미각, 촉각)를 일차적으로 받아들여 분석한 뒤, 대뇌피질의 해당 감각 전용 영역으로 배분하여 보내주는 '감각의 중계소(Relay Station)' 역할을 하는 부위는 (      )라고 하며, 변연계(Limbic System)에 속한 기관 중 특히 공포, 분노 등의 정서적 자극을 탐지하여 생존 본능을 경보하는 역할을 수행하는 뇌 영역은 (      )라고 한다.", "a": "시상 / 편도체", "a2": "시상 (Thalamus), 편도체", "e": "시상은 대뇌피질 바로 밑에 둥근 달걀 모양으로 쌍을 이루어 존재하며, 유입되는 감각 정보를 통합 및 배분하는 스위칭 역할을 합니다. 편도체는 감정 사건의 정서적 톤을 조율합니다. 반면, 바로 옆에 위치한 '해마(Hippocampus)'는 정서 사건의 시공간적 '맥락과 기억'을 담당합니다.", "b": "3권 p.743 · 3권 p.608 · 3권 p.610"}, {"id": "B11-1-3", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "국가적 재난이나 충격적인 대형 사고처럼 정서적으로 극도로 중차대한 순간을 경험할 때, 마치 사진을 찍듯 뇌리에 매우 선명하고 세밀하게 낙인되어 남아있는 생생한 일화적 장기기억 현상은?", "a": "섬광기억", "a2": "섬광기억 (Flashbulb memory)", "e": "강렬한 정서적 각성이 동반되는 사건들은 스트레스 호르몬의 작용과 해마-편도체의 유기적 작용으로 인해 세부 기억이 평생에 걸쳐 선명하게 부호화되는 경향이 있습니다.", "b": "3권 p.745 · 3권 p.664"}, {"id": "B11-1-4", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "타인에 대한 사전 기대나 믿음이 객관적인 실제 사실과는 부합하지 않더라도, 지각자가 그 기대가 정말 실현될 것이라고 굳게 믿고 상대방을 대하면, 결국 상대방이 지각자의 기대에 맞추어 행동하게 됨으로써 원래의 주관적 기대가 현실로 구현되는 현상을 (      )라 한다.", "a": "자기충족적 예언 / 자성예언 / 피그말리온 효과", "a2": "자기충족적 예언 혹은 자성예언 (피그말리온 효과, Self-fulfilling prophecy)", "e": "로젠탈(Rosenthal)과 제이콥슨(Jacobson)의 실험은 교사의 호의적 기대가 실제로 아동의 지능 점수를 비약적으로 향상시킴을 보여주었습니다(자성예언). 반면 기대유지 효과는 향상 가능성 자체를 교사의 고정관념이 억제해 수행을 정체시키는 교실 내의 심각한 인지 왜곡 기제입니다.", "b": "3권 p.699 · 3권 p.735"}, {"id": "B11-1-5", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "이전의 익숙한 문제 해결 과정에서 성공적이었던 고정적이고 지배적인 '심적 틀'이나 일방적인 규칙만을 맹목적으로 고수하여, 정작 새로운 조건의 문제에 창의적이고 유연하게 대처하지 못하고 똑같은 방식에 고착되는 심리적 오류는?", "a": "마음 갖춤새 효과 / 반응 갖춤새 효과", "a2": "마음갖춤새 효과 혹은 반응갖춤새 효과 (Mental set / Response set)", "e": "과거의 성공 경험이 오히려 사고의 유연성을 가로막는 마음의 올가미가 되는 현상으로, 이 마음갖춤새 효과를 제거하고 시야를 초기화하기 위해 문제에서 잠시 손을 떼는 '부화 효과(Incubation effect)'의 활용이 도움을 줄 수 있습니다.", "b": "3권 p.694"}, {"id": "B11-1-6", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "장기기억의 개념적 지식들이 논리적인 위계뿐만 아니라 의미적인 연관성에 따라 수많은 그물망처럼 뒤얽혀 있으며, 하나의 개념(노드)이 활성화되면 그 통로(경로)를 따라 연합된 주위 정보로 퍼져 나간다고 설명하는 모형은?", "a": "의미망 모형 / 의미적 그물망 모형", "a2": "의미망 모형 혹은 의미적 그물망 모형 (Semantic network model)", "e": "개념이 위치하는 지점인 노드(Node)와 개념 간 관계를 잇는 통로(Pathway)로 구성되며, 한 자극에 의해 관련 단어들이 연속적으로 떠오르는 '활성화 확산(Spreading activation)' 및 '점화 효과'를 잘 설명합니다.", "b": "3권 p.665 · 3권 p.664 · 3권 p.685"}, {"id": "B11-1-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "드웩(Dweck)의 암묵적 지능이론에 따르면, 개인의 지능과 능력에 대한 믿음은 크게 두 갈래로 나뉜다. 지능은 태어날 때부터 고정되어 노력해도 변하지 않는다고 믿는 (실체 이론)과, 지능은 유동적이며 노력과 새로운 학습을 통해 얼마든지 발달시킬 수 있다고 믿는 (증진이론)이 그것이다. 이 중 (실체이론)을 지닌 학생은 능력을 증명하는 데 초점을 두고 실패 시 무기력에 빠지기 쉬운 반면, (증진이론)을 지닌 학생은 실패 내성이 높고 도전을 성장의 기회로 삼는 ( ① ) 마인드셋을 발달시킨다.", "a": "성장", "a2": "① 성장 (Growth)", "e": "실체이론가들은 실패를 곧 '지능 부족'의 증거로 보기 때문에 도전을 회피하고 쉬운 과제만 골라 수행하려 하지만, 증진이론가들은 실패를 단순한 '배움의 과정'이나 '노력 부족'으로 보아 도전적인 과제를 적극 선호합니다.", "b": "3권 p.731 · 1권 p.131"}, {"id": "B11-1-9", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "켈리(Kelley)의 공변 모형에 따르면, 사람들은 타인의 행동 원인을 밝힐 때 세 가지 차원의 정보 공변을 고려한다. 행위자가 동일 자극에 대해 항상 똑같이 행동하는지 판단하는 (①), 동일 상황에서 다른 사람들 역시 같은 행동을 취하는지 판단하는 (일치성 혹은 합치성), 그리고 그 행위자가 오직 해당 자극물에 대해서만 유독 그 행동을 보이는지 판단하는 (②)이 그것이다.", "a": "일관성 / 특이성", "a2": "① 일관성 (Consistency), ② 특이성 (Distinctiveness)", "e": "공변 원리에 따라 세 가지 정보가 모두 높으면 자극(대상)에 귀인하고, '고 일관성 + 저 일치성 + 저 특이성'의 조합일 때는 행위자(성향)에 귀인합니다. 반면, 일관성이 낮고 일치성과 특이성이 높을 때는 상황에 귀인하게 됩니다.", "b": "3권 p.696"}, {"id": "B11-1-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "커빙턴(Covington)과 오멜리히(Omelich)는 자기 가치를 보호하려는 동기와 실패를 피하려는 동기의 상호 조합에 따라 학습자 유형을 네 가지로 분류했다. 이 중 목표가 '실패하지 않는 것'에 있어 성취 수준은 높지만 성취 상황에서 극심한 스트레스와 압박을 받아 학습 과정을 힘들어하는 유형을 (      ) 학생이라 하고, 성공에 대한 희망도 없고 실패에 대한 두려움도 낮아 반복적인 실패를 당연하게 수용하며 무기력을 겪는 유형을 (실패 수용적) 학생이라고 한다.", "a": "과성취 / 과잉노력", "a2": "과성취 혹은 과잉노력 (Overachiever)", "e": "과성취 학생은 실패를 피하기 위해 엄청난 노력을 쏟아부어 겉으로는 우수해 보이지만 심리적 소진 위험이 큽니다. 반면 실패 수용적 학생은 실패를 자신의 변하지 않는 능력 부족 탓으로 돌려 학습된 무기력 상태에 고착되기 쉽습니다.", "b": "3권 p.724"}, {"id": "B11-2-3", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "뇌의 해마 및 측두엽 부위의 물리적 손상(H.M. 사례 등)으로 인해, 손상 이전에 획득한 과거 기억은 잘 보존되어 있으나 손상 시점 이후로 마주하는 새로운 정보를 영구히 학습하거나 기억해 내지 못하는 기억 장애는?", "a": "순행성 기억상실증", "a2": "순행성 기억상실증 (Anterograde amnesia)", "e": "과거의 일화기억과 손상 전 지식의 인출은 정상적이나, 새로 입력된 단기기억 정보를 장기기억으로 이전하는 공고화(Consolidation) 능력을 소실하여 발생합니다.", "b": "3권 p.668"}, {"id": "B11-2-4", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "농구공을 패스하는 학생들의 패스 횟수를 세는 과제에 고도로 집중하는 동안, 고릴라 옷을 입은 사람이 화면 중앙을 대놓고 가로질러 가더라도 이를 전혀 탐지하지 못하는 오류를 설명하는 용어는?", "a": "부주의 맹 / 선택적 부주의", "a2": "선택적 부주의 혹은 부주의맹 (Inattentional blindness)", "e": "눈이 대상을 물리적으로 바라보고 있더라도, 개인이 지닌 한정된 인지 자원인 '주의(Attention)'가 할당되지 못하면 뇌는 그 정보를 자각 수준으로 지각해 내지 못함을 시사합니다.", "b": "3권 p.621"}, {"id": "B11-2-5", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "대뇌피질의 좌반구 언어 영역 중, 손상되었을 때 타인의 말은 완벽히 이해하지만 스스로 문장을 유창하게 구어 표현하지 못하는 (①) 영역과, 말은 막힘없이 하지만 의미가 통하지 않는 엉터리 단어를 나열하며 타인의 말을 전혀 이해하지 못하는 (②) 영역을 순서대로 쓰시오.", "a": "브로카 / 베르니케", "a2": "① 브로카 (Broca) 영역, ② 베르니케 (Wernicke) 영역", "e": "브로카 영역은 전두엽 부근에 위치하여 언어의 '생산/표현'을 담당하고, 베르니케 영역은 측두엽 부근에 위치하여 언어의 '이해/수용'을 주관합니다.", "b": "3권 p.612 · 3권 p.347"}, {"id": "B11-2-6", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "혼자 벽돌을 나르거나 줄다리기를 할 때보다, 책임 소재가 불분명해진 집단 공동 과제 수행 시 개인별 공헌 수준이 측정되지 않아 \"나 하나쯤이야\" 하는 무임승차 마인드로 태업하여 시너지 효과를 내지 못하는 집단적 저하 현상은?", "a": "사회적 태만 / 링겔만 효과", "a2": "사회적 태만 혹은 링겔만 효과 (Social loafing / Ringelmann effect)", "e": "개인의 노력이나 투자가 다른 집단원들과 확실히 구별되어 정밀하게 측정 및 공지된다고 발표하고, 각자의 책임과 공헌도를 부각하며 협력을 촉진할 때 사회적 태만은 현저히 줄어듭니다.", "b": "3권 p.711"}, {"id": "B11-2-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "린빌(Linville)의 개념으로, 개인이 일상에서 지니고 있는 사회적 역할, 대인관계, 취미 활동 등 '자아의 다양한 측면(가지)의 개수가 얼마나 풍부하며 그 측면들이 서로 겹치지 않고 독립적으로 조밀하게 구성되어 있는가'를 뜻하는 심리학적 지표는?", "a": "자기복잡성", "a2": "자기복잡성 (Self-complexity)", "e": "자기복잡성이 높은 사람(예: 직장인, 주말 밴드 보컬, 요리사 동호회원 등 독립 영역이 다양함)은 한 영역에서 파탄이나 상처를 입어도 다른 건강한 영역들이 쿠션 역할을 해주기 때문에 스트레스에 매우 강하며 우울증에 걸릴 확률이 극히 낮아집니다.", "b": "3권 p.702"}, {"id": "B11-2-8", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "데시(Deci)와 라이언(Ryan)의 자기결정성 이론에 따르면, 인간은 스스로 동기화되고 성장하기 위해 세 가지 기본 심리욕구를 충족해야 한다. 외적인 보상이나 압박에 구애받지 않고 자신의 행동과 운명을 스스로 선택하려는 (①) 욕구, 환경과 상호작용하며 자신의 역량과 재능을 효과적으로 발휘하고 향상시키려는 (유능감) 욕구, 그리고 타인과 따뜻하고 안정적인 정서적 유대감 및 애착을 형성하고자 하는 (②) 욕구가 그것이다.", "a": "자율성 / 관계성", "a2": "① 자율성 (Autonomy), ② 관계성 (Relatedness)", "e": "이 세 가지 기본 심리욕구가 교실이나 가정환경에서 지지되고 충족될 때, 학생들은 외재동기를 자기 것으로 내면화하며 능동적인 내재동기를 발달시키게 됩니다.", "b": "3권 p.729"}, {"id": "B11-2-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "주변에 조력 가능한 구경꾼과 목격자가 많을수록 책임감이 사방으로 고루 흩어져서, 정작 위급한 상황에 부닥친 피해자를 적극적으로 돕는 구조 행동률이 극적으로 감소하고 시간이 지연되는 현상은?", "a": "방관자 효과", "a2": "방관자 효과 (Bystander effect)", "e": "방관자 효과는 다른 사람들이 가만히 관망하는 눈치를 보며 상황의 위급성 자체를 아무 일도 아니라고 오판하는 상황 해석의 애매성(다수적 무지), 내가 돕지 않아도 남이 하리라 미루는 책임감 분산, 섣불리 도왔다가 부끄러운 실수를 보일까 겁내는 평가 염려가 상호 결합하여 나타납니다.", "b": "3권 p.710"}, {"id": "B11-3-3", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "배들리(Baddeley)의 작업기억 모형에서 언어이해와 청각적 암송을 처리하는 장치는 (      )이고, 시각적 심상과 공간정보를 조정하는 장치는 시공간 잡기장이며, 정보를 한꺼번에 처리하도록 양을 제한하고 전체 흐름 및 의사결정을 통제하는 사령탑은 중앙집행기이다.", "a": "음운루프 / 조음루프", "a2": "음운루프 혹은 조음루프 (Phonological loop)", "e": "배들리는 작업기억이 단순히 정보를 수동 보존하는 것이 아니라, 언어적 영역과 시공간적 영역이 독립적인 저장고에서 병렬 처리되며 중앙집행기에 의해 전체 자원이 통제·배분되는 역동적 구조라고 보았습니다.", "b": "3권 p.663"}, {"id": "B11-3-4", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "뇌가 시각 자극을 분석할 때 한 번에 한 단계씩 순차 처리하지 않고, 색깔, 깊이, 운동, 형태 등의 다양한 하위 속성들로 분할하여 서로 다른 뇌세포 집단에서 동시에 연동하여 가공해 내는 기제는?", "a": "병렬처리", "a2": "병렬처리 (Parallel processing)", "e": "뇌는 대상의 부분과 전체, 색과 형태 정보를 동시에 실시간으로 조합함으로써 복잡한 대상을 순간적으로 재인해 낼 수 있습니다.", "b": "3권 p.620"}, {"id": "B11-3-6", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "타인의 단순한 존재가 뇌를 자극하여, 개인이 잘 숙달된 익숙한 과제나 단순 연산 과제를 수행할 때는 성적 향상을 이끌어내지만(①), 정작 복잡하고 낯설며 배우지 못한 난해한 과제를 처리할 때는 극심한 긴장과 흥분(추동)을 유발해 오히려 수행 수준을 크게 저하시키는(②) 현상은 무엇인가?", "a": "사회적 촉진 / 사회적 억제", "a2": "① 사회적 촉진 (Social facilitation), ② 사회적 억제 (Social inhibition)", "e": "자이언스(Zajonc)의 추동 이론에 따르면 타인의 존재는 개인의 생리적 각성을 높여 높은 확률의 지배 반응(우세 반응)을 촉진합니다. 따라서 쉬운 과제에서는 '성공'이 지배 반응이므로 성적이 오르고(촉진), 어려운 과제에서는 '실수와 오답'이 지배 반응이므로 망가집니다(억제).", "b": "3권 p.711"}, {"id": "B11-3-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "깊이지각 단서 중 하나로, 좌우 두 눈이 수평으로 떨어져 있어 망막에 맺히는 상이 서로 다르다는 사실에 기인하며, 뇌가 이 두 개의 불일치하는 이미지를 대조·분석하여 대상과의 거리를 판독하는 양안 단서는?", "a": "양안부등", "a2": "양안부등 (Binocular disparity)", "e": "두 눈의 위치 차이로 발생하는 이미지 어긋남이 클수록 대상이 관찰자에게 가깝고, 차이가 적을수록 멀리 있다고 지각하게 됩니다.", "b": "3권 p.624"}, {"id": "B11-3-9", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "쾰러(Kohler)가 침팬지 실험을 통해 정립한 학습이론으로, 점진적인 시행착오를 거치지 않고 문제 상황 속에 놓인 다양한 도구적 요소들과 최종 목적 사이의 역학적 관계를 머릿속에서 일시에 파악하여 해결해 내는 이 현상은?", "a": "통찰 / 통찰학습", "a2": "통찰학습 혹은 통찰 (Insight learning)", "e": "부분적인 요소들이 갑자기 '유의미한 전체 형태'로 종합적으로 재구성되면서 \"아하! 현상(Aha-experience)\"과 함께 한순간에 영구적인 문제해결책을 획득하는 인지적 원리입니다.", "b": "3권 p.674"}, {"id": "B11-3-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "개인이 축적한 삶의 경험이나 문화적 가정, 일시적인 기대 수준에 의해 형성된 마음의 지각 틀로 인해, 들어오는 모호한 자극 정보를 특정한 한 가지 방식으로만 치우쳐 받아들이게 만드는 심적 성향은?", "a": "지각적 갖춤새", "a2": "지각적 갖춤새", "e": "사전 자극이나 개념적 도식이 사후에 입력되는 가시적 단서를 특정 방향으로 편향되게 가공(하향 처리)하도록 이끄는 주관적 인지 왜곡 요인입니다.", "b": "3권 p.626"}, {"id": "B11-4-1", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "장기기억에 저장되어 있는 여러 정보들이 인출 경쟁을 펼치며 충돌하는 과정에서 망각이 일어난다는 관점으로, 새로운 정보가 기존 정보의 회상을 방해하는 (①)과 기존에 머물던 정보가 새 정보의 학습 및 회상을 방해하는 (②)로 나뉘는 이 이론은?", "a": "역행간섭 / 순행간섭", "a2": "① 역행간섭 (Retroactive interference), ② 순행간섭 (Proactive interference)", "e": "기억의 자취가 시간이 흘러 저절로 무뎌진다고 보는 '소멸이론'에 대비하여, 정보들이 서로 경합을 벌이고 차단하면서 인출에 장애를 겪는다고 보는 '간섭이론'의 핵심 원리들입니다.", "b": "3권 p.669 · 3권 p.680"}, {"id": "B11-4-2", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "한 문제를 어떤 방식으로 포장하고 단어를 배치하는지에 따라 사람들의 이성적 판단과 의사결정이 다르게 조작되는 현상으로, 예컨대 환자에게 수술 성공률 \"90%\"를 강조할 때와 사망률 \"10%\"를 경고할 때의 수용 태도가 판이하게 달라지는 기제는?", "a": "틀 효과 / 프레이밍 효과", "a2": "틀 효과 혹은 프레이밍 효과 (Framing effect)", "e": "동일한 물리적 결과나 리스크 정보를 지녔더라도, 맥락을 이득 프레임으로 가두느냐 혹은 손실 프레임으로 가두느냐에 따라 합리적 인간의 선택 성향이 극적으로 바뀌게 됩니다.", "b": "3권 p.692"}, {"id": "B11-4-6", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "톨만(Tolman)의 미로실험에서 증명된 개념으로, 쥐들이 먹이(강화물)를 즉시 제공받지 않더라도 미로 내부 구조에 대한 (①)를 뇌 속에 무의식적으로 이미 형성(학습)하고 있었으며, 강화물은 단지 머릿속에 숨겨져 있던 (②)을 겉으로 표출시키는 유인책 기능만을 담당했음을 보여준다.", "a": "인지도 / 잠재학습", "a2": "① 인지도 (Cognitive map), ② 잠재학습 (Latent learning)", "e": "단순 자극-반응 결합만을 주장했던 행동주의 한계를 깨고, 강화는 단지 학습된 내용을 외현적 수행으로 표현하게 만드는 촉매제일 뿐이며, 내적 인지도식의 변화 자체가 본질적인 학습임을 증명했습니다.", "b": "3권 p.673"}, {"id": "B11-4-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "페스팅거(Festinger)의 이론으로, 개인이 지닌 신념(태도)과 실제로 행한 행동이 상호 모순되어 일치하지 않을 때 마음속에 극심한 인지적 불편감과 각성(부조화)이 유발되며, 인간은 이 고통을 해결하기 위해 이미 질러버려서 되돌릴 수 없는 '행동'에 맞추어 사후적으로 자신의 '신념'을 강제로 개조하게 된다는 이론은?", "a": "인지부조화 이론 / 인지부조화", "a2": "인지부조화 이론 (Cognitive dissonance theory)", "e": "페스팅거의 지루한 벽돌 돌리기 실험에서, 고작 1달러를 받고 거짓말을 한 피험자들은 행동을 정당화할 외적 명분(보상)이 부족해 심한 인지부조화를 겪었고, 결국 \"작업이 정말 유익하고 재밌었다\"라고 자신의 태도를 진심으로 개조했습니다. 반면 20달러를 받은 집단은 '돈'이라는 확실한 외부정당화가 있어 부조화를 느끼지 않았고 태도도 바뀌지 않았습니다.", "b": "3권 p.706"}, {"id": "B11-4-9", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "사물이 통상적으로 지닌 고유하고 일차원적인 쓰임새에만 주의가 과도하게 매몰되어, 문제해결 현장에 널려 있는 주변 사물(상자, 못 등)들을 다각도의 유용한 대안적 해결 도구로 가공해 내지 못하는 특수한 마음갖춤새 편향은?", "a": "기능적 고착", "a2": "기능적 고착 혹은 기능적 고착성 (Functional fixedness)", "e": "던커(Duncker)의 양초 문제나 메이어(Maier)의 두 밧줄 문제 등에서 잘 증명되는데, 기존에 부호화된 고정 도식에 지나치게 얽매여 사물의 잠재적 다목적 기능을 간과함으로써 나타나는 마인드버그(Mindbug)입니다.", "b": "3권 p.694"}, {"id": "B11-4-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "셀리그만(Seligman)이 제안한 학습된 무기력이론은 후속 연구를 통해 수정 및 보완되었다. 특히 에이브람슨(Abramson) 등은 무기력 상태를 유발하는 매개요인으로 인지적 귀인 과정을 강조하였고, 워트맨(Wortman)과 브렘(Brehm)의 통합이론에 따르면 학습자가 통제 불가능한 실패에 직면했을 때 초기에는 극복하고자 더욱 노력을 투여하는 ( ① ) 현상이 나타나지만, 실패가 누적되고 통제 불가능성이 장기화될 때 비로소 무기력감에 빠지게 된다고 보았다.", "a": "저항 / 심리적 저항", "a2": "① 심리적 저항 혹은 저항 (Psychological reactance)", "e": "초기 학습된 무기력이론은 기계적인 기대 학습만을 다루었으나, 수정이론은 실패 사건에 대한 귀인(내부적, 안정적, 전반적 귀인일 때 무기력이 심화됨)을 삽입했습니다. 또한 통합이론은 중요한 과제일수록 초기에 강한 심리적 저항(더욱 노력함)이 발생하다가 한계에 달하면 급격히 무기력해짐을 입증했습니다.", "b": "3권 p.725 · 3권 p.724"}, {"id": "B11-5-1", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "단기기억의 정보를 단순히 머릿속으로 되뇌어 재생하는 수준에 그쳐 장기기억 전이 가능성이 낮은 시연을 (      )이라 한다.", "a": "기계적 시연 / 유지형 시연", "a2": "기계적 시연 혹은 유지형 시연 (Maintenance rehearsal)", "e": "단순 반복인 유지형 시연은 전이율이 매우 낮지만, 능동적으로 인지적 맥락을 부여하는 정교형 시연은 장기기억으로 정보를 성공적으로 보관하도록 이끕니다.", "b": "3권 p.661"}, {"id": "B11-5-2", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "물질중독 환자들의 뇌를 분석한 결과, 약물 사용을 중단하여 신체적 금단증상이 모두 사라졌음에도 불구하고, 이전에 약물을 사용했던 자극이나 환경에 노출될 때 뇌의 도파민 뉴런이 과도하게 활동하여 강력한 갈망을 다시 촉발하는 영구적인 변화가 발견되었다. 이와 같이 중독 물질의 반복적 사용으로 도파민 체계가 과민해지는 생물학적 현상은?", "a": "신경 민감화 / 동기 민감화", "a2": "신경민감화 (Incentive-sensitization) 혹은 동기민감화", "e": "로빈슨과 베리지(Robinson & Berridge)의 동기민감화 이론에 따르면, 약물의 남용은 약물이 주는 실질적 쾌감 자체(Liking)보다는 중뇌-변연계 도파민 체계를 물리적으로 과민 변형시켜 약물을 끊임없이 갈망하고 찾아다니는 충동적 동기(Wanting)를 영구적으로 활성화합니다.", "b": "3권 p.634"}, {"id": "B11-5-3", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "개인이 어떤 물리적 자극(빛, 소리, 압력 등)의 존재 여부를 시행의 50% 확률로 탐지해 낼 수 있는 최소한의 자극 강도를 지칭하는 개념은?", "a": "절대역", "a2": "절대역 (Absolute threshold)", "e": "인간 감각 체계가 자극을 탐지하는 한계 강도를 의미하며, 이 절대역 이하의 강도를 갖는 자극은 우리가 알아차릴 수 없는 '역하자극(식역하자극)'이 됩니다.", "b": "3권 p.617"}, {"id": "B11-5-4", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "시상하부는 섭식행동의 시작(on)과 정지(off)를 명령하는 사령부를 가지고 있다. 활성화되면 음식을 탐색하고 먹도록 자극하여 기아중추로 기능하는 부위는 (외측) 시상하부이고, 활성화되면 음식 섭취를 멈추게 하여 포만중추로 기능하는 부위는 (①) 시상하부이다. 또한 복내측 시상하부에 손상을 입은 쥐는 급격한 체중 증가를 겪은 후 새로운 체중 수준에서 안정되는데, 이처럼 유기체가 유지하고자 하는 일종의 목표 체중 값을 (②)라고 한다.", "a": "복내측 / 조절점", "a2": "① 복내측 (Ventromedial), ② 조절점 (Setpoint)", "e": "외측 시상하부 손상 시 먹지 않아 굶어 죽는 절식증이 나타나고, 복내측 시상하부 손상 시 멈추지 않고 먹는 과식증이 나타납니다. 조절점은 시상하부가 체온계처럼 몸의 지방과 체중을 일정하게 유지하려고 설정해 둔 기준값입니다.", "b": "3권 p.717"}, {"id": "B11-5-6", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "르두(Ledoux)의 뇌과학 연구에 따르면, 공포 정서는 위험 자극이 유입될 때 두 가지 경로를 거쳐 편도체에 도달한다. 감각 정보를 받은 시상에서 시각피질을 거치지 않고 편도체로 직접 연결되어 신속하고 대략적인 위협 분석을 처리하는 경로를 (①) 경로라 하고, 시상에서 시각피질(감각피질)을 거쳐 정밀한 분석을 끝마친 뒤 최종 편도체로 가닿는 구체적이고 느린 경로를 (②) 경로라고 한다.", "a": "빠른 / 느린", "a2": "① 빠른 경로, ② 느린 경로", "e": "산길에서 뱀 같은 모양을 보았을 때 머리로 생각하기도 전에 소스라치게 몸을 피하는 자동 반사는 시상-편도체의 '빠른 경로(①)' 덕분이며, 이후 \"자세히 보니 새끼줄이네\"라고 안심하고 각성을 가라앉히는 것은 피질을 거쳐 도달한 '느린 경로(②)'의 조절 결과입니다.", "b": "3권 p.744"}, {"id": "B11-5-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "단기기억의 제한된 용량 한계를 극복하기 위해, 무작위로 제시된 친숙하지 않은 자극 요소들을 의미 있는 고차원적 정보 단위로 묶어서 기억 수행력을 비약적으로 향상시키는 전략은?", "a": "청킹 / 군집화", "a2": "청킹 (군집화)", "e": "밀러(Miller)가 제시한 단기기억 용량인 7±2의 단위를 확장하는 방법으로, 이미 장기기억에 저장된 친숙한 도식이나 상식을 불러와 자극들을 유기적으로 조직화할 때 발생합니다.", "b": "3권 p.662"}, {"id": "B11-5-9", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인간은 복잡한 사회적 정보를 마주했을 때 정밀하게 검토하기보다, 한정된 뇌의 에너지 소모를 최소화하기 위해 인지적 지름길(도식이나 어림법)을 활용하여 신속하게 판단을 내리려는 성향을 지닌다. 이처럼 인간의 뇌가 정보를 가공하는 효율 중심의 인지적 특성을 일컫는 용어는?", "a": "인지적 구두쇠", "a2": "인지적 구두쇠 (Cognitive miser)", "e": "도식을 기반으로 한 인지 처리는 복잡한 환경 자극 속에서 정보처리 시간과 노력을 극적으로 단축해주고 누적된 망각의 빈자리를 메워주는 이점이 있으나, 과잉단순화로 인한 오판과 편견이라는 역효과를 유발합니다.", "b": "3권 p.698"}, {"id": "B11-5-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "기억의 인출 단서가 정보를 뇌 속에 처음 밀어 넣었던 '부호화 과정에서 함께 사용된 주변 맥락'과 완벽히 일치하고 유사할수록 인출 정확도가 급상승한다는 인출 원리는?", "a": "부호화 특수성 원리 / 부호화 명세성 원리", "a2": "부호화 특수성 원리 혹은 부호화 명세성 원리 (Encoding specificity principle)", "e": "부호화 당시의 단서가 효과적인 인출의 열쇠가 된다는 원리로, 특정 장소나 환경적 맥락이 동일할 때 기억이 잘 나는 '맥락의존기억'을 완벽히 지지하는 기초 이론입니다.", "b": "3권 p.666"}, {"id": "B11-6-1", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "타인의 행동이나 사회적 사건이 발생했을 때, 그 행동이 일어난 내적·외적 원인을 추론하고 찾아가는 주관적 인지 과정을 (      )이라 한다.", "a": "귀인", "a2": "귀인 (Attribution)", "e": "귀인은 인간이 주변 사회적 환경을 예측하고 통제하려는 본능적 욕구에서 비롯되며, 인지된 원인이 무엇이냐에 따라 행위자에 대한 우리의 감정과 후속 행동이 결정됩니다.", "b": "3권 p.695"}, {"id": "B11-6-2", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "셀리에(Selye)가 정립한 일반 적응 증후군(GAS)에 따르면, 만성적 스트레스원에 장기간 노출된 신체는 3단계를 거치며 비특이적 적응 반응을 보인다. 위협을 처음 지각하여 교감신경계가 급격히 각성되는 (①) 단계, 스트레스에 맞서 분비된 코르티솔 등의 호르몬을 동원해 저항력이 최고조에 달하는 (②) 단계, 그리고 스트레스가 계속 해소되지 않아 신체 자원이 완전히 고갈되고 면역체계가 붕괴되어 질병에 걸리는 (소진 혹은 고갈) 단계가 그것이다.", "a": "경고 / 저항", "a2": "① 경고 (Alarm), ② 저항 (Resistance)", "e": "경고 단계는 투쟁-도피 반응과 흡사하며, 저항 단계는 외형상 안정되어 보이지만 신체 내부 에너지를 쥐어짜며 버티는 단계입니다. 소진 단계에 도달하면 신체 방어선이 무너져 만성 심신 장애나 사망에 이를 수 있습니다.", "b": "3권 p.747"}, {"id": "B11-6-4", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "어두운 극장 안으로 들어갔을 때 처음에는 아무것도 보이지 않다가 점차 의자의 윤곽이나 사람들의 실루엣을 식별할 수 있게 되었다. 이처럼 어두운 조명 조건(낮은 명도)에서 활성화되어 사물의 대략적인 형태를 파악하게 하며, 주로 망막의 주변부(말초)에 조밀하게 분포해 있는 감각세포는?", "a": "간상체 / 간상세포", "a2": "간상체 (Rods) 혹은 간상세포", "e": "간상체는 매우 어두운 조명 조건에서 작동하는 시각 세포로, 정밀한 색상 변별력은 없으나 명암과 대략적인 형태, 운동을 감지하는 능력이 우수하며 망막 중심부(황반)보다는 주변부에 넓게 분포해 있습니다.", "b": "3권 p.619"}, {"id": "B11-6-5", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "자신의 전반적인 사고 및 인지 과정 자체를 스스로 조망하고 점검·조절하는 상위 인지 수준으로, 계획(Planning), 점검(Monitoring), 조절(Regulating), 평가(Evaluating)를 아우르는 정신활동을 뜻하는 용어는?", "a": "초인지 / 메타인지", "a2": "메타인지 혹은 초인지 (Metacognition)", "e": "지적 수행에서 어떤 부호화 전략을 쓸지 결정하고 자신의 집중도 수준을 평가하여 부족한 점을 보충해 학습 속도를 늦추거나 다시 읽는 등의 자기조절활동을 통제하는 뇌의 중앙처리장치 역할을 합니다.", "b": "3권 p.679"}, {"id": "B11-6-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "어떤 사건의 발생 빈도나 위험 수위를 이성적인 통계 확률 대신, 최근 언론에서 생생하게 다루었거나 머릿속에 가장 쉽고 즉각적으로 가용되어 튀어나오는 자서전적 사례들을 기준으로 주관적으로 과장되게 추정하는 직관적 편향은?", "a": "가용성 어림법 / 가용성 휴리스틱", "a2": "가용성 어림법 혹은 가용성 휴리스틱 (Availability heuristic)", "e": "예컨대 통계상 당뇨나 간염으로 사망할 확률이 훨씬 높음에도 불구하고, 대중매체에서 자극적이고 생생하게 보도하는 살인이나 화재 사건의 빈도를 훨씬 더 높게 잘못 예측하는 현상이 이에 속합니다.", "b": "3권 p.691"}, {"id": "B11-6-8", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "크레이크(Craik)와 록하트(Lockhart)의 이론으로, 정보의 기계적·물리적 특징을 분석하는 것보다 정보의 '의미적 속성'을 깊게 분석하고 정교화할수록 기억의 파지 상태가 훨씬 우수해진다는 이론은?", "a": "처리깊이 / 처리수준", "a2": "처리깊이 혹은 처리수준 (Levels of processing theory)", "e": "얕은 처리(단어의 외형이나 음운 분석)는 망각이 빠르지만, 깊은 처리(단어의 개념적 정의나 자기 적용)는 대뇌 속에 오랫동안 기억 흔적을 남기게 됩니다.", "b": "3권 p.664 · 3권 p.666"}, {"id": "B11-6-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "페스팅거(Festinger)의 이론으로, 인간은 자신의 능력 수준이나 생각의 타당성을 정확히 판별하기 어려울 때 다른 타인을 기준점으로 삼아 자신을 대조 평가하려는 강력한 본능적 동기를 지닌다는 이론은?", "a": "사회비교 이론 / 사회비교", "a2": "사회비교 이론 (Social comparison theory)", "e": "자신보다 우월한 대상과 비교하는 상향비교(동기 고취 효과가 있으나 자존감 하락을 겪는 '대비 효과' 유발), 열등한 대상과 비교하는 하향비교(자존감 수호 기능), 그리고 동질감을 주는 대상과 대조하는 유사비교로 구성되어 심리를 조율합니다.", "b": "3권 p.700"}, {"id": "B11-7-1", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "우리는 그림이나 사물을 바라볼 때 생략되거나 미완성된 틈새 부분이 있더라도, 무의식적으로 그 빈 공간을 메워서 하나의 완전한 형태(닫힌 개체)로 지각하려는 경향이 있다. 이러한 자극 집단화 원리에 해당하는 게슈탈트 지각 조직화 법칙은?", "a": "폐쇄성 / 폐쇄성의 원리", "a2": "폐쇄성의 원리 (Law of Closure)", "e": "게슈탈트 지각 법칙 중 폐쇄성의 원리는 불완전하거나 일부분이 끊어진 시각 단서 속에서도 인지적인 가소성을 발휘하여, 빈 공간을 머릿속에서 채워 전체적이고 완결된 형태로 파악하게 만듭니다.", "b": "3권 p.623"}, {"id": "B11-7-3", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "대상과의 거리가 멀어지거나 보는 각도가 변하고 혹은 주변의 조명 색이 급격히 달라지더라도, 뇌가 대상 고유의 크기, 형태, 밝기를 안정적이고 변함없는 본래의 속성으로 한결같이 인식하는 조절력은?", "a": "지각 항등성", "a2": "지각 항등성 (Perceptual constancy)", "e": "망막 이미지의 물리적 모양이 시시각각 일그러지고 크기가 변화하더라도 뇌가 무의식적 추론을 가동하여 대상의 항상성을 확보해 주는 강력한 지각 체계입니다.", "b": "3권 p.624"}, {"id": "B11-7-4", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "칙센트미하이(Csikszentmihalyi)의 플로우(Flow) 이론에 따르면, 과제가 주는 즐거움과 재미에 완전히 매료되어 시간 가는 줄 모르고 행위에 몰입하는 집중 상태를 경험하기 위해서는 두 가지 요건의 적절한 조화가 필수적이다. 만약 (①) 수준이 학습자가 보유한 (②) 수준보다 지나치게 높으면 심한 불안과 스트레스를 느끼게 되고, 반대로 (①) 수준이 (②) 수준보다 터무니없이 낮으면 지루함과 권태를 느끼게 된다.", "a": "도전 / 기술", "a2": "① 도전 혹은 도전 수준 (Challenge), ② 기술 혹은 기술 수준 (Skills)", "e": "몰입(Flow)은 개인의 기술 수준과 과제의 도전 수준이 모두 높으면서 두 지표가 팽팽한 균형을 이룰 때 발생합니다. 이를 통해 활동 그 자체가 보상이 되는 출현동기(Emergent motivation)가 촉진됩니다.", "b": "3권 p.730 · 1권 p.139"}, {"id": "B11-7-5", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "타인의 행동 원인을 추론할 때, 그 행동이 일어날 수밖에 없었던 주변 상황적 영향력과 환경적 제약은 지나치게 과소평가하고, 오직 행위자 본인의 내적 특성이나 성격 요인만을 지나치게 과대평가하여 설명하려는 인지적 편향은?", "a": "기본적 귀인 오류", "a2": "기본적 귀인 오류 (Fundamental attribution error)", "e": "타인의 처지를 구체적으로 헤아리기보다 행위자의 성향으로 원인을 단순화하려는 뇌의 자동적 기제로, 동사무소 직원의 불친절을 더운 날씨(상황) 때문이 아니라 고약한 성질머리(성향) 탓으로 돌리는 것이 대표적인 예시입니다.", "b": "3권 p.697"}, {"id": "B11-7-7", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "민우는 수면 도중 안구의 빠른 움직임을 제외한 전신의 근육 마비(움직임 없음) 현상을 겪고 있었으나, 뇌파 측정 결과는 깨어 있을 때의 베타파나 가벼운 졸음 상태인 세타파와 거의 유사하게 빠르고 불규칙한 활동을 보이고 있었다. 이처럼 뇌는 고도로 각성되어 꿈을 꾸지만 신체는 마비되는 특징을 지닌 수면 상태는 (      ) 수면이라고 한다.", "a": "REM / 역설적", "a2": "REM 수면 (REM Sleep) 혹은 역설적 수면 (Paradoxical Sleep)", "e": "REM 수면 단계에서는 활발한 시각 신경계의 기능으로 인해 생생한 꿈을 경험하게 되며, 이때 뇌는 각성 상태와 유사하게 요동치지만(뇌파 활성화), 꿈속 행동이 신체 실제 운동으로 나타나 부상당하는 것을 방지하기 위해 운동 명령 통로가 강하게 차단되어 신체 마비가 동반됩니다.", "b": "3권 p.630 · 3권 p.629 · 3권 p.631"}, {"id": "B11-7-8", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "와이너(Weiner)의 귀인이론에 따르면, 학업 성패의 원인을 분석할 때 인과소재, 안정성, 통제 가능성의 3가지 차원을 고려한다. 만약 시험 실패의 원인을 적성이 낮거나 머리가 나쁘기 때문으로 귀인한다면 이는 '내부 + (①) + (②)' 차원에 해당하여 무기력감과 우울을 유발한다.", "a": "안정 / 통제 불가능", "a2": "① 안정, ② 통제 불가능", "e": "실패 원인을 '노력 부족'(내부-불안정-통제 가능)으로 돌릴 때는 수치심이나 죄책감을 느끼지만 다음에는 더 잘할 수 있다는 통제감을 갖게 됩니다. 반면 '능력 부족'(내부-안정-통제 불가능)으로 귀인하면 자존감이 크게 다치고 자포자기하게 됩니다.", "b": "3권 p.726 · 1권 p.133"}, {"id": "B11-7-9", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "교실 뒤편에 앉아 있는 지수가 칠판에 적힌 모호하게 갈겨쓴 글씨를 처음에는 해독하지 못하다가, 앞뒤 문장인 'A _ C'와 '12 _ 14'의 주변 문맥을 파악한 후 가운데 글자를 각각 'B'와 '13'으로 올바르게 해석하였다. 이처럼 이전에 습득한 지식과 문맥 정보가 유입되는 감각 자극의 해석을 지배하는 정보처리 방식은?", "a": "하향처리", "a2": "하향처리 (Top-down processing)", "e": "하향처리는 유입되는 감각 정보(상향처리)에만 의존하지 않고, 개인이 가진 과거의 경험, 지식, 기대, 혹은 주변 문맥 정보를 활용하여 들어오는 감각 자극을 능동적으로 예측하고 해석하는 정보처리 과정입니다.", "b": "3권 p.616"}, {"id": "B11-7-10", "s": "심리학개론 및 교육심리", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "트버스키(Tversky)와 카네만(Kahneman)의 전망이론(Prospect theory)에 따르면, 사람들은 부를 획득하는 상황인 (①) 프레임에서는 굳이 모험을 걸지 않고 확실한 이익을 수호하려는 위험회피 성향을 보이지만, 손실이 불가피한 손실 프레임에 봉착하면 확정된 피해를 회피하고자 위험도가 높은 모험적 선택을 자처하는 (②) 성향을 취한다.", "a": "이득 / 위험추구", "a2": "① 이득, ② 위험추구 (Risk seeking)", "e": "인간은 손실에 대한 정서적 혐오와 두려움이 이득에 대한 쾌감보다 훨씬 큽니다. 따라서 100% 확률로 90만 원을 버는 것을 선호하는 반면, 손실 상황에서는 확실한 손해를 보기보다는 차라리 더 큰 손해를 볼 위험이 있더라도 모험적인 도박안(90% 확률로 100만 원 손실)을 택하게 됩니다.", "b": "3권 p.692"}];const ALIAS={"1-5":["B1-1-9","B1-14-6","B1-27-2","B1-34-10"],"1-9":["B1-3-2","B1-14-8","B1-36-8"],"1-7":["B1-5-5","B1-7-8","B1-15-5","B1-23-2","B1-25-1","B1-28-6","B1-34-1"],"1-6":["B1-5-8","B1-7-7","B1-9-5","B1-17-3","B1-23-4","B1-25-4","B1-26-5","B1-27-8"],"1-3":["B1-6-1","B1-11-6","B1-28-10","B1-35-3"],"1-10":["B1-6-2","B1-11-3","B1-28-1"],"B1-2-1":["B1-7-3","B1-13-10","B1-23-6","B1-25-9","B1-35-7"],"B1-3-4":["B1-7-4","B1-9-2","B1-14-9","B1-23-9","B1-25-3","B1-31-1","B1-32-8"],"B1-5-10":["B1-7-5 const CIRC={"①":"1","②":"2","③":"3","④":"4","⑤":"5","⑥":"6","⑦":"7","⑧":"8","⑨":"9"};
function nb(t){return t.replace(/\(\s{3,}\)/g,'<span class="blank">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span>').replace(/\([^()]{1,24}\)/g,m=>`<span class="nb">${m}</span>`)}   /* 괄호 묶음은 줄바꿈 금지 */
function row(cls,num,txt){return `<div class="${cls}"><span class="num">${num}</span><span class="txt">${nb(txt)}</span></div>`}
function fmt(s,ans){
  return esc(s).split("\n").map(l=>{let m;l=l.trim();
    if((m=l.match(/^([①②③④⑤⑥⑦⑧⑨])\s*(.*)$/))){if(ans&&CIRC[m[1]]===String(ans).trim())return `<p>${nb(m[2])}</p>`;return row("opt",CIRC[m[1]],m[2]);}
    if((m=l.match(/^([-–—•·▪◦]|[㉠-㉭])\s*(.*)$/)))return row("li",/^[-–—]$/.test(m[1])?"–":m[1],m[2]);
    if((m=l.match(/^(\d{1,2})\.\s+(.*)$/)))return `<div class="h"><span class="num">${m[1]}.</span><span class="txt">${nb(m[2])}</span></div>`;
    if((m=l.match(/^(\d{1,2})\)\s*(.*)$/)))return row("sub",m[1]+")",m[2]);
    if((m=l.match(/^([A-Ea-e])[.)]\s*(.*)$/)))return row("sub",m[1]+".",m[2]);
    if((m=l.match(/^정답\s*[:：]\s*(.*)$/))){const parts=m[1].split(/(?=[①-⑨㉠-㉭])/).map(x=>x.replace(/[\s,，/·]+$/,"").trim()).filter(Boolean);
      if(parts.length>=2&&/^[①-⑨㉠-㉭]/.test(parts[1]))return `<div class="ansline multi"><span>정답</span><div>${parts.map(x=>{const k=x.match(/^([①-⑨㉠-㉭])\s*(.*)$/);return k?`<div class="am"><b>${CIRC[k[1]]||k[1]}</b>${k[2]}</div>`:`<div class="am">${x}</div>`}).join("")}</div></div>`;
      return `<p class="ansline"><span>정답</span>${m[1]}</p>`;}
    return l?`<p>${nb(l)}</p>`:`<div class="gap"></div>`;
  }).join("").replace(/(<div class="gap"><\/div>){2,}/g,'<div class="gap"></div>');
}
function cnt(id){let ok=0,ng=0;for(const k of keysOf(id)){const m=M[k];if(m){ok+=m.ok||0;ng+=m.ng||0}}return {ok,ng}}
function starred(id){const m=M["S:"+id];return !!(m&&m.ok>0)}
function toggleStar(id,b){const on=!starred(id);M["S:"+id]={ok:on?1:0,ng:0,u:Date.now()};save();b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);queueSync();if(cur==="star")refreshCounts()}
function favN(sj){return Q.filter(q=>q.s===sj&&starred(q.id)).length}
function cntHtml(id){const c=cnt(id);if(!(c.ok||c.ng))return "";const t=c.ok+c.ng;
  const rate=`${Math.round(100*c.ok/t)}%`;
  return `<span class="cnt"><span class="o">맞음 ${c.ok}</span> · <span class="x">틀림 ${c.ng}</span> · ${rate}</span>`}
function sumHtml(ok,ng){return ok||ng?`<span class="so">${ok}</span> <span class="sx">${ng}</span> · <span class="sr">${Math.round(100*ok/(ok+ng))}%</span>`:""}
function subjStat(sj){let ok=0,ng=0;Q.forEach(q=>{if(q.s===sj&&(cur!=="star"||starred(q.id))){const c=cnt(q.id);ok+=c.ok;ng+=c.ng}});return {ok,ng}}
function updSummary(card){const d=card&&card.closest("details.theme");if(!d||!d.dataset.s)return;const sm=d.querySelector("summary small .l2");if(!sm)return;
  const c=subjStat(d.dataset.s);sm.innerHTML=sumHtml(c.ok,c.ng)}
function judgeHtml(id){const c=cnt(id);return `<div class="judge"><button class="ok" onclick="judge('${id}','ok',this)">맞음 <span>${c.ok}</span></button><button class="rs" onclick="judge('${id}','reset',this)">초기화</button><button class="ng" onclick="judge('${id}','ng',this)">틀림 <span>${c.ng}</span></button></div>`}
function unarm(btn,id){btn.closest(".judge").outerHTML=judgeHtml(id)}
const DL={"쉽게":"쉬운 문제","어렵게":"어려운 문제"};
function srcText(q,withSubj){const p=[];if(withSubj)p.push(esc(q.s));if(q.f==="Ⅰ")p.push(`${q.y?`${q.y}년 `:""}${q.no?`${q.no}번`:""}`.trim());if(q.f==="C")p.push("클로드 출제");return p.filter(Boolean).join(" · ")}
function card(q,i,withSubj){
