tion)", "e": "충분한 라포가 형성된 후 조심스럽게 사용해야 하는 고차원 기술입니다.", "b": "2권 p.71 · 2권 p.94 · 2권 p.79"}, {"id": "4-10", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "라자루스(Lazarus)의 중다양식 치료 중, 내담자의 '자기상(Self-image)'이나 환상을 다루는 양식은?", "a": "심상 / I", "a2": "심상(I) (Imagery)", "e": "BASIC-ID의 각 철자가 의미하는 양식을 정확히 구분해야 합니다.", "b": "2권 p.81 · 2권 p.82 · 2권 p.84"}, {"id": "15-1", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "다음 중 상담 초기 단계의 과업이 아닌 것을 고르시오.\n\n① 상담관계 형성\n② 정보수집\n③ 사례개념화\n④ 증상의 구체화 작업\n⑤ 상담목표 및 전략 수립", "a": "4", "a2": "4 증상의 구체화 작업", "e": "증상의 구체화 작업은 중기 단계에서 진행하는 것이다.", "b": "2권 p.38 · 2권 p.20 · 2권 p.48"}, {"id": "15-2", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "다음 중 ‘상담 구조화의 원칙’으로 적절하지 않은 것을 고르시오.\n\n① 상담자와 내담자가 서로 편안하게 느낄 수 있게 구조화를 최소한으로 줄여야 한다.\n② 구조화는 적절한 시점에서 이루어지되, 내담자를 처벌하는 식이 되어서는 안된다.\n③ 면담시간 약속 및 내담자의 행동규범에 관해서는 구체적으로 정해야 한다.\n④ 상담자는 비밀보장의 구조화를 통해 내담자에게 비밀보장의 한계에 대해 알려주어야 한다.\n⑤ 구조화는 반복하기보다 처음에 명확하게 정하고 지켜나가는 것이 중요하다.", "a": "5", "a2": "5 구조화는 반복하기보다 처음에 명확하게 정하고 지켜나가는 것이 중요하다.", "e": "‘구조화’는 상담자가 내담자에게 상담에 필요한 기본규칙과 한계 등에 대해 설명하는 것이다.\n구조화는 필요에 따라서 상담의 전 과정에서 반복해서 이루어질 수 있다.", "b": "2권 p.40"}, {"id": "15-3", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음의 설명을 읽고, 해당하는 상담 초기과정의 과업을 쓰시오.\n\n상담 초기에는 상담자가 내담자에게 필요한 기본 규칙과 한계 등에 대해서 설명하는 것이 중요하다. 상담에 대한 내담자의 자발적 참여와 협력 의지에 긍정적인 영향을 줄 뿐만 아니라 내담자가 가지고 있는 애매모호함과 불안을 경감시키는 등의 효과를 지니고 있다. 이 과업은 상담 시간이나 횟수, 장소 등을 안내하고, 상담 과정의 진행방법과 상담자와 내담자의 역할을 알려주며, 비밀보장의 의무와 한계에 대해서도 설명한다. 상담 초기 꼭 필요한 과업이라 볼 수 있다.", "a": "구조화", "a2": "구조화", "e": "상담 초기에는 상담자가 내담자에게 필요한 기본 규칙과 한계 등을 설명하는 구조화 작업을 한다. 구조화에 포함되는 내용은 상담과정의 본질, 상담관계의 특징, 상담자와 내담자 역할, 내담자의 권리, 비밀보장에 대한 약속과 한계, 매 회기별 상담시간과 예상회기, 상담약속 등 진행과 관련된 세부사항, 기타 지켜야 할 일 등이다.", "b": "2권 p.40"}, {"id": "15-4", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "다음 중 저항을 효과적으로 다루는 방법이 아닌 것을 고르시오.\n\n① 내담자의 저항을 정확하게 직면해주어 저항임을 깨닫도록 해야 한다.\n② 내담자의 저항을 당연한 것으로 받아들인다.\n③ 내담자의 저항 패턴을 통해 문제에 대한 내담자의 대처방식을 추측한다.\n④ 내담자는 다양한 방식으로 저항한다는 점을 이해한다.\n⑤ 저항 행동에 대해 지금-여기의 자세로 접근한다.", "a": "1", "a2": "1 내담자의 저항을 정확하게 직면해주어 저항임을 깨닫도록 해야 한다.", "e": "내담자의 저항을 정확하게 직면하기보다는 저항을 당연하게 받아들이고, 안전한 분위기에서 수용해야 한다.", "b": "2권 p.50"}, {"id": "15-5", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "다음에 해당하는 프로체스카(Prochaska)의 내담자 변화과정의 모델 과정을 고르시오.\n\n- 행동 변화가 나타난 후 행동이 습관화되도록 돕는 단계\n- 새로운 행동의 시도로 긍정적 효과가 나타났더라도, 후퇴하여 기존의 익숙한 행동으로 돌아가기도 함\n- 새로운 행동을 이어나가는데 방해되는 요인을 탐색하여 조절하게 함\n\n① 숙고 단계\n② 준비 단계\n③ 행동 단계\n④ 유지 단계\n⑤ 종결 단계", "a": "4", "a2": "4 유지 단계", "e": "프로체스카(Prochaska)의 내담자 변화과정은 숙고 전 단계, 숙고 단계, 준비 단계, 행동 단계, 유지 단계, 종결 단계 순서이다. 유지 단계는 행동 변화가 나타난 후 행동이 습관화되도록 돕는 단계이다.", "b": "2권 p.51"}, {"id": "15-6", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "프로체스카(Prochaska)의 내담자 변화과정 모델에서 (      )단계는 내담자가 자신이 문제가 있다고 인식하지만 변화해야 할지 말아야 할지 고민하는 단계로서 내담자는 변화가 필요하지만 어렵다는 것을 알고 있으며 자신이 어떤 변화를 시도할 수 있는지 모르는 단계를 의미한다.", "a": "숙고", "a2": "숙고", "e": "프로체스카(Prochaska)의 내담자 변화과정 모델의 단계는 전숙고, 숙고, 준비, 행동, 유지, 종결 순서이다.", "b": "2권 p.51"}, {"id": "15-7", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "상담회기를 기록하기 위한 ‘SOAP 양식’에서 다음의 사례에 해당되는 영역을 쓰시오.\n\n준우는 추운 겨울날씨에 맞지 않게 얇은 긴팔티를 입고 있었고, 신발은 아주 낡아있었다. 상담실에 앉자마자 배가 고픈데 간식을 달라며 큰소리로 말했고, 자신은 초콜릿을 좋아한다며 초콜릿이 없냐고 재차 물었다.", "a": "객관적", "a2": "객관적", "e": "SOAP 양식은 S는 주관적, O는 객관적, A는 분석, 평가, 진단, P는 계획이다.", "b": "2권 p.59"}, {"id": "15-8", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "상담의 중기 과정에서는 내담자가 익숙한 방식에서 벗어나는 것과 현재 이익을 잃는 것에 대한 두려움, 새로운 행동의 시도와 결과에 대한 두려움 등 변화를 원하면서도 두려워하는 경우가 많다. 상담자는 이러한 내담자의 변화에 대한 (      )을 탐색하고 내담자가 표현할 수 있도록 함으로써 내담자의 감정적인 어려움에 함께 머물면서 견뎌주는 역할을 할 수 있다.", "a": "양가감정", "a2": "양가감정", "e": "변화에 대한 양가감정 다루기에 대한 내용이다.\n- 내담자는 익숙한 방식에서 벗어나는 것과 현재의 이익을 잃는 것에 대한 두려움, 새로운 행동의 시도와 결과에 대한 두려움 등 변화를 원하면서도 두려워하는 양가적인 태도를 갖는 경우가 많다.\n- 상담자는 내담자 변화에 대한 양가감정을 탐색하고 내담자가 표현할 수 있게 함으로써, 내담자의 감정적인 어려움에 함께 머물면서 견뎌주는 역할을 할 수 있다.", "b": "2권 p.51"}, {"id": "15-9", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "다음 중 상담 종결과정의 과업이 아닌 것을 고르시오.\n\n① 상담의 성과를 정리하며 이 성과가 상담 종결 후에도 오랫동안 지속되도록 돕는다.\n② 종결 이후의 목표와 계획 등 미래 과제를 다루며 앞으로의 계획을 탐색 및 설정한다.\n③ 종결을 앞두고 내담자가 느낄 상실감과 슬픔 등을 다루며 감정을 솔직하게 표현하도록 돕는다.\n④ 상담이 종결 되고 일정 시간이 지난 뒤 내담자의 경과를 파악하기 위해 추후 일정을 잡는다.\n⑤ 종결 이후의 내담자를 평가하기 위해 새로운 정보들을 수집한다.", "a": "5", "a2": "5 종결 이후의 내담자를 평가하기 위해 새로운 정보들을 수집한다.", "e": "종결 시기에는 새로운 정보를 수집하기 보다는 상담의 성과 등을 정리하며, 종결 이후의 계획을 세우는 것이 중요하다. 또한, 내담자의 이별 감정을 다루고, 추수 상담을 계획해야 한다.", "b": "2권 p.54"}, {"id": "15-10", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "다음 중 코마이어의 적극적 경청의 반응 양식이 아닌 것을 고르시오.\n\n① 명료화하기\n② 질문하기\n③ 바꾸어 말하기\n④ 반영하기\n⑤ 요약하기", "a": "2", "a2": "2 질문하기", "e": "코미어(Cormier)의 적극적 경청의 반응 양식은 명료화하기, 바꾸어 말하기, 반영하기, 요약하기가 있다.", "b": "2권 p.62 · 2권 p.25 · 2권 p.60"}, {"id": "B4-1-4", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ASCA 국가모델의 4대 구성요소(기초, 운영, 전달, 책임) 중 상담 프로그램의 미션과 철학, 학생이 갖추어야 할 국가표준 역량을 정의하는 단계는?", "a": "기초", "a2": "기초 (Foundation)", "e": "기초 단계는 학교상담 프로그램의 방향성을 결정하는 가장 근본적인 가치와 표준을 설정하는 영역입니다.", "b": "2권 p.154 · 2권 p.150 · 2권 p.156"}, {"id": "B4-1-5", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "실험연구에서 연구자가 의도적으로 조작하여 원인이 되는 변인(변수)을 ( ① )이라 하고, 그로 인해 나타나는 결과 변인(변수)을 ( ② )라고 한다.", "a": "독립변인 / 종속변인", "a2": "① 독립변인, ② 종속변인", "e": "인과관계를 입증하는 실험의 가장 기초적인 구성 요소입니다.", "b": "2권 p.119 · 3권 p.594 · 2권 p.120"}, {"id": "B4-1-7", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "변증법적 행동치료(DBT)의 타당화 수준 중, \"누구라도 그런 상황이라면 화가 날 수밖에 없어\"라며 보편적 논리를 인정하는 수준은?", "a": "5수준 / 5", "a2": "5수준 (현재 맥락/논리적 타당화)", "e": "4수준은 개인의 과거 역사를, 5수준은 보편적 상황을 근거로 삼습니다.", "b": "2권 p.106 · 2권 p.103"}, {"id": "B4-1-10", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담자가 내담자와 전문적인 관계 외에 사적, 금전적, 교육적 관계 등을 동시에 혹은 순차적으로 맺는 현상은?", "a": "다중관계", "a2": "다중관계 (Multiple Relationship)", "e": "상담자의 객관성을 저해하고 내담자를 착취할 위험이 있어 원칙적으로 지양해야 합니다.", "b": "2권 p.232 · 2권 p.246 · 2권 p.255"}, {"id": "B4-2-1", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담의 성격, 비밀보장의 한계, 상담 거부권 등에 대해 충분히 설명하고 내담자의 자발적 동의를 얻는 절차는?", "a": "사전 동의", "a2": "사전동의 (Informed Consent)", "e": "내담자의 자율성을 보장하고 치료적 작업동맹을 강화하는 필수적인 윤리적 절차입니다.", "b": "2권 p.226 · 2권 p.228 · 2권 p.247"}, {"id": "B4-2-2", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "청소년 상담정책으로 365일 24시간 청소년과 관련된 고민상담에서부터 긴급한 위기문제 해결까지 종합적인 서비스를 받을 수 있는 청소년전화 (      )을 운영 및 지원한다.", "a": "1388", "a2": "1388(청소년 전화 1388)", "e": "365일 24시간 청소년과 관련된 고민상담에서부터 긴급한 위기문제 해결까지 종합적인 서비스를 받을 수 있는 청소년전화 1388을 운영 및 지원한다.", "b": "2권 p.261"}, {"id": "B4-2-4", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "조하리의 창에서 자신은 알지만 타인에게 숨기는 '비밀 영역'을 좁히고 공개 영역을 넓히는 기제는?", "a": "자기노출 / 자기개방", "a2": "자기노출 (자기개방, Self-disclosure)", "e": "진솔한 나눔을 통해 타인과의 신뢰 관계를 구축하는 과정입니다.", "b": "2권 p.86 · 2권 p.85"}, {"id": "B4-2-5", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담자가 내담자를 돕기에 충분한 지식, 기술, 정서적 조절력을 갖추는 것을 의미하는 상담자 윤리의 핵심 조건은?", "a": "전문성 / 유능성 / 역량", "a2": "전문성 (유능성, 역량, Professional Competence)", "e": "유능성은 내담자에게 선의를 베풀고 해를 끼치지 않기 위한 가장 기초적인 윤리적 책무입니다.", "b": "2권 p.235 · 2권 p.156"}, {"id": "B4-4-1", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "갑작스러운 사고나 이별 등 예기치 못한 사건에 의해 발생하는 위기의 유형은?", "a": "상황적 위기", "a2": "상황적 위기", "e": "위기는 발달적 위기(성숙), 상황적 위기(우발적 사건), 실존적 위기(의미 상실), 환경적 위기(재난)로 나뉩니다.", "b": "2권 p.169 · 2권 p.134"}, {"id": "B4-4-2", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "매우 높은 점수나 낮은 점수를 얻은 집단이 재검사 시 자연스럽게 평균 점수 근처로 되돌아가려는 타당도 위협 요인은?", "a": "통계적 회귀", "a2": "통계적 회귀 (Statistical Regression)", "e": "극단적인 표본을 선정했을 때 발생하는 내적 타당도 위협입니다.", "b": "2권 p.127"}, {"id": "B4-4-3", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "심리도식에서 상담자가 내담자의 어린 시절 결핍된 정서적 욕구를 상담 관계 내에서 적절히 충족시켜 주는 치료적 태도는?", "a": "제한된 재양육", "a2": "제한된 재양육 (Limited Reparenting)", "e": "심리도식 치료의 핵심적인 관계 전략입니다.", "b": "2권 p.94"}, {"id": "B4-4-4", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "심리도식의 3가지 대처 방식 중, 도식의 정반대가 진실인 것처럼 행동하여 완벽주의나 오만함으로 자신을 위장하는 방식은?", "a": "과잉보상 / 과잉보상자 양식", "a2": "과잉보상 (Overcompensation)", "e": "굴복(순응), 회피(차단), 과잉보상(반격)의 차이를 이해해야 합니다.", "b": "2권 p.91 · 2권 p.92 · 2권 p.29"}, {"id": "B4-4-5", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ASCA 전달 체제의 4개 프로그램 요소 중, 개별 학생이 자신의 적성을 확인하고 학업 및 진로 목표를 설정하도록 조력하는 활동은?", "a": "개별 학생 계획", "a2": "개별 학생 계획 (Individual Student Planning)", "e": "평가와 조언을 통해 학생 스스로 자신의 미래를 주도적으로 계획하도록 돕는 활동입니다.", "b": "2권 p.157 · 2권 p.153 · 2권 p.156"}, {"id": "B4-4-6", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "타인에게 명백한 위해를 가할 구체적 계획이 있는 내담자의 비밀을 파기하고 잠재적 피해자에게 알리는 상담자의 의무는?", "a": "경고 의무", "a2": "경고 의무 (Duty to Warn / 타라소프 판례)", "e": "비밀보장의 예외 상황 중 '타인에 대한 보호 및 경고 의무'에 해당합니다.", "b": "2권 p.256 · 2권 p.254 · 2권 p.223"}, {"id": "B4-4-8", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담자가 내담자가 현재 가장 편안하게 느끼는 양식으로 대화를 시작하여 점차 다른 양식으로 이동하는 기술은?", "a": "다리 놓기", "a2": "다리 놓기 (Bridging)", "e": "내담자의 주파수에 맞추어 관계를 형성하는 기법입니다.", "b": "2권 p.84"}, {"id": "B4-4-9", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "스마트폰 과의존 3대 요인은 현저성, 문제적 결과, 그리고 무엇인가요?", "a": "조절 실패", "a2": "조절 실패 (Loss of Control)", "e": "NIA(한국지능정보사회진흥원)의 모델로, 이 3요소가 결합될 때 과의존으로 판단합니다.", "b": "2권 p.197 · 3권 p.253"}, {"id": "B4-4-10", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "뒤르켐(Durkheim)의 자살 유형 중, 사회적 규제가 급격히 약화되어 무규범 상태에서 혼란을 겪을 때 나타나는 자살은?", "a": "아노미적 자살", "a2": "아노미적 자살", "e": "급격한 사회 변동이나 경제 위기 등으로 가치관이 붕괴될 때 발생하는 유형입니다.", "b": "2권 p.185"}, {"id": "B4-5-4", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "사이버 상담에서 상담자가 자신의 신체적 반응이나 상태를 문자로 생생히 묘사하여 상담자의 실재감을 높이는 기법은?", "a": "현시기법 / 즉시성과 현시기법", "a2": "현시 기법 (Presence technique) 혹은 즉시성과 현시기법", "e": "비언어적 단서가 부족한 환경을 보완하는 특수 기술입니다.", "b": "2권 p.116"}, {"id": "B4-5-5", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "카플란(Caplan)의 자문 모델 중, 피자문자(교사)의 심리적 어려움이나 객관성 상실을 해결하여 전문성을 높이는 모델은?", "a": "정신건강 모델 / 정신건강 자문 모델", "a2": "정신건강 (자문) 모델", "e": "사례 해결뿐만 아니라 피자문자의 인격적 성장과 자기 인식을 강조하는 모델입니다.", "b": "2권 p.204 · 2권 p.202 · 2권 p.141"}, {"id": "B4-5-7", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "내적 타당도 위협 요인 중, 실험 기간 내에 발생한 예상치 못한 외부 사건이 결과에 영향을 미치는 것은?", "a": "역사", "a2": "역사 (History)", "e": "우연한 사건(사고, 뉴스 등)이 상담의 순수한 효과 분석을 방해하는 경우입니다.", "b": "2권 p.127 · 2권 p.128"}, {"id": "B4-6-3", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "통제집단 학생들이 실험집단에 지지 않으려고 비정상적으로 노력하여 실험 결과를 왜곡시키는 현상은?", "a": "존헨리효과", "a2": "존 헨리 효과 (John Henry effect)", "e": "통제집단에서 나타나는 반응성 효과로, 외적 타당도를 위협합니다.", "b": "2권 p.128 · 2권 p.35"}, {"id": "B4-6-8", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "종합적 학교상담 모델에서 강조하는 학교상담의 3대 내용 영역(Content Areas)은 개인·사회성 발달과 ( ㉠ ) 발달, ( ㉡ ) 발달이다.", "a": "학업 / 진로", "a2": "학업, 진로 — 순서 상관 없음", "e": "학교상담은 일부 학생의 문제 해결을 넘어, 전교생을 대상으로 이 세 영역의 균형 있는 성장을 돕는 교육 프로그램이어야 합니다.", "b": "2권 p.155 · 2권 p.150 · 2권 p.153"}, {"id": "B4-7-1", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "칼라한(Callahan)의 중복모델에서 일시적인 위기 반응이 해소되지 못하고 6주 이상 지속되어 내면의 상처로 고착된 상태는?", "a": "트라우마", "a2": "트라우마 (Trauma)", "e": "6주를 기준으로 Baseline 회복 여부에 따라 위기와 트라우마를 구분하며, 트라우마 단계에서는 전문적인 심리치료가 필요합니다.", "b": "2권 p.170"}, {"id": "B4-7-8", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "비자살성 자해(NSSI)를 지속하게 만드는 핵심 심리 기제(행동주의)로서, 자해를 통해 정서적 고통이 일시적으로 제거되는 현상은?", "a": "부적 강화", "a2": "부적 강화 (Negative Reinforcement)", "e": "혐오스러운 고통(불쾌 자극)이 사라지는 안도감이 자해 행동을 반복하게 만드는 '강화 함정' 역할을 합니다.", "b": "2권 p.192 · 2권 p.191"}, {"id": "B4-7-9", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "DSM-5-TR의 비자살성 자해 진단 기준 중 빈도 준거(Criterion A)는 지난 1년 동안 최소 며칠 이상인가요?", "a": "5 / 5일 / 5일 이상", "a2": "5일 이상", "e": "자살 의도 없이 고의적인 신체 손상을 지난 1년간 5일 이상 가했을 때 진단합니다.", "b": "2권 p.191 · 1권 p.490"}, {"id": "B4-7-10", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "키치너(Kitchener)의 5가지 윤리 원칙 중 내담자의 스스로 결정할 권리를 존중하는 원칙은?", "a": "자율성 존중", "a2": "자율성 존중 (Autonomy)", "e": "상담자는 내담자가 자신의 삶의 방향을 스스로 선택할 수 있도록 정보를 제공하고 지지해야 합니다.", "b": "2권 p.215 · 2권 p.230"}, {"id": "B4-8-1", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "PFA의 8가지 핵심 활동 중 감정적으로 압도당한 생존자의 마음을 가라앉히고 현재에 집중하도록 돕는 활동은?", "a": "안정화 / 안정화 기법", "a2": "안정화 (안정화 기법)", "e": "복식호흡이나 접지 기법 등을 사용하여 생존자의 극심한 심리적 동요를 진정시키는 단계입니다.", "b": "2권 p.180 · 2권 p.179 · 2권 p.182"}, {"id": "B4-8-3", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "심리도식에서 아동기에 상처 입은 장면으로 돌아가 상담자가 개입하여 상황을 재구성하고 감정적 승리를 돕는 기법은?", "a": "심상대화 / 심상 재각본화", "a2": "심상대화 (심상 재각본화)", "e": "과거의 도식을 체험적으로 수정하는 강력한 도구입니다.", "b": "2권 p.94"}, {"id": "B4-8-5", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "프로체스카의 변화 단계 중, 문제 인식은 하나 변화에 대한 '양가감정'이 가장 극심한 단계는?", "a": "숙고 단계", "a2": "숙고 단계 (Contemplation)", "e": "\"할까 말까\" 고민하는 단계로 동기 강화 개입이 가장 효과적인 시기입니다.", "b": "2권 p.96 · 2권 p.51 · 2권 p.23"}, {"id": "B4-8-8", "s": "상담실제 및 학교상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "동기강화상담의 변화 언어 중 결심, 실행 활성화, 실천을 의미하는 약어는?", "a": "CAT", "a2": "CAT (Commitment, Activation, Taking steps), 결심공약/실행 활성화/실천", "e": "준비 언어인 DARN과 실행 언어인 CAT을 구분해야 합니다.", "b": "2권 p.30 · 2권 p.99"}, {"id": "5-1", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 1, "d": "어렵게", "q": "보딘(Bordin)의 정신역동 진로진단 범주 중, 내담자가 자신의 문제를 스스로 책임지고 해결하는 것을 어렵게 느끼며 상담자에게 결정을 맡기려 하는 유형은?", "a": "의존성", "a2": "의존성 (Dependence)", "e": "의존적인 내담자는 스스로 의사결정을 내리는 데 따르는 불안을 피하기 위해 타인에게 의지합니다.", "b": "2권 p.417 · 2권 p.297 · 2권 p.374"}, {"id": "5-2", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 2, "d": "어렵게", "q": "크롬볼츠(Krumboltz)의 진로결정 결과물 중, 자신의 능력이나 흥미에 대해 내담자 스스로 내린 평가(예: \"나는 수학을 못해\")를 뜻하는 용어는?", "a": "자기관찰 일반화", "a2": "자기관찰 일반화", "e": "직업 세계에 대한 믿음은 '세계관 일반화', 자기에 대한 믿음은 '자기관찰 일반화'입니다.", "b": "2권 p.353 · 2권 p.354 · 2권 p.355"}, {"id": "5-3", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 3, "d": "어렵게", "q": "사비카스가 정의한 자아의 3단계 층위 중, 인생의 파편화된 경험들을 관통하는 '의미'를 찾아내어 서사를 통합하는 '저자(Author)'로서의 자기는?", "a": "생애 주제", "a2": "생애 주제 (Life Themes)", "e": "성격 평판은 '배우', 적응 역량은 '주체', 인생의 의미는 '저자'입니다.", "b": "2권 p.384 · 2권 p.386 · 2권 p.342"}, {"id": "5-4", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 4, "d": "쉽게", "q": "윌리엄슨(Williamson)이 제시한 진로진단 4범주 중, 내담자가 흥미를 느끼는 직업이 있으나 그 직업을 가질 능력이 부족하거나, 반대로 적성은 있으나 흥미가 낮은 상황은 흥미와 (      )간의 모순이라고 한다.", "a": "적성 / 객관적 능력", "a2": "적성(객관적 능력)", "e": "내담자의 심리적 특성(흥미)과 객관적 능력(적성)이 일치하지 않는 경우입니다.", "b": "2권 p.417 · 2권 p.305"}, {"id": "5-5", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "윌리엄슨의 특성요인 상담 과정 6단계 중, 수집된 정보를 정리하고 내담자의 특징(장단점)을 요약하여 문제의 원인을 파악하기 전 단계는?", "a": "종합", "a2": "종합 (Synthesis)", "e": "[분석 - 종합 - 진단 - 예측 - 상담 - 추후지도] 순서 중 분석 데이터를 요약하는 단계입니다.", "b": "2권 p.306 · 2권 p.439 · 2권 p.380"}, {"id": "5-6", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "브레이필드(Brayfield)의 직업정보 기능 중, 내담자가 선택한 직업이 자신의 능력이나 현실과 얼마나 부합하는지를 '현실적으로 점검'하도록 돕는 기능은?", "a": "재조정", "a2": "재조정 기능", "e": "이미 선택을 내린 내담자가 그 선택의 타당성을 객관적으로 확인하게 돕는 기능입니다.", "b": "2권 p.307 · 2권 p.308 · 2권 p.268"}, {"id": "5-7", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 7, "d": "어렵게", "q": "행동주의 진로상담에서 '정보 부족'으로 인해 발생하는 일시적 상태인 ( ① )와, 정보가 충분함에도 '성격적 불안'으로 인해 발생하는 만성적 상태인 ( ② )으로 구분된다.", "a": "우유부단 / 무결단성", "a2": "①우유부단 ②무결단성", "e": "전자는 발달 과정의 정상적 상태이며, 후자는 심리적 치료가 병행되어야 하는 상태입니다.", "b": "2권 p.367 · 2권 p.411 · 2권 p.299"}, {"id": "5-8", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 8, "d": "어렵게", "q": "홀랜드의 5가지 주요 개념 중, 육각형 모델에서 두 유형 간의 거리가 가까울수록 공통점이 많다는 것을 의미하는 개념은?", "a": "일관도 / 일관성", "a2": "일관도 (Consistency)", "e": "인접한 유형일수록 일관도가 높으며, 이는 진로 정체성의 안정성과 관련됩니다.", "b": "2권 p.431 · 2권 p.313 · 2권 p.312"}, {"id": "5-9", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 9, "d": "쉽게", "q": "내담자의 RIASEC 프로파일에서 특정 유형의 점수가 다른 유형에 비해 확연히 높게 나타나 성격적 특징이 뚜렷하게 구별되는 정도를 나타내는 지표는?", "a": "변별도 / 변별성", "a2": "변별도 (Differentiation)", "e": "모든 유형의 점수가 비슷하게 평평하면 변별도가 낮다고 봅니다.", "b": "2권 p.431"}, {"id": "5-10", "s": "진로상담", "f": "Ⅰ", "y": "2026", "no": 10, "d": "쉽게", "q": "홀랜드 이론의 주요 개념 중, 개인의 성격 유형과 그가 현재 속해 있거나 희망하는 '환경 유형' 사이의 부합 정도를 의미하는 것은?", "a": "일치성", "a2": "일치성 (Congruence)", "e": "자신의 성격 유형(예: S)과 일치하는 환경(예: S)에서 일할 때 만족도와 성취가 가장 높다는 원리입니다.", "b": "2권 p.313 · 2권 p.309 · 2권 p.312"}, {"id": "16-1", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "다음 중 보딘(Bordin)의 진단체계가 아닌 것을 고르시오.\n\n① 의존성\n② 정보의 부족\n③ 외적 갈등\n④ 선택에의 불안\n⑤ 불확신 유형", "a": "3", "a2": "3 외적 갈등", "e": "보딘(Bordin)의 진단체계는 의존성, 정보의 부족, 자아갈등(내적갈등), 선택에의 불안(진로 선택에 따르는 불안), 불확신 유형(문제가 없음)으로 나뉜다.", "b": "2권 p.297"}, {"id": "16-2", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "다음은 미영(고1,여)이와 진로상담 이후에 나눈 대화이다. 미영이에게 적합한 ‘진로상담 목표’를 쓰시오.\n\n상담교사: 미영아 진로상담 이후에 생각의 변화가 생겼을까?\n미 영: 아직 잘 모르겠어요. 저는 지금과 같은 자본주의 사회에서 가장 중요한 것은 돈이라고 생각해요. 선생님은 제 적성에 어울리는 직업으로 사회복지사를 추천해 주셨지만 저는 돈을 많이 버는 직업을 하고 싶어요. 일은 돈을 버는 수단에 불과하니까 이왕이면 많이 벌면 좋은게 아닐까요?\n\n① 자신에 관한 보다 정확한 이해증진\n② 직업세계에 대한 이해증진\n③ 합리적인 의사결정 능력의 증진\n④ 정보탐색 및 활용능력의 함양\n⑤ 일과 직업에 대한 올바른 가치관 및 태도 형성", "a": "5", "a2": "5 일과 직업에 대한 올바른 가치관 및 태도 형성", "e": "미영이에게 적합한 진로상담의 목표는 ‘일과 직업에 대한 올바른 가치관 및 태도를 형성’하는 것이다. 일은 생애 수단 이상의 의미를 가진다는 점과 일을 갖는 것의 본래의 의미를 깨닫고 올바른 직업관과 직업의식을 가지도록 해야 함.", "b": "2권 p.406"}, {"id": "16-3", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음을 읽고, 행동주의 진로상담의 진단 유형을 쓰시오.\n\n- 정보 획득과 적절한 반응을 할 기회가 부족함\n- 내담자는 선택을 할 수 없거나 실제적이지 못한 선택을 함\n- 내담자의 불안(후행 결과로 인한)을 제거한 후 내담자가 필요로 하는 정보를 찾거나 진로 선택에서 요구되는 반응을 획득할 수 있는 도구적 학습을 경험하도록 함", "a": "우유부단", "a2": "우유부단", "e": "행동주의 진로상담의 진단 유형으로는 크게 우유부단과 무결단성으로 나뉜다.\n우유부단 유형의 원인은 경험이 제한된 데서 기인하는 자아와 일의 세계에 대한 정보의 결핍이다.\n우유부단 유형의 특징은 내담자는 선택할 수 없거나 실제적이지 못한 선택을 한다. 결과적으로 내담자는 진로 발달과업을 숙달하지 못한 것에 대한 불안을 느끼며 이 과정에서의 불안은 우유부단의 선행 원인이 아닌 후행 결과이다.", "b": "2권 p.299"}, {"id": "16-4", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "윌리엄슨의 변별진단 범주 중 다음 사례에서 해당하는 범주를 쓰시오.\n\n나는 수의사가 되기로 결심했다. 그 이유는 동물을 좋아하기 때문이다. 하지만 동물을 좋아한다는 이유만으로 수의사를 선택하는 것이 맞는지 의심이 된다. 동물에 관련된 직업은 수의사가 아니어도 다양하게 있는데.. 수의사는 엄마가 좋아할 것 같기 때문에 그렇게 정한 것이다. 그래서 나는 내 진로에 대해 맞는 길인지 불안하고.. 의심이 되고...", "a": "불확실한 선택", "a2": "불확실한 선택", "e": "윌리엄슨의 변별진단 범주\n진로 무선택\n불확실한 선택\n현명하지 못한 선택\n흥미와 적성 간의 모순", "b": "2권 p.305 · 2권 p.417"}, {"id": "16-5", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "다음은 상담교사가 작성한 고민일기이다. 사례에 해당하는 윌리엄슨(Williamson)의 진단을 쓰시오.\n\n내가 상담하고 있는 학생 중 은명(중2, 남)이는 진로수업도 듣고, 진로상담도 받았다. 하지만, 자신이 무엇을 잘하고, 원하는지, 어떤 직업이 나에게 맞을지 모르겠다고 이야기한다. 아직 꿈을 이루기에는 어린 나이라고 생각하여, 진로 선택에 큰 관심이 없어 보인다. 은명이를 도와주기 위해서는 무엇부터 해야할지, 무엇을 더 개입해야 할지 고민이다.", "a": "진로 무선택", "a2": "진로 무선택", "e": "윌리엄슨의 변별진단의 4가지 범주를 구분하면, 진로 무선택, 불확실한 선택, 현명하지 못한 선택, 흥미와 적성 간의 모순이 있다. 그중 진로 무선택은 공식적 교육, 훈련을 마친 후에 어떤 직업을 갖고 싶은지를 물으면, 내담자는 자신의 선택 의사를 표현할 수 없고 자신이 무엇을 원하는지 모른다고 대답한다.", "b": "2권 p.305"}, {"id": "16-6", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "윌리엄슨(Williamson)의 진로상담 과정을 순서대로 자음을 나열하시오.\n㉠ 내담자의 자료들을 비교하여 문제의 원인들을 탐색한다.\n㉡ 내담자가 고려해야하는 문제를 위한 대안적 조치와 중점사항을 예측한다.\n㉢ 내담자가 바람직한 행동계획을 실행하도록 계속적으로 돕는다.\n㉣ 내담자의 여러 가지 자료들을 주관적·객관적인 방법으로 수집한다.\n㉤ 내담자와 상담자가 협동적으로 상담을 실시한다.\n㉥ 심리검사를 통해 내담자의 자료를 수집하고, 요약한다.", "a": "ㄹㅂㄱㄴㅁㄷ", "a2": "ㄹㅂㄱㄴㅁㄷ", "e": "윌리엄슨의 진로상담 과정\n분석 : 내담자의 여러 가지 자료들을 주관적·객관적인 방법으로 수집한다.\n종합 : 심리검사를 통해 내담자의 자료를 수집하고, 요약한다.\n진단 : 내담자의 자료들을 비교하여 문제의 원인들을 탐색한다.\n예측 : 내담자가 고려해야하는 문제를 위한 대안적 조치와 중점사항을 예측한다.\n상담 및 치료 : 내담자와 상담자가 협동적으로 상담을 실시한다.\n추수지도 : 내담자가 바람직한 행동계획을 실행하도록 계속적으로 돕는다.", "b": "2권 p.306 · 2권 p.303 · 2권 p.408"}, {"id": "16-7", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "다음 중 특성요인 진로상담의 한계점이 아닌 것을 고르시오.\n\n① 직업 선택을 일회적인 행위로 간주하여 장기간에 걸친 인간의 직업적 발달을 도외시한다.\n② 개인의 특성 간 역동성이나 어떤 요인을 우선적으로 고려하느냐에 따라 직업 선택이 달라질 수 있다는 사실을 간과한다.\n③ 개인의 특성과 직업 간 관계를 기술하지만 개인의 특성이 어떻게 발달하는지 설명이 부족하다.\n④ 검사로 밝혀진 결과가 어떤 직업에서의 성공 여부를 정확히 예언하지 못하는 문제가 있다.\n⑤ 성적 편견으로 인해 어떤 유형에서는 여성적인 직업을 배제하거나 많이 나열하는 문제가 있다.", "a": "5", "a2": "5 성적 편견으로 인해 어떤 유형에서는 여성적인 직업을 배제하거나 많이 나열하는 문제가 있다.", "e": "성적 편견으로 인해 어떤 유형에서는 여성적인 직업을 배제하거나 많이 나열하는 문제가 있는 것은 홀랜드 이론의 한계점이다.", "b": "2권 p.308"}, {"id": "16-8", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "다음 중 홀랜드 성격 유형과 그 직업이 올바르게 짝지어진 것을 고르시오.\n\n① 실재형 – 언어학자, 심리학자, 의사\n② 탐구형 – 소방관, 군인, 중장비 기사\n③ 사회형 – 소설가, 연극배우, 미술교사\n④ 진취형 – 변호사, 고위 관리자, 영업사원\n⑤ 관습형 – 사회복지사, 상담교사, 성직자", "a": "4", "a2": "4 진취형 – 변호사, 고위 관리자, 영업사원", "e": "① 실재형 - 전기기사, 소방관, 중장비 기사, 목수, 군인, 운전기사, 운동선수 등\n② 탐구형 - 언어학자, 심리학자 등의 사회과학 분야의 학자, 물리학자나 생물학자 등의 자연과학 분야의 학자, 시장조사나 경영 관련 분석가 등\n③ 사회형 – 사회사업가, 상담가, 간호사, 교사, 성직자 등\n⑤ 관습형 – 회계사, 경리사무원, 의무기록사, 비서, 은행원 등\n+ 예술형 - 음악가, 화가, 디자이너, 소설가, 시인, 영화·연극배우 등", "b": "2권 p.310 · 2권 p.311"}, {"id": "16-9", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "다음을 읽고, 홀랜드(Holland)의 성격이론을 기반으로 A, B에 해당하는 부가적 가정을 쓰시오.\n\n영호(고2, 남)는 자신의 진로에 대해 고민이 있어 위클래스에 방문하였다. <(A)초등학교 때는 경찰이 꿈이었는데, 중학교 때는 성우를 꿈꾸게 되었다고 했다. 하지만 고등학교 올라와서 심리학 책을 읽다가 매력을 느껴 심리학자나 상담 쪽으로 진로를 희망한다고 말했다. 그동안 진로에 대해서는 안정되어 있지 않은 모습이 보였다.> 홀랜드의 흥미검사 결과를 살펴보니 <(B) 사회형, 예술형, 기업형 순으로 높았으며, 성격 유형 간 관련이 있는 것으로 보였다.>", "a": "정체성 / 일관성", "a2": "정체성 / 일관성", "e": "홀랜드 이론의 부가적 가정은 일관성, 변별성, 일치성, 정체성, 계측성이 있다.\n정체성은 개인의 정체성과 환경에 대한 정체성이 얼마나 분명하고 안정되어 있는가를 의미한다.\n일관성은 개인의 성격 유형들 또는 환경 유형들 사이의 관련 정도를 의미하는 것으로, 육각형 모형상의 두 유형 사이의 근접성에 따라 설명된다.", "b": "2권 p.312 · 2권 p.313"}, {"id": "16-10", "s": "진로상담", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "홀랜드(Holland) 직업성격유형론에 관한 설명으로 옳지 않은 것은?\n\n① 관습적 유형(C)은 자료를 체계적으로 잘 처리하고 기록을 정리하는 것을 좋아한다.\n② 진로선택에 있어서 성격적 특성을 중요시하며, 발달과정에 대해서는 설명하지 않는다.\n③ 개인의 성격특성과 직무환경 특성간 일치성이 높을 때 직무만족, 직업성취 수준이 높아질 수 있다.\n④ 실재적이면서 탐구적인 성격유형(RI)은 사회적이면서 관습적인 성격유형(SC)보다 일관성이 낮다.\n⑤ 변별성이 낮은 사람은 진로를 결정하는 데 어려움을 가질 수 있다.", "a": "4", "a2": "4 실재적이면서 탐구적인 성격유형(RI)은 사회적이면서 관습적인 성격유형(SC)보다 일관성이 낮다.", "e": "‘일관성’은 개인의 성격 유형들 또는 환경 유형들 사이의 관련 정도를 의미하는 것으로, 육각형 모형 상의 두 유형 사이의 근접성에 따라 설명된다.", "b": "2권 p.312 · 2권 p.309"}, {"id": "B5-1-1", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "긴즈버그(Ginzberg)가 초기 이론을 수정하며 제시한 개념으로, 진로 선택이 한 번의 타협으로 끝나는 것이 아니라 변화하는 욕구와 환경 사이에서 '최적의 지점'을 지속적으로 찾아가는 동적인 과정은?", "a": "적정화", "a2": "적정화 (Optimization)", "e": "초기의 '비가역성' 개념을 부정하고, 평생에 걸쳐 자아와 환경을 조절해나가는 과정을 강조한 용어입니다.", "b": "2권 p.333 · 2권 p.332 · 2권 p.427"}, {"id": "B5-1-2", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "재니스(Janis)와 맨(Mann)의 갈등 모델에서, 대안 탐색 시간이 부족하다는 압박 때문에 패닉에 빠져 성급하고 부주의한 결정을 내리는 상태는?", "a": "과도한 경계", "a2": "과도한 경계 (Hypervigilance)", "e": "정보 수집을 회피하면 '방어적 회피', 극심한 스트레스로 패닉이 오면 '과도한 경계'입니다.", "b": "2권 p.371"}, {"id": "B5-1-3", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "내담자가 3대에 걸친 가족의 진로 역사와 가치를 시각화하여 자신의 진로 정체성 뿌리를 찾는 질적 기법은?", "a": "진로가계도", "a2": "진로 가계도 (Career Genogram)", "e": "보웬의 가계도를 진로 영역에 응용한 기법입니다.", "b": "2권 p.421 · 2권 p.393"}, {"id": "B5-1-5", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "수퍼(Super)의 이론 중, 외부 환경의 변화나 자아개념의 변화로 인해 이미 거쳐온 이전 단계(주로 탐색기)로 다시 돌아가 발달 과업을 반복하는 현상은?", "a": "재순환", "a2": "재순환 (Recycling)", "e": "수퍼는 이를 퇴행이 아닌 성인기의 건강한 적응 과정으로 보았습니다.", "b": "2권 p.335 · 2권 p.334"}, {"id": "B5-1-6", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "하렌(Harren)의 의사결정 유형 중, 논리적 분석보다는 내면의 감정과 정서적 자각에 의존하여 결정하며, 결과에 대해 스스로 책임을 지려 하는 유형은?", "a": "직관적 유형", "a2": "직관적 유형 (Intuitive)", "e": "타인에게 책임을 전가하면 '의존적', 느낌에 기반하여 스스로 책임지면 '직관적'입니다.", "b": "2권 p.369"}, {"id": "B5-1-8", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "로(Roe)의 부모 양육 유형 중, 자녀를 자기 방식대로 통제하며 자녀의 재능보다는 부모의 성취를 강요하는 유형은?", "a": "과요구형", "a2": "과요구형", "e": "로의 부모 양육 유형은 정서적 집중형(과보호/과요구), 회피형(거부/방임), 수용형(무관심/애정)으로 나뉩니다.", "b": "2권 p.322 · 2권 p.321"}, {"id": "B5-1-9", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "진로 무질서 이론(CTC)의 유인자 중, 예측 불가능한 변화 속에서도 나름의 창조적 질서를 찾아가는 '개방적 체제'의 유인은?", "a": "우연유인 / 우연", "a2": "우연 유인 (Strange Attractor)", "e": "목표(고정), 진동(이분법), 패턴(루틴)은 폐쇄적 유인입니다.", "b": "2권 p.401 · 2권 p.400 · 2권 p.402"}, {"id": "B5-1-10", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "블로흐와 리치먼드의 영성 연결고리 중, 일·여가·관계 사이의 에너지를 적절히 배분하는 양적인 조절을 뜻하는 것은?", "a": "균형", "a2": "균형 (Balance)", "e": "가치와 행동의 질적 어우러짐은 '조화', 에너지의 양적 배분은 '균형'입니다.", "b": "2권 p.405 · 1권 p.102"}, {"id": "B5-2-1", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "기스버(Gysbers) 등이 제시한 저항 유형 중, 내담자가 인생의 중요한 과업을 스스로 결정하는 것을 회피하고 변명거리를 만드는 상태는 (      )지기에 대한 두려움 때문이다.", "a": "책임", "a2": "책임", "e": "상담에 대한 두려움, 책임지기에 대한 두려움, 비합리적 신념이 3대 저항입니다.", "b": "2권 p.415 · 2권 p.286"}, {"id": "B5-2-2", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "갓프레드슨(Gottfredson)의 타협 원칙에 따르면, 진로 장벽에 부딪혀 대안을 포기해야 할 때 사람들이 가장 먼저 포기하는 요소는?", "a": "흥미", "a2": "흥미 (Interests)", "e": "성 유형(성별 적합성)이나 사회적 지위는 자아 정체성의 더 깊은 곳에 위치하므로, 개인적 즐거움인 흥미를 가장 먼저 양보합니다.", "b": "2권 p.346 · 2권 p.349"}, {"id": "B5-2-3", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "직업적응이론에서 '개인의 성격 양식' 중, 개인이 환경에 반응하기까지 걸리는 '반응 속도'를 의미하는 명칭은?", "a": "민첩성", "a2": "민첩성(Celerity)", "e": "민첩성, 속도, 리듬(규칙성), 지속성(지구력)이 개인의 성격 양식 4요소입니다.", "b": "2권 p.316 · 2권 p.270 · 2권 p.318"}, {"id": "B5-2-5", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "사회인지진로이론(SCCT)에서 개인이 어떤 행동을 했을 때 나타날 결과(보상)에 대한 주관적인 추측을 의미하는 변인은?", "a": "결과기대", "a2": "결과기대 (Outcome Expectations)", "e": "\"할 수 있는가\"는 자기효능감, \"하면 무엇을 얻는가\"는 결과기대입니다.", "b": "2권 p.360 · 2권 p.359 · 2권 p.361"}, {"id": "B5-2-6", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "다위스와 로프퀴스트(Dawis & Lofquist)가 정의한 개념 중, 개인의 욕구가 직업 환경에 의해 충족되었을 때 느끼는 주관적 상태는?", "a": "만족", "a2": "만족 (Satisfaction)", "e": "개인이 느끼면 '만족', 환경(회사)이 내담자의 능력을 보고 느끼면 '충족(Satisfactoriness)'입니다.", "b": "2권 p.319 · 2권 p.315"}, {"id": "B5-4-1", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "적응 양식(Adjustment Style) 중, 환경과 자신의 불일치를 참아내는 한계점인 ( ① )과, 불일치를 해결하기 위해 환경을 변화시키려 노력하는 ( ② )를 쓰시오.", "a": "유연성 / 적극성", "a2": "① 유연성(Flexibility), ② 적극성(Activeness)", "e": "유연성은 견디는 힘이고, 적극성은 환경을 나에게 맞게 고치려는 태도입니다.", "b": "2권 p.319 · 2권 p.270"}, {"id": "B5-4-2", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "직업관계이론에서 관계가 진로에 미치는 영향 중, 관계 그 자체가 진로 결정의 동기나 목적이 되는 내적 관계의 성격은?", "a": "내재성", "a2": "내재성", "e": "관계가 목적이면 '내재성', 관계가 진로 성공을 위한 수단이나 자원이면 '상호성'입니다.", "b": "2권 p.330 · 2권 p.329 · 2권 p.328"}, {"id": "B5-4-3", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "샘슨(Sampson) 등의 분류 중, 자신의 선택이 잘 되었는지 확인받고 싶어 하거나 선택을 이행하는 데 도움이 필요하지만 성격적 병리는 없는 유형은?", "a": "진로 결정자", "a2": "진로 결정자 (The Decided)", "e": "결정자, 미결정자(발달적), 우유부단형(성격적 불안)으로 나뉩니다.", "b": "2권 p.418 · 2권 p.410 · 2권 p.378"}, {"id": "B5-4-4", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "국가직무능력표준(NCS)에서 모든 직업인이 공통으로 갖추어야 할 10가지 기본 능력을 무엇이라 하는가?", "a": "직업기초능력", "a2": "직업기초능력", "e": "직업기초능력은 의사소통, 수리, 문제해결, 자기개발, 자원관리, 대인관계, 정보, 기술, 조직이해, 직업윤리입니다.", "b": "2권 p.448 · 2권 p.292 · 2권 p.449"}, {"id": "B5-4-5", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "크롬볼츠가 제시한 '계획된 우연 기술' 5가지 중, \"상황 변화에 맞춰 자신의 태도와 계획을 바꿀 수 있는 능력\"은?", "a": "융통성", "a2": "융통성 (Flexibility)", "e": "호기심, 인내, 융통성, 낙관성, 위험 감수가 5대 기술입니다.", "b": "2권 p.355 · 2권 p.277 · 2권 p.403"}, {"id": "B5-4-6", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "긴즈버그(Ginzberg)의 진로발달단계는 ( 1 ) - ( 2 ) - 현실기이다.", "a": "환상기 / 잠정기", "a2": "환상기, 잠정기", "e": "긴즈버그의 진로발달단계는 환상기-잠정기-현실기이다.", "b": "2권 p.332 · 2권 p.333"}, {"id": "B5-4-7", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "필립스가 제시한 '타인 관여 행동(Actions of Others)'의 7단계 중, 타인이 내담자에게 특정 직업을 선택하도록 일방적으로 지시하거나 명령하는 방식은?", "a": "지도", "a2": "지도 (Guidance)", "e": "[비평 - 지도 - 권유 - 대안 제공 - 정보 제공 - 무조건적 지지 - 소극적 지지] 중 타인의 개입 수준이 매우 높은 단계입니다.", "b": "2권 p.327 · 2권 p.272"}, {"id": "B5-4-8", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "웨스트우드(Westwood) 등의 취업 로드맵 4단계 중, 이미 직업을 선택한 내담자가 실제 업무 현장에서 상사나 동료와의 관계를 관리하고 적응해 나가는 단계는?", "a": "일자리 유지 / 일자리 유지 기술", "a2": "일자리 유지 (Job Maintenance Skills)", "e": "로드맵은 [탐색/결정 - 기술 연마 - 일자리 찾기 - 일자리 유지]로 구성됩니다.", "b": "2권 p.410"}, {"id": "B5-4-9", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "빙엄과 워드의 소수민 여성 모형 중, 가족·종교·법적 지위 등이 내담자의 선택에 미치는 영향을 분석하는 단계는 (      )들의 영향 평가 단계이다. 빈칸에 들어갈 단어를 쓰시오.", "a": "문화적 변인 / 문화 변인", "a2": "문화적 변인들의 영향 평가 (3단계)", "e": "2단계는 진로 이슈 확인, 3단계는 그 배경이 되는 문화적 변인 평가(사정)입니다.", "b": "2권 p.395"}, {"id": "B5-5-5", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "스트롱(Strong) 직업흥미검사 II의 개인특성척도(PSS) 중, 혼자 일하는 것보다 사람과 관련된 활동을 선호하는 경향을 나타내는 척도는?", "a": "업무 유형", "a2": "업무 유형 (Work Style)", "e": "업무 유형, 학습 환경, 리더십 스타일, 위험 감수, 팀 지향이 5대 PSS 척도입니다.", "b": "2권 p.434 · 2권 p.433"}, {"id": "B5-5-7", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "생애 진로 사정(LCA)의 4가지 구조 중, 하루 동안의 생활을 어떻게 조직하는지를 통해 독립성과 체계성을 파악하는 영역은?", "a": "일상적인 날", "a2": "일상적인 날 (Typical Day)", "e": "진로사정, 일상적인 날, 강점과 장애, 요약이 4대 구조입니다.", "b": "2권 p.441"}, {"id": "B5-5-8", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "생애설계 상담 과정 중, 내담자를 억누르는 사회적 고정관념이나 부정적 자아상을 의심하고 비워내는 단계는?", "a": "해체", "a2": "해체 (Deconstruction)", "e": "구성을 통해 이야기를 모으고, 해체를 통해 틀을 깨며, 재구성을 통해 줄거리를 잡습니다.", "b": "2권 p.385"}, {"id": "B5-5-9", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "브라운(Brown)의 모델에 따르면, 행동을 끝까지 유지시키고 선택을 정당화하는 가장 강력한 결정 요인은?", "a": "가치", "a2": "가치 (Values)", "e": "흥미는 단기적 선호일 뿐, 가치가 정보처리와 행동의 합리화를 주도한다고 봅니다.", "b": "2권 p.399"}, {"id": "B5-6-2", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "수퍼의 탐색기 발달과업 중, 자신의 흥미와 가치를 고려하여 '광범위한 진로 분야'에 대한 선호를 형성하는 ( ① ) 과업과, 특정 직업 하나를 최종 결정하는 ( ② ) 과업을 구분하시오.", "a": "결정화 / 구체화", "a2": "① 결정화 (Crystallization), ② 구체화 (Specification)", "e": "결정화는 분야의 선택이고, 구체화는 특정 직업의 확정입니다.", "b": "2권 p.336 · 2권 p.394 · 2권 p.341"}, {"id": "B5-6-8", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "SCCT에서 내담자가 능력은 충분하지만 낮은 자기효능감이나 부정적 결과기대 때문에 너무 일찍 포기해버린 직업 목록을 다시 검토하는 개입 전략은?", "a": "제외된 진로 대안 확인", "a2": "제외된 진로 대안 확인 (Identifying Foreclosed Options)", "e": "변형된 직업카드 분류법 등을 통해 가능성을 확장하는 전략입니다.", "b": "2권 p.365"}, {"id": "B5-7-1", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "라슨(Larson)의 미결정 하위 유형 중, 진로 계획 행위에 대한 충분한 정보를 가지고 있으나 자신을 부정적으로 지각하여 결정을 못 하는 유형은?", "a": "정보를 가진 우유부단형", "a2": "정보를 가진 우유부단형 (Informed Indecisive)", "e": "계획 없는 회피형은 정보 수집 계획 자체가 없는 상태입니다.", "b": "2권 p.414 · 2권 p.286 · 2권 p.418"}, {"id": "B5-7-2", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "코크런이 제시한 개념으로, 내담자가 결정을 내리지 못하고 방황하는 상태가 오히려 새로운 의미를 찾는 '능동적 탐색'임을 뜻하는 용어는?", "a": "흔들림", "a2": "흔들림 (Wavering)", "e": "흔들림은 병리가 아니라 정체성 형성을 위한 건강한 과정으로 해석됩니다.", "b": "2권 p.390"}, {"id": "B5-8-1", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "미첼과 비치의 (      ) 모델에서, 어떤 선택의 합리성을 계산할 때 '성공 확률'과 '성공의 가치'뿐만 아니라 실패할 확률과 실패했을 때의 비효용(아픔/손실)을 함께 고려해야 한다.", "a": "주관적 기대효용", "a2": "주관적 기대효용", "e": "SEU = (P × U) + (1-P) × (-U) 공식을 통해 손실 리스크까지 계산에 넣습니다.", "b": "2권 p.372 · 2권 p.280 · 2권 p.373"}, {"id": "B5-8-4", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "크리츠의 진로성숙도검사(CMI) 태도 척도 5요인 중, 선호하는 진로 방향에 대한 확신 정도를 의미하는 요인은?", "a": "결정성", "a2": "결정성 (Decisiveness)", "e": "결·참·독·성·타(결정성, 참여도, 독립성, 성향, 타협성)가 태도 척도입니다.", "b": "2권 p.428"}, {"id": "B5-8-5", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "직업적응이론의 '환경 양식' 중, 환경이 개인에게 요구하는 기술이나 과업을 얼마나 오랫동안 유지하도록 하는가와 관련된 요인은?", "a": "지속성", "a2": "지속성 (Endurance)", "e": "환경이 요구하는 반응을 얼마나 오래 지속하는지를 측정합니다.", "b": "2권 p.318 · 2권 p.316 · 2권 p.315"}, {"id": "B5-8-7", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "코크런의 7가지 에피소드 중, 상담실 밖에서 실제 현장을 방문하거나 인턴십 등을 통해 미래 역할을 미리 체험해보는 단계는?", "a": "역할 실연하기 / 역할 실연하기 단계 / 역할 실연", "a2": "역할 실연하기 (Role-playing)", "e": "실재 구성(정보 수집)과 역할 실연(직접 체험)을 구분하는 것이 핵심입니다.", "b": "2권 p.394 · 2권 p.391"}, {"id": "B5-8-9", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "진로사고검사(CTI)의 3요소 중, 자신의 의견과 부모님 등 타인의 기대 사이에서 갈등을 겪느라 결정을 내리지 못하는 정도를 뜻하는 척도는?", "a": "외적 갈등", "a2": "외적 갈등 (External Conflict, EC)", "e": "DMC는 시작의 혼란, CA는 결단의 불안, EC는 관계적 압박을 의미합니다.", "b": "2권 p.378"}, {"id": "B5-9-1", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "필립스(Phillips)의 사례개념화 5가지 주제 중, 내담자가 자신의 능력을 파악하고 어떤 분야를 원하는지 등 '진로를 향한 첫 발'을 떼는 단계는 (      )과 발견이다.", "a": "자기탐색", "a2": "자기탐색", "e": "[자기탐색과 발견 - 선택준비 - 의사결정 - 선택과 결정 - 실천] 중 첫 번째 단계입니다.", "b": "2권 p.409 · 2권 p.417"}, {"id": "B5-9-3", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "진로 적응도 4차원(4Cs) 중 \"내 진로의 주인은 나이며, 내가 결정하고 책임지겠다\"는 주도성을 의미하는 차원은?", "a": "진로통제", "a2": "진로 통제 (Control)", "e": "관심(미래 계획), 통제(주도성), 호기심(탐색), 자신감(효능감)입니다.", "b": "2권 p.383"}, {"id": "B5-9-4", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "CIP의 영역 피라미드 중 최상위에 위치하며, 하위 영역의 정보처리를 감시하고 조절하는 '중앙 제어장치' 역할을 하는 영역의 명칭은?", "a": "실천과정 영역 / 실행처리 영역", "a2": "실천과정 영역", "e": "자기독백, 자기자각, 모니터링과 통제를 통해 의사결정 과정을 관리합니다.", "b": "2권 p.375 · 2권 p.280"}, {"id": "B5-9-9", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "밀러-타이드만이 제시한 개념으로, 사회적 통념이나 타인의 기대가 아닌 '나 자신의 주관적 경험과 직관'에 근거한 진실은?", "a": "사적 현실", "a2": "사적 현실 (Personal Reality)", "e": "공적 현실(세상의 목소리)보다 사적 현실(자신의 목소리)을 신뢰하는 것이 상담 목표입니다.", "b": "2권 p.405 · 2권 p.284"}, {"id": "B5-9-10", "s": "진로상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "CASVE 주기 중, 자신의 경험과 직업 정보를 '연결'하여 진로 문제가 발생한 원인을 탐색하는 단계는?", "a": "분석", "a2": "분석 (Analysis)", "e": "단순히 문제를 느끼는 '의사소통' 단계를 넘어, 자기지식과 직업지식을 대조하는 인지 활동입니다.", "b": "2권 p.375 · 2권 p.377 · 2권 p.378"}, {"id": "6-1", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 1, "d": "쉽게", "q": "전통적인 인과관계가 '원인-결과'의 직선적 방향을 갖는다면, 가족원들이 서로 영향을 주고받으며 원인이 결과가 되고 결과가 다시 원인이 되는 이 역동적인 인과관계의 명칭은?", "a": "순환적 인과관계", "a2": "순환적 인과관계 (Circular Causality)", "e": "가족 내의 문제는 어느 한 사람의 잘못(원인)이라기보다 구성원 간의 끊임없는 상호작용의 결과로 파악해야 합니다.", "b": "2권 p.493 · 2권 p.499 · 2권 p.491"}, {"id": "6-2", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 2, "d": "어렵게", "q": "가족 체계 내에서 특정 과업을 수행하기 위해 형성되는 하위 단위들(부부, 부모, 형제 등) 사이의 정보 흐름을 조절하는 심리적 장벽은?", "a": "경계선", "a2": "경계선 (Boundaries)", "e": "경계선은 명료한 경계(건강), 밀착된 경계(모호), 유리된 경계(경직)로 구분됩니다.", "b": "2권 p.549 · 2권 p.547 · 2권 p.546"}, {"id": "6-3", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 3, "d": "쉽게", "q": "체계가 일탈을 감지했을 때 이를 수정하여 원래의 안정된 상태로 돌아가게 하는 피드백은 ( ① )이고, 초기 일탈을 더욱 가속화하고 증폭시켜 체계의 변화를 유도하는 피드백은 ( ② )이다.", "a": "부적 피드백 / 정적 피드백", "a2": "① 부적 피드백 (Negative Feedback), ② 정적 피드백 (Positive Feedback)", "e": "부적 피드백은 '항상성'을 유지하고, 정적 피드백은 체계의 '변화'나 '파국'을 가져옵니다.", "b": "2권 p.494 · 2권 p.498 · 2권 p.558"}, {"id": "6-4", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "가족 체계가 외부 환경의 변화에도 불구하고 기존의 평형 상태를 유지하려는 성질인 ( ① )와, 발달 단계나 위기에 대응하여 자신의 구조를 근본적으로 변화시키려는 능력인 ( ② )를 구분하시오.", "a": "항상성 / 변형성", "a2": "① 항상성 (Homeostasis), ② 변형성 (Morphogenesis)", "e": "건강한 가족은 상황에 따라 안정(항상성)과 변화(변형성)의 적절한 균형을 유지합니다.", "b": "2권 p.495 · 2권 p.499 · 2권 p.496"}, {"id": "6-5", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "서로 다른 시작점(원인)에서 출발했더라도 상호작용 과정을 거쳐 같은 결과에 도달하는 원리를 (      )이라 하고, 같은 원인에서 시작했으나 체계의 역동에 따라 전혀 다른 결과가 나타나는 원리를 ‘동일 잠재성’이라 한다.", "a": "동일 결과성", "a2": "동일결과성 (Equifinality)", "e": "이 원리는 상담자로 하여금 과거의 '원인'보다 현재의 '상호작용 과정'에 집중하게 만듭니다.", "b": "2권 p.499"}, {"id": "6-6", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "가족 구성원 사이의 상호작용을 지배하는 보이지 않는 합의나 규범을 '가족규칙'이라 한다. 이때 가족규칙 자체를 어떻게 변화시킬 것인가에 대한 지침이자 '규칙을 지배하는 규칙'을 무엇이라 하는가?", "a": "상위규칙", "a2": "상위규칙 (Meta-rules)", "e": "역기능적 가족은 상황이 변해도 규칙을 바꿀 수 없게 만드는 경직된 상위규칙을 가진 경우가 많습니다.", "b": "2권 p.603 · 2권 p.557"}, {"id": "6-7", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "하위체계 간의 정보 유입과 유출을 조절하는 심리적 칸막이를 '경계선'이라 한다. 구성원 간의 독립성이 지나쳐 소외된 상태를 (      ) 경계선이라 하고, 지나치게 엉켜서 자율성이 없는 상태를 밀착된(모호한) 경계선이라 한다.", "a": "경직된", "a2": "경직된 (Rigid)", "e": "건강한 가족은 소속감과 개별성이 조화를 이루는 '명료한 경계선'을 가집니다.", "b": "2권 p.548 · 2권 p.498 · 2권 p.545"}, {"id": "6-8", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 8, "d": "어렵게", "q": "바츨라비크(Watzlawick)에 따르면 모든 대화는 정보를 전달하는 ( ① ) 차원과, 상대방에게 일정한 행동을 요구하거나 관계의 성격을 규정하는 ( ② ) 차원으로 구성된다.", "a": "내용 / 관계", "a2": "① 내용 (Content), ② 관계 (Relationship)", "e": "갈등 중인 가족은 말의 내용보다는 그 이면의 '관계적 메시지' 때문에 싸우는 경우가 많습니다.", "b": "2권 p.502 · 2권 p.555"}, {"id": "6-9", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 9, "d": "어렵게", "q": "상호작용하는 사람 중 누가 먼저 시작했느냐에 대해 각자가 내리는 주관적인 시작점의 정의를 (      )이라 한다. 이것이 서로 다를 때 \"네가 그러니까 내가 이랬지\" 식의 끝없는 싸움이 발생한다.", "a": "구두점의 원리", "a2": "구두점의 원리 (Punctuation)", "e": "상담자는 가족이 각자의 구두점을 찍는 방식이 순환적인 고리의 일부임을 깨닫게 해야 합니다.", "b": "2권 p.502 · 2권 p.503 · 2권 p.470"}, {"id": "6-10", "s": "가족상담", "f": "Ⅰ", "y": "2026", "no": 10, "d": "쉽게", "q": "대화 그 자체에 대해 나누는 대화로서, 현재 우리가 어떻게 소통하고 있는지, 방금 한 말의 의도가 무엇인지 등을 점검하는 기술은?", "a": "메타대화", "a2": "메타대화 (Meta-communication)", "e": "메타대화는 의사소통의 오류를 수정하고 관계의 정의를 명료화하는 핵심 도구입니다.", "b": "2권 p.504"}, {"id": "17-1", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "(      )은/는 체계에서 일어난 행동은 순환적으로 영향을 미침으로써 순환적인 결과를 일으키므로 원인과 결과를 정확하게 찾거나 구분 지을 수 없다고 보았다.", "a": "순환적 인과관계", "a2": "순환적 인과관계", "e": "직선적 인과관계는 어떤 결과에 선행하는 사건이 있고, 결과가 문제라면, 선행사건(원인)을 찾아 교정하면 된다고 가정한다.\n순환적 인과관계는 체계에서 일어난 행동은 순환적으로 영향을 미침으로써 순환적인 결과를 일으키므로 원인과 결과를 정확하게 찾거나 구분 지을 수 없으며, 따라서 증상이나 문제도 특정한 원인에 의해 일어나는 것이 아니라 행동과 반응의 연속선상에 존재한다.", "b": "2권 p.499"}, {"id": "17-2", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "일반체계이론의 주요 개념 중 피드백에는 ( ㄱ )과 ( ㄴ )이 있다. ( ㄱ )은 체계의 안정적인 상태를 거부하고 변화하려는 방향으로서의 피드백이다. ( ㄴ )은 체계가 변화나 일탈을 거부하고 안정성을 유지하는 방향으로서의 피드백이다.", "a": "정적 피드백 / 부적 피드백", "a2": "정적 피드백 / 부적 피드백", "e": "피드백은 체계가 어떤 과정이나 행동의 결과에 대한 정보를 그 근원에 전달하는 과정으로, 체계의 자기조절 기제를 나타낸다. 체계는 피드백 과정을 통해 본연의 정체성을 유지할 수 있다.\n<정적 피드백과 부적 피드백>\n- 정적 피드백: 체계의 안정적인 상태를 거부하고 변화하려는 방향으로서의 피드백이다.\n- 부적 피드백: 체계가 변화나 일탈을 거부하고 안정성을 유지하는 방향으로서의 피드백이다.", "b": "2권 p.498"}, {"id": "17-3", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "일반체계이론에서 (      )은/는 가족체계가 어떤 파괴 상황에 직면할 때 변화에 저항하고, 이전의 균형 상태로 돌아가려는 가족의 보수적인 성향을 말한다.", "a": "가족항상성", "a2": "가족항상성", "e": "항상성은 체계가 환경의 영향을 통제하고 일관성을 유지하려는 경향이며, 가족항상성은 가족체계가 어떤 파괴 상황에 직면할 때 변화에 저항하고 이전의 균형 상태로 돌아가려는 가족의 보수적인 성향을 말한다.", "b": "2권 p.499"}, {"id": "17-4", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "대상관계 가족상담에서 ‘’는 외부 환경이나 대상의 특성과 관계 경험을 자기 내부로 받아들여 자기의 특성으로 변형시키는 심리적인 기제이다. 그 과정 중 외부에 있는 어떤 대상이 유아의 내면세계로 들어오는 것을 ‘’라고 한다.", "a": "내면화 / 내사", "a2": "내면화 / 내사", "e": "‘내면화’는 외부 환경이나 대상의 특성과 관계 경험을 자기 내부로 받아들여 자기의 특성으로 변형시키는 심리적인 기제이다. 내면화는 함입, 내사, 동일시, 통합의 과정을 거친다.", "b": "2권 p.513"}, {"id": "17-5", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "보스조르메니-내지(Boszormenyi-Nagy)의 맥락적 가족상담에서 자녀가 자기도 모르는 사이에 자신이 싫어하는 부모의 역할을 따라 하는 경우를 ‘’이라고 하며, 아이가 한 부모에 대한 충성심을 희생하면서 다른 한 부모에게 충성을 다하는 것을 ‘’이라고 한다.", "a": "보이지 않는 충성심 / 분열된 충성심", "a2": "보이지 않는 충성심 / 분열된 충성심", "e": "‘보이지 않는 충성심’은 자녀가 자기도 모르는 사이에 자신이 싫어하는 부모의 역할을 따라 하는 경우이다.\n‘분열된 충성심’은 아이가 한 부모에 대한 충성심을 희생하면서 다른 한 부모에게 충성을 다하는 것이다.", "b": "2권 p.519"}, {"id": "17-6", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "맥락적 가족상담에서 ‘역기능적 가족현상’이 아닌 것을 고르시오.\n\n① 부모화\n② 정서적 단절\n③ 보이지 않는 충성심\n④ 회전판\n⑤ 분열된 충성심", "a": "2", "a2": "2 정서적 단절", "e": "맥락적 가족상담에서 역기능적 가족현상에는 부모화, 분열된 충성심, 보이지 않는 충성심, 회전판이 있다.\n② 정서적 단절은 보웬의 다세대 가족상담의 개념이다.", "b": "2권 p.473 · 2권 p.519"}, {"id": "17-7", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "보웬(M. Bowen)의 가족상담이론의 개념으로 옳은 것은?\n① 가족게임\n② 실연화\n③ 권력과 통제\n④ 하위체계\n⑤ 핵가족 정서체계", "a": "5", "a2": "5 핵가족 정서체계", "e": "보웬의 주요개념\n-분화\n-삼각관계\n-핵가족정서체계\n-가족투사과정\n-다세대전수과정\n-정서적단절", "b": "2권 p.523 · 2권 p.507 · 2권 p.473"}, {"id": "17-8", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "① 핵가족 정서체계란 개인이 원가족으로부터 학습한 방식으로 타인과 관계를 맺고 결혼 선택을 통해 가족의 정서적인 긴장을 다세대에 걸쳐 반복하는 것으로 배우자의 역기능, 만성적 결혼갈등, 자녀 역기능 등의 결과가 발생할 수 있다.\n② 가족투사과정이란 부부의 불안이 증가될 때 자신들의 미분화된 정서문제를 자녀에게 투사하는 것으로서 부모의 자아 분화 수준이 다른 세대로 전수되는 것이라고도 볼 수 있다.\n③ 분화는 감정과 사고를 분리하는 개인내적분화와 자신과 타인을 구분하는 대인관계적인 분화가 있으며, 분화되지 못한 사람은 융해될 가능성이 높다.\n④ 자아의 과대 기능은 다른 사람의 기대를 충족하고자 부지런히 움직이고 아낌없는 희생을 하는 것으로 자기 분화 수준이 높은 상태이며, 과소기능은 문제를 드러내며 다른 사람의 요구에 반응하는 것을 버거워하는 자기 분화수준이 낮은 상태를 의미한다.\n⑤ 다세대 전수과정은 원가족의 불안, 자아 분화 수준, 관계 특성이 전세대에서 후세대로 유사하게 이어져 내려오는 과정을 의미한다.", "a": "4", "a2": "4 자아의 과대 기능은 다른 사람의 기대를 충족하고자 부지런히 움직이고 아낌없는 희생을 하는 것으로 자기 분화 수준이 높은 상태이며, 과소기능은 문제를 드러내며 다른 사람의 요구에 반응하는 것을 버거워하는 자기 분화수준이 낮은 상태를 의미한다.", "e": "과대기능과 과소기능을 하는 구성원은 모두 자아분화 수준이 높지 않다.\n‘과대 기능’은 다른 사람의 기대를 충족하고자 부지런히 움직이고 아낌없는 희생을 하는 것이고, ‘과소 기능’은 문제를 드러내며 다른 사람의 요구에 반응하는 것을 버거워하는 것이다. 둘 다 자아분화 수준이 높지 않은 상태이다.", "b": "2권 p.521 · 2권 p.523"}, {"id": "17-9", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "아래의 예시에서 사용하고 있는 다세대 가족상담의 ‘상담기법’을 쓰시오.\n\n-가족체계 안에서 자신의 역할을 이해하고 문제의 맥락을 명료하게 사고하도록 한다.\n- 감정을 가라앉히고 정서적 반응에 의해 유발된 불안을 낮추도록 질문한다.\n- 부부의 논쟁이 심한 경우, 상담자는 중립적인 태도로 각자의 생각에 초점을 맞추도록 한다.\n- 가족원이 문제를 어떻게 지각하고 관계유형에 어떤 방식으로 참여하였는지 질문한다.", "a": "과정질문", "a2": "과정질문", "e": "과정질문에 대한 설명이다.", "b": "2권 p.526"}, {"id": "17-10", "s": "가족상담", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "㉠, ㉡에 알맞은 단어를 각각 쓰시오.\n사티어(V. Satir)는 인간의 내면을 개인의 빙산에 비유하면서 겉으로 드러나는 행동이나 말은 빙산의 일각이며 내면은 ‘감정-감정에 대한 감정-(㉠)-기대-(㉡)-자기’의 순서로 이루어진다고 하였다.", "a": "지각 / 열망", "a2": "지각 / 열망", "e": "빙산기법은, 행동-감정-감정에 대한 감정-지각-기대-열망-자기 순으로 탐색과정이 이루어진다.", "b": "2권 p.536"}, {"id": "B6-1-1", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "이야기 치료에서 내면화된 문제를 인격화(의인화)하여 개인의 정체성과 분리함으로써, 내담자와 문제 사이에 공간을 만드는 기법은?", "a": "문제의 외재화", "a2": "문제의 외재화 (Externalization)", "e": "\"나는 우울하다\"를 \"우울이라는 녀석이 나를 방해한다\"로 바꿈으로써 내담자의 수치심을 줄이고 주체성을 회복합니다.", "b": "2권 p.582"}, {"id": "B6-1-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "리츠(Lidz)가 제시한 부부 관계 패턴 중, 부부가 서로 주도권을 쥐려 치열하게 싸우며 만성적인 불화를 겪는 상태를 ( ① )이라 하고, 한쪽 배우자가 너무 지배적이어서 다른 쪽이 수동적으로 굴복하며 기이한 균형을 이룬 상태를 ( ② )이라 한다.", "a": "부부 균열 / 부부 불균형", "a2": "① 부부 균열 (Marital Schism), ② 부부 불균형 (Marital Skew)", "e": "이러한 부적응적 부부 관계는 자녀를 갈등의 희생양으로 만들 위험이 큽니다.", "b": "2권 p.505 · 2권 p.471"}, {"id": "B6-1-4", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "내담자의 대안적 이야기를 경청하고 이를 자신의 삶과 연결하여 다시 말해줄 '외부 증인'을 초대하여 새로운 정체성을 사회적으로 확증하는 의식은?", "a": "정의 예식", "a2": "정의 예식 (Definitional Ceremony)", "e": "인정을 위한 다시 말하기(Retelling) 과정을 통해 내담자의 선호하는 이야기에 생명력을 불어넣습니다.", "b": "2권 p.586 · 2권 p.587"}, {"id": "B6-1-5", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "보스조르메니-내지(Nagy)가 제시한 4가지 관계 차원 중, 신뢰, 충성심, 공정성 등 상담의 핵심 지표가 되는 가장 중요한 차원은?", "a": "관계윤리", "a2": "관계 윤리 (Relational Ethics)", "e": "맥락적 상담은 사실, 심리, 교류 차원을 넘어 '공정성'이라는 윤리적 차원을 중시합니다.", "b": "2권 p.516 · 2권 p.517 · 2권 p.473"}, {"id": "B6-1-7", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "한 가족원에게 다른 가족원들 사이의 관계나 상호작용에 대해 묻는 질문으로, 선형적 사고를 깨뜨리고 체계를 객관화하는 질문법은?", "a": "순환질문", "a2": "순환 질문 (Circular Questioning)", "e": "타인의 시선을 빌려와 가족의 보이지 않는 역동과 관계의 지도를 스스로 그리게 돕는 강력한 기술입니다.", "b": "2권 p.555 · 2권 p.564 · 2권 p.624"}, {"id": "B6-1-8", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "클라우스와 케널의 장애 아동 부모 수용과정 중, 진단을 거부하며 여러 병원을 전전하여 오진임을 확인받으려 하는 의사쇼핑을 하는 단계의 명칭을 쓰시오.", "a": "부인", "a2": "부인(Denial)", "e": "2단계인 '부인(Denial)' 단계에서 나타나는 전형적인 행동적 특징입니다.", "b": "2권 p.630 · 2권 p.489"}, {"id": "B6-1-9", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "원가족과의 접촉에서 발생하는 극심한 불안을 피하기 위해 부모와 물리적·심리적으로 접촉을 끊어버리는 행위는?", "a": "정서적 단절", "a2": "정서적 단절 (Emotional Cutoff)", "e": "단절은 독립이 아닌 미분화의 또 다른 모습이며, 새로운 관계에서 원가족의 문제를 재연할 가능성을 높입니다.", "b": "2권 p.524"}, {"id": "B6-2-1", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "힐(Hill)의 ABC-X 모델에서 'C'가 의미하는 것은 사건에 대한 (      )이다.", "a": "인지", "a2": "인지(인지적 해석)", "e": "똑같은 사건이라도 가족이 이를 '파국'으로 보느냐 '성장의 기회'로 보느냐에 따라 위기(X) 여부가 결정됩니다.", "b": "2권 p.592 · 2권 p.482"}, {"id": "B6-2-3", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "해결중심 상담의 피드백 메시지 구성 요소 중, 내담자가 바라는 결과와 상담자가 제안하는 과제 사이를 논리적으로 잇는 부분은?", "a": "연결문", "a2": "연결문 (Bridge)", "e": "[칭찬-연결문-과제]의 구조를 통해 내담자가 왜 그 숙제를 해야 하는지 납득하게 돕는 다리 역할을 합니다.", "b": "2권 p.577 · 2권 p.480 · 2권 p.578"}, {"id": "B6-2-4", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "내면화 과정 중, 타인의 닮고 싶은 부분을 주체적으로 선택하여 자신의 특성으로 받아들이는 고차원적인 단계는?", "a": "동일시", "a2": "동일시 (Identification)", "e": "함입(통째로 삼킴), 내사(스탬프처럼 박힘)보다 능동적이고 자율적인 내면화 과정입니다.", "b": "2권 p.514 · 2권 p.513"}, {"id": "B6-2-5", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "비버즈(Beavers) 체계 모델에서 가족의 에너지가 외부 세계를 향하며, 자녀를 조기에 밖으로 내보내려는 성향을 가진 가족 유형은?", "a": "원심성 / 원심성 가족", "a2": "원심성 가족 (Centrifugal Family)", "e": "내부로 뭉치려 하고 외부를 불신하면 '구심성', 외부 활동을 즐기고 분리가 빠르면 '원심성'입니다.", "b": "2권 p.484 · 2권 p.608"}, {"id": "B6-2-6", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "윈(Wynne)이 제시한 개념으로, 겉으로는 매우 화목해 보이지만 실제로는 갈등과 분노를 억압하고 있어 성장을 방해하는 가짜 친밀감의 상태는?", "a": "거짓 상호성", "a2": "거짓 상호성 (Pseudo-mutuality)", "e": "이 상태의 가족은 변화를 위협으로 간주하여 경직된 평화를 유지하려 합니다.", "b": "2권 p.506"}, {"id": "B6-2-7", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "밤사이에 기적이 일어나서 지금 고민하는 문제가 다 해결되었다고 가정하고, 아침에 눈을 떴을 때 무엇을 보고 기적이 일어난 걸 알 수 있는지 묻는 질문 기법은?", "a": "기적질문", "a2": "기적 질문 (Miracle Question)", "e": "문제가 해결된 상태를 구체적으로 상상하게 함으로써 막연한 소망을 행동적인 목표로 바꾸는 역할을 합니다.", "b": "2권 p.575 · 2권 p.574"}, {"id": "B6-2-8", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "이혼가족 상담에서 자녀가 부모 중 누구의 편을 들어야 할지 갈등하며 어느 쪽을 지지해도 다른 쪽을 배신하는 것 같은 고통을 느끼는 현상은?", "a": "충성 갈등 / 충성심 갈등", "a2": "충성 갈등 혹은 충성심 갈등 (Loyalty Conflict)", "e": "부모 사이의 갈등이 해결되지 않았을 때 자녀가 정서적 중간에서 겪는 전형적인 역동입니다.", "b": "2권 p.625 · 2권 p.519 · 2권 p.518"}, {"id": "B6-3-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "두 사람 사이의 불안이 높아질 때 그 긴장을 해소하기 위해 제3자(자녀, 일, 술 등)를 끌어들여 안정을 찾으려는 역동적인 불균형 상태는?", "a": "삼각관계", "a2": "삼각관계 (Triangulation)", "e": "삼각관계는 불안을 일시적으로 분산시키지만, 근본적인 갈등 해결을 방해하고 제3자를 희생양으로 만듭니다.", "b": "2권 p.522"}, {"id": "B6-3-3", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "가족 내에서 부모가 자녀의 정서적 원장을 채워주는 것이 아니라, 자녀가 부모의 결핍을 채워주느라 자신의 발달을 포기하는 현상은?", "a": "부모화", "a2": "부모화 (Parentification)", "e": "돌봄의 질서가 역전되어 아이가 '작은 어른' 역할을 수행하며 정서적 착취를 당하는 상태입니다.", "b": "2권 p.518 · 2권 p.604"}, {"id": "B6-3-4", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "문제가 너무 만성적이어서 예외를 찾기 힘들거나 절망에 빠진 내담자에게, 그 지독한 고통 속에서도 \"어떻게 지금까지 견뎌올 수 있었는지\" 묻는 기법은?", "a": "대처질문", "a2": "대처 질문 (Coping Question)", "e": "내담자를 '희생자'에서 '생존자'로 재규정하며 내면의 강점과 자원을 발견하도록 돕는 질문입니다.", "b": "2권 p.576 · 2권 p.507"}, {"id": "B6-3-5", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "자신의 부정적 감정을 상대에게 투사하고, 실제로 상대가 그 감정을 느끼고 행동하게 유도하여 자신의 믿음을 확인받으려는 방어기제는?", "a": "투사적 동일시", "a2": "투사적 동일시 (Projective Identification)", "e": "단순한 인지적 투사를 넘어 상대방을 심리적 연극의 배우로 끌어들이는 상호작용적 기제입니다.", "b": "2권 p.514 · 2권 p.512"}, {"id": "B6-3-6", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "의사소통 유형 중, '자기'와 '상황'은 존중하지만 정작 대화 상대방인 '타인'의 가치나 감정은 무시하고 비난하는 유형은?", "a": "비난형", "a2": "비난형 (Blaming)", "e": "비난형은 타인을 무시함으로써 자신의 가치를 증명하려 하며, 외면은 강해 보이나 내면은 외로움과 실패감을 느낍니다.", "b": "2권 p.531"}, {"id": "B6-3-8", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "내담자의 인생을 '회원으로 구성된 클럽'으로 비유하며, 정체성 형성에 기여한 인물과의 관계를 재배치하여 소속감과 연대를 강화하는 기법은?", "a": "회원 재구성", "a2": "회원 재구성 (Re-membering)", "e": "소중한 타인의 눈에 비친 자신의 긍정적 모습을 확인하여 자아상을 풍부하게 하는 과정입니다.", "b": "2권 p.585"}, {"id": "B6-3-9", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "사티어(Satir)가 제시한 자아존중감의 3대 요소 중, 자신의 고유한 가치와 존재에 대한 신뢰를 의미하는 요소는?", "a": "자기", "a2": "자기 (Self)", "e": "자아존중감은 자기(Self), 타인(Other), 상황(Context)의 세 기둥으로 구성되며, 이들의 균형이 깨질 때 역기능적 의사소통이 발생합니다.", "b": "2권 p.531 · 2권 p.528 · 2권 p.529"}, {"id": "B6-3-10", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담자가 가족의 조직과 언어에 적응하여 신뢰 관계를 형성하는 기법인 '합류(Joining)'의 3가지 하위 기술은 유지, (      ), (      )이다.", "a": "추적 / 모방", "a2": "추적(Tracking), 모방(Mimesis)", "e": "상담자가 가족의 구조를 지지(유지)하고, 대화를 쫓아가며(추적), 말투나 몸짓을 흉내 내는(모방) 과정입니다.", "b": "2권 p.550"}, {"id": "B6-4-1", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "부모의 미분화 수준이 특정 자녀에게 전수되는 과정을 의미하며, 자녀가 부모의 불안을 흡수하여 증상을 보이게 되는 현상은?", "a": "가족투사과정", "a2": "가족투사과정 (Family Projection Process)", "e": "투사의 대상이 된 자녀는 부모와 밀착되어 자아분화 수준을 높이지 못하고 부적응을 겪습니다.", "b": "2권 p.523"}, {"id": "B6-4-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "부부 사이의 갈등을 해결하지 못한 채, 자녀에게 모든 관심을 쏟아부어 갈등을 잠시 덮어두려 하거나 자녀를 통해 위로를 얻으려는 연합의 명칭은?", "a": "우회연합", "a2": "우회연합 (Detouring Coalition)", "e": "자녀를 희생양 삼아 공격하거나(우회-공격), 과잉보호하여(우회-보호) 부부 문제를 회피하는 구조입니다.", "b": "2권 p.546 · 2권 p.547"}, {"id": "B6-4-5", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "해결중심 상담에서 내담자가 문제를 인식하고 변화의 필요성은 느끼지만, 문제의 원인을 타인이나 환경 탓으로 돌리며 자신은 변화의 주체가 되지 않으려는 관계 유형은?", "a": "불평형", "a2": "불평형 (Complainant)", "e": "불평형 내담자에게는 직접적인 행동 과제보다는 예외 상황을 찾아보게 하는 '관찰 과제'가 적절합니다.", "b": "2권 p.573 · 2권 p.578"}, {"id": "B6-4-7", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담자가 가족의 삼각관계에 연루되지 않으면서 중립을 유지하여 가족원 스스로 갈등을 해결하게 돕는 상담자의 태도 및 기법은?", "a": "치료적 삼각관계 / 탈삼각화", "a2": "치료적 삼각관계 혹은 탈삼각화 (Detriangulation)", "e": "상담자가 가족의 불안에 전염되지 않고 '나-입장'을 견지함으로써 가족 내 역기능적 연합을 해체합니다.", "b": "2권 p.525 · 2권 p.526 · 2권 p.474"}, {"id": "B6-4-9", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "헤일리(Haley)가 제안한 기법으로, 증상이 나타날 때마다 유익하지만 매우 귀찮고 힘든 일(운동, 청소 등)을 하도록 지시하는 기법은?", "a": "고된 체험기법 / 시련 기법", "a2": "고된 체험 기법 (시련 기법, Ordeal)", "e": "증상을 유지하는 비용(고통)을 높여 내담자가 스스로 증상을 버리는 것이 더 편하다고 느끼게 만듭니다.", "b": "2권 p.562 · 2권 p.507 · 2권 p.559"}, {"id": "B6-4-10", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담자가 가족의 상호작용 패턴을 시각화하기 위해 한 사람을 조각가로 선정하여 다른 가족원들을 공간에 배치하고 신체적 자세를 취하게 하는 기법은?", "a": "가족 조각 / 가족 조각 기법", "a2": "가족 조각 (Family Sculpting)", "e": "언어적 방어를 우회하여 가족의 역동과 위계, 친밀도를 한눈에 파악하게 돕는 강력한 비언어적 기법입니다.", "b": "2권 p.541"}, {"id": "B6-5-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "부모로부터 물려받은 심리적 명령이나 기대를 뜻하며, 긍정적일 경우 자산이 되지만 부정적일 경우 후손에게 '빚'으로 작용하는 것은?", "a": "유산", "a2": "유산 (Legacy)", "e": "유산은 선조로부터 세대 간에 대물림되는 강력한 심리적 유언과 같은 역할을 합니다.", "b": "2권 p.517"}, {"id": "B6-5-4", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "의사소통 유형 중, 자신과 타인의 정서는 모두 배제한 채 오직 객관적인 데이터나 논리적인 '상황'에만 집착하는 유형은?", "a": "초이성형", "a2": "초이성형 (Super-reasonable)", "e": "초이성형은 감정에 압도당하는 것을 두려워하여 지적인 용어로 자신을 방어하는 경향이 있습니다.", "b": "2권 p.531 · 2권 p.532 · 2권 p.534"}, {"id": "B6-6-1", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "밀란(Milan) 모델에서 증상을 가족 체계의 평형과 응집력을 유지하기 위한 '긍정적 의도'가 담긴 것으로 재해석하는 기법은?", "a": "긍정적 의미부여", "a2": "긍정적 의미부여 (Positive Connotation)", "e": "비난을 멈추고 구성원 모두가 체계를 위해 협력하고 있음을 인정하여 심리적 저항을 줄입니다.", "b": "2권 p.565"}, {"id": "B6-6-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "미누친(Minuchin)에 따르면, 섭식장애가 나타나는 가족은 구성원 간 경계가 모호한 융합(밀착)과 변화를 거부하는 (      ) 등의 구조적 특징을 보인다.", "a": "경직", "a2": "경직", "e": "융합, 과보호, 경직, 갈등해결 능력 결여 등이 섭식장애 가족의 5대 특징입니다.", "b": "2권 p.632 · 2권 p.543"}, {"id": "B6-6-3", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "사티어의 빙산 탐색 기법 중, \"공부를 잘해야 사랑받을 수 있다\"와 같이 내면화된 구체적이고 조건적인 요구사항을 의미하는 층위는?", "a": "기대", "a2": "기대 (Expectations)", "e": "'열망'이 사랑, 인정 등 보편적 욕구라면, '기대'는 그 열망을 채우기 위해 설정한 구체적인 조건들입니다.", "b": "2권 p.536 · 2권 p.512 · 1권 p.76"}, {"id": "B6-6-4", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "위니컷(Winnicott)이 제시한 개념으로, 내담자가 쏟아내는 강렬한 감정을 상담자가 흔들림 없이 견뎌주며 안전한 심리적 환경을 제공하는 기법은?", "a": "안아주기 / 지탱하기 / 버텨주기", "a2": "안아주기 (지탱하기, 버텨주기, Holding)", "e": "안아주기는 내담자가 정서적으로 통합될 때까지 상담자가 든든한 울타리가 되어주는 정서적 환경을 의미합니다.", "b": "2권 p.509 · 2권 p.515"}, {"id": "B6-6-6", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "보웬(Bowen)의 핵심 개념으로, 지적 기능이 정서적 기능에서 얼마나 자유로운가를 나타내며 타인과 융합되지 않고 독립된 자아를 유지하는 능력은?", "a": "자기분화", "a2": "자기분화 (Differentiation of Self)", "e": "자기분화가 낮은 사람은 감정에 압도당하는 '감정반사'를 보이며 타인과 쉽게 융합됩니다.", "b": "2권 p.506 · 2권 p.521 · 2권 p.522"}, {"id": "B6-6-7", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담자가 가족의 고통이나 증상을 가족 구조의 결함과 연결하여 긍정적인 의미로 다시 이름 붙여주는 기법을 증상의 (      )라고 한다.", "a": "재정의", "a2": "증상의 재정의 (Reframing)", "e": "예를 들어, '거식증'을 '부모의 간섭으로부터 자신을 지키려는 독립의 의지'로 재정의하여 구조 변화를 유도합니다.", "b": "2권 p.553 · 2권 p.562 · 2권 p.550"}, {"id": "B6-6-9", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담자가 특정 가족원에게 다른 가족원들 사이의 관계에 대해 질문하여 제3자의 객관적 시각을 빌려오는 질문 기법은?", "a": "순환질문", "a2": "순환 질문 (Circular Questioning)", "e": "선형적 인과관계를 깨뜨리고 관계의 역동을 스스로 깨닫게 돕는 밀란 모델의 핵심 기술입니다.", "b": "2권 p.564 · 2권 p.555 · 2권 p.526"}, {"id": "B6-7-1", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "힐의 롤러코스터 모델에서 위기 발생 후 평형이 깨지고 가족 기능이 급격히 저하되는 단계를 무엇이라 하는가?", "a": "해체 / 조직 해체 / 해체 단계", "a2": "해체 단계 (또는 조직 해체 단계)", "e": "[조직화 - 해체 - 회복 - 재조직] 순서 중 기능이 바닥을 치는 구간입니다.", "b": "2권 p.594 · 2권 p.482"}, {"id": "B6-7-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "맥매스터(McMaster) 모델에서 가족원들이 서로의 관심사와 가치관에 대해 진심으로 이해하고 존중하며 관여하는 가장 건강한 상태는?", "a": "공감적 관여", "a2": "공감적 관여 (Empathic Involvement)", "e": "무관심(1단계)부터 공생적 관여(5단계) 중 4단계에 해당하는 가장 이상적인 형태입니다.", "b": "2권 p.607 · 2권 p.606"}, {"id": "B6-7-3", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담실 내에서 가족 간의 갈등 상황을 직접 대화나 행동으로 재현하게 하여 상담자가 그 패턴을 직접 관찰하고 수정하는 기법은?", "a": "실연", "a2": "실연 (Enactment)", "e": "\"말하지 말고 여기서 직접 해보세요\"라고 요청하여 가족의 구조적 지도를 그리는 핵심 도구입니다.", "b": "2권 p.550 · 2권 p.547 · 2권 p.551"}, {"id": "B6-7-4", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "부모 하위체계가 자녀 하위체계보다 상위에 위치하여 적절한 권위와 책임을 갖는 건강한 가족의 질서를 무엇이라 하는가?", "a": "위계구조", "a2": "위계구조 (Hierarchy)", "e": "위계가 무너져 자녀가 부모를 통제하거나 한 부모가 소외될 때 가족 문제가 발생합니다.", "b": "2권 p.546 · 2권 p.544 · 2권 p.549"}, {"id": "B6-7-6", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "내담자의 저항을 역이용하여 \"변하지 말라\"거나 \"증상을 계속하라\"고 지시함으로써 스스로 증상을 포기하게 만드는 기법은?", "a": "역설적 개입", "a2": "역설적 개입 (Paradoxical Intervention)", "e": "내담자를 '치료적 이중구속'에 빠뜨려 순종하든 반항하든 결국 변화하게 만드는 고도의 전략입니다.", "b": "2권 p.562 · 2권 p.559 · 2권 p.563"}, {"id": "B6-7-8", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "MRI 상호작용 모델에서 행동의 양적 변화인 1차적 변화와 달리, 체계 내의 규칙이나 의사소통 패턴을 근본적으로 바꾸는 변화는?", "a": "2차적 변화 / 이차적 변화", "a2": "2차적 변화 (Second-order Change)", "e": "문제를 해결하려는 기존의 노력이 문제를 유지시킨다는 인식 하에, 관계의 대본 자체를 수정하는 변화입니다.", "b": "2권 p.558 · 2권 p.555"}, {"id": "B6-7-9", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "제휴(Alignment)의 형태 중, 두 사람이 제3의 가족원을 공격하거나 배제하기 위해 지속적이고 비밀스럽게 맺는 밀착 관계는?", "a": "연합", "a2": "연합 (Coalition)", "e": "공통의 적을 향하는 '연합'은 공동 목표를 위한 '동맹'과 구별되는 역기능적 패턴입니다.", "b": "2권 p.546 · 2권 p.547"}, {"id": "B6-7-10", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "유아가 어머니와 분리될 때의 불안을 줄이기 위해 사용하는 대체물(담요, 인형 등)을 일컫는 용어는?", "a": "중간대상", "a2": "중간대상 (Transitional Object)", "e": "내적 환상과 외적 현실을 연결하는 다리 역할을 하며 독립을 준비하게 돕습니다.", "b": "2권 p.516"}, {"id": "B6-8-10", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "가족 스트레스 연구에서 조상으로부터 내려오는 가훈, 비밀, 역기능적 패턴 등 세대 간 전수되는 심리적 유산을 뜻하는 용어는?", "a": "수직적 스트레스원", "a2": "수직적 스트레스원 (Vertical Stressors)", "e": "시간의 흐름에 따른 생활 사건인 '수평적 스트레스원'과 대비되는 개념으로 가계의 역사를 흐르는 압박 요인입니다.", "b": "2권 p.592 · 2권 p.597 · 2권 p.482"}, {"id": "B6-10-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "지배적인 '문제 이야기'에 포함되지 않는, 문제를 이겨냈거나 문제가 발생하지 않았던 '반짝이는 순간'을 뜻하는 용어는?", "a": "독특한 결과", "a2": "독특한 결과 (Unique Outcome)", "e": "예외적인 사건들을 찾아내어 대안적인 이야기를 써 내려가는 재저작 대화의 출발점이 됩니다.", "b": "2권 p.582 · 2권 p.585 · 2권 p.583"}, {"id": "B6-11-5", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "부모를 무조건 용서하는 것이 아니라, 부모 역시 그들 세대의 '회전판'에 갇힌 피해자였음을 이해하여 원망의 사슬을 끊는 과정은?", "a": "해방", "a2": "해방 (Exoneration)", "e": "부모를 맥락 속에서 해방시킴으로써 내담자 자신도 복수의 고된 노동에서 벗어나는 치유의 정점입니다.", "b": "2권 p.519 · 2권 p.566 · 2권 p.630"}, {"id": "B6-12-2", "s": "가족상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "가족 체계 내에 새로운 정보가 들어오거나 구성원이 밖으로 나가는 것을 막기 위해, 상황에 따라 경계선의 유연성을 비정상적으로 조절하는 역기능적 현상은?", "a": "고무 울타리", "a2": "고무 울타리 (Rubber Fence)", "e": "이는 외부 세계와 단절되어 가족만의 폐쇄적인 현실(신화)에 갇히게 만듭니다.", "b": "2권 p.506"}, {"id": "C6-1", "s": "가족상담", "f": "C", "y": "", "no": 0, "d": "어렵게", "q": "보스조르메니-내지의 맥락적 가족상담에서 부여(entitlement)는 어떤 사람이 다른 사람에게 일방적으로 제공하는 것으로, 자산이 될 수도 있고 빚이 될 수도 있다. 이 가운데 아이가 태어나기 전에 이미 부모가 원가족과의 관계에서 만들어 놓은 빚을 다음 세대에게 제공하는 것을 (      )라고 하며, 이를 물려받은 아이는 (      ) 역할을 담당할 가능성이 높다.", "a": "파괴적 부여 / 부모화", "a2": "① 파괴적 부여 (Destructive entitlement) ② 부모화", "e": "부여가 자산이 아니라 빚일 때 파괴적 부여라고 합니다. 윗세대의 역기능적 행동이 되풀이되는 회전판이 이를 만들어 내며, 상담에서는 해방 기법으로 회전판에서 벗어나도록 돕습니다.", "b": "2권 p.519"}, {"id": "7-1", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 1, "d": "쉽게", "q": "집단 내에서 다수가 특정 방향으로 의견을 모을 때, 개별 집단원이 자신의 생각과 다르더라도 집단의 분위기에 맞춰 동조하게 되는 심리적 압박 현상은?", "a": "집단압력", "a2": "집단 압력 (Group Pressure)", "e": "준비되지 않은 자기개방이나 의사결정을 강요하게 되어 집단원에게 수치심이나 심리적 상처를 줄 수 있는 집단상담의 주요 단점입니다.", "b": "2권 p.682 · 2권 p.656 · 2권 p.700"}, {"id": "7-2", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 2, "d": "어렵게", "q": "비교적 기능 수준이 높은 정상인을 대상으로 하며, 무의식적 갈등보다는 '의식 수준'에서의 자각 확장과 인간관계 능력 향상, 잠재력 개발에 초점을 두는 집단의 유형은?", "a": "성장집단", "a2": "성장 집단 (Growth Group)", "e": "치료집단이 성격의 재구조화에 집중한다면, 성장집단은 현재의 적응적 힘을 극대화하는 데 방점이 있습니다.", "b": "2권 p.660 · 2권 p.658 · 2권 p.659"}, {"id": "7-3", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 3, "d": "쉽게", "q": "로저스(Rogers)가 주창한 모델로, 지적 분석보다는 지금-여기에서의 진솔한 감정 표현과 전인적 만남을 강조하며 \"사회적 가면을 벗는 것\"을 핵심 과업으로 삼는 집단은?", "a": "참만남 집단", "a2": "참만남 집단 (Encounter Group)", "e": "T-집단이 집단 과정과 조직에 집중한다면, 참만남 집단은 개인의 실존적 경험과 감정에 더 집중합니다.", "b": "2권 p.660"}, {"id": "7-4", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 4, "d": "쉽게", "q": "멤버가 확정된 후 종결 시까지 새로운 멤버를 받지 않는 운영 방식으로, 집단 응집력이 높고 역할과 규범이 안정적으로 유지되는 장점을 가진 집단 형태는?", "a": "폐쇄집단", "a2": "폐쇄 집단 (Closed Group)", "e": "2026학년도 기출에서 응집력 형성의 유리한 점으로 정답 처리된 핵심 개념입니다.", "b": "2권 p.663"}, {"id": "7-5", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "실제 사회의 축소판(미시세계) 역할을 수행하며, 다양한 배경을 가진 성원들로부터 폭넓은 피드백을 얻고 대인관계 기술을 연습하기에 유리한 집단 형태는?", "a": "이질 집단", "a2": "이질 집단 (Heterogeneous Group)", "e": "동질 집단이 보편성 획득과 응집력 형성에 유리하다면, 이질 집단은 현실 검증력을 높이는 데 유리합니다.", "b": "2권 p.663 · 2권 p.658 · 2권 p.730"}, {"id": "7-6", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "집단 상담자가 \"무엇을 말하는가\"라는 대화의 줄거리보다, \"어떻게 상호작용하는가\"라는 대화의 방식과 이면의 역동에 초점을 맞추어 분석하는 기술은?", "a": "과정 분석 / 집단과정 / 집단과정 분석", "a2": "과정분석 (Process Analysis) 혹은 집단과정, 집단과정 분석", "e": "내용(Content)에 매몰되지 않고 과정(Process)을 다룰 때 비로소 집단의 치료적 힘이 발휘됩니다.", "b": "2권 p.665 · 2권 p.758 · 2권 p.759"}, {"id": "7-7", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "대인간 역동 중, 자신의 주관적 생각이나 감정을 다른 집단원들의 반응과 비교·검토함으로써 자신의 반응이 현실적으로 적절한지 확인하고 객관적인 현실감을 확보하는 역동적 기제는?", "a": "합의적 타당화", "a2": "합의적 타당화 (Consensual Validation)", "e": "한 사람의 행동을 다른 집단원들과 함께 검토해 보는 것으로, 특정 사안에 대해 다른 집단원도 유사한 느낌이나 경험을 하는지 확인하는 과정이다.", "b": "2권 p.667 · 2권 p.715"}, {"id": "7-8", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 8, "d": "쉽게", "q": "얄롬의 11가지 요인 중, 집단을 하나의 '사회적 미시세계'로 보고 타인의 피드백을 통해 자신의 패턴을 자각(입력)하고 새로운 행동을 시도(출력)하는 핵심 요인은?", "a": "대인학습 / 대인관계 학습", "a2": "대인관계 학습 (Interpersonal Learning) 혹은 대인학습", "e": "얄롬이 가장 강조한 요인으로, 자각과 행동 변화가 결합된 형태입니다.", "b": "2권 p.670"}, {"id": "7-9", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 9, "d": "어렵게", "q": "얄롬과 레스츠의 12가지 Q-분류 요인 중, \"다른 사람을 짜증나게 하는 나의 습관이나 태도에 대해 다른 사람들이 알려주는 것\"에 해당하는 요인 명칭은?", "a": "대인관계 입력", "a2": "대인관계 입력 (Interpersonal Input)", "e": "피드백을 '받는 것'은 입력, 새로운 기술을 '연습하는 것'은 출력입니다.", "b": "2권 p.671 · 2권 p.670 · 2권 p.673"}, {"id": "7-10", "s": "집단상담", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "코틀러(Kottler)의 요인 중, 비웃음이나 거절의 위험을 무릅쓰고 평생 누구에게도 말하지 못했던 깊은 비밀이나 자신의 취약성을 용기 있게 개방하는 행동은?", "a": "모험시도", "a2": "모험 시도 (Taking Risks)", "e": "단순한 자기개방을 넘어 '위험 감수'와 '행동적 결단'이 포함된 고차원적 요인입니다.", "b": "2권 p.674 · 2권 p.722 · 2권 p.677"}, {"id": "18-1", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "집단의 유형에 대한 설명이다. 빈칸에 들어갈 유형을 각각 쓰시오.\n\n(      )집단은 정신건강 전문가가 돕기에 한계가 있는 문제를 지닌 사람들이 통상적으로 전문가의 도움 없이 진행되는 집단이다. 반면, (      )은 특정 과업을 완수하기 위한 목적으로 구성되는 유형의 집단이다.", "a": "자조 / 과업", "a2": "자조 / 과업", "e": "집단 유형은 상담집단, 치료집단, 교육집단, 성장집단, 과업집단, 자조집단, 지지집단이 있다.", "b": "2권 p.661 · 2권 p.659"}, {"id": "18-2", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "다음 중 ‘집단의 유형’과 설명으로 옳지 않은 것을 고르시오.\n\n① 상담집단은 개인적, 교육적, 사회적, 직업적 문제에 초점을 맞추고 치료적인 목적 외에도 예방과 교육적인 목표를 설정하여 집단상담을 실천하는 집단의 형태이다.\n② 치료 집단은 지지와 격려가 필요한, 공통의 관심사가 있는 사람들을 위한 집단 유형이다.\n③ 자조집단은 정신건강전문가가 돕기에 한계가 있는 문제를 지닌 사람들이 통상적으로 전문가의 도움 없이 진행되는 집단이다.\n④ 과업집단은 특정 과업을 완수하기 위한 목적으로 구성되는 유형의 집단이다.\n⑤ 성장집단은 비교적 짧은 기간에 다양한 집단체험을 원하거나, 자신에 대해 좀 더 알기 원하거나 잠재력 개발에 관심이 있는 사람들의 성장과 발달 촉진을 위해 구성되는 집단이다.", "a": "2", "a2": "2 치료 집단은 지지와 격려가 필요한, 공통의 관심사가 있는 사람들을 위한 집단 유형이다.", "e": "지지와 격려가 필요한, 공통의 관심사가 있는 사람들을 위한 집단 유형은 ‘지지집단’이다.", "b": "2권 p.661 · 2권 p.658"}, {"id": "18-3", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "집단상담에서 ‘개방 여부’에 따른 집단 형태를 구분할 때 다음의 빈칸에 들어갈 알맞은 개념을 순서대로 쓰시오.\n\n(      )집단은 집단상담이 진행되고 있더라도 집단의 허용 범위 내에서 새로운 집단원을 받아들이는 형태를 말한다. 반면, (      )집단은 특정한 구성원 수로 집단이 구성되어 일단 집단이 시작되면 결원이 생기더라도 새로운 구성원을 충원 하지 않는 집단의 형태이다. 응집력이 높고, 집단의 역할과 규범이 안정적이다.", "a": "개방 / 폐쇄", "a2": "개방 / 폐쇄", "e": "개방집단과 폐쇄 집단은 ‘개방 여부’에 따른 집단 형태 구분이다.", "b": "2권 p.663"}, {"id": "18-4", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "다음이 설명하는 집단역동에 영향을 미치는 요인을 쓰시오.\n\n- 집단이 어떤 사람들로 구성되는지가 집단역동에 영향을 준다.\n집단원의 배경 요인은 성별, 연령, 출신지역, 학력, 결혼 상태, 직업, 사회경제적 지위, 종교, 인종 등이 있다", "a": "집단원의 배경 / 집단원 배경", "a2": "집단원의 배경 / 집단원 배경", "e": "집단원의 배경에 따라서 집단역동에 영향을 주기도 한다. 집단원의 배경은 어떤 사람들로 구성되는지를 말한다.", "b": "2권 p.667"}, {"id": "18-5", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "다음 중 ‘집단의 형태’와 그 특징으로 적절하지 않은 것을 고르시오.\n\n① 개방집단은 서로 다른 사람들이 우리와의 관계 안으로 들어오거나 떠나는 일상을 좀 더 정확하게 반영한다.\n② 폐쇄집단은 집단 응집력이 높고, 집단의 역할과 규범이 안정적이다.\n③ 동질 집단은 상호작용이 많아지므로 갈등이 심화될 수 있기 때문에 집단상담자는 상호작용의 역동을 충분히 다룰 수 있어야 한다.\n④ 이질집단은 갈등 유발의 가능성이 높지만, 이러한 갈등은 집단역동을 강하게 불러일으켜서 역동적 상호작용을 촉진시키기도 한다.\n⑤ 구조화 집단은 합의된 공동목표를 달성하는 데 시간과 경비를 절약할 수 있다.", "a": "3", "a2": "3 동질 집단은 상호작용이 많아지므로 갈등이 심화될 수 있기 때문에 집단상담자는 상호작용의 역동을 충분히 다룰 수 있어야 한다.", "e": "상호작용이 많아지므로 갈등이 심화될 수 있기 때문에 집단상담자는 상호작용의 역동을 충분히 다룰 수 있어야 한다는 단점을 지닌 집단의 형태는 ‘이질집단’이다.", "b": "2권 p.663"}, {"id": "18-6", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "얄롬(Yalom)과 레스츠(Leszcz)가 제시한 집단의 치료적 요인 중 다음에 해당되는 요인을 쓰시오.\n\n저는 집단에 참여하면서 그동안 꾹 참아왔던 제 감정을 마음껏 표현할 수 있어서 좋았어요. 지금까지 누구에게도 말해본 적이 없었지만.. 정말 이야기하고 싶었던 것들.. 이야기하고 나니 속이 너무 시원하고 가슴이 뻥 뚫린 기분이에요.. 이 경험을 잊지 못할 것 같아요.", "a": "정화 / 카타르시스", "a2": "정화 / 카타르시스", "e": "정화 (카타르시스)\n과거에 표출해 본 적 없던 감정 방출\n-> 내면에 쌓였던 감정들을 표출함으로써 해소되는 과정을 말한다.\n개방적인 정서 표현은 집단과정에 반드시 필요하며, 정서 표현이 없는 집단은 메마른 학술적 연습으로 전락할 수 있다.", "b": "2권 p.671"}, {"id": "18-7", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "아래의 설명에 해당되는 코틀러의 집단의 치료적 요인을 쓰시오.\n\n자신의 약점을 기꺼이 공개하고, 인정하며, 변화를 꾀하는 것을 뜻한다. 이는 집단원이 스스로 통제하고 되풀이 해온 방식을 포기하는 것을 의미하며, 상처받을 수 있는 상황에서 기꺼이 자신을 개방하는, 변화를 위한 적극적인 행동이다.", "a": "모험시도", "a2": "모험시도", "e": "코틀러의 치료적 요인 중 모험 시도\n집단의 핵심으로 누구에게도 말해 본 적이 없는 가장 깊고 어두운 비밀을 진정/솔직/진솔한 방식으로 소리 내어 말하고, 삶의 행동방식에 놀랄 만한 변화를 가져오게 되는 광경을 상상함", "b": "2권 p.674 · 2권 p.677"}, {"id": "18-8", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "‘집단원이 선정한 집단의 치료적 요인’ 중 아래 문항에 해당하는 요인을 고르시오.\n\n- 다른 사람이 위험을 감수하며 난처한 일을 함으로써 이득을 얻는 것에 대한 관찰은 내가 같은 일을 해보는 데 도움이 됨.\n- 내가 본받을 수 있는 사람을 집단에서 발견함.\n\n① 보편성\n② 이타주의\n③ 동일시\n④ 자기이해\n⑤ 희망고취", "a": "3", "a2": "3 동일시", "e": "집단원이 선정한 집단의 치료적 요인(Q분류 기법)은 이타주의, 집단응집력, 보편성, 대인관계-입력, 대인관계-출력, 지도, 정화, 동일시, 가족재정립, 자기이해, 희망고취, 실존적 요인이 있다.", "b": "2권 p.672 · 2권 p.673 · 2권 p.671"}, {"id": "18-9", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "집단상담자의 리더십 유형으로는 민주형 리더십, 독단형 리더십, (      ) 리더십이 있다.", "a": "방임형", "a2": "방임형", "e": "집단상담자의 리더십 유형으로는 민주형 리더십, 독단형 리더십, 방임형 리더십이 있다. 방임형 리더십을 발휘하는 집단은 집단의 방향이 전적으로 집단원들에게 맡겨지고, 집단과정과 결과에 대한 책임도 집단원들에게 달려 있다.", "b": "2권 p.685"}, {"id": "18-10", "s": "집단상담", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "다음 빈칸에 들어갈 집단상담자가 보이는 문제행동은?\n\n(      )은 집단상담자가 지나치게 자신의 사적인 내용을 노출하는 것으로 집단상담자의 역할 수행에 방해가 되는 문제가 있다면 다른 전문가와 상담 또는 자문을 통해 그 문제를 우선 해결하도록 한다.", "a": "과도한 자기개방", "a2": "과도한 자기개방", "e": "집단상담자가 보일 수 있는 문제행동\n지나친 개입\n방어적 태도\n폐쇄적 태도\n과도한 자기개방", "b": "2권 p.682"}, {"id": "B7-1-1", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "다른 집단원의 고통스러운 감정 표현을 견디기 힘들어 급하게 위로하거나 화제를 돌림으로써, 결과적으로 상대방의 정서적 정화(카타르시스) 기회를 박탈하는 문제 행동은?", "a": "일시적 구원 / 상처 싸매기", "a2": "일시적 구원 (Temporary Rescue) 혹은 상처 싸매기(Band-aiding)", "e": "배려처럼 보이지만 실제로는 자신의 불안을 해소하기 위한 방어 기제입니다.", "b": "2권 p.694 · 2권 p.704"}, {"id": "B7-1-2", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "모레노(Moreno)가 강조한 개념으로, 일상의 현실에서는 불가능한 일(예: 돌아가신 분과의 만남)을 무대 위에서 실연할 수 있게 하는 심리적 세계는?", "a": "잉여현실", "a2": "잉여현실 (Surplus Reality)", "e": "상상력과 무대의 결합을 통해 현실의 제약을 넘어선 치유를 가능케 합니다.", "b": "2권 p.760 · 2권 p.761"}, {"id": "B7-1-3", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "불편한 감정을 직접 마주하는 대신 철학적, 이론적 분석 뒤로 숨어 집단을 인지적인 토론장으로 변질시키는 집단원의 방어 기제는?", "a": "지성화 / 주지화", "a2": "지성화 (Intellectualization) 혹은 주지화", "e": "'가슴(정서)'으로 느껴야 할 것을 '머리(인지)'로 처리하여 진실된 접촉을 피하는 행동입니다.", "b": "2권 p.699 · 3권 p.416 · 1권 p.90"}, {"id": "B7-1-5", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "집단원들이 자신의 인생에 대한 궁극적인 책임은 자신에게 있음을 깨닫고, 고독과 죽음이라는 인간의 근원적 한계를 직면하며 성장하는 치료적 요인은?", "a": "실존적 요인", "a2": "실존적 요인 (Existential Factors)", "e": "얄롬의 11가지 요인과 Q-분류 모두에서 중요하게 다루어지는 철학적 차원의 요인입니다.", "b": "2권 p.673 · 2권 p.671"}, {"id": "B7-1-6", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "질문 공세를 퍼붓거나 비밀을 누설하려는 집단원, 혹은 상처 싸매기를 시도하는 집단원의 발언을 상담자가 직접 개입하여 중지시키는 기법은?", "a": "차단하기 / 차단", "a2": "차단하기 (Blocking)", "e": "집단원의 성장을 저해하거나 안전을 해치는 역동을 즉각 제어하는 기술입니다.", "b": "2권 p.708"}, {"id": "B7-1-8", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "코틀러의 요인 중, 논리적 설명을 넘어 집단 전체의 시너지로 인해 발생하는 신비롭고 극적인 치유 경험을 일컫는 용어는?", "a": "마법", "a2": "마법 (Magic)", "e": "정서적 경이로움을 묘사할 때 사용된 키워드입니다.", "b": "2권 p.669 · 2권 p.716 · 2권 p.749"}, {"id": "B7-1-9", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담자가 과거의 사건이나 집단 밖의 이야기가 아닌, '지금 이 순간' 리더가 느끼는 감정을 도구로 사용하여 현재의 상호작용을 정면으로 다루는 기술은?", "a": "즉시성", "a2": "즉시성 (Immediacy)", "e": "집단 내 정체된 에너지를 돌파하고 진실된 접촉을 이끄는 강력한 개입입니다.", "b": "2권 p.704 · 2권 p.708 · 1권 p.187"}, {"id": "B7-2-5", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "특정 집단원의 말이나 행동을 다른 집단원의 경험이나 감정과 의미 있게 이어줌으로써 집단원 간의 상호작용을 촉진하고 보편성을 체험하게 하는 기술은?", "a": "연결 / 연결하기", "a2": "연결하기 (Linking) 혹은 연결", "e": "개인 상담에는 없는 집단 전용 기법으로, 응집력을 높이는 핵심 도구입니다.", "b": "2권 p.707"}, {"id": "B7-3-1", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "집단원이 수행하는 역할 중, 집단이 목표 달성 과정의 어느 단계에 와 있는지 혹은 현재 무엇을 해야 할 시점인지를 파악하여 흐름을 짚어주는 역할은?", "a": "관여자", "a2": "관여자(Partaker)", "e": "\"우리가 지금까지 ~를 다룬 것 같아요\"와 같이 집단의 내비게이션 역할을 하는 기능입니다.", "b": "2권 p.688"}, {"id": "B7-3-3", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "가즈다(Gazda)의 집단계획 10단계 중, 상담 직후의 학습 효과를 측정하기 위해 종료 후 '1~2주 이내'에 실시하는 과정은?", "a": "사후검사", "a2": "사후 검사 (Post-test)", "e": "추후지도는 종료 후 4~8주 뒤에 실시하여 변화의 지속성을 확인하는 작업입니다.", "b": "2권 p.727"}, {"id": "B7-3-4", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "집단 내 지위에 대한 불안이나 리더에 대한 적대감을 해소하기 위해 일부 성원들끼리 파벌을 형성하고 사적인 비밀을 유지하여 응집력을 해치는 행동은?", "a": "하위집단 형성", "a2": "하위집단 형성 (Subgrouping)", "e": "공유되지 않은 정보로 인해 소외감을 조장하고 집단 전체의 안전감을 파괴합니다.", "b": "2권 p.699 · 2권 p.698"}, {"id": "B7-3-6", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "집단 첫 회기를 시작하기 전, 규칙, 절차, 비밀보장의 한계 등을 안내하여 집단원들의 불안을 해소하고 심리적 준비를 돕는 모임의 명칭은?", "a": "예비 집단회기 / 사전 오리엔테이션", "a2": "예비 집단회기 혹은 사전 오리엔테이션", "e": "본 회기 시작 전 '안전망'을 구축하는 전략적 단계입니다.", "b": "2권 p.725 · 2권 p.735"}, {"id": "B7-4-3", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "집단상담자가 모든 발언에 일일이 반응하여 집단원 간의 상호작용 기회를 차단하고, 집단을 '1:多 개인상담' 구조로 전락시키는 문제 행동은?", "a": "지나친 개입", "a2": "지나친 개입 (Excessive Intervention)", "e": "리더 중심의 의존적 구조를 형성하며 집단원끼리 연결될 기회를 가로채는 전술적 오류입니다.", "b": "2권 p.681"}, {"id": "B7-4-4", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "예비 집단원들과의 '작업동맹'을 형성하고, 집단 참여에 대한 '현실적인 기대'를 갖도록 돕기 위해 반드시 거쳐야 하는 선발 절차는?", "a": "개별면담 / 집단원 선별", "a2": "개별면담 (Individual Interview) 혹은 집단원 선별", "e": "상담자와의 사전 신뢰 관계 구축은 중도 포기율을 낮추는 결정적 요인입니다.", "b": "2권 p.727 · 2권 p.731 · 2권 p.735"}, {"id": "B7-4-9", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "리더가 집단의 방향을 독자적으로 설정하지 않고 구성원들을 '촉진(Facilitating)'하는 역할에 집중하며, 집단원의 자율성과 주인의식을 극대화하는 리더십 유형은?", "a": "민주형 리더십", "a2": "민주형 리더십 (Democratic Leadership)", "e": "해답을 주는 전문가가 아닌 안전한 환경을 제공하는 촉진자로서의 리더십입니다.", "b": "2권 p.685 · 2권 p.684"}, {"id": "B7-5-3", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "코리(Corey)의 발달 단계 중, 집단원들이 \"이곳이 안전한가\"를 시험하며 낮은 신뢰감과 높은 불안을 보이고, 자신에게 초점을 맞추는 것을 회피하는 단계는?", "a": "초기단계", "a2": "초기 단계 (Initial Stage)", "e": "낮은 신뢰감으로 인해 탐색적인 대화와 피상적인 상호작용이 주를 이루는 시기입니다.", "b": "2권 p.719 · 2권 p.718 · 2권 p.720"}, {"id": "B7-5-5", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상대방을 비난하지 않고, 관찰된 행동(Situation) - 그 행동이 나에게 미친 영향(Impact) - 나의 주관적 느낌(Feeling) - 요구(Request)의 순서로 표현하는 기법은?", "a": "나 전달법", "a2": "나-전달법 (I-Message)", "e": "공격성을 줄이고 상대방의 자발적인 변화를 이끌어내는 모델링의 기초입니다.", "b": "2권 p.716"}, {"id": "B7-5-8", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "집단상담자의 인간적 자질 중, 상담자 자신의 한계와 서툰 모습을 있는 그대로 인정함으로써 집단원들이 방어를 해제하고 모델링할 수 있게 돕는 자질은?", "a": "자기수용", "a2": "자기수용 (Self-Acceptance)", "e": "상담자가 완벽주의를 버리고 자신을 수용할 때 집단 내 안전감이 형성됩니다.", "b": "2권 p.678"}, {"id": "B7-5-9", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "주인공의 뒤에 서서 주인공이 차마 입 밖으로 내지 못하는 속마음이나 무의식적 감정을 대신 말해주는 보조자아의 기법은?", "a": "이중자아 기법", "a2": "이중자아 기법 (Double Technique)", "e": "주인공의 내적 갈등을 표면화하고 억눌린 감정 표현을 촉진합니다.", "b": "2권 p.762"}, {"id": "B7-5-10", "s": "집단상담", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "(      )을 제공할 때, 상대방의 인격 전체를 평가하기보다 관찰 가능한 행동을 구체적으로 언급하고 비판 없이 자신의 반응만을 전달해야 한다는 원칙은 구체성(Specificity) 및 비심판적 태도다.", "a": "피드백", "a2": "피드백", "e": "효과적인 피드백의 조건으로, 학습 효과를 극대화하고 방어를 최소화합니다.", "b": "2권 p.676 · 2권 p.723 · 2권 p.707"}, {"id": "8-1", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 1, "d": "어렵게", "q": "여러 검사를 묶어 실시함으로써 단일 검사가 가질 수 있는 측정의 오차를 줄이고, 내담자의 심리적 특성을 다각도에서 교차 검증하여 통합적으로 이해하려는 방식은?", "a": "배터리 검사 / 베터리 검사", "a2": "배터리 검사 (Battery of Tests)", "e": "검사 데이터 간의 합치 여부를 확인하여 진단의 신뢰도와 타당도를 높이는 핵심 전술입니다.", "b": "3권 p.49 · 3권 p.190"}, {"id": "8-2", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 2, "d": "쉽게", "q": "검사 자극이 모호하고 비구조화되어 있어 수검자의 의도적 방어가 어렵고, 개인의 독특한 무의식적 역동을 풍부하게 끌어낼 수 있는 검사 유형은?", "a": "투사검사 / 투사적 검사", "a2": "투사(적) 검사 (Projective Test)", "e": "로르샤흐, TAT, HTP 등이 대표적이며, 안면 타당도가 낮아 수검자가 무엇을 재는지 알기 어렵다는 특징이 있습니다.", "b": "3권 p.50 · 3권 p.221"}, {"id": "8-3", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 3, "d": "어렵게", "q": "타인과의 비교를 통해 상대적 위치를 파악하기보다, 이미 설정된 교육 목표나 숙달 기준(Cut-off)에 도달했는지 여부를 판정하는 해석 기준은?", "a": "준거참조검사 / 절대평가", "a2": "준거 참조 검사(Criterion-Referenced Test) 혹은 절대평가", "e": "자격증 시험이나 국가고시 등이 해당하며, 규준 참조 검사(상대평가)와 대비되는 개념입니다.", "b": "3권 p.51 · 3권 p.65 · 3권 p.20"}, {"id": "8-4", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "수검자가 자신의 능력을 최대한 발휘하도록 요구하며 정답과 오답이 존재하는 검사로, 지능검사나 적성검사가 속하는 분류는?", "a": "최대능력검사", "a2": "최대능력검사 (Maximum Performance Test)", "e": "성격검사나 태도검사처럼 평소의 전형적인 성향을 재는 '행동표현검사'와 구분됩니다.", "b": "3권 p.51"}, {"id": "8-5", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 5, "d": "쉽게", "q": "측정 척도 중 순서와 등간격의 정보뿐만 아니라 '절대영점'을 가지고 있어 사칙연산과 비율 계산이 모두 가능한 가장 높은 수준의 척도는?", "a": "비율척도", "a2": "비율 척도 (Ratio Scale)", "e": "지능지수(IQ)나 온도는 절대영점이 없는 '등간 척도'이므로 곱셈 법칙이 성립하지 않음을 주의하세요.", "b": "3권 p.57"}, {"id": "8-6", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 6, "d": "쉽게", "q": "수검자의 원점수가 규준 집단 내에서 나보다 낮은 점수를 받은 사람의 비율(%)로 나타낸 서열 점수는?", "a": "백분위 점수", "a2": "백분위 점수 (Percentile Rank)", "e": "이해하기 쉽지만, 분포의 양극단 점수 차를 과장하고 중앙의 차이를 작게 보이게 하는 단위 불균형의 단점이 있습니다.", "b": "3권 p.55 · 3권 p.154 · 3권 p.168"}, {"id": "8-7", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "평균을 50, 표준편차를 10으로 설정하여 음수나 소수점이 나오지 않게 변환한 점수로, MMPI 등 임상 검사에서 가장 널리 쓰이는 표준점수는?", "a": "T점수", "a2": "T점수", "e": "Z = (원점수-평균)/표준편차로 구한 Z점수를 10Z + 50으로 선형 변환한 값입니다.", "b": "3권 p.56 · 3권 p.55"}, {"id": "8-8", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 8, "d": "어렵게", "q": "검사 결과가 수검자의 실제 능력(진점수)으로부터 어느 정도의 범위 내에 있는지 나타내는 지표로, 점수의 '신뢰구간'을 설정하는 근거가 되는 것은?", "a": "측정의 표준오차", "a2": "측정의 표준오차 (SEM; Standard Error of Measurement)", "e": "신뢰도가 높을수록 표준오차는 작아지며, 점수를 단일 수치가 아닌 '범위'로 해석하게 돕습니다.", "b": "3권 p.57 · 3권 p.168"}, {"id": "8-9", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 9, "d": "쉽게", "q": "\"검사가 측정하고자 하는 목적을 얼마나 정확하게 측정하고 있는가\"를 의미하며, 신뢰도의 필요조건이 되는 검사의 양호도 지표는?", "a": "타당도", "a2": "타당도 (Validity)", "e": "신뢰도는 타당도를 위한 필요조건이지만 충분조건은 아니라는 명제를 반드시 암기하십시오.", "b": "3권 p.61 · 3권 p.62"}, {"id": "8-10", "s": "심리검사", "f": "Ⅰ", "y": "2026", "no": 10, "d": "쉽게", "q": "타당도 중 하나로, 전문가들이 검사 문항이 측정 영역을 얼마나 잘 대표하고 있는지 주관적으로 판단하며 '이원분류표' 등을 활용하는 타당도는?", "a": "내용 타당도", "a2": "내용 타당도 (Content Validity)", "e": "수검자가 느끼는 '안면 타당도'와는 구별되는 전문가의 논리적 분석 지표입니다.", "b": "3권 p.62 · 3권 p.63"}, {"id": "19-1", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "최대수행능력을 측정하는 검사로 옳지 않은 것은?\n\n① K-WISC-Ⅳ\n② 학업성취도검사\n③ MMPI-2\n④ 적성검사\n⑤ 창의력 검사", "a": "3", "a2": "3 MMPI-2", "e": "MMPI-2는 최대능력검사가 아닌 성격검사이다.", "b": "3권 p.51 · 2권 p.426 · 3권 p.50"}, {"id": "19-2", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "배터리검사의 특징으로 적절하지 않은 것을 고르시오.\n① 배터리검사를 시행함으로써 피검자의 다양한 차원과 기능에 관심을 기울일 수 있고, 개인에 대한 폭넓은 자료를 제공할 수 있다.\n② 다양한 심리검사들은 어느 정도 평가영역이 중첩되기 때문에 단일한 검사로부터 얻어진 결과에 대한 타당성이 다른 검사결과를 통해 검증될 수 있다.\n③ 심리검사의 예견적 능력은 배터리검사의 결과를 모두 합친다고 해서 증가되는 것이 아니기 때문에 배터리 검사는 검사시행에 소모된 시간과 노력의 투자에 비해 효용성이 충분하지 않다는 문제점이 있다.\n④ 배터리검사에서 가장 먼저 시행되는 검사는 벤더-게슈탈트검사, 인물화 검사 등 주로 간단하면서도 검사자와 수검자 사이에 거리가 유지되는 검사이다.\n⑤ 배터리 검사를 시행한 후 수집된 검사자료를 모두 사용하는 것이 바람직하다.", "a": "5", "a2": "5 배터리 검사를 시행한 후 수집된 검사자료를 모두 사용하는 것이 바람직하다.", "e": "배터리 검사는 수집된 검사자료 중 일부 결과만을 선택적으로 사용한다.", "b": "3권 p.49"}, {"id": "19-3", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "심리검사의 분류에서 ( A )검사는 검사 개발자가 특정 개인의 점수를 다른 사람들의 점수와 비교하는데 우선적인 관심을 두는 검사이고, ( B )검사는 검사 개발자가 개인의 점수를 이미 정해진 기준점수와 비교해서 전체적으로 기준점수를 넘은 사람이 얼마나 되는지를 파악하는 데 우선적인 관심을 두는 검사이다.", "a": "규준참조 / 준거참조", "a2": "규준참조 / 준거참조", "e": "규준참조검사 : 검사 개발자가 특정 개인의 점수를 다른 사람들의 점수와 비교하는데 우선적인 관심을 두는 검사\n준거참조검사 : 검사 개발자가 개인의 점수를 이미 정해진 기준점수와 비교해서 전체적으로 기준점수를 넘은 사람이 얼마나 되는지를 파악하는 데 우선적인 관심을 두는 검사", "b": "3권 p.51"}, {"id": "19-4", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "심리학개론 시험성적이 정규분포를 이루고 평균이 60, 표준편차가 10이라고 할 때, 75점에 해당하는 Z점수와 T점수는?\n① Z=0, T=50\n② Z=+0.5, T=60\n③ Z=+0.5, T=65\n④ Z=+1.5, T=60\n⑤ Z=+1.5, T=65", "a": "5", "a2": "5 Z=+1.5, T=65", "e": "Z점수 = (점수 – 평균점수)/표준편차\nT점수 = 50+10z", "b": "3권 p.55 · 3권 p.56"}, {"id": "19-5", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "다음 중 척도에 관한 설명으로 옳지 않은 것을 고르시오.\n\n① 명명척도는 특정한 속성에 따라 사물을 구분하기 위한 척도로 성별이나 계절이 명명척도에 해당된다.\n② 서열척도는 석차, 성적을 수우미양가 등으로 구분하는 것이 해당된다.\n③ 등간척도는 서열척도의 속성을 갖는 동시에 등간성을 가진 척도를 의미한다.\n④ 등간척도의 속성을 가진 척도는 곱셈법칙의 적용이 가능하다.\n⑤ 비율척도는 거리, 무게, 나이, 연간소득 등이 해당된다.", "a": "4", "a2": "4 등간척도의 속성을 가진 척도는 곱셈법칙의 적용이 가능하다.", "e": "등간척도의 속성을 가진 척도는 덧셈법칙은 성립하나 곱셈법칙은 성립하지 않는다.", "b": "3권 p.57"}, {"id": "19-6", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "새로운 우울증 검사의 개발과 관련된 신뢰도와 타당도에 관한 설명으로 옳지 않은 것은?\n\n① 수렴타당도를 구하기 위해 기존의 우울증 검사와 새로운 우울증 검사의 상관계수를 산출하였다.\n② 변별타당도를 구하기 위해 기존의 분노검사와 새로운 우울증 검사의 상관계수를 산출하였다.\n③ 반분신뢰도를 구하기 위해 새로운 우울증 검사의 홀수 문항과 짝수 문항 간 상관계수를 산출하였다.\n④ 검사-재검사 신뢰도를 구하기 위해 기존의 우울증 검사를 실시하고 1달 후 새로운 검사를 실시하여 상관계수를 산출하였다.\n⑤ 예측타당도를 구하기 위해 새로운 우울증 검사를 실시하고 1년 후 자살충동 검사를 실시하여 상관계수를 산출하였다.", "a": "4", "a2": "4 검사-재검사 신뢰도를 구하기 위해 기존의 우울증 검사를 실시하고 1달 후 새로운 검사를 실시하여 상관계수를 산출하였다.", "e": "기존의 우울증 검사를 실시하고 1달 후 새로운 검사를 실시하여 상관계수를 산출을 통해 구할 수 있는 것은 예언타당도이다.", "b": "3권 p.65 · 3권 p.64 · 3권 p.59"}, {"id": "19-7", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "다음 중 객관도를 높이는 방법에 관한 설명으로 옳지 않은 것은?\n\n① 평가도구를 객관화한다.\n② 평가자의 소양을 높인다.\n③ 명확한 평가기준을 마련한다.\n④ 비용과 시간, 노력을 최대한 절약시킨다.\n⑤ 다수에 의한 공동평가를 실시한다.", "a": "4", "a2": "4 비용과 시간, 노력을 최대한 절약시킨다.", "e": "비용과 시간, 노력을 최대한 절약시키는 것은 실용도를 높이기 위한 방안이다", "b": "3권 p.66"}, {"id": "19-8", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "다음의 내용이 설명하는 검사의 명칭을 작성하시오.\n\n내담자의 주요한 정신의학적 기능을 조사하는 것을 목적으로 하며 내담자의 정신병리적 문제에 초점을 맞춘 검사이다. 이 검사를 통해서 내담자의 외모, 행동, 태도, 감정, 지각, 사고 등의 영역을 파악한다.", "a": "정신상태검사", "a2": "정신상태검사", "e": "정신상태검사는 정신병리적 문제에 초점을 맞춘 검사로 포괄적 검토가 가능하다", "b": "3권 p.70"}, {"id": "19-9", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "‘면담’에 관한 설명으로 옳지 않은 것은?\n\n① 구조적 면담은 전문가가 아닌 경우에도 단기간의 훈련을 거치면 실시 가능하다.\n② 비구조적 면담은 내담자의 정보를 심층적으로 탐색할 수 있다.\n③ 구조적 면담은 일정기간동안 많은 사람을 면담해야 하는 경우에 편리하게 사용할 수 있다.\n④ 구조적 면담은 면담자의 판단과 능력이 다양하기 때문에 심리평가 자료로서 낮은 신뢰도를 갖는다.\n⑤ 비구조적 면담은 다량의 자료를 수집하기 어려울 뿐만 아니라 수집된 자료를 객관적으로 수량화하기 어렵다.", "a": "4", "a2": "4 구조적 면담은 면담자의 판단과 능력이 다양하기 때문에 심리평가 자료로서 낮은 신뢰도를 갖는다.", "e": "‘구조적 면담’은 질문의 내용, 방식, 순서를 미리 정해놓고 사전에 준비한 질문을 중심으로 면접하는 방식이다.\n‘비구조적 면담’은 질문방식이나 내용을 미리 정해놓지 않고, 면접자가 상황에 맞추어 유연하게 진행되는 방식이다.\n④ 구조적 면담은 진단의 신뢰도를 높여준다는 장점을 갖는다.", "b": "3권 p.69"}, {"id": "19-10", "s": "심리검사", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "아래에서 설명하는 해석과 관련된 MMPI-2 검사의 척도는?\n무엇인가와 싸우고 있는 것과 관련된 문항으로 구성되며 사회적 적응곤란을 인정하는 동시에 사회적 침착성과 자신감을 측정하는 척도이다.\n① 척도 1(Hs)\n② 척도 2(D)\n③ 척도 3(Hy)\n④ 척도 4(Pd)\n⑤ 척도 5(Mf)", "a": "4", "a2": "4 척도 4(Pd)", "e": "척도 4(Pd)는 ‘무언가와 싸우고 있는 것’과 관련된 문항들로 구성되며, 사회적 적응 곤란을 인정하는 동시에 사회적 침착성과 자신감을 측정한다. 이 척도의 충동성은 반드시 행동이 외부적으로 표현되는 것을 의미하진 않으며 척도 8, 9가 상승하면 비행률이 높고, 반대로 척도 1, 2, 7이 상승하면 비행률이 낮아진다.", "b": "3권 p.92"}, {"id": "B8-1-1", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "MMPI-A 내용 척도 중 청소년기 특유의 정서적 고립감과 \"아무도 나를 이해해주지 않는다\"는 단절감을 측정하는 척도는?", "a": "소외 / 소외척도", "a2": "소외 (A-aln)", "e": "또래나 성인 사회로부터 분리되어 있다고 느끼는 청소년의 심리를 반영합니다.", "b": "3권 p.112 · 3권 p.75 · 3권 p.84"}, {"id": "B8-1-2", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "모든 임상 척도에 공통적으로 섞여 있는 '전반적인 불행감' 요인을 제거하여 각 척도의 변별 타당도를 높이고자 추출한 공통 요인의 명칭은?", "a": "의기소침 / RCd", "a2": "의기소침 (RCd)", "e": "RC 척도 개발의 핵심으로, 전반적인 정서적 불편감을 따로 관리하여 다른 척도의 '알맹이'만 남기게 합니다.", "b": "3권 p.110"}, {"id": "B8-1-3", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "면담법 중 질문의 내용과 순서가 매뉴얼로 고정되어 있어 정보의 수량화가 용이하고 진단의 신뢰도가 높지만, 유연성이 부족한 방식은?", "a": "구조화된 면담", "a2": "구조화된 면담 (Structured Interview)", "e": "내담자의 독특한 역동을 깊이 있게 파악하려면 '비구조화된 면담'이 더 유리합니다.", "b": "3권 p.69 · 3권 p.70"}, {"id": "B8-1-4", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "7-8 코드와 8-7 코드를 비교할 때, 자신의 기이한 생각이나 혼란에 대해 '불안해하며 저항하고 있음'을 시사하여 예후가 더 좋은 코드는?", "a": "7-8 코드", "a2": "7-8 코드", "e": "7번(불안)이 8번(정신증)보다 높다는 것은 아직 증상에 안주하지 않고 싸우고 있다는 건강한 신호입니다.", "b": "3권 p.106 · 3권 p.239 · 3권 p.98"}, {"id": "B8-1-6", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "MMPI-2-RF 및 MMPI-A-RF의 위계 구조 중 가장 상위에 위치하며, 정서적(EID), 사고적(THD), 행동적(BXD) 문제를 포괄하는 척도군은?", "a": "상위 차원 척도", "a2": "상위 차원 척도 (H-O Scales)", "e": "인간 병리의 광범위한 세 영역을 피라미드의 꼭대기에서 조망하는 지표입니다.", "b": "3권 p.118 · 3권 p.120 · 3권 p.119"}, {"id": "B8-1-9", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "척도 1(Hs)과 3(Hy)이 동반 상승하고 2(D)가 상대적으로 낮은 형태로, 심리적 갈등을 신체 증상으로 전환하여 우울을 부인하는 프로파일의 명칭은 전환 (      )형이라고 한다.", "a": "V", "a2": "전환 V형 (Conversion V)", "e": "자신의 문제를 심리적인 것이 아닌 '신체적인 병'으로만 보려 하므로 통찰 치료에 대한 저항이 매우 강하고 예후가 불량합니다.", "b": "3권 p.98 · 3권 p.91 · 3권 p.89"}, {"id": "B8-1-10", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "성격병리 5요인(PSY-5) 중 도덕적 규범 무시, 위험 감수, 낮은 자기통제력을 특징으로 하며 척도 4번 및 9번과 관련이 깊은 지표는?", "a": "통제결여 / DISC", "a2": "통제결여 (DISC; Disconstraint)", "e": "제약(Constraint)이 없다는 뜻으로, 충동 통제의 실패와 비순응성을 측정합니다.", "b": "3권 p.122 · 3권 p.116 · 3권 p.26"}, {"id": "B8-2-2", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "자신의 심각한 고통을 자각하고 변화하려는 의지가 강해, 통찰 중심 상담에서 치료 동기가 가장 높고 예후가 좋은 것으로 알려진 코드는? 아래 양식과 같이 답변하시오.\n0-0 코드", "a": "2-7 코드 / 7-2 코드", "a2": "2-7 / 7-2 코드", "e": "우울(2)과 강박적 불안(7)이 결합되어 스스로를 끊임없이 성찰하고 고통에서 벗어나고 싶어 하는 집단입니다.", "b": "3권 p.98 · 3권 p.109 · 3권 p.101"}, {"id": "B8-2-3", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "자신의 증상이 심리적 문제임을 자각하고 변화하려는 의지가 있는지 사정하는 MSE의 핵심 영역은?", "a": "병식", "a2": "병식 (Insight)", "e": "병식이 결여된 내담자는 치료에 대한 저항이 매우 강하므로 초기 사정이 필수적입니다.", "b": "3권 p.98 · 3권 p.70 · 3권 p.149"}, {"id": "B8-2-4", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "검사 결과에 채점자의 주관이 배제된 정도를 의미하며, '채점자 간 신뢰도'라고도 불리는 지표는?", "a": "객관도", "a2": "객관도 (Objectivity)", "e": "채점 루브릭(기준)의 명료화와 채점자 훈련을 통해 높일 수 있습니다.", "b": "3권 p.66 · 3권 p.67"}, {"id": "B8-2-5", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "해당 문항이 능력이 높은 집단과 낮은 집단을 얼마나 잘 구별해내느냐를 나타내며, 수치가 음(-)으로 나올 경우 문항 오류를 의심해야 하는 지표는?", "a": "문항 변별도", "a2": "문항 변별도 (Item Discrimination)", "e": "상위권은 맞히고 하위권은 틀리는 문항이 변별도가 높은 양호한 문항입니다.", "b": "3권 p.68"}, {"id": "B8-2-10", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "MMPI-2와 MMPI-A의 가장 큰 차이점 중 하나로, 성인용에서는 방어적 태도를 보정하기 위해 사용하지만 청소년용에서는 적용하지 않는 절차는 (      )교정이라고 한다.", "a": "K", "a2": "K 교정 (K-Correction)", "e": "청소년은 발달 특성상 방어성이 성인과 다른 양상을 띠므로, 1, 4, 7, 8, 9번 척도에 K점수를 더하는 보정을 실시하지 않습니다.", "b": "3권 p.75 · 3권 p.73 · 3권 p.117"}, {"id": "B8-3-1", "s": "심리검사", "f": "Ⅱ", "y": "", "no": 0,
