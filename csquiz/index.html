  const st=srcText(q,withSubj);const src=st?`<div class="src">출처: ${st}</div>`:"";
  return `<div class="card" data-id="${q.id}"><div class="qn"><span class="lab">${label}</span>${cntHtml(q.id)}</div><div class="q">${fmt(q.q)}</div>
<div class="ctl"><button class="star${starred(q.id)?" on":""}" aria-label="즐겨찾기" aria-pressed="${starred(q.id)}" onclick="toggleStar('${q.id}',this)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 16.7l-5.8 3 1.1-6.5L2.6 9.6l6.5-.9z"/></svg></button><button class="btn" onclick="toggle(this)">정답 확인하기</button></div>
<div class="ans"><div class="ai"><div class="pad">${fmt("정답: "+(q.a2||q.a).replace(/\s*\n\s*/g," "))}<div class="e">${fmt(q.e,q.a)}</div>${src}${q.b?`<div class="book"><span>교재</span>${esc(q.b)}</div>`:""}
${judgeHtml(q.id)}</div></div></div></div>`;
}
function setBtn(b,state){b.textContent=state==="open"?"정답 숨기기":state==="graded"?"채점됨":"정답 확인하기";b.classList.toggle("open",state!=="closed");b.classList.toggle("graded",state==="graded")}
function closedState(card){return card.classList.contains("graded")?"graded":"closed"}
function toggle(b){const a=b.closest(".card").querySelector(".ans");const top=b.getBoundingClientRect().top;
  const on=!a.classList.contains("show");
  if(on){document.querySelectorAll(".ans.show").forEach(o=>{if(o===a)return;o.classList.add("instant");o.classList.remove("show");void o.offsetHeight;o.classList.remove("instant");const ob=o.closest(".card").querySelector(".btn");if(ob&&ob.classList.contains("btn")){setBtn(ob,closedState(o.closest(".card")));return;ob.textContent="정답 확인하기";ob.classList.remove("open")}})}
  a.classList.toggle("show",on);setBtn(b,on?"open":closedState(b.closest(".card")));
  const delta=b.getBoundingClientRect().top-top;if(delta)window.scrollBy(0,delta);}
function judge(id,v,btn){
  const card=btn.closest(".card");
  if(v==="reset"){const j=btn.parentElement;if(!j.classList.contains("arm")){j.classList.add("arm");j.innerHTML=`<span class="ask">기록을 지울까요?</span><button class="rs danger" onclick="judge('${id}','reset',this)">지우기</button><button class="rs" onclick="unarm(this,'${id}')">취소</button>`;return}
    const now=Date.now();keysOf(id).forEach(k=>{if(M[k]||k===id)M[k]={ok:0,ng:0,u:now}});card.querySelector(".judge").outerHTML=judgeHtml(id)}
  else{M[id]=M[id]||{ok:0,ng:0};M[id][v]=(M[id][v]||0)+1;M[id].u=Date.now();noteDraw(id,v)}
  save();
  const c=cnt(id);
  card.querySelector(".judge .ok span").textContent=c.ok;card.querySelector(".judge .ng span").textContent=c.ng;
  const qn=card.querySelector(".qn");const old=qn.querySelector(".cnt");if(old)old.remove();qn.insertAdjacentHTML("beforeend",cntHtml(id));
  if(v!=="reset"){card.classList.add("graded");const a=card.querySelector(".ans");a.classList.remove("show");setBtn(card.querySelector(".btn"),"graded")}
  stat();updSummary(card);queueSync();
}

const SYNC="https://script.google.com/macros/s/AKfycbxdfzi98P3OmT-tcEfmVScw4rp_QP0tASPPD_vMhXfGJ4rDj4msu6bRALh7_cgaF-HZ/exec";
let SY={nick:"",code:"",last:"",resetAt:0};try{SY=Object.assign(SY,JSON.parse(localStorage.getItem(KEY+"_sync")||"{}"))}catch(e){}
function saveSY(){try{localStorage.setItem(KEY+"_sync",JSON.stringify(SY))}catch(e){}}
async function skey(n=SY.nick,c=SY.code){const t=(n||"").trim()+"#"+(c||"").trim();const b=new TextEncoder().encode(t);const h=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(h)].slice(0,16).map(x=>x.toString(16).padStart(2,"0")).join("")}
function applyReset(at){if(!at)return;if(at>(SY.resetAt||0))SY.resetAt=at;for(const k in M){if((M[k].u||0)<at)M[k]={ok:0,ng:0,u:at}}}
function mergeInto(a,b){for(const id in b){const x=a[id],y=b[id]||{};if(!x){a[id]={ok:y.ok||0,ng:y.ng||0,u:y.u||0};continue}
  const xu=x.u||0,yu=y.u||0;if(xu||yu){if(yu>xu)a[id]={ok:y.ok||0,ng:y.ng||0,u:yu}}else a[id]={ok:Math.max(x.ok||0,y.ok||0),ng:Math.max(x.ng||0,y.ng||0),u:0}}return a}
let syncTimer=null,syncBusy=false,syncMsg="";
function syncStatus(m){syncMsg=m;if(!syncEdit)renderSync()}   // 입력 중인 로그인 칸은 다시 그리지 않음

function hhmm(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function acct(){return SY.nick+"#"+SY.code}
function wipeLocal(){M={};CUR=null;saveCur();LASTSCORE=null;SY.resetAt=0;SY.synced="";save()}   // 이 기기의 기록은 로그인한 아이디의 사본
async function pullSync(){if(!SYNC||!SY.nick)return;const who=acct();try{syncStatus("불러오는중");const r=await fetch(SYNC+"?key="+await skey()+"&nick="+encodeURIComponent(SY.nick));const j=await r.json();if(who!==acct())return;if(j.error==="code"){codeFail();return}
  if(j.ok){if(!j.data&&SY.synced===who){wipeLocal();render()}   // 시트에서 지운 아이디는 0부터
    else{applyReset(j.resetAt);if(j.data){M=mergeInto(M,j.data);SY.synced=who}save();refreshCounts()}}
  SY.last=hhmm();saveSY();syncStatus("")}catch(e){syncStatus("불러오기 실패")}}
async function pushSync(){if(!SYNC||!SY.nick||syncBusy)return false;syncBusy=true;const who=acct();try{const r=await fetch(SYNC,{method:"POST",body:JSON.stringify({key:await skey(),nick:SY.nick,code:SY.code,data:M})});const j=await r.json();if(who!==acct())return false;if(j.error==="code"){codeFail();return false}if(j.ok){const before=JSON.stringify(M);applyReset(j.resetAt);if(j.data)M=mergeInto(M,j.data);SY.synced=who;save();if(JSON.stringify(M)!==before)refreshCounts()}SY.last=hhmm();saveSY();syncStatus("");return !!j.ok}catch(e){syncStatus("저장 실패");return false}finally{syncBusy=false}}
function queueSync(){if(!SYNC||!SY.nick)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,1500)}
let syncEdit=false;
function renderSync(){const el=document.getElementById("sync");if(!el)return;
  if(!SYNC){el.innerHTML="<span>기록은 이 기기에만 저장됩니다.</span>";return}
  if(syncEdit||!SY.nick){el.innerHTML=`<form onsubmit="return setSync(event)"><input id="sy-nick" placeholder="닉네임" value="${esc(SY.nick)}" autocomplete="off"><input id="sy-code" placeholder="숫자 코드" inputmode="numeric" value="${esc(SY.code)}" autocomplete="off"><span class="bt"><button class="go" type="submit">연결</button>${SY.nick?'<button type="button" onclick="cancelEdit()">취소</button>':""}</span><span class="msg${syncMsg?" err":""}">${syncMsg||"로그인하면 어디서든 이어할 수 있습니다."}</span></form>`;return}
  const st=syncMsg?syncMsg:(SY.last||"");
  el.innerHTML=`<span class="st"><b>${esc(SY.nick)}</b> 동기화중${st?`(${esc(st)})`:""}</span><span class="bt"><button onclick="pullSync()">새로고침</button><button onclick="syncEdit=true;renderSync()">변경</button></span>`}
function cancelEdit(){syncEdit=false;syncMsg="";renderSync()}
async function setSync(e){e.preventDefault();const n=document.getElementById("sy-nick").value.trim(),c=document.getElementById("sy-code").value.trim();if(!n||!c){formMsg("닉네임과 코드를 모두 넣어주세요",true);return false}
  if(n===SY.nick&&c===SY.code){syncEdit=false;syncMsg="";renderSync();pullSync();return false}
  formMsg("확인중");let chk;try{const r=await fetch(SYNC+"?key="+await skey(n,c)+"&nick="+encodeURIComponent(n));chk=await r.json()}catch(e){chk={ok:false}}
  if(!chk.ok){formMsg(chk.error==="code"?"코드가 일치하지 않습니다":"연결 실패. 다시 시도해 주세요",true);return false}
  syncEdit=false;syncMsg="";
  clearTimeout(syncTimer);while(syncBusy)await new Promise(r=>setTimeout(r,100));
  if(SY.nick){if(!await pushSync()){syncEdit=true;syncMsg="기록 저장 실패. 다시 시도해 주세요";renderSync();return false}}   // 떠나는 아이디의 기록을 서버에 저장
  else if(Object.keys(M).length){try{localStorage.setItem(KEY+"_guest",JSON.stringify(M))}catch(e){}}
  wipeLocal();SY.nick=n;SY.code=c;SY.last="";saveSY();render();renderSync();
  await pullSync();render();await pushSync();return false}
function refreshCounts(){   // 열린 상태를 유지한 채 카운트만 갱신
  document.querySelectorAll(".card").forEach(c=>{const id=c.dataset.id;if(!id)return;const n=cnt(id);
    const qn=c.querySelector(".qn");if(qn){const old=qn.querySelector(".cnt");if(old)old.remove();qn.insertAdjacentHTML("beforeend",cntHtml(id))}
    const o=c.querySelector(".judge .ok span"),x=c.querySelector(".judge .ng span");if(o)o.textContent=n.ok;if(x)x.textContent=n.ng;const st=c.querySelector(".star");if(st)st.classList.toggle("on",starred(id))});
  document.querySelectorAll("details.theme[data-s]").forEach(d=>{const c=subjStat(d.dataset.s);const l2=d.querySelector("summary small .l2");if(l2)l2.innerHTML=sumHtml(c.ok,c.ng);const l1=d.querySelector("summary small .l1");if(cur==="star"&&l1)l1.textContent=favN(d.dataset.s)+"문제"});
  const b=document.querySelector(".board .score");if(b)b.textContent=drawSummary();
  stat();
}
function stat(){let ok=0,ng=0;for(const k in M){if(/^[DS]:/.test(k))continue;ok+=M[k].ok||0;ng+=M[k].ng||0}
  document.getElementById("stat").innerHTML=`<span>맞음 <b style="color:var(--ok)">${ok}</b> · 틀림 <b style="color:var(--ng)">${ng}</b></span>`;}
function weight(q){const c=cnt(q.id);return (1+c.ng*1.5)/(1+c.ok)}   // 틀림이 많으면 자주, 맞음이 많으면 드물게
const CKEY=KEY+"_cur";
const QBY={};Q.forEach(q=>QBY[q.id]=q);
let CUR=null;try{CUR=JSON.parse(localStorage.getItem(CKEY)||"null")}catch(e){CUR=null}
if(CUR){CUR.ids=[...new Set(CUR.ids.map(canon))];const r={};for(const k in CUR.res||{})r[canon(k)]=CUR.res[k];CUR.res=r}
function saveCur(){try{if(CUR)localStorage.setItem(CKEY,JSON.stringify(CUR));else localStorage.removeItem(CKEY)}catch(e){}}
function draws(){const out=[];for(const k in M){if(!k.startsWith("D:"))continue;const e=M[k];if((e.ok||0)+(e.ng||0)===0)continue;const parts=k.split(":");out.push({ts:+parts[1],ids:(parts[2]||"").split(",").filter(Boolean),ok:e.ok||0,ng:e.ng||0})}return out.sort((a,b)=>a.ts-b.ts)}
function subjCounts(){const c={};const add=id=>{const q=QBY[canon(id)];if(q)c[q.s]=(c[q.s]||0)+1};draws().forEach(d=>d.ids.forEach(add));if(CUR)CUR.ids.forEach(add);return c}
function pickWeighted(list){let s=list.reduce((a,q)=>a+weight(q),0),r=Math.random()*s;for(const q of list){r-=weight(q);if(r<=0)return q}return list[list.length-1]}
function drawRandom(){
  const pool=Q.filter(q=>inChip(q,RF));
  const DR=subjCounts();
  const subjects=[...new Set(pool.map(q=>q.s))];
  subjects.sort((a,b)=>((DR[a]||0)-(DR[b]||0))||(Math.random()-0.5)); // 덜 나온 과목 먼저
  const out=[];
  subjects.slice(0,10).forEach(sj=>{const list=pool.filter(q=>q.s===sj);if(list.length)out.push(pickWeighted(list))});
  out.sort((a,b)=>{const x=cnt(a.id),y=cnt(b.id);return (y.ng-y.ok)-(x.ng-x.ok)});   // 틀림이 많은 문제가 앞으로
  CUR={ts:Date.now(),ids:out.map(q=>q.id),res:{},rf:RF};saveCur();
  return out;
}
function curList(){return CUR?CUR.ids.map(id=>QBY[id]).filter(Boolean):[]}

  if(!CUR||!CUR.ids.includes(id)||CUR.res[id])return;

function examProg(){const done=CUR?CUR.ids.filter(x=>CUR.res[x]).length:0;return done?`이번 시험 ${done}/${CUR.ids.length} 채점`:"시험이 시작되었습니다. 결과를 기록합니다!"}

function finishExam(){if(!CUR)return;const ok=CUR.ids.filter(x=>CUR.res[x]==="ok").length;
  M["D:"+CUR.ts+":"+CUR.ids.join(",")]={ok:ok,ng:CUR.ids.length-ok,u:Date.now()};save();queueSync();CUR=null;saveCur();LASTSCORE=ok*10;render();}
let LASTSCORE=null;
function drawSummary(){const d=draws();if(!d.length)return "아직 끝낸 회차가 없습니다.";const ok=d.reduce((a,x)=>a+x.ok,0),tot=d.reduce((a,x)=>a+x.ok+x.ng,0);return `${d.length}회 · 평균 ${Math.round(100*ok/tot)}점 (${ok}/${tot})`}
let cur="subj",pick=[],wsort="count",fsort="subj",RF="전체";const FILT={};
const CHIPS=[{k:"전체",l:"전체<br>문항"},{k:"기본",l:"기본<br>랜덤"},{k:"쉽게",l:"쉬운<br>랜덤"},{k:"어렵게",l:"어려운<br>랜덤"}];
const ORDER={};
function inChip(q,c){return c==="전체"||(c==="기본"?q.f==="Ⅰ":q.d===c)}
function chipBtn(x,on,click,n){return `<button class="${on?"on":""}" onclick="${click}"><span>${x}</span>${n!=null?`<small>${n}</small>`:""}</button>`}
function shuffled(list){return list.map(q=>{const c=cnt(q.id);return [c.ok+c.ng,Math.random(),q]}).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2])}   // 풀이 횟수가 적은 문제가 위로, 같으면 무작위
function subjBox(sj,i,n,inner){const c=subjStat(sj);return `<details class="theme" data-s="${esc(sj)}"><summary><span>${i+1}. ${esc(sj)}</span><small><span class="l1">${n}문제</span><span class="l2">${sumHtml(c.ok,c.ng)}</span></small></summary>${inner}</details>`}
function fillSubj(d){const sj=d.dataset.s,c=FILT[sj]||"전체",all=Q.filter(q=>q.s===sj);
  if(cur==="star"){d.querySelector(".list").innerHTML=all.filter(q=>starred(q.id)).map((q,i)=>card(q,i)).join("")||`<div class="empty">이 영역에 별표를 누른 문제가 없어요.</div>`;return}
  d.querySelector(".chips").innerHTML=CHIPS.map(x=>chipBtn(x.l,x.k===c,`setChip(this,'${x.k}')`,all.filter(q=>inChip(q,x.k)).length)).join("");
  const list=c==="전체"?all:ORDER[sj].map(id=>QBY[id]);

  if(c==="전체")delete ORDER[sj];else ORDER[sj]=shuffled(Q.filter(q=>q.s===sj&&inChip(q,c))).map(q=>q.id);

function closeSubj(){const d=document.querySelector("details.theme[data-s][open]");if(!d)return;d.open=false;d.scrollIntoView()}
function updFloat(){document.getElementById("fclose").hidden=!document.querySelector("details.theme[data-s][open]")}
function rate(c){return c.ok+c.ng?c.ng/(c.ok+c.ng):0}
function wcmp(a,b){const x=cnt(a.id),y=cnt(b.id);return wsort==="count"?(y.ng-x.ng)||(rate(y)-rate(x)):(rate(y)-rate(x))||(y.ng-x.ng)}
function mix(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
function acc(q){const c=cnt(q.id),t=c.ok+c.ng;return t?c.ok/t:null}
function starList(){const w=Q.filter(q=>starred(q.id));if(fsort==="random")return mix(w);if(fsort!=="low")return w;
  return w.sort((a,b)=>{const x=acc(a),y=acc(b);if(x===null||y===null)return (x===null)-(y===null);return x-y})}   // 안 푼 문제는 맨 뒤
function wrongList(){const w=Q.filter(q=>cnt(q.id).ng>0).sort(wcmp);if(wsort!=="random")return w;   // 정답률 낮은 순으로 20문제씩 구간을 나누고 구간 안에서만 섞음
  let out=[];for(let i=0;i<w.length;i+=20)out=out.concat(mix(w.slice(i,i+20)));return out}
function view(v,b){cur=v;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()}
/* 아코디언: 하나를 열면 나머지는 닫고, 연 제목의 화면 위치는 그대로 유지 */
function onToggle(e){const d=e.target;updFloat();
  if(!d.open){d.querySelectorAll(".card.graded").forEach(c=>{c.classList.remove("graded");const b=c.querySelector(".btn");if(b&&!c.querySelector(".ans.show"))setBtn(b,"closed")});return;}
  if(d.dataset.s&&!d.querySelector(".card"))fillSubj(d);
  const top=d.getBoundingClientRect().top;
  document.querySelectorAll("details.theme[open]").forEach(o=>{if(o!==d){o.querySelectorAll(".ans.show").forEach(a=>{a.classList.add("instant");a.classList.remove("show");void a.offsetHeight;a.classList.remove("instant");setBtn(a.closest(".card").querySelector(".btn"),"closed")});o.open=false}});
  const delta=d.getBoundingClientRect().top-top;if(delta)window.scrollBy(0,delta);}
function render(){stat();document.getElementById("fclose").hidden=true;const box=document.getElementById("box");
  if(cur==="subj"){const subs=[...new Set(Q.map(q=>q.s))];
    box.innerHTML=subs.map((sj,i)=>subjBox(sj,i,Q.filter(q=>q.s===sj).length,`<div class="chips"></div><div class="list"></div>`)).join("");
    box.querySelectorAll("details.theme").forEach(d=>d.addEventListener("toggle",onToggle));}
  else if(cur==="random"){pick=curList();
    const board=`<div class="board"><div class="brow"><div class="score">${drawSummary()}</div>${LASTSCORE!=null?`<div class="last">방금 ${LASTSCORE}점 기록됨</div>`:""}</div></div>`;
    const inExam=pick.length>0,rf=inExam?(CUR.rf||"전체"):RF;   // 시험 중에는 범위를 보여 주기만 하고 바꿀 수 없음
    const chips=`<div class="chips top">${["전체","쉽게","어렵게"].map(x=>chipBtn(x==="전체"?x:DL[x],x===rf,inExam?"":`RF='${x}';render()`)).join("")}</div>`;
    if(!inExam){box.innerHTML=board+chips+`<div class="tools"><button class="draw" onclick="startExam()">무작위로 10문제 뽑고 시험보기</button></div>`;}
    else{LASTSCORE=null;box.innerHTML=board.replace(/<div class="last">.*?<\/div>/,"")+chips+`<div class="tools"><button class="quit" onclick="quitExam()">여기까지 저장하고 시험 포기하기</button></div><div class="cov" id="exam-prog">${examProg()}</div><details class="theme plain" open><summary></summary>${pick.map((q,i)=>card(q,i,true)).join("")}</details><div class="tools"><button class="draw" onclick="finishExam()">기록 저장하고 시험 끝내기</button></div>`;}}
  else if(cur==="star"){const w=starList();
    const bar=`<div class="tools">${[["subj","영역순"],["low","낮은 정답률"],["random","랜덤풀이"]].map(([k,l])=>`<button class="${fsort===k?"on":""}" onclick="fsort='${k}';render()">${l}</button>`).join("")}</div>`;
    if(w.length&&fsort==="subj"){const subs=[...new Set(Q.map(q=>q.s))];box.innerHTML=bar+subs.map((sj,i)=>subjBox(sj,i,favN(sj),`<div class="list"></div>`)).join("");box.querySelectorAll("details.theme").forEach(d=>d.addEventListener("toggle",onToggle));return}
    box.innerHTML=bar+(w.length?`<details class="theme plain" open><summary></summary>${w.map((q,i)=>card(q,i,true)).join("")}</details>`:`<div class="theme"><div class="empty">별표를 누른 문제가 아직 없어요.<br>문제 아래 별표를 누르면 여기에 모입니다.</div></div>`);}
  else{const w=wrongList();
    const sortBar=`<div class="tools"><button class="${wsort==="count"?"on":""}" onclick="wsort='count';render()">많이 틀린 순</button><button class="${wsort==="rate"?"on":""}" onclick="wsort='rate';render()">낮은 정답률 순</button><button class="${wsort==="random"?"on":""}" onclick="wsort='random';render()">랜덤 풀이</button></div>`;
    box.innerHTML=sortBar+(w.length?`<details class="theme plain" open><summary></summary>${w.map((q,i)=>card(q,i,true)).join("")}</details>`:`<div class="theme"><div class="empty">틀림으로 표시한 문제가 아직 없어요.<br>정답을 확인한 뒤 "틀림"을 누르면 여기에 모입니다.</div></div>`);}
}
render();renderSync();pullSync().then(()=>{if(SY.synced===acct())pushSync()});
setInterval(()=>{if(document.visibilityState==="visible"&&!syncBusy)pullSync()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pullSync()});
</script></body></html>
