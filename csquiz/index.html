<script>
const Q=[{"id": "1-1", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 1, "d": "어렵게", "q": "다음 설명을 읽고 빈칸에 알맞은 용어를 쓰시오.\n\n성격을 정의하는 요소 중 하나로, 주로 유전적·생물학적 기초를 두고 생애 초기부터 나타나는 정서적 반응 양식을 (      )이라고 한다.", "a": "기질", "a2": "기질 (Temperament)", "e": "기질은 환경의 영향을 받기 전, 개인이 타고난 생물학적 바탕을 의미합니다.", "b": "1권 p.46 · 3권 p.371 · 1권 p.66"}, {"id": "1-2", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 2, "d": "어렵게", "q": "성격이론을 평가하는 과학적 준거에 대한 설명이다. 빈칸에 알맞은 용어를 쓰시오.\n\n성격이론은 가급적 적은 수의 핵심 개념으로 가능한 많은 현상을 설명할 수 있어야 한다는 원리를 (      ) 또는 간결성이라고 한다.", "a": "경제성", "a2": "경제성 (Parsimony)", "e": "복잡한 현상을 단순하고 명료한 원리로 설명할 수 있는 이론이 좋은 이론으로 평가받습니다.", "b": "1권 p.48"}, {"id": "1-3", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 3, "d": "어렵게", "q": "블록(Block)이 제시한 성격 측정 자료(LOTS) 중 다음에 해당하는 자료의 명칭을 쓰시오.\n\n학교 성적표, 범죄 기록, 취업 이력, 이혼 경력 등과 같이 한 개인의 생애사적 기록이나 공공 기록을 통해 얻는 객관적 정보를 (      )라고 한다.", "a": "L자료 / 생애기록자료", "a2": "L-자료 (Life record data), 생애기록자료", "e": "Life의 앞 글자를 따온 것으로, 수검자의 주관적 보고 없이도 확인할 수 있는 삶의 흔적 자료입니다.", "b": "1권 p.49"}, {"id": "1-4", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "성격 연구 방법 중 다음이 설명하는 방법을 쓰시오.\n\n한 개인의 성격을 깊이 있게 이해하기 위해 면접, 관찰 등을 통해 장기간 심층적으로 연구하는 방법으로, 프로이트의 정신분석 발전에 큰 기여를 한 이 방법은 (      )이다.", "a": "사례 연구 / 임상법", "a2": "사례 연구 (Case study / 임상법)", "e": "개별 사례의 독특성을 파악하기엔 유리하지만, 연구 결과를 전체 인구로 일반화하기 어렵다는 단점이 있습니다.", "b": "1권 p.51 · 1권 p.59 · 1권 p.56"}, {"id": "1-5", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "캠벨(Campbell)의 성격 평가 분류 차원에 근거하여 빈칸에 알맞은 용어를 쓰시오.\n\n캠벨은 성격 평가 방식을 세 가지 차원(구조-비구조, 위장-비위장, 자발-객관)으로 분류하였다. 이 중 로르샤흐(Rorschach)나 주제통각검사(TAT)와 같은 투사 검사는 ( ① ), ( ② ), ( ③ ) 검사의 조합에 해당한다.", "a": "비구조 / 위장 / 자발", "a2": "① 비구조 (Unstructured), ② 위장 (Disguised), ③ 자발 (Voluntary)", "e": "투사 검사는 자극이 모호하여 반응 형식이 정해져 있지 않고(비구조), 무엇을 재려는지 숨겨져 있으며(위장), 피검자가 스스로 반응을 선택(자발)하는 특징이 있습니다.", "b": "1권 p.52"}, {"id": "1-6", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 6, "d": "쉽게", "q": "캠벨(Campbell)의 성격 평가 분류 차원에 근거하여 빈칸에 알맞은 용어를 쓰시오.\n\nMMPI나 MBTI와 같은 자기보고식 객관적 검사는 캠벨의 분류 중 ( ① ), 비위장, 자발 검사의 조합에 해당한다. 빈칸 ①에 들어갈 용어를 쓰시오.", "a": "구조 / 구조화", "a2": "① 구조 (Structured)", "e": "자기보고식 검사는 질문 내용과 응답 형식이 정해져 있는 '구조'적 검사이며, 측정 목적이 드러나 있고(비위장), 피검자가 자신의 의사에 따라 응답(자발)합니다.", "b": "1권 p.52 · 1권 p.21"}, {"id": "1-7", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "성격의 주요 속성인 '안정성'과 '일관성'의 차이를 이해하고 빈칸에 알맞은 용어를 쓰시오.\n\n질문: 성격은 시간과 상황의 변화에도 불구하고 비교적 변하지 않는 속성을 지닌다. 이 중 ( ① )은 어릴 때의 성격이 성인이 되어서도 크게 변하지 않는 것과 같이 '시간의 경과'에도 불구하고 나타나는 한결같음을 의미하며, ( ② )은 집에서나 학교에서나 비슷한 행동 양식을 보이는 것과 같이 '상황의 변화'에도 불구하고 나타나는 공통된 반응 경향성을 의미한다.", "a": "안정성 / 일관성", "a2": "① 안정성 (Stability), ② 일관성 (Consistency)", "e": "안정성: 시간적 차원 (어제-오늘-내일의 유사성), 일관성: 상황적 차원 (상황 A-상황 B의 유사성)", "b": "1권 p.46"}, {"id": "1-8", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 8, "d": "어렵게", "q": "성격을 범주화하여 비연속적으로 분류하는 방식을 ( ① )이라 하고, 연속선상에서 양적인 정도의 차이로 이해하는 방식을 ( ② )이라고 한다.", "a": "유형 / 특질", "a2": "① 유형(type), ② 특질(trait)", "e": "유형은 질적 접근이자 상호 배타적 범주이며, 특질은 양적 접근이자 연속성을 가정합니다.", "b": "1권 p.53 · 1권 p.54"}, {"id": "1-9", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 9, "d": "어렵게", "q": "성격의 개인차를 질적인 차이로 간주하여 서로 중복되지 않는 배타적인 범주에 할당하는 방식을 ( ① ) 분류라고 하며, 개인차를 양적인 정도의 문제로 보아 성격 차원의 특정 지점으로 평가하는 방식을 ( ② ) 분류라고 한다.", "a": "범주적 / 차원적", "a2": "① 범주적 분류, ② 차원적 분류", "e": "범주적 분류는 성격유형론(MBTI 등)에서 주로 사용하며 흑백논리적 특징을 보이고, 차원적 분류는 특질론(Big 5 등)에서 주로 사용하며 연속성을 가정합니다.", "b": "1권 p.54"}, {"id": "1-10", "s": "성격심리학", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "일반적이고 모호한 성격 묘사를 자신에게만 해당되는 정확한 것으로 믿는 현상을 무엇이라 하는가?", "a": "포러 효과 / 바넘 효과", "a2": "포러 효과 (또는 바넘 효과)", "e": "타로점이나 혈액형 성격설이 잘 맞는다고 느끼는 심리적 기제입니다.", "b": "1권 p.54"}, {"id": "12-1", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "다음 중 릭맨(Ryckman) 등이 제시한 성격이론의 평가준거가 아닌 것을 고르시오.\n\n① 검증성\n② 경제성\n③ 포괄성\n④ 독특성\n⑤ 경험적 타당성", "a": "4", "a2": "4 독특성", "e": "릭맨의 성격이론 평가준거는 검증성, 경제성, 포괄성, 경험적 타당성, 탐구성, 적용성이 있다.", "b": "1권 p.48 · 1권 p.20"}, {"id": "12-2", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "성격의 연구방법 가운데, (      )연구는 연구 상황이 인위적이고 자연스럽지 못하게 되어 연구결과를 일반화하기 어려워진다. 하지만 모든 성격 연구 방법 중에서 (      )를 가장 강력하게 밝혀 줄 수 있다.", "a": "실험 / 인과관계", "a2": "실험 / 인과관계", "e": "사례연구 : 임상 장면에 한 개인을 집중적으로 깊게 연구\n상관연구 : 한 변인과 다른 변인 간의 관계 규명\n실험연구 : 알아보고자 하는 변인을 실험자의 의도대로 조작하여 다른 변인에 미치는 영향을 밝히고 인과관계를 확립하기 위한 연구", "b": "1권 p.51 · 1권 p.52"}, {"id": "12-3", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음 괄호 부분에 해당하는 올포트(Allport)의 특질 종류를 쓰시오.\n\n중학교 2학년인 수경이는 평소에는 조용하고 소극적으로 반에서는 거의 말을 하지 않는 모습을 보인다. <하지만 친한 친구인 은경이 앞에서는 춤도 추고 노래도 부르면서 장난을 많이 치고, 종일 수다스러운 모습을 보인다.>", "a": "이차적 성향 / 이차 성향 / 이차적 특질", "a2": "이차적 성향 / 이차 성향 / 이차적 특질", "e": "이차적 성향(이차적 특질) : 중심특질보다는 약하지만 특정 대상이나 특정 상황에 대한 행동경향성", "b": "1권 p.56 · 1권 p.22"}, {"id": "12-4", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "Cattell의 특질의 종류 중에서 대다수 사람과 공유하지 않고 한 개인이나 소수에게만 나타나는 특질을 (      )이라고 하며, 한 개인의 정서적 수준과 행동스타일을 결정하고 환경적 자극에 얼마나 빠르게 적극적이고 정서적으로 반응하는지 알 수 있게 해주는 것을 (      )이라고 한다.", "a": "독특한 특질 / 기질 특질", "a2": "독특한 특질 / 기질 특질", "e": "카텔의 특질 종류\n보편성 기준 : 공통특질 vs. 독특한 특질\n안정성과 영속성 기준 : 표면특질 vs. 근원특질\n능력특질 vs. 기질특질\n역동적 특질 : 에르그, 견해, 태도", "b": "1권 p.60 · 1권 p.23 · 1권 p.59"}, {"id": "12-5", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "(가)~(나)에 해당하는 블록(Block)의 성격측정 자료의 종류를 순서대로 쓰시오.\n\n강교사는 학교적응에 어려움을 겪고 있는 연수의 (가) 부모님과 면담을 통해 연수의 어린시절 성장과정을 듣고, 가정에서는 어떠한 모습으로 생활하는지 상담하였다. 또한 (나) 연수에게 MMPI-A와 TCI검사 등 심리검사를 실시하였다.", "a": "관찰자 자료 / 자기보고식 자료", "a2": "관찰자 자료 / 자기보고식 자료", "e": "블록의 성격측정 자료의 종류는 생애기록 자료, 관찰자 자료, 객관적 검사자료, 자기보고식 자료가 있다. (LOTS)", "b": "1권 p.49"}, {"id": "12-6", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "다음 사례에 해당하는 올포트(Allport)의 특질 종류를 쓰시오.\n\n지혜는 학급에서 친구들과의 교우관계가 원만하며, 늘 친구들을 배려하는 모습을 보인다. 선생님들 사이에서도 착한 학생이라고 불리며, 거의 모든 행동에서 친절함과 배려의 모습을 보인다. 그러나 지혜의 부모님은 지혜가 집에서는 짜증도 많고, 늘 동생과 싸워서 지혜를 기르는 것이 힘들 때가 많다고 호소하며 담임교사에게 상담을 요청하였다.", "a": "개인특질", "a2": "개인특질", "e": "올포트는 공통특질과 개인특질로 크게 나누었으며, 해당 사례는 중심특질과 이차적 성향의 내용이 나타나 있으므로 개인특질이 정답이 된다.", "b": "1권 p.56 · 1권 p.59"}, {"id": "12-7", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "올포트(Allport)가 제시한 다음의 설명에 해당하는 개념의 명칭을 쓰시오.\n\n이것은 정상적이고 성숙한 성인의 동기는 이전에 발생된 과거와는 기능적으로 관련이 없어지는 것을 의미한다. 즉, 현재의 동기는 원래의 상황과는 무관하게 자율적인 기능을 가진다는 것이다.", "a": "기능적 자율성", "a2": "기능적 자율성", "e": "올포트의 ‘기능적 자율성’은 정상적이고 성숙한 성인의 동기는 이전에 발생된 과거와는 기능적으로 관련이 없어지는 것을 의미한다. 즉, 현재의 동기는 원래의 상황과는 무관하게 자율적인 기능을 가진다는 개념이다. 두 가지 수준은 ‘지속적 기능자율성’, ‘고유자아적 기능 자율성’이다.", "b": "1권 p.56"}, {"id": "12-8", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "다음에서 설명하는 카텔(Cattell)의 성격평가 기법을 쓰시오.\n- 질문지를 통한 자기평정 기법을 활용하고, 피험자에게 스스로 자신을 평가하도록 요청한다.\n- 태도, 흥미, 의견을 측정하는 척도와 같은 표준화된 자기보고 성격검사를 포함한 여러 질문지가 사용된다.", "a": "질문지법", "a2": "질문지법", "e": "카텔의 성격평가 기법은 생활기록법, 질문지법, 검사법이 있다.", "b": "1권 p.61"}, {"id": "12-9", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "다음 중 아이젱크(Eysenck)의 특성이론에 대한 설명으로 적절하지 않은 것을 고르시오.\n\n① 내향성은 생리적 각성수준이 높아 최적 자극을 추구하기 위해 사회적 자극을 회피하는 경향이 강하다.\n② 그레이는 아이젱크의 외향성과 신경증보다 충동성과 불안이 더 의미를 갖는다고 본다.\n③ 정신병적 성향은 도파민 수준과 남성호르몬 수준과 관련이 높다.\n④ 신경증은 자율신경계와 관련 있으며, 신경증이 높은 사람은 자율신경계가 더 잘 흥분하고, 스트레스에 더 빠르게 반응하는 경향이 있다.\n⑤ 외향성은 망상체의 활성화에 의해 매개되며, 처벌의 영향을 더 크게 받는다.", "a": "5", "a2": "5 외향성은 망상체의 활성화에 의해 매개되며, 처벌의 영향을 더 크게 받는다.", "e": "아이젱크의 성격의 3가지 차원 중 ‘외향성’은 사회적 환경과 물리적 환경의 외적인 자극에 관심이 많은 사람들의 특징으로서 반대의 극단에는 내면적인 문제에 관심을 지니는 내향성이 존재한다. 외향성의 생물학적 특징은 생리적 각성 수준이 낮아 최적자극을 추구하기 위해 사회적 자극을 추구하는 경향이 높다는 것이다.", "b": "1권 p.63 · 1권 p.64"}, {"id": "12-10", "s": "성격심리학", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "다음은 고경력 상담교사가 쓴 일기장 일부이다. ㉠ 부분에 해당하는 켈리(Kelly)의 추론을 고르시오.\n\n요즘 밈이라고 불리는 각종 유행어부터 다양한 짤, 숏폼 등을 창출해내는 MZ세대들은 자신의 개성을 마음껏 뽐내고 다닌다. 각종 SNS를 통해 여행부터 각종 맛집을 돌아다니고 인증샷을 찍고, 자신의 의상 코디 등을 뽐내는 등 각자만의 스타일대로 자신을 뽐내고 다닌다. 아직 이런 흐름이 익숙하지 않고 따라가기 바쁘지만, 오늘도 숏폼을 통해 하나씩 배워 간다. <㉠ 이제는 MZ의 문화를 받아들이고 이해해줘야 할 것 같다는 생각이 든다.>\n\n① 선택추론\n② 경험추론\n③ 조절추론\n④ 공통성추론\n⑤ 사회성추론", "a": "3", "a2": "3 조절추론", "e": "켈리의 추론은 11가지로 나뉘며, 그 중 조절 추론의 경우 구성개념의 새로운 경험에 대한 적응을 강조한 것으로, 구성개념의 침투성에 따라 새로운 요소를 편리함의 범위에 투과시키거나 받아들이도록 허용하는 것이다.", "b": "1권 p.72"}, {"id": "B1-1-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "로터의 행동잠재력 공식 BP = f(E, RV)에서, E는 ( ① )를, RV는 ( ② )를 의미한다.", "a": "기대 / 강화가치", "a2": "① 기대 (Expectancy), ② 강화가치 (Reinforcement Value)", "e": "특정 행동을 할 가능성은 그 행동이 성과를 낼 확률과 그 성과를 선호하는 정도에 의해 결정됩니다.", "b": "1권 p.76"}, {"id": "B1-1-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "머레이의 이론에서 한 욕구가 다른 욕구를 충족시키기 위한 수단이나 도구로 작용하는 관계를 보조(종속)의 원리라 하고, 하나의 행동이 두 개 이상의 욕구를 동시에 충족시키는 경우를 (      )의 원리라고 한다.", "a": "융합", "a2": "① 보조 (종속), ② 융합", "e": "보조는 욕구 간의 서열(수단-목적)을, 융합은 효율적인 욕구 충족의 양상을 보여줍니다.", "b": "1권 p.109"}, {"id": "B1-1-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "린빌(Linville)에 따르면, 개인이 자신을 정의하는 자아 측면들이 얼마나 다양하고 독립적인지를 의미하는 개념을 무엇이라 하는가?", "a": "자기 복잡성", "a2": "자기 복잡성 (Self-complexity)", "e": "자기 복잡성이 높을수록 특정 영역에서의 실패가 전체 자존감에 미치는 충격이 분산되어 심리적 완충 작용을 합니다.", "b": "1권 p.119 · 3권 p.702"}, {"id": "B1-1-4", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "돌라드와 밀러(Dollard & Miller)의 추동감소 이론에서 학습의 4가지 요소는 추동(Drive), ( ① ), 반응(Response), 보상(Reward)이다.", "a": "단서", "a2": "단서 (Cue)", "e": "단서는 언제, 어디서, 어떤 반응을 할지 결정하는 지표 역할을 합니다.", "b": "1권 p.127"}, {"id": "B1-1-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "자기결정성 이론의 유기적 통합 이론(OIT) 중, 타인의 비난을 피하거나 죄책감을 느끼지 않기 위해 행동하는 조절 동기 수준을 (      )라 한다.", "a": "내사된 조절 / 투사된 조절", "a2": "내사된 조절 (투사된 조절, Introjected Regulation)", "e": "내사는 외적 압박을 내면화했으나 아직 '나의 것'은 아닌 상태이며, 확인은 가치를 개인적으로 중요하게 받아들인 상태입니다.", "b": "1권 p.137 · 1권 p.138"}, {"id": "B1-1-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "설리번은 유아가 양육자와의 관계에서 경험하는 불안의 정도에 따라 세 가지 자아 체계를 형성한다고 보았다. 부모의 칭찬과 보상을 통해 형성된 긍정적 자아상은 ( ① )이며, 참을 수 없는 극심한 불안으로 인해 의식 밖으로 밀려난 공포스러운 자아상은 ( ② )이다.", "a": "좋은 나 / 나 아닌 나", "a2": "① 좋은 나 (Good-me), ② 나 아닌 나 (Not-me)", "e": "'나 아닌 나'는 해리된 영역으로, 주로 꿈이나 정신분열증적 증상을 통해 나타납니다.", "b": "1권 p.105 · 1권 p.106 · 1권 p.34"}, {"id": "B1-1-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "호나이에 따르면, 아동이 부모로부터 적절한 애정과 보호를 받지 못할 때 느끼는 '적대감'이 억압되어 자신과 세상에 대해 느끼는 무력감과 고립감을 무엇이라 하는가?", "a": "기본 불안 / 기본적 불안", "a2": "기본 불안 (Basic Anxiety)", "e": "기본 불안은 신경증의 모태가 되며, 이를 극복하기 위해 개인은 다양한 자아 보호 기제를 발달시킵니다.", "b": "1권 p.102 · 1권 p.103"}, {"id": "B1-1-8", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "카텔의 역동적 특질 중 환경조형특질에 해당하며, 사회적·물리적 환경에서 학습된 태도의 패턴을 (      )라고 한다.", "a": "견해 / 감정", "a2": "견해 (감정, Sentiment)", "e": "에르그와 달리 삶에서 중요하지 않게 되면 사라지거나 바뀔 수 있습니다.", "b": "1권 p.60"}, {"id": "B1-1-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "켈리의 11가지 추론 중, '한 사람이 다른 사람이 사용하는 것과 유사한 경험의 구성개념을 사용하는 정도에 따라 심리적 과정이 유사하다'는 원리는 무엇인가?", "a": "공통성 / 공통성 추론", "a2": "공통성 추론", "e": "같은 문화권 사람들이 유사한 구성개념을 가질 때 나타나는 심리적 유사성을 의미합니다.", "b": "1권 p.72"}, {"id": "B1-2-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "드웩(Dweck)의 암묵적 이론에 따르면, 지능은 변하지 않는다고 믿으며 결과에 초점을 맞추는 유형을 ( ① ) 마음자세라 하고, 노력하면 변할 수 있다고 믿으며 배움에 초점을 맞추는 유형을 ( ② ) 마음자세라고 한다.", "a": "고정 / 성장", "a2": "① 고정 (Fixed), ② 성장 (Growth)", "e": "고정 마음자세는 실패 시 무기력한 방략을 사용하지만, 성장 마음자세는 숙달 지향적 방략을 사용하여 더 높은 성취를 보입니다.", "b": "1권 p.131 · 1권 p.130"}, {"id": "B1-2-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "개인이 현재의 자아를 넘어서 \"미래에 어떤 사람이 될 수 있는가?\" 혹은 \"어떤 사람이 될까 두려운가?\"에 대한 인지적 표상을 마커스(Markus)는 (      )라고 불렀다.", "a": "가능한 자기", "a2": "가능한 자기 (Possible selves)", "e": "현재의 자기개념을 미래와 연결하는 가교 역할을 하며, 행동을 이끄는 강력한 동기적 기능을 수행합니다.", "b": "1권 p.118 · 3권 p.700 · 1권 p.119"}, {"id": "B1-2-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "로터가 강조한 일반화된 기대 중 하나로, 사람들을 믿을 수 있다고 생각하는 정도를 (      )라고 한다.", "a": "대인신뢰", "a2": "대인신뢰", "e": "일반화된 기대는 새로운 상황에 직면할 때 적용되는 범상황적 기대입니다.", "b": "1권 p.76"}, {"id": "B1-2-4", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "설리번이 제시한 발달 단계 중 '청소년 전기(Preadolescence)'의 가장 큰 특징으로, 자신의 비밀을 공유하고 깊은 정서적 유대감을 나누는 동성 친구와의 관계를 의미하는 용어는?", "a": "단짝 / 단짝친구", "a2": "단짝 (Chums)", "e": "단짝 관계를 통해 아동은 타인의 관점을 수용하고 자신의 왜곡된 지각을 수정하는 기회를 갖게 됩니다.", "b": "3권 p.459 · 3권 p.418"}, {"id": "B1-2-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "렉키(Lecky)는 인간이 자신의 기존 자아상과 일치하는 정보를 선택적으로 받아들여 자아의 통합성을 유지하려는 (      ) 동기와, 자신을 가치 있는 존재로 느끼고자 하는 자기 고양 동기를 가진다고 보았다.", "a": "자기 일관성 / 자기 일관성 동기", "a2": "자기 일관성", "e": "때로는 자신에 대한 부정적 신념조차 일관성을 위해 유지하려는 성향이 있어 상담에서의 저항 원인이 되기도 합니다.", "b": "1권 p.120"}, {"id": "B1-2-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "아들러에 따르면 인간은 누구나 타고난 ( ① )을 극복하고 ( ② )을 추구하려는 동기를 가진다.", "a": "열등감 / 우월성", "a2": "① 열등감, ② 우월성", "e": "열등감은 모든 발달의 원동력이 되며, 이를 보상하기 위해 우월성을 추구합니다.", "b": "1권 p.95 · 1권 p.92 · 1권 p.93"}, {"id": "B1-2-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "데시와 라이언이 제시한 인간의 3가지 기본 심리 욕구는 ( ① ), 유능성, ( ② )이다.", "a": "자율성 / 관계성", "a2": "① 자율성 (Autonomy), ② 관계성 (Relatedness)", "e": "이 욕구들이 충족될 때 내재적 동기가 극대화되며 안녕감이 증진됩니다.", "b": "1권 p.135 · 3권 p.729 · 1권 p.136"}, {"id": "B1-2-8", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "모델의 행동 결과가 자신에게 이득이 된다고 판단하거나, 모델이 자신과 유사하거나 유능할 때 학습이 더 잘 일어나는 단계는 관찰학습의 (      ) 과정이다.", "a": "주의집중", "a2": "주의집중", "e": "모델의 특성과 행동의 기능적 가치는 주의집중에 큰 영향을 줍니다.", "b": "1권 p.80"}, {"id": "B1-2-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "로저스에 따르면, 부적응은 유기체적 경험과 (      ) 사이의 불일치에서 비롯된다. 개인은 이 불일치로 인한 불안으로부터 자신을 보호하기 위해 '왜곡'이나 '부인'과 같은 방어기제를 사용한다.", "a": "자기개념 / 자기", "a2": "자기(개념)", "e": "생생한 내적 경험과 타인에 의해 형성된 자아상이 어긋날 때 인간은 심리적 위협을 느낍니다.", "b": "1권 p.116 · 1권 p.117 · 1권 p.119"}, {"id": "B1-2-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "자아실현인이 추구하는 '존재 가치(B-values)'가 좌절될 때 나타나는 냉소주의, 허무주의, 절망과 같은 심리적 고통을 무엇이라 하는가?", "a": "메타 병리", "a2": "메타병리 (Metapathology)", "e": "하위 욕구가 충족되었음에도 불구하고 진리, 정의, 아름다움과 같은 고차원적 가치를 실현하지 못할 때 발생하는 실존적 병리 현상입니다.", "b": "1권 p.114"}, {"id": "B1-3-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "반두라가 제시한 자기조절 실행과정 3단계를 순서대로 쓰시오.", "a": "자기관찰 / 판단과정 / 자기반응", "a2": "자기관찰 → 판단과정 → 자기반응", "e": "자신의 행동을 관찰하고, 기준과 비교한 후, 결과에 따라 스스로 보상이나 처벌을 줍니다.", "b": "1권 p.83"}, {"id": "B1-3-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "몰입의 8채널 모델에서 기술 수준은 높으나 도전 과제의 난이도가 중간 정도여서, 상황을 안정적으로 장악하고 있다고 느끼는 상태를 무엇이라 하는가?", "a": "통제", "a2": "통제 (Control)", "e": "여기서 과제의 난이도를 더 높이면 비로소 '몰입(Flow)' 상태로 진입하게 됩니다.", "b": "1권 p.139 · 1권 p.138"}, {"id": "B1-3-4", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "원초아의 본능적 충동이 의식될 때 느끼는 위협으로부터 자아를 보호하기 위해 무의식적으로 사용하는 심리적 기제를 무엇이라 하는가?", "a": "방어기제 / 자아방어기제", "a2": "자아방어기제", "e": "억압, 투사, 반동형성 등이 있으며 자아의 불안을 감소시키는 역할을 합니다.", "b": "1권 p.89"}, {"id": "B1-3-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "리프(Ryff)의 심리적 안녕 6요소 중, 자신의 잠재력이 실현되고 있으며 새로운 경험에 개방적인 태도를 유지하며 발전하고 있다는 느낌은?", "a": "개인적 성장", "a2": "개인적 성장 (Personal growth)", "e": "이는 단순한 만족(주관적 안녕)을 넘어 인간으로서의 성숙과 잠재력 발현에 초점을 둔 지표입니다.", "b": "1권 p.138 · 1권 p.130 · 1권 p.141"}, {"id": "B1-3-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "길버트(Gilbert)가 제시한 3가지 정서 조절 체계에는 위험을 감지하고 안전을 확보하려는 '위협 체계', 보상과 목표를 추구하는 '드라이브 체계', 그리고 친밀감과 평온함을 느끼게 하는 (      )가 있다.", "a": "진정 체계", "a2": "진정 체계 (Soothing system)", "e": "자기비난이 강한 내담자는 위협 체계가 과활성화되어 있으므로, 자비 명상 등을 통해 진정 체계를 활성화하는 것이 중요합니다.", "b": "1권 p.70 · 1권 p.123 · 1권 p.126"}, {"id": "B1-3-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "모델이 처벌받지 않고 위협적인 행동을 하는 것을 관찰한 후, 억눌렸던 공포나 불안이 줄어들어 그 행동을 시도해보는 관찰학습 효과를 무엇이라 하는가?", "a": "탈제지 / 탈억제", "a2": "탈제지(탈억제)", "e": "반대로 모델이 처벌받는 것을 보고 반응이 줄어드는 것은 '제지(억제)' 효과입니다.", "b": "1권 p.81 · 1권 p.84"}, {"id": "B1-3-8", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "융이 제시한 꿈의 기능 중, 의식에서 부족한 부분을 보충하고 마음의 평정을 유지하는 기능은?", "a": "보상기능 / 보상", "a2": "보상 기능", "e": "의식이 일방적으로 흐르는 것을 막아 마음의 균형을 잡습니다.", "b": "1권 p.102"}, {"id": "B1-3-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "켈리가 개인적 구성개념 체계를 이해하기 위해 고안한 검사로, 유의미한 타인들의 유사점과 차이점을 비교하게 하는 검사는?", "a": "역할구성개념 목록검사", "a2": "역할구성개념 목록검사 (REP test)", "e": "20~30명의 역할 명칭 목록을 통해 개인의 인지적 복잡성과 변화를 탐색합니다.", "b": "1권 p.74"}, {"id": "B1-3-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "아들러에 따르면 가족 내의 (      )은 성격 형성에 큰 영향을 미치며, 특히 둘째 아이는 앞선 아이를 이기기 위해 경쟁적인 특성을 보이기 쉽다.", "a": "출생 순위", "a2": "출생 순위", "e": "출생 순위에 따른 가족 역동이 개인의 생활양식 형성에 기여합니다.", "b": "1권 p.96"}, {"id": "B1-4-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "성숙한 성인의 동기는 과거의 어린 시절 경험과는 무관하게 현재의 자율적인 기능을 갖는다는 개념은?", "a": "기능적 자율성", "a2": "기능적 자율성 (Functional autonomy)", "e": "과거의 동기가 현재의 활동을 지속시키는 독립적인 동기로 변화하는 것을 의미합니다.", "b": "1권 p.56"}, {"id": "B1-4-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "타인에게 긍정적 인상을 심어주려는 의식적 노력인 '인상관리'와 달리, 긍정적 자기상을 유지하기 위해 무의식적으로 자신의 부정적 측면을 외면(억압)하는 과정을 (      )라고 하며, 이 중 자신의 영웅적 특성을 나타내는 왜곡을 이기주의자 편향이라고 한다.", "a": "자기기만", "a2": "자기기만 (Self-deception)", "e": "인상관리는 공적 청중을 향한 의식적 조절이나, 자기기만은 사적 청중(자기)을 향한 무의식적 방어 기제입니다.", "b": "1권 p.89 · 1권 p.94 · 1권 p.98"}, {"id": "B1-4-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "아들러의 4가지 생활양식 중, 활동 수준은 높지만 사회적 관심이 낮아 타인을 지배하고 공격적인 성향을 보이는 유형은?", "a": "지배형", "a2": "지배형", "e": "생활양식은 지배형, 기생형, 회피형, 사회적 유용형으로 나뉩니다.", "b": "1권 p.94"}, {"id": "B1-4-4", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담을 통해 '자기'와 '경험'이 통합되어 자신의 잠재력을 실현해 나가는 이상적인 인간상을 로저스는 (      )라고 불렀다.", "a": "충분히 기능하는 사람 / 완전히 기능하는 사람 / 충분히 기능하는 인간", "a2": "충분히 기능하는 사람 (Fully functioning person)", "e": "경험에 대한 개방성, 실존적인 삶, 유기체적 신뢰, 선택의 자유, 창조성이라는 5가지 특징을 보입니다.", "b": "1권 p.117 · 1권 p.205 · 1권 p.204"}, {"id": "B1-4-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "아이젱크의 성격 위계 모델 중 가장 하위 단계는 ( ① )수준이며, 가장 상위 단계는 ( ② )수준이다.", "a": "구체적 반응 / 유형", "a2": "① 구체적 반응, ② 유형 (Type)", "e": "구체적 반응 → 습관적 반응 → 특질 → 유형 순으로 위계화됩니다.", "b": "1권 p.63 · 1권 p.123"}, {"id": "B1-4-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "켈리에 따르면, 직면한 사건이 자신의 구성개념 체계의 편의성 범위 밖에 놓여 있다는 인식에서 비롯되는 정서는 (      )이다.", "a": "불안", "a2": "불안", "e": "새로운 구성개념이 침투할 때는 공포를, 체계 전체가 변해야 할 때는 위협을 느낍니다.", "b": "1권 p.73"}, {"id": "B1-4-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "프로이트가 제시한 본능 중 '죽음의 본능'이자 파괴적 에너지를 뜻하는 용어는?", "a": "타나토스", "a2": "타나토스 (Thanatos)", "e": "삶의 본능인 에로스(Eros)와 대비되는 개념입니다.", "b": "3권 p.415 · 1권 p.87"}, {"id": "B1-4-8", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "네프(Neff)가 제안한 '자기자비(Self-compassion)'의 3가지 핵심 요소는 자기 친절, 인간보편성(보편적 인간성), 그리고 (      )이다.", "a": "마음챙김", "a2": "마음챙김(Mindfulness)", "e": "자신의 고통을 인류 공통의 경험으로 인식하고(보편적 인간성), 고통에 휩쓸리지 않고 객관적으로 관찰하는 것(마음챙김)이 핵심입니다.", "b": "1권 p.126"}, {"id": "B1-4-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "클로닝거의 성품 차원 중 자신을 사회의 일부로 이해하며 타인을 수용하고 동일시하는 능력은?", "a": "연대감", "a2": "연대감", "e": "성품에는 자율성, 연대감, 자기초월의 세 차원이 있습니다.", "b": "1권 p.70"}, {"id": "B1-4-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "아들러가 제안한 개념으로, 타인 및 사회와의 유대감을 형성하고 사회적 발전에 기여하려는 선천적 성향은?", "a": "사회적 관심 / 공동체감", "a2": "사회적 관심 (Gemeinschaftsgefühl)", "e": "건강한 성격의 척도이며 심리적 성숙의 핵심 지표입니다.", "b": "1권 p.93 · 1권 p.94 · 1권 p.31"}, {"id": "B1-5-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "카텔의 특질 분류 중 외현적 반응들의 군집으로 제3자가 관찰 가능하지만 안정성이 낮은 것은 표면특질이고, 성격의 핵심을 구성하는 내면적 구조는 (      )이다.", "a": "근원특질 / 원천특질", "a2": "근원특질 (원천특질)", "e": "근원특질은 16PF 검사의 구성요소이며 성격의 가장 핵심적인 단위입니다.", "b": "1권 p.60"}, {"id": "B1-5-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "성격 5요인(NEO-PI-R) 중 '상상력, 심미안, 지적 호기심'을 하위 요인으로 갖는 차원은?", "a": "개방성", "a2": "개방성 (O)", "e": "새로운 체험을 좋아하고 다양한 경험에 열린 자세를 뜻합니다.", "b": "1권 p.65"}, {"id": "B1-5-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "역동적 특질 중 타고난 에너지의 원천이자 사라지지 않는 본능적 추진력을 무엇이라 하는가?", "a": "에르그 / 욕동", "a2": "에르그(욕동, Erg)", "e": "배고픔, 성, 호기심 등 타고난 심리·신체적 성향을 말합니다.", "b": "1권 p.60 · 1권 p.23"}, {"id": "B1-5-4", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "\"나는 이 과제를 성공적으로 해낼 수 있어\"와 같이 특정 과업을 수행할 수 있다는 자신의 능력에 대한 신념은?", "a": "자기효능감", "a2": "자기효능감", "e": "", "b": "1권 p.82 · 1권 p.81 · 2권 p.359"}, {"id": "B1-5-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "로저스 이론에 따르면, 아동이 부모로부터 '무조건적인 사랑'이 아닌, 특정한 기준을 충족할 때만 인정받으면서 내면화하게 되는 외부의 가치 기준을 (      )라고 한다.", "a": "가치 조건 / 가치 조건화", "a2": "가치 조건 (Conditions of worth)", "e": "가치 조건은 유기체적 가치화 과정을 방해하고, 자신의 실제 경험을 왜곡하게 만드는 주범입니다.", "b": "1권 p.116"}, {"id": "B1-5-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "프로이트 정신분석에서 정신의 구조 중 도덕적 완성의 원리에 지배되며, 양심과 자아이상으로 구성된 체계는?", "a": "초자아", "a2": "초자아 (Superego)", "e": "초자아는 부모의 가치관이 내면화된 것으로, 쾌락보다는 도덕적 완성을 추구합니다.", "b": "1권 p.87 · 3권 p.441 · 3권 p.415"}, {"id": "B1-5-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "올포트가 제시한 개인특질 중 개인의 생활 전반에 지배적인 영향을 미쳐서 소수의 사람(히틀러, 테레사 수녀 등)만 소유하는 성향은?", "a": "기본특질 / 주특질", "a2": "기본특질 (또는 주특질, Cardinal traits)", "e": "개인의 행동 대부분에 강력한 영향을 미치는 가장 지배적인 성향입니다.", "b": "1권 p.56"}, {"id": "B1-5-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "클로닝거의 기질 차원 중 새로운 자극에 행동이 활성화되는 성향이며 도파민 활동과 관련된 것은?", "a": "자극추구", "a2": "자극추구 (NS)", "e": "충동성, 무질서성 등의 하위 구성을 가집니다.", "b": "1권 p.69"}, {"id": "B1-6-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "아이젱크에 따르면 외향적인 사람은 (      )의 활성화 수준이 낮아 최적 각성을 위해 자극을 추구한다.", "a": "망상체", "a2": "망상체 (또는 상행성 망상 활성계)", "e": "내향적인 사람은 망상체의 각성 수준이 높아 자극을 회피합니다.", "b": "1권 p.63 · 1권 p.64"}, {"id": "B1-6-4", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "비윤리적·반사회적 대인관계 스타일인 '검은 삼인조(Dark Triad)'에 속하는 세 가지 특질로는 사이코패스(반사회성), 마키아벨리즘(권모술수), (      )가 있다.", "a": "자기애 / 나르시시즘", "a2": "자기애(나르시시즘)", "e": "3가지 특질은 타인을 조정하거나 이용하며 이기적인 성공을 추구하는 특성입니다.", "b": "1권 p.68"}, {"id": "B1-6-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "아이젱크의 신경증(N) 차원의 생물학적 기반은 정서 조절과 관련된 (      )와 연결되어 있다.", "a": "변연계 / 시상하부", "a2": "변연계 (또는 시상하부)", "e": "자율신경계가 민감하게 흥분하는 특성과 관련이 있습니다.", "b": "1권 p.64"}, {"id": "B1-6-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "라자루스(Lazarus)의 인지적 평가 이론에서, 어떤 사건이 나에게 위협적인지 판단하는 단계를 ( ① )이라 하고, 내가 가진 자원으로 대처 가능한지 판단하는 단계를 ( ② )라고 한다.", "a": "일차 평가 / 이차 평가", "a2": "① 일차 평가, ② 이차 평가", "e": "일차 평가가 '해로운가?'를 묻는다면, 이차 평가는 '내가 감당할 수 있는가?'를 묻는 과정입니다.", "b": "1권 p.39 · 1권 p.124"}, {"id": "B1-6-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "프롬에 따르면 인간은 자유를 얻을수록 역설적으로 고립감을 느끼며 이를 피하기 위해 도피기제를 사용한다. 그중 자신의 개성을 포기하고 사회가 요구하는 모습에 자신을 완전히 맞추어 '자동인형'처럼 살아가는 기제는?", "a": "자동적 동조", "a2": "자동적 동조", "e": "현대인들이 가장 흔히 사용하는 기제로, 고독을 피하려다 진정한 자아를 상실하게 됩니다.", "b": "1권 p.111"}, {"id": "B1-6-8", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "닷지(Dodge)의 사회적 정보처리 모델 중, 수집된 단서를 바탕으로 상대방의 의도를 파악하는 '2단계 표상 및 해석 단계'에서 공격적인 아동들이 흔히 보이는 인지적 왜곡은?", "a": "적대적 귀인 편향 / 적대적 귀인", "a2": "적대적 귀인 편향 (Hostile Attribution Bias)", "e": "상대의 모호한 행동을 자신을 해치려는 의도로 해석하여 보복적 공격성을 정당화합니다.", "b": "3권 p.391 · 1권 p.147"}, {"id": "B1-6-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "어떤 결과가 자신의 행동이나 특성에 달려 있다고 믿는 정도를 뜻하는 개념으로, 일종의 일반화된 기대를 가리키는 용어는?", "a": "통제소재", "a2": "통제소재 (Locus of Control)", "e": "성공과 실패의 원인을 내부에 두느냐 외부에 두느냐의 차이를 설명합니다.", "b": "1권 p.77 · 1권 p.132"}, {"id": "B1-6-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "미셸이 제안한 인지-정서 처리체계(CAPS)의 5가지 단위 중, 외부 상황적 특성을 자신, 타인, 세상에 관한 특정한 의미로 해석하는 내용은?", "a": "부호화 방략 / 부호화", "a2": "부호화 방략", "e": "CAPS는 부호화, 기대/신념, 정서, 목표/가치, 인지 및 행동 역량으로 구성됩니다.", "b": "1권 p.78"}, {"id": "B1-7-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "개인이 사회에 적응하기 위해 사용하는 공적인 얼굴이자 '가면'에 해당하는 원형은 (      )라고 한다. 반면, 성격의 중심이자 전체성을 상징하며, 모든 대립물을 통합하여 균형을 이루려는 종착점에 해당하는 원형은 (      )라고 한다.", "a": "페르소나 / 자기", "a2": "① 페르소나 (Persona) ② 자기 (Self)", "e": "- 페르소나: 사회적 요구에 부응하는 자아의 외적 측면입니다.\n- 자기: 개성화 과정을 통해 도달하게 되는 진정한 성격의 중심입니다.", "b": "1권 p.99 · 1권 p.101"}, {"id": "B1-7-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "방어기제의 명칭을 순서대로 쓰시오.\n\n(1) 용납하기 어려운 충동을 정반대의 행동으로 바꾸어 표현하는 방어기제(예: 미운 놈 떡 하나 더 주기)는?\n\n(2) 심리성적 발달 단계에서 특정 단계에 과도하게 충족되거나 좌절을 경험할 경우, 리비도가 다음 단계로 진행하지 못하고 정신에너지가 그 단계에 머물게 되는 현상을 (      )이라고 한다.", "a": "반동형성 / 고착", "a2": "① 반동형성 (Reaction formation) ② 고착 (Fixation)", "e": "- 반동형성: 무의식적 소망과 반대되는 행동을 통해 불안을 해소합니다.\n- 고착: 성인기 성격의 특징적인 병리나 퇴행의 근거가 되기도 합니다.", "b": "1권 p.89 · 1권 p.87 · 1권 p.90"}, {"id": "B1-8-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "하나의 목표가 긍정적인 면과 부정적인 면을 동시에 가지고 있어 접근하고 싶으면서도 회피하고 싶은 갈등 유형은?", "a": "접근회피 갈등 / 접근-회피 갈등 / 접근회피", "a2": "접근-회피 갈등", "e": "목표에 가까워질수록 회피가 접근보다 가파르게 상승하여 망설임이 커집니다.", "b": "1권 p.128"}, {"id": "B1-8-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "올포트가 제안한 고유자아(Proprium) 발달 단계 중, 3~4세경에 자신의 성취를 자랑스러워하며 형성되는 단계는?", "a": "자아존중감", "a2": "자아존중감", "e": "1단계 신체적 자아, 2단계 자아정체감을 거쳐 자존감을 느끼는 단계입니다.", "b": "1권 p.57"}, {"id": "B1-8-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "머레이는 환경적 자극을 두 가지로 구분하였다. 객관적 사실로서의 환경 자극을 (      )라고 하며, 개인이 자신의 욕구에 따라 주관적으로 지각하고 해석한 환경을 (      )라고 한다.", "a": "알파 압력 / 베타 압력", "a2": "① 알파(α) 압력, ② 베타(β) 압력", "e": "상담에서는 내담자의 행동에 직접적인 영향을 미치는 베타 압력을 파악하는 것이 중요합니다.", "b": "1권 p.136 · 1권 p.109 · 2권 p.364"}, {"id": "B1-8-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인과관계가 없는 두 사건을 마치 상관이 있는 것처럼 연결하여 주관적으로 왜곡해서 해석하는 설리번의 경험 양식은 무엇인가?", "a": "병렬적 경험 / 병렬적 양식 / 병렬적", "a2": "병렬적 양식 (Parataxic mode)", "e": "성인이 되어서도 타인을 과거의 인물과 동일시하여 오해하는 '병렬적 왜곡'의 기초가 됩니다.", "b": "1권 p.106"}, {"id": "B1-8-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "사람들이 자신의 성격을 평가할 때 특정한 사회적 상황을 고려하여 자신의 모습을 떠올리는 경향성을 뜻하는 원리는?", "a": "참조체계의 원리", "a2": "참조체계의 원리 (frame of reference principle)", "e": "성격 평가는 상황적 맥락과 함께 고려될 때 유용합니다.", "b": "1권 p.78"}, {"id": "B1-8-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인간 언어에 중요한 성격 특성이 어휘로 자리 잡고 있다는 가설은?", "a": "기본 어휘 가설 / 기본 어휘", "a2": "기본 어휘 가설 (골드버그)", "e": "대인관계에서 중요한 특성일수록 관련된 어휘가 더 많다는 주장입니다.", "b": "1권 p.67"}, {"id": "B1-8-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "매슬로우는 인간의 욕구를 크게 두 부류로 나누었다. 부족한 것을 채우려는 하위 단계의 욕구를 ( ① )라고 하며, 자신의 잠재력을 발휘하고 성장을 지향하는 상위 단계의 욕구를 ( ② )라고 한다.", "a": "결핍 욕구 / 성장 욕구", "a2": "① 결핍 욕구(D-needs), ② 성장 욕구(B-needs)", "e": "결핍 욕구는 충족되면 동기가 감소하지만, 성장 욕구는 충족될수록 그 동기가 더욱 강화되는 특성이 있습니다.", "b": "1권 p.129 · 1권 p.130"}, {"id": "B1-10-1", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "히긴스(Higgins)의 자기안내 이론에서 '실제적 자기'와 '이상적 자기' 사이의 불일치가 발생할 때 주로 느껴지는 정서 중 1가지를 쓰시오.", "a": "실망 / 불만 / 우울", "a2": "실망, 불만, 우울과 관련된 위축 정서", "e": "이상적 자기는 희망과 소망을 의미하므로, 이를 달성하지 못하면 낙담하게 됩니다. 반면 '의무적 자기'와의 불일치는 불안이나 죄책감을 유발합니다.", "b": "1권 p.121 · 1권 p.119 · 1권 p.120"}, {"id": "B1-11-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "로저스가 내담자의 '현실적 자기'와 '이상적 자기' 사이의 유사성을 측정하여 상담의 성과를 평가하기 위해 활용한 도구는 무엇인가?", "a": "Q분류기법 / Q-분류기법", "a2": "Q-분류기법 (Q-sort technique)", "e": "자기 기술 문장이 담긴 카드를 정상분포 모양으로 분류하게 하여 상관계수를 통해 일치도를 측정합니다.", "b": "1권 p.116 · 1권 p.117"}, {"id": "B1-11-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "개인이 평소 이루고자 하는 일관된 목표 패턴인 '개인적 열망(Emmons)'과 달리, 인생의 특정한 시기나 특수한 상황에서 수행하고자 하는 구체적인 활동을 (      )라고 한다.", "a": "생활과제", "a2": "생활과제 (Life tasks)", "e": "캔터(Cantor)는 성격을 '무엇을 가지고 있는가'보다 '어떤 활동을 하고 있는가'로 이해해야 한다고 보았습니다.", "b": "1권 p.81 · 1권 p.50 · 1권 p.57"}, {"id": "B1-12-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "켈리는 모든 사람이 과학자처럼 가설을 세우고 세상을 예측하려 한다고 보았다. 세상의 모든 사건에는 다양한 대안이 존재하며, 개인은 자신의 방식을 언제든 수정할 수 있다는 철학적 입장인 (      )주의를 주장했다.", "a": "구성개념적 대안", "a2": "구성개념적 대안 (constructive alternativism)", "e": "인간은 고정된 현실에 반응하는 존재가 아니라, 자신의 구성개념을 수정해 나가는 능동적 주체입니다.", "b": "1권 p.71"}, {"id": "B1-12-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "사람(P), 환경(E), 행동(B)의 세 요인이 서로 원인이 되며 영향을 주고받는다는 반두라의 핵심 원리는?", "a": "상호결정론", "a2": "상호결정론", "e": "인간 행동은 외부 자극뿐 아니라 개인 내부 인지와 환경의 지속적 상호작용 결과입니다.", "b": "1권 p.81 · 1권 p.28"}, {"id": "B1-13-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "호나이에 따르면, 신경증적인 사람이 기본 불안에 대처하기 위해 사용하는 세 가지 경향성 중, 타인에게 의존하고 순응함으로써 안전을 얻으려는 전략은 (      )이며, 반대로 타인을 믿지 못하고 지배하며 자신의 힘을 확인하려는 전략은 (공격형)이다.", "a": "순응형", "a2": "① 사람들을 향해서 가기(=타인을 향해 움직이기) = 순응형, ② 사람들에 대항해서 가기(=타인에 반해 움직이기) = 공격형", "e": "순응형은 사랑을 통해, 공격형은 권력과 지배를 통해 불안을 통제하려 합니다.", "b": "1권 p.103"}, {"id": "B1-13-9", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "에르그, 견해, 태도가 서로 연결되어 보조(Subsidiation) 관계를 형성하는 것을 보여주는 도식은?", "a": "역동적 격자 도식", "a2": "역동적 격자 도식", "e": "성격 내 요소들이 어떻게 상호 보조하며 관련되는지를 보여줍니다.", "b": "1권 p.61"}, {"id": "B1-14-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "올포트의 연구 방법 중 즉흥적이고 목적 없이 나타나며 개인의 성격 특질을 잘 보여주는 행동을 ( ① )행동이라 하고, 의도적으로 계획된 행동을 ( ② )행동이라 한다.", "a": "표현적 / 대처", "a2": "① 표현적(expressive), ② 대처(coping)", "e": "말투, 몸짓 등 자연스러운 표현적 행동이 성격적 요소를 더 잘 보여줍니다.", "b": "1권 p.58"}, {"id": "B1-14-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "프롬이 제시한 비생산적 성격 유형 중, 자신을 시장에서 거래되는 하나의 '상품'으로 여기고 타인의 평가에 따라 수시로 인격을 변화시키는 유형은 무엇인가?", "a": "시장 지향", "a2": "시장 지향 (Marketing Orientation)", "e": "자신의 가치를 내면이 아닌 '교환 가치'와 '인기'에서 찾는 현대적 성격 유형입니다.", "b": "1권 p.112"}, {"id": "B1-15-6", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "5요인 이론(FFT) 성격체계에서 생물학적 기반을 둔 핵심 요소로 전 생애에 걸쳐 지속되는 것은?", "a": "기본적 성향 / 기본 경향 / 기본 성향", "a2": "기본적 성향 (기본경향)", "e": "성격체계에서 생물학적 기반을 둔 핵심 요소로 전 생애에 걸쳐 지속되는 것은 기본적 성향이며, 사회문화적 환경에서 구체화된 것은 '특징적 적응'입니다.", "b": "1권 p.66"}, {"id": "B1-15-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "위긴스(Wiggins) 등의 대인관계 원형모델에서 인간관계를 설명하는 두 가지 핵심 축은 (      ) 축과 사랑(친애, 우호)-미움(적대) 축이다.", "a": "지배복종 / 지배-복종 / 복종지배", "a2": "지배-복종", "e": "이 두 축을 기준으로 대인관계의 다양한 하위 유형을 원형상에 배열하여 성격의 사회적 측면을 설명합니다.", "b": "1권 p.143"}, {"id": "B1-16-3", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "미래의 더 큰 보상을 위해 당장의 보상을 포기하는 행동인 ( ① )을 위해 미셸은 주의전환이나 ( ② ) 변환 방략이 효과적임을 실험으로 입증했다.", "a": "만족지연 / 인지적", "a2": "① 만족지연, ② 인지적", "e": "좌절 상황을 유쾌한 상황으로 전환하는 인지적 방략이 중요합니다.", "b": "1권 p.78 · 1권 p.28"}, {"id": "B1-16-5", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "HEXACO 모델이 Big 5 모델과 구별되는 가장 큰 특징은 (      ) 요인이 추가된 점이다.", "a": "정직겸손 / 정직-겸손", "a2": "정직-겸손", "e": "진실성, 공정성, 탐욕 회피 등을 포함하는 6번째 요인입니다.", "b": "1권 p.68"}, {"id": "B1-16-7", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "다음은 융의 개념이다. 빈칸에 해당하는 개념을 순서대로 쓰시오.\n\n융의 정신에너지 원리 중, 신체에너지 내에 반대되는 힘이 존재하여 갈등을 야기하며 이것이 에너지를 생성하는 데 필요하다는 원리는 (      )라고 한다. 정신 가치가 약해지거나 사라지면 그 에너지는 상실되지 않고 정신 내의 다른 영역으로 전환되어 재분배된다는 원리는 (      )라고 한다.", "a": "대립원리 / 등가원리", "a2": "① 대립원리 ② 등가원리", "e": "- 대립원리: 대립이 있어야 에너지가 발생하며, 이는 삶의 본질입니다.\n- 등가원리: 에너지의 총량은 변하지 않고 다른 곳으로 흐른다는 원리입니다.", "b": "1권 p.102"}, {"id": "B1-17-2", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "하나의 구성개념이 유용하게 적용될 수 있는 일련의 사건 범위를 ( ① )라고 하며, 그중에서도 그 구성개념이 가장 잘 예측할 수 있는 특정 사건들을 ( ② )이라고 한다.", "a": "편의성 범위 / 편의성 초점", "a2": "① 편의성 범위, ② 편의성 초점", "e": "구성개념마다 적용 가능한 범위와 가장 잘 들어맞는 핵심 영역이 다릅니다.", "b": "1권 p.73"}, {"id": "B1-17-8", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "내담자가 새로운 인물인 것처럼 2주 정도 행동해 보게 함으로써 대안적 관점을 갖게 하는 치료 기법은 (      ) 치료이다.", "a": "고정역할", "a2": "고정역할", "e": "자기성격묘사 → 고정역할묘사 → 고정역할시연의 단계를 거칩니다.", "b": "1권 p.75"}, {"id": "B1-18-10", "s": "성격심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "그레이(Gray)의 행동체계 중 보상 자극에 민감하며 접근 행동을 유발하는 시스템은 행동 활성화 체계(BAS)이고, 처벌 자극에 민감하며 회피 행동을 유발하는 시스템은 (      )이다.", "a": "행동 억제 체계 / BIS", "a2": "행동 억제 체계 (BIS)", "e": "BAS는 도파민과, BIS는 편도핵 및 걱정·불안 특질과 관련됩니다.", "b": "1권 p.70 · 1권 p.64"}, {"id": "2-1", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 1, "d": "어렵게", "q": "상담자가 과학적 연구 결과와 실제 임상 실무를 통합해야 한다는 모델의 명칭은?", "a": "과학자 실무자 모델", "a2": "과학자-실무자 모델 (Scientist-Practitioner Model)", "e": "상담자의 전문성을 연구와 실무 양측면에서 모두 강조하는 핵심 모델입니다.", "b": "1권 p.173 · 1권 p.150"}, {"id": "2-2", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 2, "d": "어렵게", "q": "상담 통합의 방법 중, 이론적 배경과 상관없이 여러 이론에서 효과가 입증된 특정 기법들을 내담자의 문제에 맞춰 골라 쓰는 방식은?", "a": "기술적 절충 / 기법적 절충 / 기술적 통합", "a2": "기술(기법)적 절충 (Technical Eclecticism)", "e": "이론의 통합보다는 실제적인 '효과성'에 초점을 맞추어 기법을 선택하는 방식입니다(예: 라자루스(Lazarus)의 다중양식 치료).", "b": "2권 p.81 · 1권 p.173"}, {"id": "2-3", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 3, "d": "어렵게", "q": "(      )의 원리에서는 인간은 개인차가 있으므로, 상담자는 내담자의 독특한 성질을 이해하고 보다 나은 적응을 할 수 있도록 개인에게 맞는 원리와 방법을 사용해야 한다고 본다.", "a": "개별화", "a2": "개별화(individualization)의 원리", "e": "인간은 개인차가 있으므로, 상담자는 내담자의 독특한 성질을 이해하고 보다 나은 적응을 할 수 있도록 개인에게 맞는 원리와 방법을 사용해야 한다.", "b": "1권 p.170"}, {"id": "2-4", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 4, "d": "쉽게", "q": "정신분석(Freud)의 궁극적인 상담 목표는 무의식의 (      ) 이다. 무엇인가요?", "a": "의식화", "a2": "의식화", "e": "자아(Ego)를 강화하여 무의식적 갈등을 의식 수준으로 끌어올리고, 본능적 충동에 휘둘리지 않도록 인격 구조를 재구성하는 것입니다.", "b": "1권 p.174"}, {"id": "2-5", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 5, "d": "쉽게", "q": "정신분석에서 내담자가 상담자에게 보이는 비합리적인 반응으로, 과거의 중요한 인물에게 느꼈던 감정을 상담자에게 투사하는 현상은?", "a": "전이", "a2": "전이 (Transference)", "e": "전이는 내담자의 무의식적 갈등이 상담 관계에서 재현되는 것으로, 이를 분석하고 훈습(Working-through)하는 과정이 치료의 핵심입니다.", "b": "1권 p.178"}, {"id": "2-6", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "아들러(Adler) 상담의 과정 중, 내담자의 생활양식을 파악하기 위해 어린 시절의 기억을 회상하게 하는 기법은?", "a": "초기 회상 / 초기 기억", "a2": "초기 회상 (Early Recollections)", "e": "내담자가 기억하는 아주 어린 시절의 사건들을 통해 현재의 생활양식과 삶의 목표, 신념 체계를 파악합니다.", "b": "1권 p.185 · 1권 p.183 · 1권 p.181"}, {"id": "2-7", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "아들러의 기법 중, 내담자의 특정 행동이 숨겨진 목적(관심 끌기, 힘 행사 등)을 가지고 있음을 폭로하여 그 행동의 즐거움을 제거하는 기법은?", "a": "수프에 침 뱉기 / 스프에 침 뱉기", "a2": "수프에 침 뱉기 (Spitting in the Client's Soup)", "e": "내담자가 자신의 행동 이면에 숨겨진 의도를 깨닫게 하여, 더 이상 그 행동이 이전처럼 매력적이지 않게 만드는 기법입니다.", "b": "1권 p.186 · 1권 p.187"}, {"id": "2-8", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 8, "d": "쉽게", "q": "아들러의 기법 중, 내담자가 유쾌한 기억과 불쾌한 기억을 번갈아 떠올리게 함으로써 자신의 감정을 스스로 통제할 수 있음을 깨닫게 하는 기법은?", "a": "단추 누르기 / 버튼 누르기", "a2": "단추 누르기 (The Button Technique)", "e": "감정은 외부 사건에 의해 강제로 생기는 것이 아니라, 본인이 선택한 '생각'의 결과임을 알게 해줍니다.", "b": "1권 p.186"}, {"id": "2-9", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 9, "d": "쉽게", "q": "융(Jung)의 분석심리학에서 지향하는 상담의 궁극적 목표로, 자아가 무의식의 요소들을 통합하여 온전한 '자기'를 실현하는 과정은?", "a": "개성화", "a2": "개성화 (Individuation)", "e": "페르소나, 그림자, 아니마/아니무스 등 분열된 인격 요소들을 의식화하고 통합하여 전일적인 존재가 되는 것입니다.", "b": "1권 p.190 · 1권 p.101 · 1권 p.100"}, {"id": "2-10", "s": "상담이론", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "융이 제안한 기법으로, 내담자가 무의식에서 올라온 이미지(꿈, 환상)를 관찰하며 그 이미지와 내면의 대화를 나누도록 하는 기법은?", "a": "적극적 상상 / 능동적 상상 / 능동적 심상", "a2": "적극적 상상 / 능동적 상상 / 능동적 심상 (Active Imagination)", "e": "무의식의 상징들이 스스로 말을 걸어오게 하여 의식과 무의식 사이의 소통을 돕는 기법입니다.", "b": "1권 p.192 · 1권 p.190 · 1권 p.153"}, {"id": "13-1", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "다음은 상담의 기본원리를 기반으로 상담자의 역할을 나열한 것이다. 이를 모두 수렴하는 상담의 기본원리를 고르시오.\n\n- 인간에 대한 편견, 선입관에서 탈피해야 한다.\n- 내담자의 말을 경청하고 세밀히 관찰해야 하며, 감정 변화를 민감하게 포착할 수 있어야 한다.\n- 내담자의 보조에 맞추어 진행할 수 있어야 하며 개인차를 인정해야 한다.\n\n① 개별화의 원리\n② 의도적 감정표현의 원리\n③ 수용의 원리\n④ 자기결정의 원리\n⑤ 비밀보장의 원리", "a": "1", "a2": "1 개별화의 원리", "e": "상담의 기본원리는 개별화의 원리, 의도적 감정표현의 원리, 수용의 원리, 비심판적 태도의 원리, 자기결정의 원리, 비밀보장의 원리, 통제된 정서관여의 원리가 있다.\n내담자의 보조에 맞추어 진행하며 개인차를 인정해야 하는 것은 개별화의 원리이다.", "b": "1권 p.171 · 1권 p.150"}, {"id": "13-2", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "(      ) 은 치료의 구성요소에 대해 명시하고 과학적 연구에 의해 지지된 치료적 접근이다. 초기에는 경험적으로 지지되거나 경험적으로 타당한 치료로 이해되었다.", "a": "근거기반상담", "a2": "근거기반상담", "e": "근거(증거) 기반 상담(치료)는 치료의 구성요소에 대해 명시하고 과학적 연구에 의해 지지된 치료적 접근이다.", "b": "1권 p.173"}, {"id": "13-3", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "다음이 설명하는 통합상담의 유형을 쓰시오.\n\n특정한 이론을 통해 내담자의 내면세계와 욕구를 체계적으로 이해한 후, 다양한 치료적 접근들을 선택적으로 결합하여 적용하는 방식이다. 예를 들어 인지행동 치료를 기반으로, 내담자의 문제행동을 이해하고 비합리적인 사고를 수정하기 위해 역기능적 사고기록지, 게슈탈트 상담의 반대로 하기 기법을 사용하고, 아들러의 수프에 침 뱉기 기법을 사용하였다.", "a": "동화적 통합", "a2": "동화적 통합", "e": "통합상담의 유형은 기술적 통합, 이론적 통합, 공통요인 이론, 동화적 통합(흡수통합접근)이 있다.\n동화적 통합의 경우 특정 이론적 접근에 근거를 두고, 다양한 치료적 접근들의 실제를 선택적으로 결합하고 적용하는 방법이다.", "b": "1권 p.173"}, {"id": "13-4", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "정신역동 상담이론의 상담과정을 순서대로 쓰시오.\n초기 단계 - (      ) - 전이의 훈습 단계 – 전이의 해결 단계", "a": "전이의 발달 단계", "a2": "전이의 발달 단계", "e": "정신역동 상담이론의 상담과정 순서는 초기단계 → 전이의 발달단계 → 전이의 훈습 단계 → 전이의 해결단계 순서이다.", "b": "1권 p.175 · 1권 p.151"}, {"id": "13-5", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "프로이트(Freud)의 정신역동 상담이론을 기반으로 A, B에 해당하는 개념의 명칭을 순서대로 쓰시오.\n\nA: 상담 선생님이 나의 어릴 적 무서웠던 이모와 같은 모습처럼 느껴져 무섭고 불편하다.\n\nB: 민수는 상담실에 가는 것도 귀찮고, 내 이야기가 다 소문날 것 같아 2주간 상담에 불참했다.", "a": "전이 / 저항", "a2": "전이 / 저항", "e": "전이는 내담자가 과거에 부모나 다른 사람에게 느꼈던 감정을 현재의 상담자에게 동일하게 느끼는 것이다.\n저항은 내담자가 치료의 진전을 방해하고 상담자에게 협조하지 않으려는 무의식적 행동이다", "b": "1권 p.178 · 1권 p.175 · 1권 p.176"}, {"id": "13-6", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "프로이트(Freud)의 정신분석이론에서 내담자가 치료의 진전을 방해하고 상담자에게 협조하지 않으려는 무의식적인 행동을 (      )(이)라고 하며, 이것의 종류 중에서 자아가 원초아의 충동, 소원을 억압하느라 생긴 저항을 (      )(이)라고 한다.", "a": "저항 / 억압 저항", "a2": "저항 / 억압 저항", "e": "프로이트\n저항 : 내담자가 치료의 진전을 방해하고 상담자에게 협조하지 않으려는 무의식적인 행동\n종류 : 억압 저항, 2차 이득 저항, 초자아 저항, 원초아 저항, 전이 저항", "b": "1권 p.176"}, {"id": "13-7", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "프로이트(Freud)의 정신역동 상담이론을 근거로 다음의 예시가 가리키는 개념의 명칭을 쓰시오.\n\n상담교사는 상담을 받으러 온 주영(중1,여)이가 학창시절 자신을 괴롭혔던 친구와 닮았다는 생각이 들어 상담을 진행하는 내내 불편함을 느끼고, 주영이에게 차갑게 대하게 되었다.", "a": "역전이", "a2": "역전이", "e": "‘역전이’는 상담자가 자신의 과거로부터 유래된 감정을 내담자에게 느끼는 것이다.", "b": "1권 p.178"}, {"id": "13-8", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "아들러(Adler)의 개인심리치료를 기반으로 아형이에게 사용한 상담기법을 쓰시오.\n\n- 아형이는 손톱을 깨무는 버릇이 있어서 상담 시간이나 쉬는 시간에 의도적으로 손톱을 깨물고, 뜯도록 하였다. 계속 손톱을 깨물다 보니 이 행동을 왜 하고 있지? 하는 생각이 들었다고 한다.", "a": "역설기법", "a2": "역설기법", "e": "역설기법은 특정사고 또는 행동을 의도적으로 과장하게 하는 기법이다. 이 기법은 내담자의 저항을 불러일으키기보다는 오히려 과장하는 것으로, 사회적 관심을 고조시키는 한편, 내담자의 행동을 덜 매력적으로 만들어 버리는 효과가 있다.", "b": "1권 p.188"}, {"id": "13-9", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "아들러의 상담 과정 중 빈칸에 알맞은 단계를 쓰시오.\n1단계 : 관계형성 단계\n2단계 : 생활양식 탐색\n3단계 : 통찰 단계\n4단계 : (      ) 단계", "a": "재정향 / 재정향 단계", "a2": "재정향 / 재정향 단계", "e": "재정향 단계는 내담자가 문제 행동이나 문제상황에 대한 대안들을 고려하여 변화를 실행하도록 돕는다", "b": "1권 p.183 · 1권 p.152"}, {"id": "13-10", "s": "상담이론", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "다음의 내용에 해당하는 아들러(Adler)의 상담기법을 쓰시오.\n\n“손톱을 물어뜯고 싶은 생각이 들 때마다 ‘스톱’이라고 외치고 너의 행동을 스스로 지각해 보겠니? 이 행동을 통해 너는 너의 행동의 선택권이 스스로에게 있음을 깨달을 수 있을거야.”", "a": "자기 간파", "a2": "자기 간파", "e": "자기 간파는 내담자가 반복적으로 범하는 부적응적 행동을 자각하게 함으로써 그 행동을 방지하도록 돕는 방법으로, 행동 선택권이 자신에게 있음을 깨닫고, 자기패배적 행동을 제거하는 것이 유익하다는 사실을 알게 된다.", "b": "1권 p.187"}, {"id": "B2-1-1", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ACT 이론을 바탕으로, 불쾌한 감정이나 기억을 없애려 하거나 통제하려다가 오히려 고통이 가중되는 정신병리 기제는?", "a": "경험회피", "a2": "경험 회피 (Experiential Avoidance)", "e": "불안을 안 느끼려고 술을 마시거나 잠을 자는 등 내적 경험을 피하려 할수록 가치 있는 삶은 멀어집니다.", "b": "1권 p.285 · 1권 p.283"}, {"id": "B2-1-2", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인간중심치료 7단계 변화 과정의 핵심은 성격이 (      )에서 유동성으로 변하는 것이다.", "a": "경직성 / 고정성", "a2": "경직성(고정성)", "e": "굳어있던 생각과 감정이 부드럽고 자유롭게 흐르는 상태로 변화하는 과정입니다.", "b": "1권 p.284 · 1권 p.285 · 1권 p.286"}, {"id": "B2-1-3", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "카프만의 드라마 삼각형에서 게임을 유발하는 세 가지 역할은 박해자, 구원자, 그리고 누구인가요?", "a": "희생자", "a2": "희생자 (Victim)", "e": "사람들은 무의식중에 이 세 역할을 번갈아 맡으며 진실한 친밀성을 회복하지 못하는 심리 게임을 합니다.", "b": "1권 p.276"}, {"id": "B2-1-4", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "성격 변화 5단계 중, 변화에 대한 두려움으로 이러지도 저러지도 못하는 '막다른 골목' 단계는?", "a": "교착층", "a2": "교착층 (Impasse Layer)", "e": "내담자가 변화를 시도하려 하나 지지기반이 없어 무력감을 느끼는 지점으로, 상담의 결정적 전환점이 됩니다.", "b": "1권 p.215"}, {"id": "B2-1-5", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "바람직한 행동 시 즉시 보상 대신 나중에 물건으로 바꿀 수 있는 포인트나 스티커를 주는 기법은?", "a": "토큰 강화", "a2": "토큰 강화 (Token Economy)", "e": "포화 현상을 방지하고 즉각적인 피드백을 제공할 수 있는 경제적 강화 시스템입니다.", "b": "1권 p.228 · 3권 p.535 · 1권 p.225"}, {"id": "B2-1-6", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "벡(Beck)의 이론을 바탕으로, 세상을 바라보는 주관적이고 고정적인 틀로, 정보를 선택적으로 수용하게 만드는 심리 구조는?", "a": "스키마 / 인지도식", "a2": "인지도식 (스키마, Schema)", "e": "과거 경험을 통해 형성된 인지적 지도로, 모든 사건을 자신의 틀에 맞추어 해석하게 합니다.", "b": "1권 p.249 · 1권 p.250 · 1권 p.251"}, {"id": "B2-1-7", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "화가 났을 때 상대에게 말하지 못하고 자신의 입술을 깨무는 것과 같이, 타인에게 하고 싶은 행동을 자신에게 하는 기제는?", "a": "반전", "a2": "반전 (Retroflection)", "e": "에너지의 방향이 타인이 아닌 자신을 향해 되돌아오는 현상으로, 자책이나 신체화 증상의 원인이 됩니다.", "b": "1권 p.212 · 1권 p.232"}, {"id": "B2-1-9", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "프랭클의 의미치료에서 피할 수 없는 고통 속에서도 태도를 결정하며 찾는 가치는?", "a": "태도적 가치", "a2": "태도적 가치 (Attitudinal Value)", "e": "시련을 견디는 인간의 존엄한 태도에서 발견되는 가장 숭고한 가치입니다.", "b": "1권 p.199 · 1권 p.155 · 1권 p.197"}, {"id": "B2-1-10", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "REBT의 대표 기법 중 하나로, 남들이 비웃을까 봐 두려워했던 행동을 일부러 실제로 해보게 하여 공포를 깨뜨리는 기법은?", "a": "수치감 공격 연습", "a2": "수치감 공격 연습 (Shame-Attacking Exercises)", "e": "타인의 시선이 생각보다 재앙이 아님을 행동으로 직접 체험하게 하는 REBT의 대표적 기법입니다.", "b": "1권 p.246 · 1권 p.163"}, {"id": "B2-2-2", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "타인의 가치관이나 기준을 무비판적으로 받아들여 자신의 것으로 삼는 접촉경계 혼란 기제는?", "a": "내사", "a2": "내사 (Introjection)", "e": "자신의 개성에 맞게 여과하지 않고 외부의 요구를 맹목적으로 '삼켜버린' 상태를 뜻합니다.", "b": "1권 p.212 · 1권 p.215"}, {"id": "B2-2-3", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "로저스가 강조한 상담자의 태도 중, 상담자의 내면과 표현이 일치하는 상태는?", "a": "진실성 / 일치성 / 진솔성", "a2": "진실성 (또는 일치성, Genuineness/Congruence)", "e": "상담자가 가식 없이 투명하게 자신을 드러내는 상태입니다.", "b": "1권 p.206 · 1권 p.204 · 1권 p.205"}, {"id": "B2-2-5", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "부적절한 행동 시 즐거운 자극이 있는 환경에서 일정 시간 격리하여 강화의 기회를 차단하는 방법은?", "a": "타임아웃", "a2": "타임아웃 (Time-out)", "e": "강화가 없는 장소로 격리함으로써 문제 행동의 빈도를 줄이는 벌의 일종입니다.", "b": "1권 p.229 · 3권 p.540 · 1권 p.225"}, {"id": "B2-2-6", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "완결되지 못한 게슈탈트가 배경으로 물러나지 못하고 현재의 삶을 방해하는 현상은?", "a": "미해결 과제", "a2": "미해결 과제 (Unfinished Business)", "e": "과거의 욕구가 해소되지 못하면 계속 전경으로 떠오르려 하며, '지금-여기'의 새로운 게슈탈트 형성을 방해합니다.", "b": "1권 p.210"}, {"id": "B2-2-7", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "교류분석 이론을 바탕으로, 타인으로부터 얻어지는 존재 인정의 한 형태이며 사회적 행동의 동기가 되는 인정 자극은?", "a": "스트로크", "a2": "스트로크 (Stroke)", "e": "신체적 접촉이나 말, 표정 등 상대로부터 \"당신을 인식하고 있다\"는 신호를 받는 모든 행위입니다.", "b": "1권 p.272"}, {"id": "B2-2-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "개체가 자신의 욕구나 감정을 하나의 의미 있는 전체로 조직화하여 지각한 형태를 무엇이라 하나요?", "a": "게슈탈트", "a2": "게슈탈트 (Gestalt)", "e": "인간은 조각난 감각이 아니라 하나의 통합된 의미(형태)로 자신의 욕구를 인식하는데, 이를 게슈탈트라고 부릅니다.", "b": "1권 p.209 · 1권 p.210 · 1권 p.211"}, {"id": "B2-2-9", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "결과가 조금만 안 좋아도 \"내 인생은 끝장이다\"라고 최악의 재앙으로 생각하는 사고 오류는?", "a": "파국화", "a2": "파국화 (Awfulizing)", "e": "사건의 부정적인 측면을 극도로 과장하여 공포심을 유발하는 비합리적 사고입니다.", "b": "1권 p.237 · 1권 p.477"}, {"id": "B2-2-10", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "상담 과정인 WDEP에서 'E'가 의미하는 단계는 무엇인가요?", "a": "평가 / 평가하기", "a2": "평가 (Evaluation)", "e": "현재 나의 행동이 내가 원하는 것(W)을 얻는 데 실제로 도움이 되는지 스스로 냉정하게 따져보는 핵심 단계입니다.", "b": "1권 p.264 · 1권 p.265 · 2권 p.421"}, {"id": "B2-3-1", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "모든 정서 장애의 뿌리가 되는 \"반드시 ~해야만 한다\"는 식의 경직된 사고는?", "a": "당위적 사고", "a2": "당위적 사고 (Demandingness / Must-urbating)", "e": "자신, 타인, 세상에 대해 절대적인 요구를 함으로써 스스로를 고통에 빠뜨리는 핵심 비합리적 신념입니다.", "b": "1권 p.236 · 1권 p.237 · 1권 p.235"}, {"id": "B2-3-2", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "벡(Beck)의 이론을 바탕으로, 어떤 상황에서 의도하지 않아도 순식간에 의식 속에 스쳐 지나가는 부정적인 생각은?", "a": "자동적 사고", "a2": "자동적 사고 (Automatic Thoughts)", "e": "너무 빨라 인지하기 어렵지만 감정에 즉각적인 영향을 미치는 인지적 산물입니다.", "b": "1권 p.249 · 1권 p.254 · 1권 p.247"}, {"id": "B2-3-4", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "교류분석 이론을 바탕으로, 겉으로는 합리적인 대화를 나누는 척하지만 속으로는 다른 의도를 숨기고 있는 복합 교류 방식은?", "a": "이면 교류 / 암시 교류", "a2": "이면 교류 (암시 교류, Ulterior Transaction)", "e": "심리적 메시지가 숨겨져 있어 결국 '게임'이라는 비효율적인 소동으로 치닫게 만듭니다.", "b": "1권 p.271"}, {"id": "B2-3-5", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "특정 자아 상태가 어른 자아(A)의 경계를 침범하여 객관적 판단을 흐리게 하는 현상은?", "a": "오염 / 혼합", "a2": "오염 (혼합, Contamination)", "e": "편견(P의 침범)이나 망상(C의 침범) 때문에 현실을 왜곡해서 인식하게 되는 구조적 문제입니다.", "b": "1권 p.270"}, {"id": "B2-3-6", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "비합리적 신념을 깨뜨리기 위해 상담자가 던지는 질문 전략을 무엇이라 하나요?", "a": "논박", "a2": "논박 (Dispute)", "e": "내담자의 생각이 논리적인지, 현실적인지, 실용적인지 따져 묻는 상담자의 핵심 개입 기술입니다.", "b": "1권 p.242 · 1권 p.243 · 1권 p.248"}, {"id": "B2-3-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "전체행동의 네 바퀴 중 우리가 의도적으로 조절할 수 있어 상담의 타깃이 되는 '앞바퀴' 두 가지로는 활동하기(행동하기)와 (      )가 있다.", "a": "생각하기 / 사고하기", "a2": "생각하기(Thinking)", "e": "감정과 생리반응은 직접 바꾸기 어렵지만, 활동과 생각을 바꾸면 뒷바퀴인 감정도 자연스레 따라옵니다.", "b": "1권 p.261"}, {"id": "B2-4-1", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "실존치료 기법 중, 자신이 두려워하는 일을 의도적으로 해보게 하여 불안을 끊는 기법은?", "a": "역설적 의도", "a2": "역설적 의도 (Paradoxical Intention)", "e": "예기불안(불안할까 봐 미리 불안함)을 치료하는 데 효과적입니다.", "b": "1권 p.202 · 1권 p.201 · 1권 p.504"}, {"id": "B2-5-3", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "REBT에서 정서적 고통(C)을 일으키는 직접적인 원인이 되는 요소는 (      )체계라고 한다.", "a": "신념", "a2": "신념 체계(B) (Belief)", "e": "사건(A) 자체가 아니라, 그 사건을 어떻게 해석하고 받아들이느냐(B)가 감정 결과를 결정합니다.", "b": "1권 p.234 · 1권 p.240 · 1권 p.249"}, {"id": "B2-5-5", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ACT 이론을 바탕으로, 단어(생각)일 뿐인 문장을 실제 현실이나 나 자신과 구분하지 못하고 절대적으로 믿는 현상은?", "a": "인지적 융합", "a2": "인지적 융합 (Cognitive Fusion)", "e": "\"나는 실패자다\"라는 단어가 내 이마에 낙인처럼 찍혀 그 생각과 내가 하나로 붙어버린 상태입니다.", "b": "1권 p.283 · 1권 p.284 · 1권 p.169"}, {"id": "B2-5-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "교류분석 이론을 바탕으로, 부모로부터 내면화된 도덕 및 신념을 표현하며, 가르치거나 돌보는 기능을 하는 자아 상태는?", "a": "어버이 자아", "a2": "어버이 자아 (P: Parent)", "e": "엄격한 비판적 어버이(CP)와 헌신적인 양육적 어버이(NP)로 구분됩니다.", "b": "1권 p.269 · 1권 p.268"}, {"id": "B2-5-9", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인간은 자신의 욕구를 충족시키기 위해 스스로 행동을 선택하고 통제한다는 이론의 명칭은?", "a": "선택이론", "a2": "선택이론 (Choice Theory)", "e": "인간은 외부 자극에 반응하는 수동적 존재가 아니라 자신의 삶을 직접 조종하는 주인임을 강조합니다.", "b": "1권 p.258 · 1권 p.259"}, {"id": "B2-6-2", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상대의 권리를 침해하지 않으면서 자신의 욕구를 솔직하고 직접적으로 표현하도록 돕는 훈련은?", "a": "자기표현 훈련 / 자기주장 훈련", "a2": "자기표현(주장) 훈련 (Assertiveness Training)", "e": "소극적이거나 공격적인 의사소통 대신 건강한 자기주장을 할 수 있도록 돕는 기법입니다.", "b": "1권 p.232"}, {"id": "B2-6-3", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ACT 이론을 바탕으로, 생각을 생각일 뿐이라고 객관화하여 거리를 둠으로써 언어의 굴레에서 벗어나는 기술은?", "a": "인지적 탈융합", "a2": "인지적 탈융합 (Defusion)", "e": "\"나는 한심해\"라고 믿는 대신 \"내 마음에 '나는 한심하다'는 생각이 떠올랐구나\"라고 관찰자로 물러나는 것입니다.", "b": "1권 p.287 · 1권 p.285 · 1권 p.286"}, {"id": "B2-6-5", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ACT 이론을 바탕으로, 삶에서 정말 중요하게 여기는 방향이자 나침반 역할을 하며 구체적 목표의 근거가 되는 것은?", "a": "가치", "a2": "가치 (Values)", "e": "완결되는 '목표'와 달리, '가치'는 살아가는 동안 끊임없이 지향해야 할 나만의 북극성과 같습니다.", "b": "1권 p.286 · 1권 p.274 · 1권 p.185"}, {"id": "B2-6-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "MBCT에서 현재 순간의 경험을 비판단적으로 허용하고 억지로 바꾸려 하지 않는 마음의 양식은?", "a": "존재양식", "a2": "존재 양식 (Being mode)", "e": "무언가를 해결하려는 '행위 양식(Doing)'과 달리, 있는 그대로를 온전히 느끼고 머무는 평온한 상태입니다.", "b": "1권 p.283"}, {"id": "B2-6-9", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "목표 행동에 점진적으로 접근할 때마다 보상을 주어 한 번에 하기 힘든 새로운 행동을 만드는 기법은?", "a": "조형 / 행동조성 / 조형법", "a2": "행동조성 (조형, Shaping)", "e": "'계단 오르기'처럼 작은 성공 단계마다 강화(보상)를 주어 최종 목표 행동을 형성합니다.", "b": "1권 p.227"}, {"id": "B2-6-10", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "인간중심치료에서 내담자의 내면 세계를 '마치 ~처럼' 느끼는 태도는?", "a": "공감적 이해", "a2": "공감적 이해 (Empathic Understanding)", "e": "객관성을 잃지 않으면서(As-if) 상대방의 관점에서 세상을 보는 것입니다.", "b": "1권 p.207 · 1권 p.204"}, {"id": "B2-7-2", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "사소한 부정적 정보 하나에만 집착하여 전체 상황을 비관적으로 보는 인지적 오류는?", "a": "정신적 여과 / 선택적 추상화", "a2": "정신적 여과 (선택적 추상화, Mental Filtering)", "e": "마치 색안경을 낀 것처럼 긍정적인 면은 무시하고 부정적인 단서 하나만 골라내어 결론을 내립니다.", "b": "1권 p.251 · 1권 p.163"}, {"id": "B2-7-3", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "불안에 대해 다시 우울해하는 것처럼, 증상 때문에 또 다른 증상이 생기는 현상은?", "a": "이차적 문제", "a2": "이차적 문제 (Secondary Problem)", "e": "'증상에 대한 증상'으로, 일차적 감정 결과(C1)가 다시 선행사건(A2)이 되어 악순환을 만드는 상태입니다.", "b": "1권 p.240"}, {"id": "B2-7-6", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "마이켄바움의 기법으로, 과제를 수행할 때 스스로에게 조언하며 행동을 조절하도록 돕는 훈련은?", "a": "자기교시훈련 / 자기지시훈련 / 자기교수훈련", "a2": "자기교시(지시, 교수) 훈련 (Self-Instructional Training)", "e": "\"천천히 하자\", \"계획대로 되고 있어\"와 같이 내적 언어를 합리적으로 바꾸어 자기통제력을 키웁니다.", "b": "1권 p.233 · 1권 p.232"}, {"id": "B2-7-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "\"만약 정말로 그런 일이 일어난다면 어떤 일이 벌어질까?\"라고 물어 막연한 공포를 줄이는 기법은?", "a": "탈파국화 / What-if 기법", "a2": "탈파국화 (What-if 기법, Decatastrophizing)", "e": "예상되는 최악의 결과를 구체화하여 그것이 감당 가능한 일임을 직면하게 합니다.", "b": "1권 p.255"}, {"id": "B2-7-10", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "교류분석 이론을 바탕으로, 부모가 자녀에게 무의식적으로 보내는 \"하지 마라\"는 식의 파괴적인 각본 메시지는?", "a": "금지령", "a2": "금지령 (Injunctions)", "e": "\"성공하지 마라\", \"존재하지 마라\" 등 부모의 불안이나 질투가 담긴 비언어적 암시가 자녀의 인생 각본을 결정합니다.", "b": "1권 p.274 · 1권 p.275"}, {"id": "B2-8-1", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "부버의 나와 너의 만남에서 상담자가 전문가의 가면을 벗고 한 인간으로서 진실하게 존재하며 자신을 드러내는 태도는?", "a": "현전", "a2": "현전 (Presence)", "e": "마틴 부버의 철학에 기초하여, 상담자가 내담자 앞에서 투명하고 진실하게 존재하는 것을 의미합니다.", "b": "1권 p.208 · 1권 p.206 · 1권 p.209"}, {"id": "B2-8-4", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "게슈탈트 상담에서 지각의 중심이 되어 또렷하게 떠오르는 지배적인 욕구와 그 토대가 되는 부분의 명칭은?", "a": "전경 / 배경", "a2": "전경(Figure)과 배경(Ground)", "e": "어느 한순간 지각의 초점이 되는 욕구를 '전경', 그 외의 바탕이 되는 부분을 '배경'이라고 하며, 이들의 원활한 교체가 건강한 삶의 핵심입니다.", "b": "1권 p.209 · 1권 p.210"}, {"id": "B2-8-5", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "ACT 이론을 바탕으로, 생각이나 감정은 구름처럼 변하지만, 그 배경이 되는 '하늘'처럼 변함없이 존재하며 관찰하는 자기는?", "a": "맥락적 자기", "a2": "맥락적 자기 (Self-as-Context)", "e": "체험하는 내용물에 함몰되지 않고 이를 조망하는 '관찰자 시점의 자기'를 회복하는 것입니다.", "b": "1권 p.285 · 1권 p.287"}, {"id": "B2-8-10", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "성공적 정체감을 갖기 위해 갖추어야 할 3R은 책임(Responsibility), 현실(Reality), 그리고 무엇인가요?", "a": "옳고 그름", "a2": "옳고 그름 (Right and wrong)", "e": "자신의 행동이 가치 있는지 스스로 판단하고(옳고 그름), 현실을 직시하며 책임을 지는 태도가 건강의 척도입니다.", "b": "1권 p.262"}, {"id": "B2-9-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "상담자가 내담자에게 \"그 생각이 실제로 당신의 문제 해결에 도움이 됩니까?\"라고 묻는 논박은?", "a": "기능적 논박 / 실용적 논박", "a2": "기능적(실용적) 논박", "e": "비합리적 신념이 내담자의 삶에 가져다주는 비효율성을 지적하여 변화의 동기를 자극합니다.", "b": "1권 p.242 · 1권 p.243"}, {"id": "B2-9-9", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "벡(Beck)의 이론을 바탕으로, 상담자와 내담자가 마치 과학자 팀처럼 협력하여 내담자의 생각이 사실인지 검토하는 태도는?", "a": "협동적 경험주의", "a2": "협동적 경험주의 (Collaborative Empiricism)", "e": "상담자가 답을 주는 게 아니라 함께 데이터를 모아 가설을 검증하는 벡 이론의 핵심 철학입니다.", "b": "1권 p.248 · 1권 p.252"}, {"id": "B2-10-1", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "얄롬이 제시한 4가지 실존적 궁극적 관심사는 죽음, 자유, (      ), 무의미이다. 빈칸은?", "a": "고독 / 소외", "a2": "고독 (또는 소외, Isolation)", "e": "인간은 결국 혼자라는 실존적 고립감을 직면해야 함을 의미합니다.", "b": "1권 p.196 · 1권 p.194 · 1권 p.154"}, {"id": "B2-10-2", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "실존치료에서 추구하는 인간상으로, 자신의 유한함과 자유를 정직하게 수용하며 스스로 선택한 삶을 책임 있게 살아가는 개인을 뜻하는 용어는?", "a": "진정성 / 진실한 개인", "a2": "진실한 개인 (진정성, Authentic Individual)", "e": "실존적 불안을 회피하지 않고 '존재의 용기'를 발휘하며 자신의 삶의 저자(Author)가 되는 상태입니다.", "b": "1권 p.199"}, {"id": "B2-10-3", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "현실치료 상담이론을 바탕으로, 인간의 5가지 기본 욕구는 생존, 사랑(소속), 힘(성취), 자유, 그리고 무엇인가요?", "a": "즐거움 / 즐거움 욕구 / 재미욕구", "a2": "즐거움 (Fun)", "e": "현실치료는 인간이 이 5가지 본능적 욕구를 충족시키기 위해 끊임없이 행동한다고 봅니다.", "b": "1권 p.260 · 1권 p.259 · 1권 p.258"}, {"id": "B2-10-7", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "불안과 이완이 동시에 존재할 수 없다는 '상호억제 원리'를 이용한 불안 감소 기법은?", "a": "체계적 둔감법", "a2": "체계적 둔감법 (Systematic Desensitization)", "e": "근육 이완과 불안 위계 상상을 결합하여 불안 반응을 역조건 형성으로 해소합니다.", "b": "1권 p.226"}, {"id": "B2-10-8", "s": "상담이론", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "벡(Beck)의 이론을 바탕으로, 우울증 환자가 공통적으로 지니는 자기, 세상, 미래에 대한 부정적 견해를 무엇이라 하나요?", "a": "인지 삼제", "a2": "인지 삼제 (Cognitive Triad)", "e": "\"나는 무능해\", \"세상은 가혹해\", \"미래는 절망적이야\"라는 세 가지 핵심적 부정 인지입니다.", "b": "3권 p.436 · 1권 p.487 · 1권 p.247"}, {"id": "3-1", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 1, "d": "쉽게", "q": "WHO(1980)의 ICIDH 모델에서 제시한 장애의 세 가지 차원 중, ‘일상적 활동을 수행하는 능력’의 제약을 의미하는 용어는?", "a": "능력장애", "a2": "능력장애 (Disability)", "e": "생물학적 결함인 ‘기능장애(Impairment)’, 그로 인한 활동 제약인 ‘능력장애(Disability)’, 사회적 불이익인 ‘사회적 장애(Handicap)’로 구분됩니다.", "b": "1권 p.309 · 1권 p.308 · 1권 p.543"}, {"id": "3-2", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 2, "d": "쉽게", "q": "장애인에게도 일반적인 규범과 생활 양식에 가까운 삶의 조건을 제공해야 한다는 통합교육의 철학적 원리는?", "a": "정상화", "a2": "정상화 (Normalization)", "e": "뱅크-미켈슨 등이 제창한 원리로, 장애인을 격리하는 대신 사회의 주류 환경 내에서 평범하게 살아가도록 지원해야 한다는 원칙입니다.", "b": "1권 p.315"}, {"id": "3-3", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 3, "d": "쉽게", "q": "장애 학생을 비장애 또래로부터 분리하지 않고, 학생의 필요를 충족하면서도 가장 일반적인 교육 환경에 배치해야 한다는 원칙은?", "a": "최소제한환경", "a2": "최소제한환경 (LRE; Least Restrictive Environment)", "e": "가능한 한 일반 학급 배치를 우선하되, 학생의 장애 정도에 따라 교육적 이익이 가장 큰 환경을 선택해야 함을 의미합니다.", "b": "1권 p.315"}, {"id": "3-4", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "장특법상 지적장애를 진단하기 위해 필수적으로 실시해야 하는 검사는 지능검사, 사회성숙도 검사, (      ), 기초학습검사, 운동능력검사다.", "a": "적응행동 검사", "a2": "적응행동 검사", "e": "지능지수와 더불어 실제 일상생활 능력을 측정하는 적응행동 검사 결과가 모두 기준 이하일 때 지적장애로 진단합니다.", "b": "1권 p.319 · 1권 p.327"}, {"id": "3-5", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "DSM-5-TR에서 지적장애의 심각도(경도, 중등도, 고도, 최중도)를 결정하는 주된 기준은 무엇인가요?", "a": "적응기능", "a2": "적응 기능 (Adaptive Functioning)", "e": "과거와 달리 IQ 수치보다 실제 일상생활에서의 개념적, 사회적, 실행적 영역의 적응 능력을 중시하여 심각도를 진단합니다.", "b": "1권 p.325"}, {"id": "3-6", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 6, "d": "어렵게", "q": "자폐 스펙트럼 장애(ASD)의 핵심 증상 2가지 영역은 (      ) 및 상호작용의 결함, 제한적이고 반복적인 행동 및 흥미이다.", "a": "사회적 의사소통", "a2": "사회적 의사소통 및 상호작용의 결함 / 제한적이고 반복적인 행동 및 흥미", "e": "영역 A(소통 결함)와 영역 B(상동적 행동)를 모두 충족해야 하며, 특히 감각 정보에 대한 과잉·과소 반응이 영역 B에 포함됩니다.", "b": "1권 p.333 · 1권 p.334 · 1권 p.369"}, {"id": "3-7", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 7, "d": "어렵게", "q": "타인이 자신과 다른 생각이나 정보를 가질 수 있다는 것을 이해하지 못하는 ASD 아동의 인지적 결함은?", "a": "마음이론 / 마음이론의 결함 / 마음이론 결함", "a2": "마음이론(Theory of Mind)의 결함", "e": "샐리와 앤(Sally-Anne) 과제로 측정하며, 타인의 조망을 수용하지 못하는 '틀린 신념' 이해의 부족을 뜻합니다.", "b": "1권 p.336 · 3권 p.362 · 3권 p.361"}, {"id": "3-8", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 8, "d": "어렵게", "q": "특정 학습장애 진단에서 '실패할 때까지 기다리기'를 방지하고 조기 개입을 강조하는 모델은?", "a": "중재반응 모델", "a2": "중재반응 모델 (RTI; Response to Intervention)", "e": "다단계 중재를 제공하며 아동이 어떻게 반응하는지 살펴보고, 반응이 없을 때 장애로 진단하는 과학적 모델입니다.", "b": "1권 p.352 · 1권 p.355"}, {"id": "3-9", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 9, "d": "쉽게", "q": "학습장애 아동이 말소리의 최소 단위인 음소를 인식하고 조작하지 못하는 음운인식의 결함 증상은?", "a": "난독증", "a2": "난독증", "e": "읽기 장애(난독증)의 가장 핵심적인 원인이며, 소리 내어 읽기(해독)의 어려움을 유발합니다.", "b": "1권 p.352 · 1권 p.353"}, {"id": "3-10", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2026", "no": 10, "d": "어렵게", "q": "품행장애(CD) 명시자 중 후회 결여, 냉담, 공감 부족 등을 특징으로 하는 집단의 명칭은?", "a": "제한된 친사회적 정서", "a2": "제한된 친사회적 정서 (Limited Prosocial Emotions)", "e": "소위 '냉담-무정서(CU)' 특성을 가진 집단으로, 타인의 고통에 무관심하며 예후가 더 좋지 않은 편입니다.", "b": "1권 p.384 · 1권 p.302"}, {"id": "14-1", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 1, "d": "기본", "q": "다음 중 특수아 상담의 원리에 대한 설명이 올바르지 않은 것을 고르시오.\n\n① 특수아 상담은 아동과 가정, 학교, 지역사회의 연계를 필요로 한다.\n② 특수아 상담은 일반 상담의 원리와 차별성을 두어야 한다.\n③ 특수아 개인의 문제 종류와 심각성에 따라 개별적인 방법으로 접근한다.\n④ 특수아 상담은 여러 영역의 전문가에 의한 종합적인 평가 결과에 기초한 상담이어야 한다.\n⑤ 특수아 상담은 팀 접근에 의해 이루어진다면 효과적이다.", "a": "2", "a2": "2 특수아 상담은 일반 상담의 원리와 차별성을 두어야 한다.", "e": "특수아 상담은 일반상담의 원리를 기본으로 한다. 특수아 상담과 일반상담의 차이는 원리보다는 방법과 도구에 있다.", "b": "1권 p.310"}, {"id": "14-2", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 2, "d": "기본", "q": "다음의 설명으로 적절한 것을 고르시오.\n\n각 아동이 지닌 개인차와 장애로 인한 발달상의 개인차로 인해 단일 교육과정으로는 그들의 필요를 충족할 수 없으므로, 교육을 계획하고 실시함에 있어 각 아동의 발달에 적절한 프로그램을 계획하고 실행하는 것을 의미한다.\n\n① 일반교육주도\n② 탈시설수용화\n③ 최소제한환경\n④ 개별화교육계획(IEP)\n⑤ 완전통합", "a": "4", "a2": "4 개별화교육계획(IEP)", "e": "‘개별화 교육계획’은 각 아동이 지닌 개인차와 장애로 인한 발달상의 개인차로 인해 단일 교육과정으로는 그들의 필요를 충족할 수 없으므로, 교육을 계획하고 실시함에 있어 각 아동의 발달에 적절한 프로그램을 계획하고 실행하는 것을 의미한다.\n특수교육법에서는 각급 학교의 장이 특수교육 대상자 개인의 능력을 계발하기 위하여 장애 유형 및 장애 특성에 적합한 교육 목표, 방법, 내용, 특수교육 관련 서비스 등이 포함된 계획을 수립하여 실시하는 교육으로 정의한다.", "b": "1권 p.317"}, {"id": "14-3", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 3, "d": "기본", "q": "지적장애 진단기준을 기반으로 다음 빈칸에 들어갈 단어를 순서대로 쓰시오.\n\n임상적 평가와 개별적으로 실시된 표준화된 지능검사로 확인된 (      )의 결함이 있다\n- 지속적인 지원 없이는 (      ) 결함으로 인해 다양한 환경에서 한 가지 이상의 일상활동 기능에 제한을 받음", "a": "지적기능 / 적응기능", "a2": "지적기능 / 적응기능", "e": "지적발달장애(지적장애)는 발달시기에 시작되며, 개념, 사회, 실행 영역에서 지적기능과 적응기능 모두에 결함이 있는 상태를 말함. 다음의 3가지 진단기준을 충족해야 함\nA. 임상적 평가와 개별적으로 실시된 표준화된 지능검사로 확인된 지적기능(추론, 문제해결, 계획, 추상적 사고, 판단, 학업, 경험 학습)의 결함이 있음\nB. 적응기능의 결함으로 인해 독립성과 사회적 책임의식에 필요한 발달학적·사회문화적 표준을 충족하지 못함. 지속적인 지원 없이는 적응 결함으로 인해 다양한 환경(가정, 학교, 일터, 공동체)에서 한 가지 이상의 일상활동(의사소통, 사회적 참여, 독립적 생활) 기능에 제한을 받음\nC. 지적 결함과 적응기능의 결함은 발달시기 동안에 시작됨", "b": "1권 p.325"}, {"id": "14-4", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 4, "d": "기본", "q": "다음의 설명에 해당하는 미국정신지체협회의 지적장애 지지수준으로 적절한 것을 고르시오.\n\n- 직장이나 가정과 같은 특정한 환경 속에서 거의 매일 정규적으로 투입되는 지지의 정도이다.\n- 특정 환경에서 규칙적인 지원이 제공되며, 지원시간은 제한되지 않는다.\n- 지능수준이 IQ 20~40정도에 해당되는 지지수준이다.\n\n① 간헐적 지원수준\n② 제한적 지원수준\n③ 확장적 지원수준\n④ 전반적 지원수준\n⑤ 통합적 지원수준", "a": "3", "a2": "3 확장적 지원수준", "e": "지적장애의 지지수준(필요한 지원강도에 따른 분류)은 간헐적 지원수준, 제한적 지원수준, 확장적 지원수준, 전반적 지원수준으로 분류할 수 있다.\n‘확장적 지원수준’은 적어도 직장이나 가정과 같은 특정한 환경에서 거의 매일 정규적으로 투입되는 지지의 정도이다.\n특정 환경에서 규칙적인 지원이 제공되며, 지원시간은 제한되지 않는다는 점이 특징이다.", "b": "1권 p.326"}, {"id": "14-5", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 5, "d": "기본", "q": "다음은 자폐 스펙트럼장애의 4가지 핵심증상에 대한 설명이다. 빈칸에 알맞은 단어를 쓰시오.\n\n- 사회적-정서적(감정적) 상호성의 결함\n- 사회적 상호작용을 위한 (      ) 의사소통 능력의 결함\n- 관계의 발전, 유지 및 관계에 대한 이해력의 결함\n- 제한적이고, (      )적인 행동이나, 흥미, 활동", "a": "비언어적 / 반복", "a2": "비언어적 / 반복", "e": "다음은 자폐 스펙트럼장애의 4가지 핵심증상에 대한 설명이다.\n- 사회적-정서적(감정적) 상호성의 결함\n- 사회적 상호작용을 위한 비언어적 의사소통 능력의 결함\n- 관계의 발전, 유지 및 관계에 대한 이해력의 결함\n- 제한적이고, 반복적인 행동이나, 흥미, 활동", "b": "1권 p.333"}, {"id": "14-6", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 6, "d": "기본", "q": "다음에서 설명하는 자폐스펙트럼 장애의 치료방법을 쓰시오.\n\n자폐스펙트럼장애를 가진 아동의 치료방법으로, 행동을 환경적 변인의 함수로 보고 조작적 조건형성의 적용을 강조하는 일종의 행동수정 방법으로 행동에 영향을 주는 변인들을 분석하고 평가하여 학습과 행동 변화를 정확히 측정해 체계적이고 과학적인 방법으로 접근하는 치료법으로서 선행사건, 행동, 행동 결과의 세 가지 측면에서 실행하여 긍정적인 행동 변화를 가져올 수 있다.", "a": "응용행동분석 / ABA", "a2": "응용행동분석 / ABA", "e": "응용행동분석(ABA)\n- 자폐스펙트럼장애를 가진 아동의 치료방법으로서 행동을 환경적 변인의 함수로 보고 조작적 조건형성의 적용을 강조하는 일종의 행동수정 방법으로 행동에 영향을 주는 변인들을 분석하고 평가하여 학습과 행동변화를 정확히 측정해 체계적이고 과학적인 방법으로 접근하는 치료법으로서 선행사건, 행동, 행동결과의 세 가지 측면에서 실행하여 긍정적인 행동변화를 가져올 수 있다.", "b": "1권 p.338"}, {"id": "14-7", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 7, "d": "기본", "q": "다음은 DSM-5-TR의 주의력결핍 과잉행동장애의 진단 기준이다. 각 항목에 부주의/과잉행동/충동성의 진단기준을 구분하여 쓰시오.\n\n- 종종 다른 사람이 말할 때 경청하지 않는 것으로 보임 (      )\n- 종종 자신의 차례를 기다리지 못함 (      )", "a": "부주의 / 충동성", "a2": "부주의 / 충동성", "e": "부주의 증상은 9개, 과잉행동-충동성 증상은 9개(6개/3개)가 있다. 종종 다른 사람이 말할 때 경청하지 않는 것으로 보임은 부주의 증상이며, 종종 자신의 차례를 기다리지 못함은 충동성의 설명이다.", "b": "1권 p.341 · 1권 p.340"}, {"id": "14-8", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 8, "d": "기본", "q": "다음의 설명 중 옳지 않은 것을 고르시오.\n\n① 학습지진은 선천적 지적능력의 결핍으로 인해 학습 진보가 떨어지는 아동을 의미한다.\n② 학습부진은 정상지능이며, 신경계의 이상은 없으나 정서문제나 환경적 원인으로 학업성취도가 떨어지는 아동을 의미한다.\n③ 학습장애는 정상이상의 지능지수이며 정서적문제나 환경적인 문제가 없음에도 불구하고 학업성취도가 떨어지는 아동을 의미한다.\n④ 학습장애는 학습과 관련된 뇌기능의 특정영역에 결함을 보이거나 발육지연 또는 장애를 가지고 있다.\n⑤ 학습부진은 치료적 개입을 실시하더라도 정상적인 학습능력과 학업성취도를 보이기 어렵다.", "a": "5", "a2": "5 학습부진은 치료적 개입을 실시하더라도 정상적인 학습능력과 학업성취도를 보이기 어렵다.", "e": "학습부진은 내외적인 요인이 제거되거나 치료적 개입을 실시하면 정상 학습능력과 학업성취도를 보일 수 있다.", "b": "1권 p.349"}, {"id": "14-9", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 9, "d": "기본", "q": "다음 중 의사소통 장애에 대한 설명으로 적절한 것을 고르시오.\n\n① 의사소통 장애에는 언어장애, 발화음장애, 사회적 의사소통장애, 지속성 음성틱장애가 있다.\n② 사회적 의사소통 장애는 사회적 상황을 회피하는 이유가 의사소통 기술이 적절히 개발되었음에도 사회적 상호작용에 대한 공포, 불안으로 인한 고통으로 사회적 의사소통 기술을 적절히 활용하지 못하는 것이다.\n③ 사회적 의사소통장애는 자폐 스펙트럼장애와 언어적, 비언어적 의사소통 및 상호작용 결함과 상동증적 행동을 보인다는 공통점이 있다.\n④ 아동기-발병 유창성 장애는 말더듬기라고도 불리며 초기발달시기에 시작된다.\n⑤ 수용성 언어장애는 언어를 이해하는데는 문제가 없으나 언어를 표현하는 능력에 결함이 있는 경우이다.", "a": "4", "a2": "4 아동기-발병 유창성 장애는 말더듬기라고도 불리며 초기발달시기에 시작된다.", "e": "① 의사소통 장애에는 언어장애, 발화음장애, 사회적 의사소통장애, 아동기-발병 유창성장애가 있다.\n② 사회적 의사소통 장애는 효과적인 사회적 의사소통을 경험해보지 못한 결과로 사회적 상황을 회피하는 것이다.\n③ 사회적 의사소통장애는 자폐 스펙트럼장애와 언어적, 비언어적 의사소통 및 상호작용 결함을 보인다는 점이 공통적이지만, 사회적 의사소통 장애는 상동증적 행동을 보이지 않는다.\n⑤ 언어를 이해하는데는 문제가 없으나 언어를 표현하는 능력에 결함이 있는 경우는 표현성 언어장애이다.", "b": "1권 p.369 · 1권 p.365 · 1권 p.323"}, {"id": "14-10", "s": "특수아 및 이상심리학", "f": "Ⅰ", "y": "2025", "no": 10, "d": "기본", "q": "DSM-5-TR 진단기준을 기반으로 다음 사례에 해당하는 진단명을 쓰시오.\n\n승현(5학년)이는 자신의 행동 때문에 다른 친구들이 수업 시간에 피해를 보는 것 같아서 괴로워 하고 있다. 승현이는 아무런 목적 없이 무의식적으로 반복적이고 갑작스러운 말이나 행동을 한다. 헛기침을 하는 소리를 내기도 하고, 얼굴을 찌푸리며 어깨를 들썩거리기도 한다. 이때 의자나 책상에 부딪히게 되어 다른 친구들에게 방해가 될 때도 있다. 3학년 때부터 시작이 되었는데, 나아질 기미는 보이지 않고, 점점 심해지는 것 같다.", "a": "투렛장애 / 뚜렛장애", "a2": "투렛장애 / 뚜렛장애", "e": "투렛장애의 진단기준으로는\nA. 다수의 운동틱과 한 가지 이상의 음성틱이 질병 경과 중 일부 기간 동안 나타남. 2가지 틱이 반드시 동시에 나타날 필요는 없음\nB. 틱 증상은 빈도에 있어 악화와 완화를 반복하지만, 처음 틱이 나타난 시점으로부터 1년 이상 지속됨\nC. 18세 이전에 발병함\nD. 장해는 물질(코카인 등)의 생리적 효과나 다른 의학적 상태(헌팅턴병, 바이러스성 뇌염)로 인한 것이 아님\n승현이는 5학년인데 3학년부터 시작했으며(1년 이상), 소리를 내는 음성틱과 얼굴을 찌푸리고 어깨를 들썩이는 운동틱이 나타나고 있다.", "b": "1권 p.363"}, {"id": "B3-1-1", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "신경성 식욕부진증(AN)과 신경성 폭식증(BN)을 가르는 임상적 절단점(BMI)은?", "a": "17", "a2": "BMI 17 (현저한 저체중 여부)", "e": "폭식과 구토를 하더라도 BMI가 17 미만이면 AN(폭식-제거형)으로 진단하는 것이 위계상 우선입니다.", "b": "1권 p.559 · 1권 p.562 · 1권 p.558"}, {"id": "B3-1-2", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "경미한 조증과 경미한 우울 증상이 2년 이상 지속되는 장애는?", "a": "순환성 장애", "a2": "순환성 장애 (Cyclothymic Disorder)", "e": "증상이 없는 기간이 2개월 미만이어야 하며, 만성적인 기분 기복이 특징입니다.", "b": "1권 p.496 · 1권 p.445 · 1권 p.493"}, {"id": "B3-1-3", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "조현병 진단 기준 A의 5대 증상 중 '핵심 증상'에 해당하는 1, 2번 증상을 쓰시오.", "a": "망상 / 환각", "a2": "망상, 환각", "e": "진단을 위해 5가지 중 2개 이상이 필요하며, 망상, 환각, 와해된 언어 세 가지 중 하나는 반드시 포함되어야 합니다.", "b": "1권 p.535 · 1권 p.548 · 1권 p.539"}, {"id": "B3-1-4", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "조현병의 발병 전 나타나는 예고 신호를 나타내는 용어는?", "a": "전구기", "a2": "전구기", "e": "대인관계 기피, 위생 관리가 안 되는 등 조현병이 시작될 것이라는 예고 신호입니다.", "b": "1권 p.538"}, {"id": "B3-1-5", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "반사회성 성격장애(ASPD)를 진단하기 위해 반드시 충족되어야 하는 '연령' 조건은 최소 (      )세 이상이어야 하며, 15세 이전에 (      )장애가 시작된 증거가 있어야 한다.", "a": "18 / 품행장애", "a2": "최소 ‘18’세 이상이어야 하며, 15세 이전에 ‘품행장애’(Conduct Disorder)가 시작된 증거가 있어야 함.", "e": "아동기의 품행 문제가 성인기까지 지속되는 인격적 패턴임을 확인하기 위한 필수 조건입니다.", "b": "1권 p.583 · 1권 p.584 · 1권 p.381"}, {"id": "B3-1-6", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "발모광이나 피부뜯기장애 치료에서 충동 시 상충되는 행동을 연습하는 기법은?", "a": "습관반전 훈련", "a2": "습관반전 훈련 (HRT)", "e": "인식 훈련, 경쟁반응 학습, 동기 향상 단계로 구성됩니다.", "b": "1권 p.508 · 1권 p.364"}, {"id": "B3-1-7", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "DSM-5 대안 모델에서 성격 장애를 진단하는 두 가지 축은 성격 기능(자기/대인관계)의 손상과 (      )이다.", "a": "병리적 성격 특질", "a2": "병리적 성격 특질", "e": "범주적 분류의 한계를 넘어 차원적으로 성격의 병리를 측정하는 방식입니다.", "b": "1권 p.593 · 1권 p.594 · 1권 p.595"}, {"id": "B3-1-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "물질 섭취 직후에 나타나는 일시적인 부적응적 증상군을 뜻하는 '물질유도성 장애'의 하위 범주는?", "a": "물질중독", "a2": "물질 중독 (Intoxication)", "e": "사용 패턴의 문제인 '사용장애'와 달리, 섭취로 인한 일시적 상태인 '중독'과 '금단'은 유도성 장애에 속합니다.", "b": "1권 p.451 · 1권 p.570"}, {"id": "B3-1-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "행동활성화(BA) 치료에서 회피 패턴을 분석하는 모델의 약자는?", "a": "TRAP", "a2": "TRAP 모델 (Trigger-Response-Avoidance Pattern)", "e": "촉발 요인(T)에 대한 정서 반응(R)으로 나타나는 회피 행동(AP)을 파악합니다.", "b": "1권 p.489 · 3권 p.373 · 1권 p.503"}, {"id": "B3-2-1", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "셀리그만(Seligman)의 이론으로, 자신의 노력으로 환경을 통제할 수 없다는 경험이 반복되어 나타나는 상태는?", "a": "학습된 무기력 / 학습된 무력감", "a2": "학습된 무기력 (Learned Helplessness)", "e": "미래에 대한 부정적 기대와 시도 자체를 포기하는 무기력이 핵심입니다.", "b": "3권 p.724 · 1권 p.359 · 1권 p.487"}, {"id": "B3-2-2", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "해리성 기억상실과 함께 자신의 정체성을 잊고 집을 떠나 방황하는 명시자는?", "a": "해리성 둔주", "a2": "해리성 둔주 (Fugue)", "e": "목적 없는 방랑이나 새로운 정체성 형성이 수반되는 특수한 상태입니다.", "b": "1권 p.532 · 1권 p.527 · 1권 p.531"}, {"id": "B3-2-3", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "‘웅대한 자기상(과대성), 찬사에 대한 욕구, 공감의 결여’라는 핵심 진단 특징을 가지는 성격장애를 쓰시오.", "a": "자기애성 성격장애", "a2": "자기애성 성격장애(NPD)", "e": "‘웅대한 자기상(과대성), 찬사에 대한 욕구, 공감의 결여’ 이 세 가지가 생활 전반에 만연되어 나타날 때 자기애성 성격장애로 진단합니다.", "b": "1권 p.586 · 1권 p.578 · 1권 p.587"}, {"id": "B3-2-4", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "공황장애는 걱정의 대상이 오직 공황발작 그 자체에 있다면, (      )은/는 걱정의 대상이 일상 전반에 있기 때문에 부동불안을 경험한다. 괄호 안에 들어갈 진단명은?", "a": "범불안장애", "a2": "범불안장애(GAD)", "e": "범불안장애는 걱정의 대상이 일상 전반입니다.", "b": "1권 p.476 · 1권 p.477 · 1권 p.472"}, {"id": "B3-2-6", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "조증 삽화와 경조증 삽화를 가르는 결정적인 기준 두 가지는 증상의 (      )과 심각도(기능 마비/입원 여부)이다. 괄호 안에 들어갈 용어를 쓰시오.", "a": "기간", "a2": "기간(1주일 vs 4일)", "e": "조증은 일상이 마비되거나 입원이 필요하지만, 경조증은 기능의 변화는 있으나 사회적 마비는 없습니다.", "b": "1권 p.494 · 1권 p.493 · 1권 p.495"}, {"id": "B3-2-7", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "고용의 유형 중 (      )은 장애의 정도가 비교적 심하여 정상적인 작업조건에서는 노동이 어려운 사람에게 특정한 작업환경을 마련해 주고, 그 환경에서 근무하면서 보수를 받을 수 있게 배려하는 고용의 형태이다.", "a": "보호고용", "a2": "보호 고용(sheltered workshops)", "e": "장애의 정도가 비교적 심하여 정상적인 작업조건에서는 노동이 어려운 사람에게 특정한 작업환경을 마련해 주고, 그 환경에서 근무하면서 보수를 받을 수 있게 배려하는 고용의 형태이다.", "b": "1권 p.412"}, {"id": "B3-2-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "미술치료 기법 중 버크(Burk)와 프로반처(Provancher)가 저널에 진단도구로 처음 소개한 것으로, 사진 또는 그림에서 필요한 형상의 요소를 종이에 오려 붙여 재구성하게 하는 기법이다.", "a": "콜라주", "a2": "콜라주", "e": "버크(Burk)와 프로반처(Provancher)가 저널에 진단도구로 처음 소개한 것으로, 사진 또는 그림에서 필요한 형상의 요소를 종이에 오려 붙여 재구성하게 하는 기법\n• 이 기법은 간편하게 적용할 수 있고, 작품 보존이 쉬우며 사진이나 그림 조각만으로도 감정을 쉽게 표현할 수 있어서 피검자의 심상 발견·계발이 가능하다는 장점이 있음.", "b": "1권 p.403"}, {"id": "B3-2-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "옐리네크(Jellinek)의 4단계 중 '블랙아웃'이 처음 나타나는 단계는?", "a": "전조 단계", "a2": "전조 단계 (Prodromal Phase)", "e": "음주량과 빈도가 증가하며 생리적 변화의 신호가 감지되는 시기입니다.", "b": "1권 p.572"}, {"id": "B3-2-10", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "이상행동의 판단 기준 중, 평균으로부터 2표준편차(SD) 이상 일탈했을 때 이상으로 보는 기준은?", "a": "통계적 기준", "a2": "통계적 기준", "e": "객관적인 수치를 제공하지만, 천재성 같은 바람직한 일탈도 이상으로 규정한다는 한계가 있습니다.", "b": "1권 p.456"}, {"id": "B3-3-6", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "영재아의 지적 능력 발달 속도와 신체/정서 발달 속도가 일치하지 않아 겪는 내적 불일치 현상은?", "a": "비동시성", "a2": "비동시성 (Asynchrony)", "e": "지능은 대학생이나 소근육 발달은 초등학생 수준일 때 겪는 불균형으로, 영재아 부적응의 주요 원인이 됩니다.", "b": "1권 p.374"}, {"id": "B3-3-7", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "수집광 환자가 자신의 기억력을 믿지 못해 물건을 정보 보존용으로 남겨두려는 인지적 결함은?", "a": "기억의 결함 / 기억에 대한 결함", "a2": "기억의 결함(기억에 대한 결함, 기억에 대한 신뢰결함) (Memory Confidence Deficit)", "e": "실제 기억력보다는 자신의 기억 기능에 대한 확신이 낮은 것이 문제입니다.", "b": "1권 p.507 · 1권 p.425"}, {"id": "B3-3-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "놀이치료 과정에서 아동이 \"이게 뭐예요?\"라고 물을 때 \"네가 원한다면 무엇이든 될 수 있단다\"라고 답하는 기술은?", "a": "책임감 돌리기", "a2": "책임감 돌리기 (Returning Responsibility)", "e": "상담자가 답을 주지 않고 아동이 스스로 결정하고 의미를 부여하도록 주도권을 넘겨주는 기술입니다.", "b": "1권 p.404"}, {"id": "B3-3-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "DSM-5-TR에서 알코올 사용장애를 진단하기 위해 11가지 진단 기준 중 최소 (      )개 이상이 지난 12개월 사이에 나타나야 하는가?", "a": "2", "a2": "2개 이상", "e": "11개 기준 중 2~3개는 경도, 4~5개는 중등도, 6개 이상은 중증도로 심각도를 명시합니다.", "b": "1권 p.571"}, {"id": "B3-3-10", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "주 양육자의 심각한 방임으로 인해 낯선 성인에게 경계심 없이 다가가는 장애는?", "a": "탈억제성 사회적 유대감장애", "a2": "탈억제성 사회적 유대감장애 (DSED)", "e": "반응성 애착장애(RAD)와 달리 환경 개선 후에도 증상이 고착되는 경향이 있습니다.", "b": "1권 p.513 · 1권 p.512 · 1권 p.510"}, {"id": "B3-4-2", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "학습 당시의 정서 상태와 인출 당시의 상태가 일치할 때 기억이 잘 나는 원리는?", "a": "상태의존적 학습", "a2": "상태의존적 학습 (State-dependent Learning)", "e": "해리성 기억상실의 원인을 기억의 인출 단서 부족으로 설명하는 이론입니다.", "b": "1권 p.533 · 1권 p.431 · 3권 p.666"}, {"id": "B3-4-3", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "문제행동의 기능을 분석하는 4가지 범주(SEAT)는 감각, 회피, 관심, 그리고 무엇인가요?", "a": "정적 강화", "a2": "정적 강화 (실물/활동 획득)", "e": "원하는 물건이나 특권, 활동 기회를 얻기 위해 문제행동을 하는 것을 의미합니다.", "b": "1권 p.387 · 1권 p.487 · 3권 p.510"}, {"id": "B3-4-4", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "피터 레빈의 SE 모델에서 트라우마 기억이 저장되는 5가지 요소는 감각, 심상, 행동, (      ), (      )가 있다.", "a": "정동 / 의미", "a2": "A(정동), M(의미)", "e": "트라우마를 신경계에 갇힌 생물학적 에너지로 보고 이 요소(S(감각), I(심상), B(행동), A(정동), M(의미))들을 통합합니다.", "b": "1권 p.526"}, {"id": "B3-4-5", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "만성 우울증(PDD) 환자의 '지각적 고립'을 깨뜨리기 위해 제임스 매컬로가 개발한 치료법은?", "a": "인지행동적 분석체계치료", "a2": "인지행동적 분석체계치료 (CBASP)", "e": "상황 분석(SA)과 수반적 개인적 반응(DPI)을 통해 환경과의 인과관계를 회복시킵니다.", "b": "1권 p.483 · 1권 p.421"}, {"id": "B3-4-7", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "놀이치료 중 아동이 상담실 벽에 낙서하려 할 때 \"벽은 낙서하는 곳이 아니야. 대신 이 종이에 그려보렴\"이라고 하는 기술은?", "a": "제한하기", "a2": "제한하기 (Limiting)", "e": "비판적이지 않은 방법으로 안전과 질서를 위해 경계선을 설정하고 대안을 제시하는 기술입니다.", "b": "1권 p.405 · 1권 p.403 · 1권 p.404"}, {"id": "B3-4-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "장애 학생이 학교 졸업 후 사회로 연착륙할 수 있도록 주거, 취업, 사회성을 통합적으로 지원하는 교육 과정은?", "a": "전환교육", "a2": "전환교육 (Transition Education)", "e": "핼펀(Halpern) 등의 모델을 바탕으로 독립적인 성인 생활을 준비시키는 결과 중심의 과정입니다.", "b": "1권 p.408 · 1권 p.409"}, {"id": "B3-4-10", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "패터슨의 강압적 가족과정에서, 아이가 떼를 쓸 때 부모가 요구를 들어주며 비명이 멈추는 상황에서 부모가 경험하는 강화 원리는?", "a": "부적 강화", "a2": "부적 강화 (Negative Reinforcement)", "e": "아이의 소음(혐오 자극)이 제거되는 안도감을 통해 부모의 굴복 행동이 강화되는 '강화 함정'에 빠지게 됩니다.", "b": "1권 p.387"}, {"id": "B3-5-7", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "야노프-불만의 이론으로, 외상 후 세상이 안전하다는 기본적 믿음이 붕괴되는 현상은?", "a": "박살난 가정이론", "a2": "박살난 가정이론 (Shattered Assumptions Theory)", "e": "세상의 자비로움, 의미 있음, 자아 가치감이라는 3대 가정이 무너지는 상태입니다.", "b": "1권 p.522 · 1권 p.429"}, {"id": "B3-5-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "클락(Clark)의 모델에서, 사회불안장애(SAD) 환자가 불안을 숨기기 위해 시선을 피하거나 원고를 꽉 잡는 등의 행동을 무엇이라 하나요?", "a": "안전행동", "a2": "안전행동 (Safety Behavior)", "e": "단기적으로는 안심을 주지만, 장기적으로는 공포가 근거 없음을 학습할 기회를 차단하여 불안을 유지시킵니다.", "b": "1권 p.468 · 1권 p.469 · 1권 p.524"}, {"id": "B3-5-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "강박장애 환자가 '부도덕한 생각을 하는 것만으로도 실제로 죄를 지은 것과 같다'고 믿는 현상은?", "a": "사고 행위 융합", "a2": "사고-행위 융합 (Thought-Action Fusion, TAF)", "e": "도덕적 융합과 발생가능성 융합으로 나뉘며, 생각에 과도한 책임감을 부여합니다.", "b": "1권 p.502 · 1권 p.501"}, {"id": "B3-5-10", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "DSM-5-TR(2022/23) 개정판에서 새롭게 추가된 진단명으로 사별 후 성인 12개월, 아동 6개월 이상 극심한 애도 반응이 지속될 때 내릴 수 있는 진단명은?", "a": "지속성 애도 장애", "a2": "지속성 애도 장애 (Prolonged Grief Disorder)", "e": "사별 후 성인 12개월, 아동 6개월 이상 극심한 애도 반응이 지속될 때 진단합니다.", "b": "1권 p.520 · 1권 p.446"}, {"id": "B3-6-1", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "양극성 장애의 재발 방지를 위해 생체 리듬과 대인관계 스트레스를 관리하는 치료법은?", "a": "대인관계 및 사회적 리듬치료", "a2": "대인관계 및 사회적 리듬치료 (IPSRT)", "e": "사회적 리듬 차트(SRM)를 활용하여 규칙적인 생활 습관을 형성하도록 돕습니다.", "b": "1권 p.498 · 1권 p.423"}, {"id": "B3-6-2", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "전체 인구 중 해당 장애를 가진 사람의 전체 비율을 뜻하는 용어와, 일정 기간 내에 새롭게 발생한 환자의 비율을 뜻하는 용어를 각각 쓰시오.", "a": "유병률 / 발병률", "a2": "유병률(Prevalence), 발병률(Incidence)", "e": "유병률은 '현재 얼마나 앓고 있는가'의 규모를, 발병률은 '얼마나 새롭게 발생하는가'의 속도를 파악하는 지표입니다.", "b": "1권 p.455"}, {"id": "B3-6-3", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "특정 공포증의 형성과 유지를 설명하는 모우러(Mowrer)의 이론 명칭은?", "a": "2요인 가설", "a2": "2요인 가설 (고전적 조건형성과 조작적 조건형성)", "e": "공포는 고전적 조건형성으로 습득되고, 회피 행동을 통한 부적 강화(조작적 조건형성)로 유지됩니다.", "b": "1권 p.465"}, {"id": "B3-6-4", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "코허트(Kohut)는 자기애성 성격장애의 원인을 부모의 무엇이 결핍되었기 때문이라고 보았나요?", "a": "공감", "a2": "공감(Empathy)", "e": "부모가 적절한 거울 역할을 해주지 못해 유아기적 전능감이 발달 정지된 것으로 봅니다.", "b": "1권 p.587 · 1권 p.578 · 1권 p.601"}, {"id": "B3-6-7", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "조현병 스펙트럼 장애를 기간에 따라 분류할 때, 증상의 총 지속 기간이 '1개월 이상 6개월 미만'인 경우 내리는 진단명은?", "a": "조현양상장애", "a2": "조현양상장애 (Schizophreniform Disorder)", "e": "1일~1개월 미만은 단기 정신병적 장애, 1개월~6개월 미만은 조현양상장애, 6개월 이상은 조현병으로 진단합니다.", "b": "1권 p.547 · 1권 p.444 · 1권 p.535"}, {"id": "B3-6-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "스타이스(Stice)의 모델에서 폭식행동이 유발되는 두 가지 경로는?", "a": "섭식 절제 / 부정 정서", "a2": "섭식 절제, 부정 정서", "e": "신체 불만족이 과도한 다이어트(절제)나 우울(정서)을 거쳐 폭식으로 이어집니다.", "b": "1권 p.567"}, {"id": "B3-6-10", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "우울장애의 인지 삼제(Cognitive Triad)가 지칭하는 대상 중 세상(환경)을 제외한 2가지를 쓰시오.", "a": "자기 / 미래", "a2": "자기(Self), 미래(Future)", "e": "벡(Beck)은 우울증 환자가 이 세 영역에 대해 일관되게 부정적인 견해를 갖는다고 보았습니다.", "b": "1권 p.487 · 1권 p.497 · 1권 p.488"}, {"id": "B3-7-5", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "강박장애의 가장 대표적인 행동 치료 기법 중 강박사고에 노출시키되 강박행동을 못하게 하는 치료방법의 명칭은?", "a": "노출 및 반응 방지법", "a2": "노출 및 반응 방지법 (ERP)", "e": "강박 자극에 노출시키되 불안을 줄여주는 강박 행동을 차단하여 습관화(Habituation)를 유도합니다.", "b": "1권 p.503 · 1권 p.424 · 1권 p.506"}, {"id": "B3-7-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "공황장애의 인지적 원인으로, 신체 감각을 심장마비나 죽음으로 오해하는 현상은?", "a": "파국적 오해석", "a2": "파국적 오해석 (Catastrophic Misinterpretation)", "e": "클락(Clark)의 모델로, 사소한 감각이 공포를 타고 증폭되는 악순환을 설명합니다.", "b": "1권 p.473"}, {"id": "B3-9-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "경계선 성격장애(BPD) 환자가 대상을 '천사 아니면 악마'로 극단적으로 나누어 보는 방어기제는?", "a": "분열", "a2": "분열 (Splitting)", "e": "통합된 자아상이나 대상상을 갖지 못하고 좋음과 나쁨을 분리하는 핵심 기제입니다.", "b": "1권 p.588 · 1권 p.564 · 1권 p.452"}, {"id": "B3-10-6", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "조현정동장애 진단에서 기분 삽화 없이 망상/환각만 단독으로 나타나야 하는 기간은 (      ) 이상이다.", "a": "2주", "a2": "2주", "e": "이것이 정신병적 양상을 동반한 기분장애와 조현정동장애를 가르는 결정적 변별점입니다.", "b": "1권 p.546 · 1권 p.547 · 1권 p.495"}, {"id": "B3-10-8", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "DSM-5-TR에서 '범주적 분류'의 한계를 보완하기 위해 도입한 평가 방식은?", "a": "차원적 평가 / 혼합모델", "a2": "차원적 평가 (Dimensional Approach) 혹은 혼합모델", "e": "증상의 유무(Yes/No)뿐만 아니라 심각도(경도, 중등도, 고도)를 함께 평가하는 혼합 모델을 지향합니다.", "b": "1권 p.459"}, {"id": "B3-11-4", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "다음에 해당하는 장애의 명칭을 쓰세요.\n- DSM-5에서 처음으로 추가된 장애로, 언어적·비언어적 의사소통 기술의 사회적 사용에 지속적인 어려움을 나타내는 경우를 말한다.\n- 진단: 의사소통 기술의 사회적 활용의 4가지 기능 모두에서 어려움을 보여 사회적 적응에 현저한 지장이 초래되는 경우 진단되며, 초기 아동기에 시작된다.", "a": "사회적 의사소통 장애", "a2": "사회적 의사소통장애(social communication disorder)", "e": "DSM-5에서 처음으로 추가된 장애로, 언어적·비언어적 의사소통 기술의 사회적 사용에 지속적인 어려움을 나타내는 경우를 말한다.", "b": "1권 p.369"}, {"id": "B3-11-9", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "긍정적 행동지원(PBS) 중재 전략 중, 문제행동과 기능은 같으면서 사회적으로 용인되는 행동을 가르치는 방법은?", "a": "대체행동 교수", "a2": "대체행동 교수 (Differential Reinforcement of Alternative behavior; DRA 포함)", "e": "단순히 행동을 억압하는 것이 아니라, 똑같은 목적(예: 관심 얻기)을 바람직한 방법으로 달성하도록 돕는 것입니다.", "b": "1권 p.400"}, {"id": "B3-12-6", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "어렵게", "q": "제2형 양극성 장애를 진단하기 위해 반드시 거쳐야 하는 두 가지 삽화는?", "a": "경조증 삽화 / 주요우울 삽화", "a2": "경조증 삽화와 주요우울 삽화", "e": "평생 한 번이라도 '조증 삽화'가 있었다면 무조건 제1형으로 진단합니다.", "b": "1권 p.493 · 1권 p.495 · 1권 p.496"}, {"id": "B3-12-10", "s": "특수아 및 이상심리학", "f": "Ⅱ", "y": "", "no": 0, "d": "쉽게", "q": "PTSD와 급성 스트레스 장애(ASD)를 구분하는 시간적 기준은 (      )개월이다.", "a": "1", "a2": "1개월", "e": "증상이 3일~1개월 이내면 ASD, 1개월 이상 지속되면 PTSD로 진단합니다.", "b": "1권 p.516 · 1권 p.510 · 1권 p.517"}, {"id": "4-1", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 1, "d": "어렵게", "q": "상담의 입구 단계로, 내담자의 인적사항과 호소문제를 확인하고, 자아기능 및 위기 가능성을 평가하여 적절한 상담자에게 배정하는 과정의 명칭은?", "a": "접수면접", "a2": "접수면접 (Intake Interview)", "e": "접수면접은 본격적인 상담 전 상담의 방향을 결정하고 내담자의 상태를 선별하는 관문 역할을 합니다.", "b": "2권 p.37 · 2권 p.38 · 2권 p.20"}, {"id": "4-2", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 2, "d": "쉽게", "q": "조하리의 창(Johari's Window)에서 자신은 모르지만 타인은 알고 있는 '맹인 영역'을 좁히기 위해 필요한 기제는?", "a": "피드백", "a2": "피드백 (Feedback)", "e": "타인이 보는 나의 모습을 전달받음으로써 자각을 넓힙니다.", "b": "2권 p.85"}, {"id": "4-3", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 3, "d": "쉽게", "q": "상담 초기, 상담자와 내담자가 상담의 규칙(시간, 장소, 비용 등) 및 비밀보장의 한계에 대해 명시적으로 합의함으로써 내담자의 불필요한 불안을 줄여주는 작업은?", "a": "구조화", "a2": "구조화 (Structuring)", "e": "구조화를 통해 내담자는 상담에 대한 명확한 기대를 갖게 되며, 상담실을 안전한 공간으로 인식하게 됩니다.", "b": "2권 p.40 · 2권 p.41 · 2권 p.222"}, {"id": "4-4", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 4, "d": "어렵게", "q": "스페리(Sperry)의 사례개념화 4대 구성요소 중, 심리학적 이론을 바탕으로 증상의 발생 기제와 \"왜 일어났는가\"를 설명하는 요소는?", "a": "임상적 공식화", "a2": "임상적 공식화 (Clinical Formulation)", "e": "진단적 공식화는 '무슨 일'인가를, 임상적 공식화는 '이유'를 다룹니다.", "b": "2권 p.44"}, {"id": "4-5", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 5, "d": "어렵게", "q": "상담 기록의 SOAP 모델 중, 상담자의 관찰 내용이나 검사 결과 등 객관적 데이터를 기록하는 단계는?", "a": "O / 객관적", "a2": "O (Objective / 객관적)", "e": "S는 내담자의 주관적 보고, O는 상담자의 객관적 관찰입니다.", "b": "2권 p.59"}, {"id": "4-6", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 6, "d": "쉽게", "q": "상담 종결 시 상담자와 헤어지는 것에 대해 내담자가 느끼는 불안이나 슬픔을 다루는 과정의 명칭은 (      ) 다루기이다.", "a": "이별 감정", "a2": "이별 감정 다루기(종결과 관련된 감정 다루기)", "e": "건강한 이별 경험은 내담자의 대인관계 성장에 큰 도움이 되는 치료적 요소입니다.", "b": "2권 p.54"}, {"id": "4-7", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 7, "d": "쉽게", "q": "내담자가 말한 내용 뒤에 숨겨진 '감정'을 상담자가 참신한 단어로 되돌려주어 수용받는 느낌을 주는 기술은?", "a": "반영", "a2": "반영 (Reflection)", "e": "내용에 집중하면 '재진술', 감정에 집중하면 '반영'입니다.", "b": "2권 p.98 · 2권 p.67 · 2권 p.66"}, {"id": "4-8", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 8, "d": "쉽게", "q": "상담자와 내담자 사이의 관계에서 일어나는 즉각적인 반응을 언급하여 관계를 점검하는 기술은?", "a": "즉시성", "a2": "즉시성 (Immediacy)", "e": "'지금-여기'의 역동을 다루어 교착 상태를 깨는 강력한 기술입니다.", "b": "2권 p.74 · 2권 p.49 · 2권 p.75"}, {"id": "4-9", "s": "상담실제 및 학교상담", "f": "Ⅰ", "y": "2026", "no": 9, "d": "쉽게", "q": "내담자가 보지 못하거나 피하려는 모순 및 불일치를 상담자가 거울처럼 보여주는 기술은?", "a": "직면", "a2": "직면 (Confronta
